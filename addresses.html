<script>

/* =========================================================
   Firebase 配置
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


/* =========================================================
   Firebase 初始化
========================================================= */

if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}

const db =
    firebase.firestore();

const auth =
    firebase.auth();


/* =========================================================
   Firebase 登录持久化
========================================================= */

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.catch(function(error) {

    console.warn(
        "Firebase 登录持久化设置失败:",
        error
    );

});


/* =========================================================
   当前用户
========================================================= */

let currentUser = null;

let authReady = false;

let addresses = [];

let editingAddressId = null;


/* =========================================================
   翻译
========================================================= */

function t(
    key,
    fallback
) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
            "function"
    ) {

        return window.MDYLanguage.t(
            key,
            {},
            fallback
        );

    }

    return fallback || key;

}


/* =========================================================
   返回
========================================================= */

function goBack() {

    if (
        document.referrer &&
        document.referrer.indexOf(
            window.location.host
        ) !== -1
    ) {

        window.history.back();

    }

    else {

        window.location.href =
            "profile.html";

    }

}


/* =========================================================
   登录状态
========================================================= */

auth.onAuthStateChanged(
    async function(user) {

        currentUser =
            user || null;

        authReady =
            true;

        updateLoginUI();

        if (currentUser) {

            await loadAddresses();

        }

    }
);


/* =========================================================
   更新登录界面
========================================================= */

function updateLoginUI() {

    const loginCard =
        document.getElementById(
            "loginCard"
        );

    const addressPage =
        document.getElementById(
            "addressPage"
        );

    if (!loginCard || !addressPage) {
        return;
    }

    if (!authReady) {

        loginCard.style.display =
            "none";

        addressPage.style.display =
            "none";

        return;

    }

    if (currentUser) {

        loginCard.style.display =
            "none";

        addressPage.style.display =
            "block";

    }

    else {

        loginCard.style.display =
            "block";

        addressPage.style.display =
            "none";

    }

}


/* =========================================================
   获取用户地址
========================================================= */

async function loadAddresses() {

    const loading =
        document.getElementById(
            "loading"
        );

    const list =
        document.getElementById(
            "addressList"
        );

    const empty =
        document.getElementById(
            "emptyCard"
        );

    if (!currentUser) {
        return;
    }

    loading.style.display =
        "block";

    list.innerHTML = "";

    empty.style.display =
        "none";

    try {

        const userRef =
            db
                .collection("customers")
                .doc(currentUser.uid);

        const snapshot =
            await userRef.get();

        if (!snapshot.exists) {

            addresses = [];

        }

        else {

            const data =
                snapshot.data() || {};

            addresses =
                Array.isArray(data.addresses)
                    ? data.addresses
                    : [];

        }

        loading.style.display =
            "none";

        renderAddresses();

    }

    catch (error) {

        console.error(
            "读取地址失败:",
            error
        );

        loading.style.display =
            "none";

        list.innerHTML = "";

        empty.style.display =
            "block";

        empty.querySelector(
            ".empty-title"
        ).innerText =
            "读取地址失败";

        empty.querySelector(
            ".empty-sub"
        ).innerText =
            error.message ||
            "请稍后再试";

    }

}


/* =========================================================
   显示地址
========================================================= */

function renderAddresses() {

    const list =
        document.getElementById(
            "addressList"
        );

    const empty =
        document.getElementById(
            "emptyCard"
        );

    list.innerHTML = "";

    if (!addresses.length) {

        empty.style.display =
            "block";

        return;

    }

    empty.style.display =
        "none";


    addresses.forEach(
        function(address) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "address-card";


            const person =
                document.createElement(
                    "div"
                );

            person.className =
                "address-person";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "address-name";

            name.innerText =
                address.name ||
                "收货人";


            const phone =
                document.createElement(
                    "div"
                );

            phone.className =
                "address-phone";

            phone.innerText =
                address.phone ||
                "";


            const badge =
                document.createElement(
                    "div"
                );

            badge.className =
                "default-badge";

            badge.innerText =
                "默认";


            if (address.isDefault) {

                badge.style.display =
                    "inline-block";

            }


            person.appendChild(name);

            person.appendChild(phone);

            person.appendChild(badge);


            const addressText =
                document.createElement(
                    "div"
                );

            addressText.className =
                "address-text";

            addressText.innerText =
                address.address ||
                "";


            const detail =
                document.createElement(
                    "div"
                );

            detail.className =
                "address-detail";

            detail.innerText =
                address.detail ||
                "";


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "address-actions";


            if (!address.isDefault) {

                const defaultButton =
                    document.createElement(
                        "button"
                    );

                defaultButton.className =
                    "address-action default-action";

                defaultButton.innerText =
                    "设为默认";

                defaultButton.onclick =
                    function() {

                        setDefaultAddress(
                            address.id
                        );

                    };

                actions.appendChild(
                    defaultButton
                );

            }


            const editButton =
                document.createElement(
                    "button"
                );

            editButton.className =
                "address-action";

            editButton.innerText =
                "编辑";

            editButton.onclick =
                function() {

                    openEditAddress(
                        address.id
                    );

                };


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "address-action delete-action";

            deleteButton.innerText =
                "删除";

            deleteButton.onclick =
                function() {

                    deleteAddress(
                        address.id
                    );

                };


            actions.appendChild(
                editButton
            );

            actions.appendChild(
                deleteButton
            );


            card.appendChild(person);

            card.appendChild(addressText);

            if (address.detail) {

                card.appendChild(detail);

            }

            card.appendChild(actions);

            list.appendChild(card);

        }
    );

}


/* =========================================================
   打开新增地址
========================================================= */

function openAddAddress() {

    editingAddressId =
        null;

    document.getElementById(
        "modalTitle"
    ).innerText =
        "添加收货地址";

    document.getElementById(
        "nameInput"
    ).value = "";

    document.getElementById(
        "phoneInput"
    ).value = "";

    document.getElementById(
        "addressInput"
    ).value = "";

    document.getElementById(
        "detailInput"
    ).value = "";

    document.getElementById(
        "defaultInput"
    ).checked =
        addresses.length === 0;

    document.getElementById(
        "addressModal"
    ).classList.add("show");

}


/* =========================================================
   打开编辑地址
========================================================= */

function openEditAddress(id) {

    const address =
        addresses.find(
            function(item) {

                return item.id === id;

            }
        );

    if (!address) {
        return;
    }

    editingAddressId =
        id;

    document.getElementById(
        "modalTitle"
    ).innerText =
        "编辑收货地址";

    document.getElementById(
        "nameInput"
    ).value =
        address.name || "";

    document.getElementById(
        "phoneInput"
    ).value =
        address.phone || "";

    document.getElementById(
        "addressInput"
    ).value =
        address.address || "";

    document.getElementById(
        "detailInput"
    ).value =
        address.detail || "";

    document.getElementById(
        "defaultInput"
    ).checked =
        !!address.isDefault;

    document.getElementById(
        "addressModal"
    ).classList.add("show");

}


/* =========================================================
   关闭弹窗
========================================================= */

function closeAddressModal() {

    document.getElementById(
        "addressModal"
    ).classList.remove("show");

}


/* =========================================================
   保存地址
========================================================= */

async function saveAddress() {

    if (!currentUser) {

        alert(
            "请先登录"
        );

        return;

    }


    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();

    const phone =
        document.getElementById(
            "phoneInput"
        ).value.trim();

    const address =
        document.getElementById(
            "addressInput"
        ).value.trim();

    const detail =
        document.getElementById(
            "detailInput"
        ).value.trim();

    const isDefault =
        document.getElementById(
            "defaultInput"
        ).checked;


    if (!name) {

        alert(
            "请输入收货人姓名"
        );

        return;

    }

    if (!phone) {

        alert(
            "请输入手机号码"
        );

        return;

    }

    if (!address) {

        alert(
            "请输入地址"
        );

        return;

    }


    const saveButton =
        document.querySelector(
            ".save-button"
        );

    saveButton.disabled =
        true;

    saveButton.innerText =
        "保存中...";


    try {

        let newAddresses =
            Array.isArray(addresses)
                ? [...addresses]
                : [];


        /*
         * 如果设置为默认，
         * 先取消其他地址的默认状态
         */

        if (isDefault) {

            newAddresses =
                newAddresses.map(
                    function(item) {

                        return {
                            ...item,
                            isDefault: false
                        };

                    }
                );

        }


        if (editingAddressId) {

            newAddresses =
                newAddresses.map(
                    function(item) {

                        if (
                            item.id ===
                            editingAddressId
                        ) {

                            return {

                                ...item,

                                name:
                                    name,

                                phone:
                                    phone,

                                address:
                                    address,

                                detail:
                                    detail,

                                isDefault:
                                    isDefault

                            };

                        }

                        return item;

                    }
                );

        }

        else {

            const newAddress = {

                id:
                    "addr_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2, 8),

                name:
                    name,

                phone:
                    phone,

                address:
                    address,

                detail:
                    detail,

                isDefault:
                    isDefault,

                createdAt:
                    new Date().toISOString()

            };


            newAddresses.push(
                newAddress
            );

        }


        /*
         * 如果没有任何默认地址，
         * 自动把第一个设为默认
         */

        if (
            newAddresses.length > 0 &&
            !newAddresses.some(
                function(item) {

                    return item.isDefault;

                }
            )
        ) {

            newAddresses[0] =
                {
                    ...newAddresses[0],
                    isDefault: true
                };

        }


        await db
            .collection("customers")
            .doc(currentUser.uid)
            .set(
                {
                    addresses:
                        newAddresses,

                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()
                },
                {
                    merge: true
                }
            );


        addresses =
            newAddresses;


        closeAddressModal();

        renderAddresses();


        alert(
            editingAddressId
                ? "地址修改成功"
                : "地址添加成功"
        );

    }

    catch (error) {

        console.error(
            "保存地址失败:",
            error
        );

        alert(
            "保存失败：" +
            (
                error.message ||
                "请稍后再试"
            )
        );

    }

    finally {

        saveButton.disabled =
            false;

        saveButton.innerText =
            "保存";

    }

}


/* =========================================================
   设置默认地址
========================================================= */

async function setDefaultAddress(id) {

    if (!currentUser) {
        return;
    }


    try {

        const newAddresses =
            addresses.map(
                function(item) {

                    return {

                        ...item,

                        isDefault:
                            item.id === id

                    };

                }
            );


        await db
            .collection("customers")
            .doc(currentUser.uid)
            .set(
                {
                    addresses:
                        newAddresses,

                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()
                },
                {
                    merge: true
                }
            );


        addresses =
            newAddresses;

        renderAddresses();

    }

    catch (error) {

        console.error(
            "设置默认地址失败:",
            error
        );

        alert(
            "设置失败：" +
            (
                error.message ||
                "请稍后再试"
            )
        );

    }

}


/* =========================================================
   删除地址
========================================================= */

async function deleteAddress(id) {

    if (!currentUser) {
        return;
    }


    const confirmed =
        window.confirm(
            "确定要删除这个收货地址吗？"
        );


    if (!confirmed) {
        return;
    }


    try {

        let newAddresses =
            addresses.filter(
                function(item) {

                    return item.id !== id;

                }
            );


        /*
         * 如果删除的是默认地址，
         * 自动把第一个剩余地址设为默认
         */

        if (
            newAddresses.length > 0 &&
            !newAddresses.some(
                function(item) {

                    return item.isDefault;

                }
            )
        ) {

            newAddresses[0] =
                {
                    ...newAddresses[0],
                    isDefault: true
                };

        }


        await db
            .collection("customers")
            .doc(currentUser.uid)
            .set(
                {
                    addresses:
                        newAddresses,

                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()
                },
                {
                    merge: true
                }
            );


        addresses =
            newAddresses;

        renderAddresses();

    }

    catch (error) {

        console.error(
            "删除地址失败:",
            error
        );

        alert(
            "删除失败：" +
            (
                error.message ||
                "请稍后再试"
            )
        );

    }

}


/* =========================================================
   语言选择器
========================================================= */

function renderLanguageSelector() {

    if (
        !window.MDYLanguage ||
        typeof window.MDYLanguage.renderLanguageSelector !==
            "function"
    ) {

        return;

    }


    const selector =
        document.getElementById(
            "languageSelector"
        );

    if (!selector) {
        return;
    }


    window.MDYLanguage.renderLanguageSelector(
        selector
    );

}


/* =========================================================
   页面翻译
========================================================= */

function applyPageTranslations() {

    document
        .querySelectorAll(
            "[data-i18n]"
        )
        .forEach(
            function(element) {

                const key =
                    element.dataset.i18n;

                const fallback =
                    element.innerText;

                element.innerText =
                    t(
                        key,
                        fallback
                    );

            }
        );


    document.title =
        "MDY FOOD - " +
        t(
            "addresses",
            "我的地址"
        );

}


/* =========================================================
   语言变化
========================================================= */

window.addEventListener(
    "mdyLanguageChanged",
    function() {

        applyPageTranslations();

        renderLanguageSelector();

    }
);


/* =========================================================
   点击弹窗外部关闭
========================================================= */

document
    .getElementById("addressModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                this
            ) {

                closeAddressModal();

            }

        }
    );


/* =========================================================
   初始化
========================================================= */

applyPageTranslations();

renderLanguageSelector();

</script>
