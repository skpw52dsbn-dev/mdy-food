button {

.slider {

.slider:before {
    content: "";

    );


/* =====================================================
   当前登录用户
===================================================== */

let currentUser = null;

let authReady = false;


/* =====================================================
   语言辅助函数
===================================================== */

function translate(
    key,
    fallback
) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t === "function"
    ) {

        const result =
            window.MDYLanguage.t(
                key,
                {},
                fallback
            );

        if (
            result &&
            result !== key
        ) {

            return result;

        }

    }

    return fallback || key;

}


/* =====================================================
   更新页面语言
===================================================== */

function renderLanguage() {

    let lang = "zh";


    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.getLanguage === "function"
    ) {

        lang =
            window.MDYLanguage.getLanguage();

    }

    else {

        const savedLanguage =
            localStorage.getItem(
                "mdyLanguage"
            );


        if (
            savedLanguage === "zh" ||
            savedLanguage === "my" ||
            savedLanguage === "en"
        ) {

            lang =
                savedLanguage;

        }

    }


    /* 当前语言选择 */

    if (languageSelect) {

        languageSelect.value =
            lang;

    }


    /* 页面标题 */

    if (pageTitle) {

        const titleSpan =
            pageTitle.querySelector(
                "span"
            );


        if (titleSpan) {

            titleSpan.textContent =
                translate(
                    "settingsTitle",
                    "设置"
                );

        }

    }


    /* 返回按钮 */

    if (backButton) {

        backButton.setAttribute(
            "aria-label",
            translate(
                "back",
                "返回"
            )
        );

    }


    /* 个人资料 */

    if (profileSettingsTitle) {

        profileSettingsTitle.textContent =
            translate(
                "profileSettings",
                "个人资料"
            );

    }


    if (nameLabel) {

        nameLabel.textContent =
            translate(
                "name",
                "姓名"
            );

    }


    if (phoneLabel) {

        phoneLabel.textContent =
            translate(
                "phone",
                "手机号"
            );

    }


    if (nameInput) {

        nameInput.placeholder =
            translate(
                "name",
                "姓名"
            );

    }


    if (phoneInput) {

        phoneInput.placeholder =
            translate(
                "phone",
                "手机号"
            );

    }


    if (saveProfileBtn) {

        saveProfileBtn.textContent =
            translate(
                "save",
                "保存"
            );

    }


    if (saveStatus) {

        saveStatus.textContent =
            translate(
                "saveSuccess",
                "已保存"
            );

    }


    /* 通用设置 */

    if (generalTitle) {

        generalTitle.textContent =
            translate(
                "settings",
                "通用设置"
            );

    }


    if (languageTitle) {

        languageTitle.textContent =
            translate(
                "language",
                "语言"
            );

    }


    if (languageDesc) {

        languageDesc.textContent =
            translate(
                "languageDesc",
                "选择网站显示语言"
            );

    }


    if (notificationTitle) {

        notificationTitle.textContent =
            translate(
                "notification",
                "通知"
            );

    }


    if (notificationDesc) {

        notificationDesc.textContent =
            translate(
                "notificationDesc",
                "接收订单和系统通知"
            );

    }


    if (darkTitle) {

        darkTitle.textContent =
            translate(
                "darkMode",
                "深色模式"
            );

    }


    if (darkDesc) {

        darkDesc.textContent =
            translate(
                "darkModeDesc",
                "使用深色界面"
            );

    }


    /* 其他 */

    if (otherTitle) {

        otherTitle.textContent =
            translate(
                "other",
                "其他"
            );

    }


    if (agreementText) {

        agreementText.textContent =
            translate(
                "userAgreement",
                "用户协议"
            );

    }


    if (privacyText) {

        privacyText.textContent =
            translate(
                "privacyPolicy",
                "隐私政策"
            );

    }


    if (aboutText) {

        aboutText.textContent =
            translate(
                "aboutUs",
                "关于 MDY FOOD"
            );

    }


    /* 账户状态 */

    if (accountStatusTitle) {

        accountStatusTitle.textContent =
            translate(
                "accountStatus",
                "账户状态"
            );

    }


    /* 退出 */

    if (logoutBtn) {

        logoutBtn.textContent =
            translate(
                "logout",
                "退出登录"
            );

    }


    /* 底部导航 */

    if (navHome) {

        navHome.textContent =
            translate(
                "home",
                "首页"
            );

    }


    if (navOrders) {

        navOrders.textContent =
            translate(
                "orders",
                "订单"
            );

    }


    if (navProfile) {

        navProfile.textContent =
            translate(
                "profile",
                "我的"
            );

    }


    /* HTML lang */

    if (lang === "my") {

        document.documentElement.lang =
            "my";

    }

    else if (lang === "en") {

        document.documentElement.lang =
            "en";

    }

    else {

        document.documentElement.lang =
            "zh-CN";

    }


    /* 浏览器标题 */

    document.title =
        "MDY FOOD - " +
        translate(
            "settingsTitle",
            "设置"
        );


    /*
       这里使用 currentUser，
       不再直接依赖 auth.currentUser。
    */

    updateLoginStatus();

}


/* =====================================================
   语言选择
===================================================== */

if (languageSelect) {

    languageSelect.addEventListener(
        "change",
        function() {

            const selectedLanguage =
                this.value;


            if (
                !window.MDYLanguage ||
                typeof window.MDYLanguage.setLanguage !== "function"
            ) {

                console.error(
                    "language.js 没有成功加载"
                );

                return;

            }


            if (
                selectedLanguage !== "zh" &&
                selectedLanguage !== "my" &&
                selectedLanguage !== "en"
            ) {

                return;

            }


            /*
               setLanguage 会：

               1. 保存 mdyLanguage
               2. 应用语言
               3. 触发 mdyLanguageChanged

               这里不再自己保存。
            */

            window.MDYLanguage.setLanguage(
                selectedLanguage
            );

        }
    );

}


/* =====================================================
   监听全站语言变化
===================================================== */

window.addEventListener(
    "mdyLanguageChanged",
    function() {

        renderLanguage();

    }
);


/* =====================================================
   深色模式
===================================================== */

const savedDarkMode =
    localStorage.getItem(
        "mdyDarkMode"
    ) === "true";


if (darkToggle) {

    darkToggle.checked =
        savedDarkMode;

}


if (savedDarkMode) {

    document.body.classList.add(
        "dark"
    );

}


if (darkToggle) {

    darkToggle.addEventListener(
        "change",
        function() {

            if (this.checked) {

                document.body.classList.add(
                    "dark"
                );

                localStorage.setItem(
                    "mdyDarkMode",
                    "true"
                );

            }

            else {

                document.body.classList.remove(
                    "dark"
                );

                localStorage.setItem(
                    "mdyDarkMode",
                    "false"
                );

            }

        }
    );

}


/* =====================================================
   通知
===================================================== */

const savedNotification =
    localStorage.getItem(
        "mdyNotification"
    );


if (notificationToggle) {

    notificationToggle.checked =
        savedNotification !== "false";

}


if (notificationToggle) {

    notificationToggle.addEventListener(
        "change",
        function() {

            localStorage.setItem(
                "mdyNotification",
                this.checked
                    ? "true"
                    : "false"
            );

        }
    );

}


/* =====================================================
   登录状态
===================================================== */

function updateLoginStatus() {

    if (!loginStatusText) {
        return;
    }


    /*
       authReady 之前显示检查状态，
       避免 Firebase 尚未恢复登录时
       短暂显示“未登录”。
    */

    if (!authReady) {

        loginStatusText.textContent =
            translate(
                "checkingLogin",
                "检查登录状态..."
            );

        return;

    }


    if (currentUser) {

        const loggedInText =
            translate(
                "loggedIn",
                "已登录"
            );


        const email =
            currentUser.email || "";


        const phone =
            currentUser.phoneNumber || "";


        let contact =
            email || phone;


        loginStatusText.textContent =
            loggedInText +
            (
                contact
                    ? " · " + contact
                    : ""
            );

    }

    else {

        loginStatusText.textContent =
            translate(
                "loggedOut",
                "未登录"
            );

    }

}


/* =====================================================
   显示保存状态
===================================================== */

let saveStatusTimer = null;


function showAutoSaveStatus() {

    if (!saveStatus) {
        return;
    }


    saveStatus.classList.add(
        "show"
    );


    clearTimeout(
        saveStatusTimer
    );


    saveStatusTimer =
        setTimeout(
            function() {

                saveStatus.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =====================================================
   显示消息
===================================================== */

let profileMessageTimer = null;


function showMessage(
    type,
    message
) {

    if (!profileMessage) {
        return;
    }


    profileMessage.className =
        "message " + type;


    profileMessage.textContent =
        message;


    clearTimeout(
        profileMessageTimer
    );


    profileMessageTimer =
        setTimeout(
            function() {

                profileMessage.className =
                    "message";

                profileMessage.textContent =
                    "";

            },
            3000
        );

}


/* =====================================================
   防止重复保存
===================================================== */

let isSavingProfile = false;


/* =====================================================
   保存个人资料
===================================================== */

async function saveProfile(
    showFullMessage = true
) {

    const user =
        currentUser;


    if (!user) {

        window.location.href =
            "login.html";

        return false;

    }


    const name =
        nameInput.value.trim();


    const phone =
        phoneInput.value.trim();


    if (isSavingProfile) {

        return false;

    }


    isSavingProfile =
        true;


    saveProfileBtn.disabled =
        true;


    try {

        await db
            .collection(
                "customers"
            )
            .doc(
                user.uid
            )
            .set({

                name:
                    name,

                customername:
                    name,

                customerName:
                    name,

                phone:
                    phone,

                email:
                    user.email || "",

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            }, {

                merge:
                    true

            });


        showAutoSaveStatus();


        if (showFullMessage) {

            showMessage(
                "success",
                translate(
                    "success",
                    "保存成功"
                )
            );

        }


        return true;

    }

    catch (error) {

        console.error(
            "保存个人资料失败:",
            error
        );


        if (showFullMessage) {

            showMessage(
                "error",
                translate(
                    "operationFailed",
                    "操作失败，请稍后重试"
                )
            );

        }


        return false;

    }

    finally {

        isSavingProfile =
            false;

        saveProfileBtn.disabled =
            false;

    }

}


/* =====================================================
   保存按钮
===================================================== */

if (saveProfileBtn) {

    saveProfileBtn.addEventListener(
        "click",
        async function() {

            await saveProfile(
                true
            );

        }
    );

}


/* =====================================================
   输入框自动保存
===================================================== */

let autoSaveTimer = null;


function scheduleAutoSave() {

    clearTimeout(
        autoSaveTimer
    );


    autoSaveTimer =
        setTimeout(
            async function() {

                if (!authReady) {
                    return;
                }


                if (!currentUser) {
                    return;
                }


                await saveProfile(
                    false
                );

            },
            500
        );

}


if (nameInput) {

    nameInput.addEventListener(
        "blur",
        function() {

            scheduleAutoSave();

        }
    );

}


if (phoneInput) {

    phoneInput.addEventListener(
        "blur",
        function() {

            scheduleAutoSave();

        }
    );

}


/* =====================================================
   Firebase 登录状态监听
===================================================== */

auth.onAuthStateChanged(
    async function(user) {

        currentUser =
            user || null;

        authReady =
            true;


        updateLoginStatus();


        if (!currentUser) {

            nameInput.value =
                "";

            phoneInput.value =
                "";

            return;

        }


        try {

            const doc =
                await db
                    .collection(
                        "customers"
                    )
                    .doc(
                        currentUser.uid
                    )
                    .get();


            if (doc.exists) {

                const data =
                    doc.data();


                nameInput.value =
                    data.name ||
                    data.customername ||
                    data.customerName ||
                    "";


                phoneInput.value =
                    data.phone ||
                    "";

            }

        }

        catch (error) {

            console.error(
                "读取个人资料失败:",
                error
            );

        }

    }
);


/* =====================================================
   退出登录
===================================================== */

if (logoutBtn) {

    logoutBtn.addEventListener(
        "click",
        async function() {

            const confirmText =
                translate(
                    "confirmLogout",
                    translate(
                        "confirm",
                        "确定要退出登录吗？"
                    )
                );


            if (
                !window.confirm(
                    confirmText
                )
            ) {

                return;

            }


            try {

                await auth.signOut();


                currentUser =
                    null;


                window.location.href =
                    "login.html";

            }

            catch (error) {

                console.error(
                    "退出登录失败:",
                    error
                );


                alert(
                    translate(
                        "operationFailed",
                        "操作失败，请稍后重试"
                    )
                );

            }

        }
    );

}


/* =====================================================
   初始化
===================================================== */

/*
   language.js 自己会初始化语言。
   这里仅根据当前语言渲染本页面，
   不修改 mdyLanguage。
*/

renderLanguage();

</script>
