.forEach(function(id) { const element = document.getElementById(id); if (!element) { return; } if (id === "logoutButton") { element.textContent = t.logout; } else { element.textContent = t[id] || element.textContent; } }); localStorage.setItem( "mdy_language", lang ); const select = document.getElementById( "languageSelect" ); if (select) { select.value = lang; } } function loadLanguage() { const saved = localStorage.getItem( "mdy_language" ) || "zh"; applyLanguage(saved); } /* ========================= 读取用户资料 ========================= */ async function loadUserProfile(user) { const accountName = document.getElementById( "accountName" ); const accountEmail = document.getElementById( "accountEmail" ); if (!user) { accountName.textContent = translations[ localStorage.getItem( "mdy_language" ) || "zh" ].user; accountEmail.textContent = "未登录"; return; } let name = user.displayName || ""; let phone = user.phoneNumber || ""; try { const customerDoc = await db .collection("customers") .doc(user.uid) .get(); if (customerDoc.exists) { const data = customerDoc.data() || {}; name = data.name || data.customername || data.customerName || name; phone = data.phone || phone; } } catch (error) { console.warn( "读取 customers 资料失败:", error ); } if (!name) { name = "MDY FOOD 用户"; } accountName.textContent = name; if (user.email) { accountEmail.textContent = user.email; } else if (phone) { accountEmail.textContent = phone; } else { accountEmail.textContent = "已登录"; } } /* ========================= 登录状态 ========================= */ auth.onAuthStateChanged( async function(user) { const accountCard = document.getElementById( "accountCard" ); const loginCard = document.getElementById( "loginCard" ); const logoutButton = document.getElementById( "logoutButton" ); if (user) { accountCard.style.display = "flex"; loginCard.style.display = "none"; logoutButton.style.display = "block"; await loadUserProfile( user ); } else { accountCard.style.display = "none"; loginCard.style.display = "block"; logoutButton.style.display = "none"; } } ); /* ========================= 退出登录 ========================= */ async function logout() { const language = localStorage.getItem( "mdy_language" ) || "zh"; const message = language === "my" ? "အကောင့်မှ ထွက်မည်မှာ သေချာပါသလား?" : language === "en" ? "Are you sure you want to log out?" : "确定要退出登录吗？"; if (!confirm(message)) { return; } try { await auth.signOut(); window.location.href = "index.html"; } catch (error) { console.error( "退出登录失败:", error ); const errorMessage = language === "my" ? "ထွက်ရန် မအောင်မြင်ပါ။ နောက်မှ ထပ်ကြိုးစားပါ။" : language === "en" ? "Logout failed. Please try again." : "退出登录失败，请稍后再试"; alert(errorMessage); } } /* ========================= 监听设置 ========================= */ document .getElementById( "darkModeSwitch" ) .addEventListener( "change", toggleDarkMode ); document .getElementById( "notificationSwitch" ) .addEventListener( "change", toggleNotifications ); document .getElementById( "languageSelect" ) .addEventListener( "change", function() { applyLanguage( this.value ); } ); /* ========================= 初始化 ========================= */ loadDarkMode(); loadNotificationSetting(); loadLanguage(); </script>
