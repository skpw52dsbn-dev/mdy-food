<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;
    background:#f6f6f6;
    color:#222;
}

body.dark{
    background:#171717;
    color:#f5f5f5;
}

.header{
    height:60px;
    background:#ff7a00;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:20px;
    font-weight:700;
}

.back{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:rgba(255,255,255,.18);
    color:#fff;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:22px;
    cursor:pointer;
}

.container{
    max-width:700px;
    margin:20px auto 100px;
    padding:0 15px;
}

.card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

body.dark .card{
    background:#242424;
    box-shadow:none;
}

.card-title{
    padding:16px 18px 10px;
    font-size:15px;
    color:#888;
    font-weight:600;
}

.setting-row{
    min-height:58px;
    padding:12px 18px;
    border-top:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
}

body.dark .setting-row{
    border-color:#3a3a3a;
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.icon{
    width:34px;
    height:34px;
    border-radius:10px;
    background:#fff1e6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
}

.text{
    min-width:0;
}

.name{
    font-size:16px;
    font-weight:500;
}

.desc{
    font-size:12px;
    color:#999;
    margin-top:3px;
}

.arrow{
    color:#aaa;
    font-size:20px;
}

.switch{
    width:48px;
    height:28px;
    border-radius:20px;
    background:#ccc;
    position:relative;
    transition:.2s;
    flex-shrink:0;
}

.switch::after{
    content:"";
    position:absolute;
    width:22px;
    height:22px;
    top:3px;
    left:3px;
    background:#fff;
    border-radius:50%;
    transition:.2s;
    box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.switch.on{
    background:#ff7a00;
}

.switch.on::after{
    left:23px;
}

.select-value{
    color:#888;
    font-size:14px;
}

.profile-box{
    padding:18px;
}

.profile-line{
    margin-bottom:12px;
}

.profile-line:last-child{
    margin-bottom:0;
}

.profile-line label{
    display:block;
    color:#999;
    font-size:12px;
    margin-bottom:5px;
}

.profile-line input{
    width:100%;
    height:42px;
    border:1px solid #ddd;
    border-radius:9px;
    padding:0 12px;
    font-size:14px;
    outline:none;
    background:#fff;
    color:#222;
}

body.dark .profile-line input{
    background:#303030;
    border-color:#444;
    color:#fff;
}

.save-btn{
    width:100%;
    height:44px;
    border:0;
    border-radius:10px;
    background:#ff7a00;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:5px;
}

.logout-btn{
    width:100%;
    height:46px;
    border:0;
    border-radius:12px;
    background:#fff;
    color:#f04444;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

body.dark .logout-btn{
    background:#242424;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    background:#fff;
    border-top:1px solid #eee;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:20;
}

body.dark .bottom-nav{
    background:#222;
    border-color:#333;
}

.nav-item{
    text-align:center;
    color:#888;
    font-size:11px;
    cursor:pointer;
}

.nav-item .nav-icon{
    font-size:21px;
    line-height:25px;
}

.nav-item.active{
    color:#ff7a00;
}

@media(max-width:600px){
    .container{
        margin-top:12px;
    }
}
</style>

</head>

<body>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"
};


firebase.initializeApp(firebaseConfig);


const auth =
    firebase.auth();

const db =
    firebase.firestore();


let currentUser = null;


/* 登录状态 */

auth.onAuthStateChanged(async user => {

    currentUser = user;


    if(!user){

        document.getElementById(
            "loginStatus"
        ).textContent = "未登录";

        return;
    }


    document.getElementById(
        "loginStatus"
    ).textContent =
        user.email || "已登录";


    try{

        const snap =
            await db
                .collection("customers")
                .doc(user.uid)
                .get();


        if(snap.exists){

            const data =
                snap.data();


            document.getElementById(
                "nickname"
            ).value =
                data.name ||
                data.customername ||
                "";


            document.getElementById(
                "phone"
            ).value =
                data.phone ||
                "";
        }

    }catch(error){

        console.log(error);

    }

});


/* 读取设置 */

function loadSettings(){

    const notification =
        localStorage.getItem(
            "mdyNotification"
        ) !== "false";


    const dark =
        localStorage.getItem(
            "mdyDarkMode"
        ) === "true";


    document
        .getElementById("notificationSwitch")
        .classList
        .toggle(
            "on",
            notification
        );


    document
        .getElementById("darkSwitch")
        .classList
        .toggle(
            "on",
            dark
        );


    document.body.classList.toggle(
        "dark",
        dark
    );


    const language =
        localStorage.getItem(
            "mdyLanguage"
        ) || "zh";


    document.getElementById(
        "languageValue"
    ).textContent =

        language === "my"
            ? "မြန်မာ"

            : language === "en"
            ? "English"

            : "中文";
}


/* 消息通知 */

function toggleNotification(){

    const current =
        localStorage.getItem(
            "mdyNotification"
        ) !== "false";


    localStorage.setItem(
        "mdyNotification",
        String(!current)
    );


    loadSettings();
}


/* 深色模式 */

function toggleDarkMode(){

    const current =
        localStorage.getItem(
            "mdyDarkMode"
        ) === "true";


    localStorage.setItem(
        "mdyDarkMode",
        String(!current)
    );


    loadSettings();
}


/* 语言 */

function changeLanguage(){

    const current =
        localStorage.getItem(
            "mdyLanguage"
        ) || "zh";


    let next;


    if(current === "zh"){

        next = "my";

    }else if(current === "my"){

        next = "en";

    }else{

        next = "zh";

    }


    localStorage.setItem(
        "mdyLanguage",
        next
    );


    loadSettings();
}


/* 保存资料 */

async function saveProfile(){

    if(!currentUser){

        alert("请先登录");

        return;
    }


    const name =
        document
            .getElementById("nickname")
            .value
            .trim();


    const phone =
        document
            .getElementById("phone")
            .value
            .trim();


    try{

        await db
            .collection("customers")
            .doc(currentUser.uid)
            .set({

                name:name,

                customername:name,

                phone:phone,

                email:
                    currentUser.email || "",

                uid:
                    currentUser.uid,

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            },{
                merge:true
            });


        alert("资料保存成功");


    }catch(error){

        console.error(error);

        alert(
            "保存失败，请稍后再试"
        );

    }

}


/* 登录状态 */

function checkLogin(){

    if(currentUser){

        alert(
            "当前已登录\n\n" +
            "账号：" +
            (
                currentUser.email || ""
            )
        );

    }else{

        alert("当前未登录");

    }

}


/* 退出登录 */

async function logout(){

    try{

        await auth.signOut();

        location.href =
            "login.html";

    }catch(error){

        console.error(error);

        alert(
            "退出登录失败"
        );

    }

}


/* 初始化 */

loadSettings();

</script>

</body>
