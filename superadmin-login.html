<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD - 超级管理员登录</title>


<!-- ========================================
     Firebase SDK
     ======================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #111827,
            #374151
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    color: #222;
}


.box {

    width: min(420px, 92%);

    background: #fff;

    border-radius: 20px;

    padding: 32px;

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, .25);

}


.logo {

    text-align: center;

    font-size: 38px;

}


.title {

    text-align: center;

    font-size: 24px;

    font-weight: 800;

    margin-top: 8px;

}


.sub {

    text-align: center;

    color: #888;

    font-size: 13px;

    margin:
        8px 0 25px;

}


label {

    display: block;

    font-weight: 700;

    font-size: 13px;

    margin:
        14px 0 7px;

}


input {

    width: 100%;

    height: 46px;

    border:
        1px solid #ddd;

    border-radius: 10px;

    padding:
        0 13px;

    font-size: 15px;

    outline: none;

}


input:focus {

    border-color: #ff5a1f;

    box-shadow:
        0 0 0 3px
        rgba(255, 90, 31, .12);

}


.login-button {

    width: 100%;

    height: 46px;

    border: 0;

    border-radius: 10px;

    background: #ff5a1f;

    color: #fff;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    margin-top: 18px;

}


.login-button:hover {

    background: #e94d18;

}


.login-button:disabled {

    opacity: .6;

    cursor: not-allowed;

}


.links {

    display: flex;

    justify-content: space-between;

    margin-top: 14px;

}


.link {

    border: 0;

    background: none;

    color: #666;

    font-size: 12px;

    padding: 0;

    margin: 0;

    width: auto;

    height: auto;

    font-weight: 600;

    cursor: pointer;

}


.link:hover {

    color: #ff5a1f;

}


.msg {

    display: none;

    margin-top: 14px;

    padding: 11px;

    border-radius: 9px;

    font-size: 13px;

    line-height: 1.6;

}


.error {

    background: #fef2f2;

    color: #b91c1c;

}


.success {

    background: #ecfdf5;

    color: #047857;

}


.security {

    margin-top: 20px;

    padding:
        11px 12px;

    background: #f8fafc;

    border:
        1px solid #e5e7eb;

    border-radius: 10px;

    color: #64748b;

    font-size: 11px;

    line-height: 1.7;

    text-align: center;

}


.loading {

    position: fixed;

    inset: 0;

    background:
        rgba(17, 24, 39, .96);

    z-index: 9999;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    text-align: center;

}


.loading-box {

    width: min(360px, 88%);

    padding: 30px;

}


.spinner {

    width: 42px;

    height: 42px;

    border:
        4px solid
        rgba(255,255,255,.25);

    border-top-color:
        #ff5a1f;

    border-radius: 50%;

    margin:
        0 auto 18px;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


.loading-title {

    font-size: 16px;

    font-weight: 700;

}


.loading-text {

    margin-top: 8px;

    font-size: 12px;

    color: #cbd5e1;

    line-height: 1.6;

}

</style>

</head>


<body>


<!-- ========================================
     登录状态检查遮罩
     ======================================== -->

<div
    id="securityLoading"
    class="loading"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <div class="loading-title">
            正在检查登录状态
        </div>

        <div class="loading-text">
            正在连接 MDY FOOD 安全验证系统...
        </div>

    </div>

</div>


<!-- ========================================
     登录框
     ======================================== -->

<div class="box">

    <div class="logo">
        🔐
    </div>


    <div class="title">
        MDY FOOD
    </div>


    <div class="sub">
        超级管理员安全登录
    </div>


    <form id="loginForm">

        <label>
            管理员邮箱
        </label>

        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="请输入管理员邮箱"
            required
        >


        <label>
            管理员密码
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="请输入密码"
            required
        >


        <button
            id="loginButton"
            class="login-button"
            type="submit"
        >
            登录管理员后台
        </button>

    </form>


    <div class="links">

        <button
            class="link"
            type="button"
            id="resetButton"
        >
            忘记密码？
        </button>


        <button
            class="link"
            type="button"
            id="homeButton"
        >
            返回首页
        </button>

    </div>


    <div
        id="message"
        class="msg"
    ></div>


    <div class="security">

        🛡️ 此页面使用 Firebase Authentication
        验证管理员账号，并检查 Firestore 中的管理员角色。

        <br>

        没有超级管理员权限的账号无法进入后台。

    </div>

</div>


<script>

/* ========================================
   Firebase 配置
   ======================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


/* ========================================
   初始化 Firebase
   ======================================== */

firebase.initializeApp(firebaseConfig);


const auth =
    firebase.auth();


const db =
    firebase.firestore();


/* ========================================
   快捷获取元素
   ======================================== */

function $(id) {

    return document.getElementById(id);

}


/* ========================================
   显示提示
   ======================================== */

function showMessage(text, type) {

    const message =
        $("message");

    message.textContent =
        text;

    message.className =
        "msg " + type;

    message.style.display =
        "block";

}


/* ========================================
   隐藏安全检查
   ======================================== */

function hideSecurityLoading() {

    const loading =
        $("securityLoading");

    if (!loading) {
        return;
    }

    loading.style.display =
        "none";

}


/* ========================================
   显示安全检查
   ======================================== */

function showSecurityLoading(title, text) {

    const loading =
        $("securityLoading");

    const titleElement =
        loading.querySelector(
            ".loading-title"
        );

    const textElement =
        loading.querySelector(
            ".loading-text"
        );


    titleElement.textContent =
        title ||
        "正在检查登录状态";


    textElement.textContent =
        text ||
        "正在连接 MDY FOOD 安全验证系统...";


    loading.style.display =
        "flex";

}


/* ========================================
   检查超级管理员权限
   ======================================== */

async function isAdmin(user) {

    if (!user) {

        return false;

    }


    try {

        const adminRef =
            db
                .collection("admins")
                .doc(user.uid);


        const adminDoc =
            await adminRef.get();


        if (!adminDoc.exists) {

            console.warn(
                "admins 中不存在当前 UID:",
                user.uid
            );

            return false;

        }


        const data =
            adminDoc.data() || {};


        console.log(
            "管理员权限数据:",
            data
        );


        return (
            data.role === "superadmin"
            ||
            data.role === "admin"
        );

    }

    catch (error) {

        console.error(
            "检查管理员权限失败:",
            error
        );

        return false;

    }

}


/* ========================================
   登录
   ======================================== */

$("loginForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            $("email")
                .value
                .trim();


        const password =
            $("password")
                .value;


        const button =
            $("loginButton");


        if (!email) {

            showMessage(
                "请输入管理员邮箱。",
                "error"
            );

            return;

        }


        if (!password) {

            showMessage(
                "请输入管理员密码。",
                "error"
            );

            return;

        }


        button.disabled =
            true;


        button.textContent =
            "正在验证...";


        showMessage(
            "正在验证管理员账号，请稍候...",
            "success"
        );


        try {

            /* -----------------------------
               第一步：Firebase Auth 登录
               ----------------------------- */

            const result =
                await auth
                    .signInWithEmailAndPassword(
                        email,
                        password
                    );


            const user =
                result.user;


            console.log(
                "Firebase 登录成功:",
                user.uid
            );


            /* -----------------------------
               第二步：检查管理员权限
               ----------------------------- */

            const allowed =
                await isAdmin(user);


            if (!allowed) {

                await auth.signOut();


                showMessage(
                    "账号密码正确，但该账号没有超级管理员权限。",
                    "error"
                );


                button.disabled =
                    false;


                button.textContent =
                    "登录管理员后台";


                return;

            }


            /* -----------------------------
               第三步：进入后台
               ----------------------------- */

            showMessage(
                "管理员验证成功，正在进入后台...",
                "success"
            );


            button.textContent =
                "验证成功";


            setTimeout(
                function() {

                    window.location.replace(
                        "superadmin.html"
                    );

                },
                500
            );

        }

        catch (error) {

            console.error(
                "管理员登录失败:",
                error
            );


            let message =
                "登录失败，请检查邮箱和密码。";


            switch (error.code) {

                case "auth/user-not-found":

                    message =
                        "该管理员账号不存在。";

                    break;


                case "auth/wrong-password":

                    message =
                        "邮箱或密码不正确。";

                    break;


                case "auth/invalid-credential":

                    message =
                        "邮箱或密码不正确。";

                    break;


                case "auth/invalid-email":

                    message =
                        "管理员邮箱格式不正确。";

                    break;


                case "auth/user-disabled":

                    message =
                        "该管理员账号已被禁用。";

                    break;


                case "auth/too-many-requests":

                    message =
                        "登录尝试次数过多，请稍后再试。";

                    break;


                case "auth/network-request-failed":

                    message =
                        "网络连接失败，请检查网络或 VPN 后重试。";

                    break;


                case "auth/operation-not-allowed":

                    message =
                        "Firebase 尚未开启邮箱/密码登录方式。";

                    break;


                default:

                    message =
                        "登录失败：" +
                        (
                            error.message
                            ||
                            error.code
                            ||
                            "未知错误"
                        );

                    break;

            }


            showMessage(
                message,
                "error"
            );

        }

        finally {

            button.disabled =
                false;


            button.textContent =
                "登录管理员后台";

        }

    }
);


/* ========================================
   忘记密码
   ======================================== */

$("resetButton").onclick =
    async function() {

        const email =
            $("email")
                .value
                .trim();


        if (!email) {

            showMessage(
                "请先输入管理员邮箱。",
                "error"
            );

            $("email").focus();

            return;

        }


        try {

            await auth
                .sendPasswordResetEmail(
                    email
                );


            showMessage(
                "密码重置邮件已发送，请检查管理员邮箱。",
                "success"
            );

        }

        catch (error) {

            console.error(
                "密码重置失败:",
                error
            );


            let message =
                "发送失败，请稍后再试。";


            if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "该管理员邮箱不存在。";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "邮箱格式不正确。";

            }

            else {

                message =
                    "发送失败：" +
                    (
                        error.message
                        ||
                        error.code
                        ||
                        "未知错误"
                    );

            }


            showMessage(
                message,
                "error"
            );

        }

    };


/* ========================================
   返回首页
   ======================================== */

$("homeButton").onclick =
    function() {

        window.location.href =
            "index.html";

    };


/* ========================================
   页面加载时检查已有登录状态
   ======================================== */

showSecurityLoading(
    "正在检查登录状态",
    "正在连接 MDY FOOD 安全验证系统..."
);


auth.onAuthStateChanged(
    async function(user) {

        try {

            /* --------------------------------
               没有登录用户
               -------------------------------- */

            if (!user) {

                hideSecurityLoading();

                return;

            }


            /* --------------------------------
               已经登录，检查管理员身份
               -------------------------------- */

            console.log(
                "检测到已登录账号:",
                user.uid
            );


            showSecurityLoading(
                "正在验证管理员权限",
                "正在检查 Firestore 管理员身份..."
            );


            const allowed =
                await isAdmin(user);


            if (allowed) {

                console.log(
                    "管理员验证成功"
                );


                window.location.replace(
                    "superadmin.html"
                );


                return;

            }


            /* --------------------------------
               已登录但不是管理员
               -------------------------------- */

            console.warn(
                "当前账号不是管理员"
            );


            await auth.signOut();


            hideSecurityLoading();


            showMessage(
                "当前登录账号没有超级管理员权限，请使用管理员账号登录。",
                "error"
            );

        }

        catch (error) {

            console.error(
                "管理员状态检查失败:",
                error
            );


            hideSecurityLoading();


            showMessage(
                "管理员验证失败：" +
                (
                    error.message
                    ||
                    error.code
                    ||
                    "未知错误"
                ),
                "error"
            );

        }

    }
);

</script>

</body>
</html>
