<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MDY FOOD - 超级管理员登录</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#111827,#374151);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:#222}.box{width:min(420px,92%);background:#fff;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.logo{text-align:center;font-size:38px}.title{text-align:center;font-size:24px;font-weight:800;margin-top:8px}.sub{text-align:center;color:#888;font-size:13px;margin:8px 0 25px}label{display:block;font-weight:700;font-size:13px;margin:14px 0 7px}input{width:100%;height:46px;border:1px solid #ddd;border-radius:10px;padding:0 13px;font-size:15px;outline:none}input:focus{border-color:#ff5a1f;box-shadow:0 0 0 3px rgba(255,90,31,.12)}button{width:100%;height:46px;border:0;border-radius:10px;background:#ff5a1f;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:18px}button:disabled{opacity:.6;cursor:not-allowed}.links{display:flex;justify-content:space-between;margin-top:14px}.link{border:0;background:none;color:#666;font-size:12px;padding:0;margin:0;width:auto;height:auto;font-weight:600}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:13px;line-height:1.6}.error{background:#fef2f2;color:#b91c1c}.success{background:#ecfdf5;color:#047857}.security{margin-top:20px;padding:11px 12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;color:#64748b;font-size:11px;line-height:1.7;text-align:center}</style>
</head>
<body>
<div class="box">
<div class="logo">🔐</div>
<div class="title">MDY FOOD</div>
<div class="sub">超级管理员安全登录</div>
<form id="loginForm">
<label>管理员邮箱</label>
<input id="email" type="email" autocomplete="username" placeholder="请输入管理员邮箱" required>
<label>管理员密码</label>
<input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
<button id="loginButton" type="submit">登录管理员后台</button>
</form>
<div class="links"><button class="link" type="button" id="resetButton">忘记密码？</button><button class="link" type="button" id="homeButton">返回首页</button></div>
<div id="message" class="msg"></div>
<div class="security">🛡️ 此页面使用 Firebase Authentication 验证账号，并检查管理员角色。没有管理员权限的账号无法进入后台。</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",authDomain:"mdy-food.firebaseapp.com",projectId:"mdy-food",storageBucket:"mdy-food.firebasestorage.app",messagingSenderId:"498327590625",appId:"1:498327590625:web:cceafb7febb689e7ad09a0",measurementId:"G-6Q5G2862XQ"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const $=id=>document.getElementById(id);
function showMessage(text,type){const m=$("message");m.textContent=text;m.className="msg "+type;m.style.display="block";}
async function isAdmin(user){try{const doc=await db.collection("admins").doc(user.uid).get();if(!doc.exists)return false;const data=doc.data()||{};return data.role==="superadmin"||data.role==="admin";}catch(e){console.error(e);return false;}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim();const password=$("password").value;const btn=$("loginButton");btn.disabled=true;btn.textContent="正在验证...";try{const result=await auth.signInWithEmailAndPassword(email,password);const allowed=await isAdmin(result.user);if(!allowed){await auth.signOut();showMessage("账号密码正确，但该账号没有超级管理员权限。","error");return;}showMessage("登录成功，正在进入后台...","success");setTimeout(()=>window.location.replace("superadmin.html"),350);}catch(error){console.error("管理员登录失败:",error);let msg="登录失败，请检查邮箱和密码。";if(error.code==="auth/user-not-found")msg="该管理员账号不存在。";else if(error.code==="auth/wrong-password"||error.code==="auth/invalid-credential")msg="邮箱或密码不正确。";else if(error.code==="auth/too-many-requests")msg="尝试次数过多，请稍后再试。";else if(error.code==="auth/invalid-email")msg="管理员邮箱格式不正确。";showMessage(msg,"error");}finally{btn.disabled=false;btn.textContent="登录管理员后台";}});
$("resetButton").onclick=async()=>{const email=$("email").value.trim();if(!email){showMessage("请先输入管理员邮箱。","error");return;}try{await auth.sendPasswordResetEmail(email);showMessage("密码重置邮件已发送，请检查邮箱。","success");}catch(error){console.error(error);showMessage("发送失败："+error.message,"error");}};
$("homeButton").onclick=()=>window.location.href="index.html";
auth.onAuthStateChanged(async user=>{if(!user)return;if(await isAdmin(user))window.location.replace("superadmin.html");else await auth.signOut();});
</script>
</body>
</html>
