.coupon-main {

.coupon-left {

<script>

/* =========================================================
   Firebase 配置
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


/* =========================================================
   Firebase 初始化
========================================================= */

if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}

const db =
    firebase.firestore();

const auth =
    firebase.auth();


/* =========================================================
   全局变量
========================================================= */

let currentUser = null;

let allCoupons = [];

let currentTab = "available";


/* =========================================================
   返回
========================================================= */

function goBack() {

    if (
        document.referrer &&
        document.referrer.includes(
            window.location.host
        )
    ) {

        window.history.back();

    }

    else {

        window.location.href =
            "profile.html";

    }

}


/* =========================================================
   翻译
========================================================= */

function t(key, fallback) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
            "function"
    ) {

        return window.MDYLanguage.t(
            key,
            {},
            fallback
        );

    }

    return fallback || key;

}


/* =========================================================
   语言选择器
========================================================= */

function renderLanguageSelector() {

    const selector =
        document.getElementById(
            "languageSelector"
        );

    if (
        !selector ||
        !window.MDYLanguage ||
        typeof window.MDYLanguage.renderLanguageSelector !==
            "function"
    ) {

        return;

    }

    window.MDYLanguage.renderLanguageSelector(
        selector
    );

}


/* =========================================================
   时间转换
========================================================= */

function getDateValue(value) {

    if (!value) {

        return null;

    }

    if (
        value instanceof firebase.firestore.Timestamp
    ) {

        return value.toDate();

    }

    if (
        value instanceof Date
    ) {

        return value;

    }

    if (
        typeof value.toDate ===
            "function"
    ) {

        try {

            return value.toDate();

        }

        catch (e) {}

    }

    if (
        typeof value === "string"
    ) {

        const date =
            new Date(value);

        if (
            !isNaN(
                date.getTime()
            )
        ) {

            return date;

        }

    }

    if (
        typeof value === "number"
    ) {

        const date =
            new Date(value);

        if (
            !isNaN(
                date.getTime()
            )
        ) {

            return date;

        }

    }

    return null;

}


/* =========================================================
   日期格式
========================================================= */

function formatDate(value) {

    const date =
        getDateValue(value);

    if (!date) {

        return "长期有效";

    }

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");

    const d =
        String(
            date.getDate()
        ).padStart(2, "0");

    return (
        y +
        "-" +
        m +
        "-" +
        d
    );

}


/* =========================================================
   判断优惠券状态
========================================================= */

function getCouponStatus(coupon) {

    const used =
        coupon.used === true ||
        coupon.isUsed === true ||
        coupon.status === "used" ||
        coupon.status === "已使用";

    if (used) {

        return "used";

    }

    const now =
        new Date();

    const expireValue =
        coupon.expireAt ||
        coupon.expiresAt ||
        coupon.endAt ||
        coupon.endDate ||
        coupon.validUntil;

    const expireDate =
        getDateValue(
            expireValue
        );

    if (
        expireDate &&
        expireDate.getTime() < now.getTime()
    ) {

        return "expired";

    }

    if (
        coupon.status === "expired" ||
        coupon.status === "过期" ||
        coupon.status === "已过期"
    ) {

        return "expired";

    }

    return "available";

}


/* =========================================================
   获取优惠金额
========================================================= */

function getCouponValue(coupon) {

    const value =
        coupon.amount ??
        coupon.discount ??
        coupon.value ??
        coupon.couponAmount ??
        0;

    const number =
        Number(value);

    if (
        isNaN(number)
    ) {

        return "0";

    }

    return number.toLocaleString();

}


/* =========================================================
   获取优惠条件
========================================================= */

function getCouponCondition(coupon) {

    const minAmount =
        coupon.minAmount ??
        coupon.minimumAmount ??
        coupon.minOrderAmount ??
        coupon.threshold ??
        0;

    const min =
        Number(minAmount);

    if (
        min > 0
    ) {

        return (
            "满 " +
            min.toLocaleString() +
            " Ks 可使用"
        );

    }

    return "无最低消费限制";

}


/* =========================================================
   获取优惠券名称
========================================================= */

function getCouponName(coupon) {

    return (
        coupon.name ||
        coupon.title ||
        coupon.couponName ||
        coupon.description ||
        "MDY FOOD 优惠券"
    );

}


/* =========================================================
   获取优惠券代码
========================================================= */

function getCouponCode(coupon) {

    return (
        coupon.code ||
        coupon.couponCode ||
        coupon.id ||
        "MDYFOOD"
    );

}


/* =========================================================
   获取有效期
========================================================= */

function getCouponTime(coupon) {

    const start =
        coupon.startAt ||
        coupon.startsAt ||
        coupon.startDate ||
        coupon.validFrom;

    const end =
        coupon.expireAt ||
        coupon.expiresAt ||
        coupon.endAt ||
        coupon.endDate ||
        coupon.validUntil;

    const startDate =
        getDateValue(start);

    const endDate =
        getDateValue(end);

    if (
        startDate &&
        endDate
    ) {

        return (
            "有效期：" +
            formatDate(startDate) +
            " 至 " +
            formatDate(endDate)
        );

    }

    if (endDate) {

        return (
            "有效期至：" +
            formatDate(endDate)
        );

    }

    if (startDate) {

        return (
            "开始使用：" +
            formatDate(startDate)
        );

    }

    return "长期有效";

}


/* =========================================================
   更新统计
========================================================= */

function updateSummary() {

    let available = 0;

    let used = 0;

    let expired = 0;

    allCoupons.forEach(
        function(coupon) {

            const status =
                getCouponStatus(
                    coupon
                );

            if (
                status === "available"
            ) {

                available++;

            }

            else if (
                status === "used"
            ) {

                used++;

            }

            else {

                expired++;

            }

        }
    );

    document.getElementById(
        "availableCount"
    ).innerText =
        available;

    document.getElementById(
        "usedCount"
    ).innerText =
        used;

    document.getElementById(
        "expiredCount"
    ).innerText =
        expired;

}


/* =========================================================
   切换 Tab
========================================================= */

function switchTab(tab) {

    currentTab =
        tab;

    document
        .querySelectorAll(
            ".tab-button"
        )
        .forEach(
            function(button) {

                button.classList.remove(
                    "active"
                );

            }
        );

    if (
        tab === "available"
    ) {

        document.getElementById(
            "tabAvailable"
        ).classList.add(
            "active"
        );

    }

    else if (
        tab === "used"
    ) {

        document.getElementById(
            "tabUsed"
        ).classList.add(
            "active"
        );

    }

    else {

        document.getElementById(
            "tabExpired"
        ).classList.add(
            "active"
        );

    }

    renderCoupons();

}


/* =========================================================
   使用优惠券
========================================================= */

function useCoupon(couponId) {

    const coupon =
        allCoupons.find(
            function(item) {

                return item.id ===
                    couponId;

            }
        );

    if (!coupon) {

        return;

    }

    if (
        getCouponStatus(coupon) !==
            "available"
    ) {

        return;

    }

    /*
       当前阶段：
       点击后跳转到结算页面。

       真正的优惠金额计算，
       下一步接 checkout.html。
    */

    window.location.href =
        "checkout.html?couponId=" +
        encodeURIComponent(
            couponId
        );

}


/* =========================================================
   渲染优惠券
========================================================= */

function renderCoupons() {

    const list =
        document.getElementById(
            "couponList"
        );

    if (!list) {

        return;

    }

    const coupons =
        allCoupons.filter(
            function(coupon) {

                return (
                    getCouponStatus(coupon) ===
                    currentTab
                );

            }
        );


    if (
        coupons.length === 0
    ) {

        let title =
            "暂无优惠券";

        let sub =
            "目前没有符合条件的优惠券";

        if (
            currentTab === "available"
        ) {

            title =
                "暂无可使用优惠券";

            sub =
                "有新的优惠券时会显示在这里";

        }

        else if (
            currentTab === "used"
        ) {

            title =
                "暂无已使用优惠券";

            sub =
                "你使用过的优惠券会显示在这里";

        }

        else {

            title =
                "暂无已过期优惠券";

            sub =
                "已过期的优惠券会显示在这里";

        }

        list.innerHTML =

            '<div class="empty-card">' +

                '<div class="empty-icon">🎟️</div>' +

                '<div class="empty-title">' +
                    title +
                '</div>' +

                '<div class="empty-sub">' +
                    sub +
                '</div>' +

            '</div>';

        return;

    }


    list.innerHTML = "";

    coupons.forEach(
        function(coupon) {

            const status =
                getCouponStatus(
                    coupon
                );

            const value =
                getCouponValue(
                    coupon
                );

            const name =
                getCouponName(
                    coupon
                );

            const condition =
                getCouponCondition(
                    coupon
                );

            const time =
                getCouponTime(
                    coupon
                );

            const code =
                getCouponCode(
                    coupon
                );

            let statusText =
                "可使用";

            if (
                status === "used"
            ) {

                statusText =
                    "已使用";

            }

            else if (
                status === "expired"
            ) {

                statusText =
                    "已过期";

            }

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "coupon-card";


            const buttonDisabled =
                status !== "available";


            card.innerHTML =

                '<div class="coupon-main">' +

                    '<div class="coupon-left">' +

                        '<div class="coupon-value">' +
                            value +
                        '</div>' +

                        '<div class="coupon-unit">' +
                            'Ks 优惠' +
                        '</div>' +

                    '</div>' +


                    '<div class="coupon-right">' +

                        '<div class="coupon-name">' +
                            escapeHtml(name) +
                        '</div>' +

                        '<div class="coupon-condition">' +
                            escapeHtml(condition) +
                        '</div>' +

                        '<div class="coupon-time">' +
                            escapeHtml(time) +
                        '</div>' +

                    '</div>' +


                    '<div class="coupon-status ' +
                        (
                            status !== "available"
                                ? status
                                : ""
                        ) +
                    '">' +
                        statusText +
                    '</div>' +

                '</div>' +


                '<div class="coupon-footer">' +

                    '<div class="coupon-code">' +
                        "券码：" +
                        escapeHtml(code) +
                    '</div>' +

                    (
                        buttonDisabled

                            ?

                            '<button class="use-button disabled" disabled>' +
                                statusText +
                            '</button>'

                            :

                            '<button class="use-button" onclick="useCoupon(\'' +
                                escapeJs(coupon.id) +
                            '\')">' +
                                '去使用' +
                            '</button>'
                    ) +

                '</div>';


            list.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(value) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* =========================================================
   读取优惠券
========================================================= */

async function loadCoupons() {

    const list =
        document.getElementById(
            "couponList"
        );

    if (!currentUser) {

        return;

    }

    try {

        /*
           优先按照 uid 查询。

           你的优惠券以后只需要保存：

           uid: 用户 Firebase UID

           就可以自动显示给该用户。
        */

        let snapshot =
            await db
                .collection("coupons")
                .where(
                    "uid",
                    "==",
                    currentUser.uid
                )
                .get();


        /*
           如果未来后台使用 userId，
           这里也兼容。
        */

        if (
            snapshot.empty
        ) {

            snapshot =
                await db
                    .collection("coupons")
                    .where(
                        "userId",
                        "==",
                        currentUser.uid
                    )
                    .get();

        }


        allCoupons = [];

        snapshot.forEach(
            function(doc) {

                allCoupons.push({

                    id:
                        doc.id,

                    ...doc.data()

                });

            }
        );


        /*
           如果数据库有多个优惠券，
           按创建时间倒序。
        */

        allCoupons.sort(
            function(a, b) {

                const aDate =
                    getDateValue(
                        a.createdAt
                    );

                const bDate =
                    getDateValue(
                        b.createdAt
                    );

                if (
                    !aDate &&
                    !bDate
                ) {

                    return 0;

                }

                if (!aDate) {

                    return 1;

                }

                if (!bDate) {

                    return -1;

                }

                return (
                    bDate.getTime() -
                    aDate.getTime()
                );

            }
        );


        updateSummary();

        renderCoupons();

    }

    catch (error) {

        console.error(
            "读取优惠券失败:",
            error
        );

        list.innerHTML =

            '<div class="empty-card">' +

                '<div class="empty-icon">⚠️</div>' +

                '<div class="empty-title">' +
                    '优惠券读取失败' +
                '</div>' +

                '<div class="empty-sub">' +
                    '请检查 Firebase Firestore 权限设置，然后刷新页面。' +
                '</div>' +

            '</div>';

    }

}


/* =========================================================
   Firebase 登录状态
========================================================= */

auth.onAuthStateChanged(
    function(user) {

        currentUser =
            user || null;


        const loginCard =
            document.getElementById(
                "loginCard"
            );

        const couponContent =
            document.getElementById(
                "couponContent"
            );


        if (user) {

            loginCard.style.display =
                "none";

            couponContent.style.display =
                "block";

            loadCoupons();

        }

        else {

            loginCard.style.display =
                "block";

            couponContent.style.display =
                "none";

        }

    }
);
