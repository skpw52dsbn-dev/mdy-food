<script>


const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:

    storageBucket:

    messagingSenderId:

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"
};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();


/* =========================
   返回首页
========================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================
   编辑个人资料
========================= */

function editProfile() {

    alert(
        "个人资料功能正在开发中"
    );

}


/* =========================
   退出登录
========================= */

async function logout() {

    const confirmed =
        confirm(
            "确定要退出登录吗？"
        );

    if (!confirmed) {
        return;
    }

    try {

        await auth.signOut();

        window.location.href =
            "index.html";

    } catch (error) {

        console.error(
            "退出登录失败:",
            error
        );

        alert(
            "退出登录失败，请稍后再试"
        );

    }

}


/* =========================
   登录状态
========================= */

auth.onAuthStateChanged(
    function(user) {

        const userCard =
            document.getElementById(
                "userCard"
            );

        const loginCard =
            document.getElementById(
                "loginCard"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );

        const userName =
            document.getElementById(
                "userName"
            );

        const userEmail =
            document.getElementById(
                "userEmail"
            );


        if (user) {

            userCard.style.display =
                "flex";

            loginCard.style.display =
                "none";

            logoutButton.style.display =
                "block";


            let displayName =
                user.displayName;


            if (!displayName) {

                displayName =
                    "MDY FOOD 用户";

            }


            userName.innerText =
                displayName;


            if (user.email) {

                userEmail.innerText =
                    user.email;

            } else if (user.phoneNumber) {

                userEmail.innerText =
                    user.phoneNumber;

            } else {

                userEmail.innerText =
                    "已登录";

            }

        } else {

            userCard.style.display =
                "none";

            loginCard.style.display =
                "block";

            logoutButton.style.display =
                "none";

        }

    }
);


</script>
