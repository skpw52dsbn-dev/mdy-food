<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f7f7f7;

    color: #222;

/* =========================
   Header
========================= */

.header {

    background:

            #ff8a3d
        );

    color: #fff;

    padding:

        28px;

}


.header p {

/* =========================
   Container
========================= */

.container {

    max-width: 720px;

    margin:
        -35px

        0;

    padding:
        0
        14px;
}


/* =========================
   Card
========================= */

.card {

    background: #fff;

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 14px;

    box-shadow:
        0 5px 20px
        rgba(

            0,
            0,

}


/* =========================
   User
========================= */

.user {

    display: flex;

    align-items: center;

    gap: 14px;

}


.avatar {

    width: 58px;

    height: 58px;

    border-radius: 50%;

    background: #fff1eb;

    color: #ff5a1f;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 27px;

    font-weight: bold;

}


.user h2 {

    margin:

        0
        5px;

    font-size: 18px;

}


.user p {

    margin: 0;

    color: #888;

    font-size: 13px;

}


/* =========================
   Login
========================= */

.login {

    display: none;

    text-align: center;

}


.login-icon {

    font-size: 45px;

    margin-bottom: 8px;

}


.login h2 {

    margin:
        0
        0
        8px;

}


.login p {

    color: #999;

    font-size: 13px;

}


.login button {

    border: 0;

    background: #ff5a1f;

    color: #fff;

    padding:
        11px
        24px;

    border-radius: 22px;

    font-size: 14px;

    cursor: pointer;

}


/* =========================
   Section title
========================= */

.title {

    font-size: 17px;

    font-weight: 700;

    margin:
        0
        0
        13px;

}


/* =========================
   Quick grid
========================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap: 10px;

}


.quick {

    padding:
        14px
        5px;

    text-align: center;

    border-radius: 14px;

    background: #fafafa;

    transition: .2s;

}


.quick:active {

    transform: scale(.96);

}


.quick .ico {

    font-size: 24px;

}


.quick b {

    display: block;

    margin-top: 7px;

    font-size: 13px;

}


.quick small {

    display: block;

    color: #999;

    margin-top: 3px;

    font-size: 11px;

}


/* =========================
   Service rows
========================= */

.row {

    display: flex;

    align-items: center;

    padding:
        15px
        2px;

    border-bottom:
        1px solid
        #eee;

}


.row:last-child {

    border-bottom: 0;

}


.row .icon {

    width: 35px;

    font-size: 21px;

}


.row .txt {

    flex: 1;

}


.row .txt b {

    display: block;

    font-size: 14px;

}


.row .txt span {

    display: block;

    color: #999;

    font-size: 11px;

    margin-top: 4px;

}


.arrow {

    color: #bbb;

    font-size: 20px;

}


/* =========================
   Logout
========================= */

.logout {

    width: 100%;

    border: 0;

    background: #fff1eb;

    color: #ff5a1f;

    padding:
        12px;

    border-radius: 22px;

    font-size: 14px;

    cursor: pointer;

}


/* =========================
   Bottom Navigation
========================= */

.bottom {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    height: 68px;

    background: #fff;

    border-top:
        1px solid
        #eee;

    display: flex;

    justify-content: center;

    z-index: 999;

}


.bottom a {

    width: 25%;

    max-width: 180px;

    text-align: center;

    padding:
        9px
        3px
        8px;

    color: #888;

    font-size: 11px;

    text-decoration: none;

}


.bottom a.active {

    color: #ff5a1f;

    font-weight: 700;

}


.bottom i {

    display: block;

    font-style: normal;

    font-size: 20px;

    margin-bottom: 3px;

}


/* =========================
   Mobile
========================= */

@media (
    max-width: 420px
) {

    .grid {

        gap: 5px;

    }


    .quick {

        padding:
            12px
            2px;

    }


    .quick b {

        font-size: 12px;

    }

}

</style>

<script>


/* =========================
   Firebase
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXCJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const auth =
    firebase.auth();


const db =
    firebase.firestore();



/* =========================
   Favorite Listener
========================= */

let favoriteUnsubscribe =
    null;



/* =========================
   Login
========================= */

function goLogin() {

    /*
       如果你的登录页面不是 login.html，
       这里以后再改。
    */

    window.location.href =
        "login.html";

}



/* =========================
   Load Favorite Count
========================= */

function loadFavoriteCount(user) {


    const countElement =
        document.getElementById(
            "favoriteCount"
        );


    const serviceElement =
        document.getElementById(
            "favoriteServiceText"
        );


    /* 取消旧监听 */

    if (
        favoriteUnsubscribe
    ) {

        favoriteUnsubscribe();

        favoriteUnsubscribe =
            null;

    }



    /* 没登录 */

    if (!user) {

        countElement.textContent =
            "登录后查看";


        serviceElement.textContent =
            "登录后查看收藏";


        return;

    }



    /*
       读取：

       customers
          └── 当前用户 UID
                └── favoriteRestaurantIds
    */

    favoriteUnsubscribe =
        db
        .collection("customers")
        .doc(user.uid)
        .onSnapshot(

            function(snapshot) {


                if (
                    !snapshot.exists
                ) {

                    countElement.textContent =
                        "0 家餐厅";


                    serviceElement.textContent =
                        "还没有收藏餐厅";


                    return;

                }



                const data =
                    snapshot.data() || {};



                let favoriteIds =
                    data.favoriteRestaurantIds;



                if (
                    !Array.isArray(
                        favoriteIds
                    )
                ) {

                    favoriteIds = [];

                }



                const count =
                    favoriteIds.length;



                countElement.textContent =
                    count +
                    " 家餐厅";



                if (
                    count === 0
                ) {

                    serviceElement.textContent =
                        "还没有收藏餐厅";

                } else {

                    serviceElement.textContent =
                        "已收藏 " +
                        count +
                        " 家餐厅";

                }

            },

            function(error) {

                console.error(
                    "收藏数量读取失败：",
                    error
                );


                countElement.textContent =
                    "查看收藏";


                serviceElement.textContent =
                    "打开查看收藏";

            }

        );

}



/* =========================
   Auth State
========================= */

auth.onAuthStateChanged(

    function(user) {


        const userCard =
            document.getElementById(
                "userCard"
            );


        const loginCard =
            document.getElementById(
                "loginCard"
            );


        const logoutCard =
            document.getElementById(
                "logoutCard"
            );



        if (user) {


            userCard.style.display =
                "flex";


            loginCard.style.display =
                "none";


            logoutCard.style.display =
                "block";



            document.getElementById(
                "userName"
            ).textContent =
                user.displayName ||
                "MDY FOOD 用户";



            document.getElementById(
                "userEmail"
            ).textContent =
                user.email ||
                "已登录";



            loadFavoriteCount(
                user
            );


        } else {


            userCard.style.display =
                "none";


            loginCard.style.display =
                "block";


            logoutCard.style.display =
                "none";



            loadFavoriteCount(
                null
            );

        }

    }

);



/* =========================
   Logout
========================= */

async function logout() {

    try {

        await auth.signOut();

        window.location.reload();

    }

    catch (error) {

        console.error(
            error
        );

        alert(
            "退出登录失败：" +
            error.message
        );

    }

}

</script>
