<script>

/* =========================================================
   Firebase 配置
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


/* =========================================================
   Firebase 初始化
========================================================= */

if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}


const db =
    firebase.firestore();


const auth =
    firebase.auth();


/* =========================================================
   Firebase 登录持久化
========================================================= */

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.catch(function(error) {

    console.warn(
        "Firebase 登录持久化设置失败:",
        error
    );

});


/* =========================================================
   当前登录状态
========================================================= */

let currentUser = null;

let authReady = false;


/* =========================================================
   翻译
========================================================= */

function t(
    key,
    fallback
) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
            "function"
    ) {

        return window.MDYLanguage.t(
            key,
            {},
            fallback
        );

    }

    return fallback || key;

}


/* =========================================================
   页面语言
========================================================= */

function applyPageTranslations() {

    document
        .querySelectorAll(
            "[data-i18n]"
        )
        .forEach(
            function(element) {

                const key =
                    element.dataset.i18n;


                const fallback =
                    element.innerText;


                element.innerText =
                    t(
                        key,
                        fallback
                    );

            }
        );


    document.title =
        "MDY FOOD - " +
        t(
            "profile",
            "我的"
        );


    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.getLanguage ===
            "function"
    ) {

        const lang =
            window.MDYLanguage.getLanguage();


        if (lang === "my") {

            document.documentElement.lang =
                "my";

        }

        else if (lang === "en") {

            document.documentElement.lang =
                "en";

        }

        else {

            document.documentElement.lang =
                "zh-CN";

        }

    }

}


/* =========================================================
   返回首页
========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================================
   编辑个人资料
========================================================= */

function editProfile() {

    window.location.href =
        "edit-profile.html";

}


/* =========================================================
   退出登录
========================================================= */

async function logout() {

    const confirmed =
        window.confirm(
            t(
                "confirmLogout",
                "确定要退出登录吗？"
            )
        );


    if (!confirmed) {

        return;

    }


    try {

        await auth.signOut();


        currentUser =
            null;


        window.location.href =
            "index.html";


    }

    catch (error) {

        console.error(
            "退出登录失败:",
            error
        );


        window.alert(
            t(
                "logoutError",
                "退出登录失败，请稍后再试"
            )
        );

    }

}


/* =========================================================
   更新账户界面
========================================================= */

function updateUserUI() {

    const userCard =
        document.getElementById(
            "userCard"
        );


    const loginCard =
        document.getElementById(
            "loginCard"
        );


    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    const userName =
        document.getElementById(
            "userName"
        );


    const userEmail =
        document.getElementById(
            "userEmail"
        );


    if (!userCard ||
        !loginCard ||
        !logoutButton ||
        !userName ||
        !userEmail
    ) {

        return;

    }


    /*
       Firebase 尚未恢复登录状态时，
       暂时不判断为未登录。
    */

    if (!authReady) {

        userCard.style.display =
            "flex";

        loginCard.style.display =
            "none";

        logoutButton.style.display =
            "none";


        userName.innerText =
            t(
                "myAccount",
                "我的账户"
            );


        userEmail.innerText =
            t(
                "checkingLogin",
                "正在读取账户信息..."
            );


        return;

    }


    /* =========================
       已登录
    ========================= */

    if (currentUser) {

        userCard.style.display =
            "flex";

        loginCard.style.display =
            "none";

        logoutButton.style.display =
            "block";


        let displayName =
            currentUser.displayName;


        if (!displayName) {

            displayName =
                t(
                    "defaultUserName",
                    "MDY FOOD 用户"
                );

        }


        userName.innerText =
            displayName;


        if (currentUser.email) {

            userEmail.innerText =
                currentUser.email;

        }

        else if (
            currentUser.phoneNumber
        ) {

            userEmail.innerText =
                currentUser.phoneNumber;

        }

        else {

            userEmail.innerText =
                t(
                    "loggedIn",
                    "已登录"
                );

        }


        return;

    }


    /* =========================
       未登录
    ========================= */

    userCard.style.display =
        "none";

    loginCard.style.display =
        "block";

    logoutButton.style.display =
        "none";

}


/* =========================================================
   Firebase 登录状态监听
========================================================= */

auth.onAuthStateChanged(
    function(user) {

        currentUser =
            user || null;


        authReady =
            true;


        updateUserUI();

    }
);


/* =========================================================
   语言选择器
========================================================= */

function renderLanguageSelector() {

    if (
        !window.MDYLanguage ||
        typeof window.MDYLanguage.renderLanguageSelector !==
            "function"
    ) {

        console.warn(
            "MDYLanguage.renderLanguageSelector 不存在"
        );

        return;

    }


    const selector =
        document.getElementById(
            "languageSelector"
        );


    if (!selector) {

        return;

    }


    window.MDYLanguage.renderLanguageSelector(
        selector
    );

}


/* =========================================================
   监听语言变化
========================================================= */

window.addEventListener(
    "mdyLanguageChanged",
    function() {

        applyPageTranslations();

        renderLanguageSelector();

        updateUserUI();

    }
);


/* =========================================================
   初始化
========================================================= */

applyPageTranslations();

renderLanguageSelector();

updateUserUI();

</script>


</body>

</html>
