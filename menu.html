<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四川味道 - Mandalay Food</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding-bottom: 90px;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .restaurant-info {
            background: white;
            padding: 20px;
        }

        .restaurant-info h2 {
            margin: 0 0 8px;
        }

        .restaurant-info p {
            margin: 5px 0;
            color: #666;
        }

        #foodList {
            padding: 15px;
        }

        .food {
            background: white;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
        }

        .food img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
        }

        .food-info {
            flex: 1;
        }

        .food-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .food-description {
            color: #777;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .price {
            color: #ff5a1f;
            font-weight: bold;
            font-size: 17px;
        }

        .add-btn {
            margin-top: 10px;
            border: none;
            background: #ff5a1f;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #222;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-btn {
            background: #ff5a1f;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="back">← 返回餐厅</a>
</header>

<div class="restaurant-info">
    <h2>四川味道</h2>
    <p>川菜 · 中餐</p>
    <p>⭐ 4.8</p>
</div>

<div id="foodList">
    <div class="loading">正在加载菜单...</div>
</div>

<div class="cart-bar">
    <div>
        🛒 <span id="cartCount">0</span> 件
       　<span id="cartTotal">0</span> Ks
    </div>

    <button class="cart-btn" onclick="openCart()">
        查看购物车
    </button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",
        authDomain: "mdy-food.firebaseapp.com",
        projectId: "mdy-food",
        storageBucket: "mdy-food.firebasestorage.app",
        messagingSenderId: "498327590625",
        appId: "1:498327590625:web:cceafb7febb689e7ad09a0",
        measurementId: "G-6Q5G2862XQ"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    const restaurantId = "AxVX8H1owO7IKe0EJcmb";

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function loadFoods() {

        db.collection("foods")
            .where("restaurantId", "==", restaurantId)
            .get()
            .then(function(snapshot) {

                const foodList = document.getElementById("foodList");

                foodList.innerHTML = "";

                if (snapshot.empty) {
                    foodList.innerHTML =
                        '<div class="loading">暂时没有菜单</div>';
                    return;
                }

                snapshot.forEach(function(doc) {

                    const food = doc.data();

                    if (food.status !== "营业中") {
                        return;
                    }

                    const div = document.createElement("div");

                    div.className = "food";

                    div.innerHTML = `
                        <img
                            src="${food.image}"
                            alt="${food.name}"
                        >

                        <div class="food-info">

                            <div class="food-name">
                                ${food.name}
                            </div>

                            <div class="food-description">
                                ${food.description || ""}
                            </div>

                            <div class="price">
                                ${Number(food.price).toLocaleString()} Ks
                            </div>

                            <button
                                class="add-btn"
                                onclick="addFood('${food.name}', ${food.price})"
                            >
                                + 加入购物车
                            </button>

                        </div>
                    `;

                    foodList.appendChild(div);
                });

            })
            .catch(function(error) {

                console.error(error);

                document.getElementById("foodList").innerHTML =
                    '<div class="loading">菜单加载失败，请检查网络</div>';
            });
    }

    function addFood(name, price) {

        let existingFood = cart.find(function(item) {
            return item.name === name;
        });

        if (existingFood) {

            existingFood.quantity += 1;

        } else {

            cart.push({
                name: name,
                price: Number(price),
                quantity: 1
            });
        }

        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );

        updateCart();

        alert(name + " 已加入购物车！");
    }

    function updateCart() {

        let count = 0;
        let total = 0;

        cart.forEach(function(item) {

            count += item.quantity;

            total +=
                Number(item.price) *
                Number(item.quantity);
        });

        document.getElementById("cartCount").innerText =
            count;

        document.getElementById("cartTotal").innerText =
            total.toLocaleString();
    }

    function openCart() {

        window.location.href = "cart.html";
    }

    updateCart();

    loadFoods();
</script>

</body>
</html>
