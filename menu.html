<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餐厅菜单 - MDY FOOD</title>
<style>
*{box-sizing:border-box}
:root{
  --orange:#ff5a1f;
  --orange2:#ff7a45;
  --cream:#fff8f3;
  --bg:#f6f6f6;
  --text:#222;
  --muted:#777;
  --green:#159447;
  --red:#d9363e;
  --shadow:0 5px 18px rgba(0,0,0,.07);
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  padding-bottom:105px;
}
button,input{font:inherit}
button{cursor:pointer}
.top{
  position:relative;
  background:linear-gradient(135deg,#ff5a1f,#ff7a45);
  color:#fff;
  padding:12px 15px 18px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.back{
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:700;
  background:rgba(255,255,255,.16);
  padding:8px 12px;
  border-radius:20px;
}
.brand-mini{font-size:15px;font-weight:800;letter-spacing:.3px}
.cover-wrap{
  background:#fff;
  position:relative;
}
.cover{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}
.placeholder{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fff0e8,#ffe0d1);
  color:var(--orange);
  font-size:68px;
}
.restaurant-card{
  position:relative;
  margin:-30px 12px 0;
  background:#fff;
  border-radius:20px;
  padding:18px 16px 15px;
  box-shadow:0 8px 25px rgba(0,0,0,.09);
  z-index:3;
}
.name-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.name-row h1{margin:0;font-size:23px;line-height:1.25}
.category{margin:7px 0 10px;color:var(--muted);font-size:13px}
.status{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}
.status.open{background:#eaf8ef;color:var(--green)}
.status.closed{background:#fff0f0;color:var(--red)}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.meta-chip{
  background:#f7f7f7;
  border-radius:9px;
  padding:7px 9px;
  color:#555;
  font-size:12px;
}
.rating-chip{background:#fff7e8;color:#a96700;font-weight:800}
.search-wrap{
  position:sticky;
  top:0;
  z-index:20;
  padding:12px 13px 8px;
  background:rgba(246,246,246,.96);
  backdrop-filter:blur(8px);
}
.search-box{
  height:48px;
  background:#fff;
  border-radius:16px;
  display:flex;
  align-items:center;
  padding:0 14px;
  box-shadow:var(--shadow);
}
.search-icon{font-size:20px;margin-right:8px}
.search{
  flex:1;border:0;outline:0;background:transparent;font-size:15px;min-width:0;
}
.search::placeholder{color:#aaa}
.content{padding:5px 13px 0}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin:10px 2px 12px;
}
.section-title{font-size:19px;font-weight:800}
.section-sub{font-size:12px;color:#999}
.food-list{display:flex;flex-direction:column;gap:11px}
.food{
  background:#fff;
  border-radius:17px;
  padding:10px;
  display:flex;
  gap:11px;
  box-shadow:var(--shadow);
  min-height:128px;
}
.food-image-box{position:relative;flex:0 0 116px}
.food img{
  width:116px;height:116px;object-fit:cover;border-radius:13px;display:block;background:#eee;
}
.food-info{flex:1;min-width:0;padding:2px 1px}
.food-name{
  font-size:17px;font-weight:800;line-height:1.3;
  margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.food-description{
  color:#888;font-size:12px;line-height:1.45;
  min-height:34px;margin-bottom:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.price{font-size:17px;color:var(--orange);font-weight:900}
.price small{font-size:11px;color:#999;font-weight:600}
.food-actions{display:flex;justify-content:flex-end;align-items:center;margin-top:7px}
.add-btn{
  border:0;background:var(--orange);color:#fff;
  border-radius:20px;padding:8px 13px;font-size:12px;font-weight:800;
  box-shadow:0 3px 9px rgba(255,90,31,.22);
}
.add-btn:disabled{background:#bbb;box-shadow:none}
.quantity-control{
  display:none;align-items:center;gap:9px;background:#fff4ef;
  border-radius:22px;padding:3px;
}
.quantity-control.show{display:flex}
.quantity-btn{
  width:31px;height:31px;border:0;border-radius:50%;
  background:#fff;color:var(--orange);font-size:19px;font-weight:900;
}
.quantity-number{min-width:20px;text-align:center;font-weight:900}
.added-tip{display:none}
.review-section{
  margin-top:17px;background:#fff;border-radius:18px;padding:16px;
  box-shadow:var(--shadow);
}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.review-title{font-size:18px;font-weight:800}
.review-count{font-size:12px;color:#999}
.rating-summary{
  background:var(--cream);border-radius:15px;padding:14px;
  display:flex;align-items:center;gap:14px;margin-bottom:13px;
}
.rating-score{font-size:30px;font-weight:900;color:#f59e0b;min-width:58px;text-align:center}
.rating-stars{color:#f59e0b;font-size:18px;letter-spacing:1px}
.rating-label{font-size:12px;color:#888;margin-top:3px}
.review-list{display:flex;flex-direction:column;gap:9px}
.review-item{background:#f8f8f8;border-radius:13px;padding:12px}
.review-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.review-user{font-weight:800;font-size:13px}
.review-time{font-size:11px;color:#aaa}
.review-stars{color:#f59e0b;font-size:14px;margin-bottom:5px}
.review-comment{font-size:13px;color:#555;line-height:1.55;word-break:break-word}
.review-empty,.review-loading,.review-error{
  text-align:center;padding:25px 10px;color:#999;font-size:13px;
}
.empty{
  background:#fff;border-radius:17px;padding:40px 15px;text-align:center;color:#888;
}
.empty-icon{font-size:45px;margin-bottom:8px}
.cart-bar{
  position:fixed;left:10px;right:10px;bottom:10px;z-index:1000;
  background:#242424;color:#fff;border-radius:18px;padding:8px 9px 8px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.25);
}
.cart-summary{font-size:12px;min-width:0}
.cart-summary strong{font-size:14px}
.cart-total{color:#ff9a72;font-size:16px;font-weight:900;margin-left:5px}
.cart-btn{
  flex-shrink:0;border:0;background:var(--orange);color:#fff;
  border-radius:13px;padding:11px 15px;font-weight:900;font-size:13px;
}
@media(max-width:500px){
  .cover,.placeholder{height:185px}
  .restaurant-card{margin-top:-25px;padding:15px}
  .name-row h1{font-size:21px}
  .food{padding:9px;min-height:115px}
  .food-image-box{flex-basis:100px}
  .food img{width:100px;height:100px}
  .food-name{font-size:15px}
  .food-description{font-size:11px;min-height:31px}
  .price{font-size:16px}
  .add-btn{padding:7px 11px}
}
</style>
</head>
<body>

<header class="top">
  <div class="topbar">
    <a href="restaurants.html" class="back" data-i18n="backToRestaurant">← 返回餐厅</a>
    <div class="brand-mini">MDY FOOD · မန္တလေး</div>
  </div>
</header>

<section class="cover-wrap">
  <img id="restaurantImage" class="cover" src="" alt="餐厅" style="display:none;">
  <div id="restaurantPlaceholder" class="placeholder">🍜</div>

  <div class="restaurant-card">
    <div class="name-row">
      <div>
        <h1 id="restaurantName"><span data-i18n="loading">正在加载...</span></h1>
        <div id="restaurantCategory" class="category"></div>
      </div>
      <div id="restaurantStatus" class="status open">读取中...</div>
    </div>
    <div class="meta">
      <div id="restaurantRating" class="meta-chip rating-chip">⭐ 暂无评分</div>
      <div id="restaurantFoodCount" class="meta-chip">🍽️ 菜品</div>
      <div class="meta-chip">🇲🇲 Mandalay</div>
    </div>
  </div>
</section>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input id="foodSearch" class="search" type="text"
      data-i18n-placeholder="searchFoodPlaceholder"
      placeholder="搜索菜品 / 搜索菜单"
      oninput="searchFoods()">
  </div>
</div>

<main class="content">
  <div id="foodList">
    <div class="review-loading">正在加载菜单...</div>
  </div>

  <section class="review-section">
    <div class="review-head">
      <div class="review-title" data-i18n="customerReviews">⭐ 顾客评价</div>
      <div id="reviewCount" class="review-count">0 条评价</div>
    </div>
    <div class="rating-summary">
      <div id="reviewAverage" class="rating-score">暂无</div>
      <div>
        <div id="reviewAverageStars" class="rating-stars">☆☆☆☆☆</div>
        <div id="reviewAverageText" class="rating-label">暂无评价</div>
      </div>
    </div>
    <div id="reviewList" class="review-list">
      <div class="review-loading">正在加载评价...</div>
    </div>
  </section>
</main>

<div class="cart-bar">
  <div class="cart-summary">
    🛒 <strong id="cartCount">0</strong>
    <span id="cartItemsText" data-i18n="items">件</span>
    <span> · </span>
    <span id="cartTotal" class="cart-total">0</span> Ks
  </div>
  <button class="cart-btn" onclick="openCart()" data-i18n="viewCart">查看购物车 →</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="language.js"></script>

<script>
"use strict";

function t(key,fallback){
  if(window.MDYLanguage && typeof window.MDYLanguage.t==="function"){
    return window.MDYLanguage.t(key,{},fallback||key);
  }
  return fallback||key;
}

const firebaseConfig={
  apiKey:"AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",
  authDomain:"mdy-food.firebaseapp.com",
  projectId:"mdy-food",
  storageBucket:"mdy-food.firebasestorage.app",
  messagingSenderId:"498327590625",
  appId:"1:498327590625:web:cceafb7febb689e7ad09a0",
  measurementId:"G-6Q5G2862XQ"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const params=new URLSearchParams(window.location.search);
const restaurantId=params.get("id");

let cart=[];
try{
  cart=JSON.parse(localStorage.getItem("cart")||"[]");
  if(!Array.isArray(cart)) cart=[];
}catch(e){cart=[];}

let allFoods=[];
let currentRestaurant=null;
let currentReviews=[];
let reviewsUnsubscribe=null;

const defaultFoodImage="https://images.unsplash.com/photo-1546069901-ba9599a7e63c";

function escapeHtml(text){
  return String(text===null||text===undefined?"":text)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeJs(text){
  return String(text===null||text===undefined?"":text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\r/g,"\\r")
    .replace(/\n/g,"\\n");
}
function translateCategory(category){
  const value=String(category||"").trim();
  if(!value) return "";
  if(window.MDYLanguage && typeof window.MDYLanguage.translateCategory==="function"){
    return window.MDYLanguage.translateCategory(value);
  }
  const map={
    "全部":t("categoryAll","全部"),
    "川菜":t("categorySichuan","川菜"),
    "缅甸菜":t("categoryMyanmar","缅甸菜"),
    "烧烤":t("categoryBBQ","烧烤"),
    "其他":t("categoryOther","其他")
  };
  return map[value]||value;
}

function showRestaurantNotFound(){
  document.getElementById("restaurantName").innerText=t("restaurantNotFound","找不到餐厅");
  document.getElementById("restaurantCategory").innerText="";
  document.getElementById("restaurantStatus").innerText="";
  document.getElementById("foodList").innerHTML=
    '<div class="empty"><div class="empty-icon">🍽️</div>'+
    escapeHtml(t("restaurantNotFound","找不到餐厅"))+'</div>';
  document.getElementById("reviewList").innerHTML=
    '<div class="review-error">'+escapeHtml(
      t("restaurantCannotLoadReviews","找不到餐厅，无法读取评价"))+'</div>';
}

function loadRestaurant(){
  db.collection("restaurants").doc(restaurantId).get().then(doc=>{
    if(!doc.exists){showRestaurantNotFound();return;}
    currentRestaurant=doc.data()||{};
    renderRestaurant();
  }).catch(error=>{
    console.error("读取餐厅失败：",error);
    document.getElementById("restaurantName").innerText=
      t("restaurantLoadFailed","餐厅加载失败");
  });
}

function renderRestaurant(){
  if(!currentRestaurant)return;
  const name=currentRestaurant.name||t("restaurant","餐厅");
  document.getElementById("restaurantName").innerText=name;
  document.getElementById("restaurantCategory").innerText=
    translateCategory(currentRestaurant.category||"");
  updateRestaurantStatus(currentRestaurant.status||"营业中");
  setRestaurantImage(currentRestaurant.image||currentRestaurant.cover||"");
  updateRestaurantRating(currentReviews);
  document.title=name+" - MDY FOOD";
}

function setRestaurantImage(url){
  const image=document.getElementById("restaurantImage");
  const placeholder=document.getElementById("restaurantPlaceholder");
  if(!url){
    image.style.display="none";placeholder.style.display="flex";return;
  }
  image.src=url;
  image.onload=()=>{image.style.display="block";placeholder.style.display="none";};
  image.onerror=()=>{image.style.display="none";placeholder.style.display="flex";};
}

function updateRestaurantStatus(status){
  const el=document.getElementById("restaurantStatus");
  const value=String(status||"").trim();
  const open=value==="营业中"||value==="open"||value==="Open";
  el.innerText=open?t("open","🟢 营业中"):t("closed","🔴 休息中");
  el.className="status "+(open?"open":"closed");
}

function isRestaurantOpen(){
  if(!currentRestaurant)return true;
  const status=String(currentRestaurant.status||"营业中").trim();
  return status==="营业中"||status==="open"||status==="Open";
}

function loadFoods(){
  db.collection("foods").where("restaurantId","==",restaurantId).get().then(snapshot=>{
    allFoods=[];
    snapshot.forEach(doc=>{
      const food=doc.data()||{};
      if(food.status &&
         food.status!=="营业中" &&
         food.status!=="open" &&
         food.status!=="Open") return;
      allFoods.push({id:doc.id,...food});
    });
    const countEl=document.getElementById("restaurantFoodCount");
    if(countEl) countEl.innerText="🍽️ "+allFoods.length+" "+t("foodCountSuffix","菜品");
    renderFoods(getCurrentSearchResults());
  }).catch(error=>{
    console.error("读取菜品失败：",error);
    document.getElementById("foodList").innerHTML=
      '<div class="empty"><div class="empty-icon">⚠️</div>'+
      escapeHtml(t("menuLoadFailed","菜单加载失败，请检查网络"))+'</div>';
  });
}

function getCurrentSearchResults(){
  const input=document.getElementById("foodSearch");
  if(!input)return allFoods;
  const keyword=input.value.trim().toLowerCase();
  if(!keyword)return allFoods;
  return allFoods.filter(food=>{
    const name=String(food.name||"").toLowerCase();
    const desc=String(food.description||"").toLowerCase();
    return name.includes(keyword)||desc.includes(keyword);
  });
}

function searchFoods(){renderFoods(getCurrentSearchResults());}

function getFoodQuantity(name){
  const item=cart.find(item=>item.name===name && item.restaurantId===restaurantId);
  return item?Number(item.quantity)||0:0;
}

function renderFoods(foods){
  const list=document.getElementById("foodList");
  if(!list)return;
  list.innerHTML="";

  if(!foods.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">🍽️</div>'+
      escapeHtml(t("noFoodFound","暂时没有找到相关菜品"))+'</div>';
    return;
  }

  const head=document.createElement("div");
  head.className="section-head";
  head.innerHTML='<div class="section-title">🍛 '+escapeHtml(t("menu","菜单"))+
    '</div><div class="section-sub">'+foods.length+" "+escapeHtml(t("foodCountSuffix","款"))+'</div>';
  list.appendChild(head);

  const wrap=document.createElement("div");
  wrap.className="food-list";

  foods.forEach(food=>{
    const div=document.createElement("div");
    div.className="food";
    div.dataset.foodId=food.id;

    const image=food.image||food.imageUrl||defaultFoodImage;
    const foodName=food.name||t("food","菜品");
    const price=Number(food.price)||0;
    const quantity=getFoodQuantity(foodName);
    const open=isRestaurantOpen();

    div.innerHTML=`
      <div class="food-image-box">
        <img src="${escapeHtml(image)}" alt="${escapeHtml(foodName)}"
          onerror="this.src='${escapeHtml(defaultFoodImage)}'">
      </div>
      <div class="food-info">
        <div class="food-name">${escapeHtml(foodName)}</div>
        <div class="food-description">${escapeHtml(food.description||"")}</div>
        <div class="price">${price.toLocaleString()} <small>Ks</small></div>
        <div class="food-actions">
          <button class="add-btn" ${open?"":"disabled"}
            onclick="addFood('${escapeJs(foodName)}',${price})"
            style="${quantity>0?"display:none;":""}">
            + ${escapeHtml(open?t("addToCart","加入购物车"):t("restaurantClosedMessage","餐厅休息中"))}
          </button>
          <div class="quantity-control ${quantity>0?"show":""}">
            <button class="quantity-btn"
              onclick="changeFoodQuantity('${escapeJs(foodName)}',-1)">−</button>
            <span class="quantity-number">${quantity}</span>
            <button class="quantity-btn"
              onclick="changeFoodQuantity('${escapeJs(foodName)}',1)">+</button>
          </div>
        </div>
      </div>`;
    wrap.appendChild(div);
  });

  list.appendChild(wrap);
}

function addFood(name,price){
  if(!isRestaurantOpen()){
    alert(t("restaurantClosedMessage","餐厅目前休息中"));
    return;
  }

  let item=cart.find(x=>x.name===name&&x.restaurantId===restaurantId);
  if(item)item.quantity=(Number(item.quantity)||0)+1;
  else cart.push({
    name:name,
    price:Number(price)||0,
    quantity:1,
    restaurantId:restaurantId,
    restaurantName:currentRestaurant&&currentRestaurant.name?currentRestaurant.name:""
  });

  saveCart();
  updateCart();
  renderFoods(getCurrentSearchResults());
}

function changeFoodQuantity(name,amount){
  const item=cart.find(x=>x.name===name&&x.restaurantId===restaurantId);
  if(!item)return;
  item.quantity=(Number(item.quantity)||0)+Number(amount);

  if(item.quantity<=0){
    cart=cart.filter(x=>!(x.name===name&&x.restaurantId===restaurantId));
  }
  saveCart();
  updateCart();
  renderFoods(getCurrentSearchResults());
}

function saveCart(){localStorage.setItem("cart",JSON.stringify(cart));}

function updateCart(){
  let count=0,total=0;
  cart.forEach(item=>{
    const q=Number(item.quantity)||0;
    const p=Number(item.price)||0;
    count+=q;total+=p*q;
  });
  document.getElementById("cartCount").innerText=count;
  document.getElementById("cartTotal").innerText=total.toLocaleString();
}

function openCart(){window.location.href="cart.html";}

function getReviewTime(review){
  const time=review.createdAt||review.created_at;
  if(!time)return 0;
  try{
    if(typeof time.toMillis==="function")return time.toMillis();
    if(typeof time.toDate==="function")return time.toDate().getTime();
    if(time instanceof Date)return time.getTime();
    if(typeof time==="number")return time;
    const result=new Date(time).getTime();
    return isNaN(result)?0:result;
  }catch(e){return 0;}
}

function loadReviews(){
  const list=document.getElementById("reviewList");
  list.innerHTML='<div class="review-loading">'+escapeHtml(
    t("loadingReviews","正在加载评价..."))+'</div>';

  if(typeof reviewsUnsubscribe==="function")reviewsUnsubscribe();

  reviewsUnsubscribe=db.collection("reviews")
    .where("restaurantId","==",restaurantId)
    .onSnapshot(snapshot=>{
      currentReviews=[];
      snapshot.forEach(doc=>currentReviews.push({id:doc.id,...(doc.data()||{})}));
      currentReviews.sort((a,b)=>getReviewTime(b)-getReviewTime(a));
      renderReviews(currentReviews);
      updateRestaurantRating(currentReviews);
    },error=>{
      console.error("读取评价失败：",error);
      list.innerHTML='<div class="review-error">'+escapeHtml(
        t("reviewLoadFailed","评价加载失败，请检查网络"))+'</div>';
    });
}

function calculateAverageRating(reviews){
  let total=0,count=0;
  reviews.forEach(review=>{
    const rating=Number(review.rating);
    if(rating>=1&&rating<=5){total+=rating;count++;}
  });
  return count?{average:total/count,count}:null;
}

function updateRestaurantRating(reviews){
  const el=document.getElementById("restaurantRating");
  const result=calculateAverageRating(reviews);
  el.innerText=result
    ?"⭐ "+result.average.toFixed(1)+" · "+result.count+" "+t("reviewCountSuffix","条评价")
    :t("noRating","⭐ 暂无评分");
}

function createStars(rating){
  const value=Math.max(0,Math.min(5,Number(rating)||0));
  let result="";
  for(let i=1;i<=5;i++)result+=value>=i?"★":"☆";
  return result;
}

function maskCustomerName(name){
  const value=String(name||"").trim();
  if(!value)return t("anonymousCustomer","匿名顾客");
  if(["匿名顾客","Anonymous Customer","အမည်မသိ ဖောက်သည်"].includes(value))
    return t("anonymousCustomer","匿名顾客");
  if(value.length===1)return "*";
  if(value.length===2)return value.charAt(0)+"*";
  return value.charAt(0)+"*".repeat(Math.max(1,value.length-2))+value.charAt(value.length-1);
}

function formatReviewDate(review){
  const time=review.createdAt||review.created_at;
  if(!time)return t("timeUnknown","时间未知");
  try{
    const date=typeof time.toDate==="function"?time.toDate():
      time instanceof Date?time:new Date(time);
    if(isNaN(date.getTime()))return t("timeUnknown","时间未知");
    if(window.MDYLanguage&&typeof window.MDYLanguage.formatDateTime==="function")
      return window.MDYLanguage.formatDateTime(date);
    return date.toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",hour12:false});
  }catch(e){return t("timeUnknown","时间未知");}
}

function renderReviews(reviews){
  const list=document.getElementById("reviewList");
  const count=document.getElementById("reviewCount");
  const average=document.getElementById("reviewAverage");
  const stars=document.getElementById("reviewAverageStars");
  const label=document.getElementById("reviewAverageText");

  count.innerText=reviews.length+" "+t("reviewCountSuffix","条评价");

  if(!reviews.length){
    average.innerText=t("noData","暂无");
    stars.innerText="☆☆☆☆☆";
    label.innerText=t("noReviews","暂无评价");
    list.innerHTML='<div class="review-empty"><div style="font-size:34px;margin-bottom:6px">⭐</div>'+
      escapeHtml(t("noCustomerReviews","暂时还没有顾客评价"))+'</div>';
    return;
  }

  const result=calculateAverageRating(reviews);
  if(result){
    average.innerText=result.average.toFixed(1);
    stars.innerText=createStars(result.average);
    label.innerText=result.count+" "+t("customersRated","位顾客参与评分");
  }else{
    average.innerText=t("noData","暂无");
    stars.innerText="☆☆☆☆☆";
    label.innerText=t("noValidRating","暂无有效评分");
  }

  list.innerHTML="";
  reviews.forEach(review=>{
    const item=document.createElement("div");
    item.className="review-item";
    const customerName=review.customerName||review.customername||
      t("anonymousCustomer","匿名顾客");
    const comment=review.comment||t("customerNoComment","顾客未填写评价");
    const rating=Number(review.rating)||0;
    item.innerHTML=`
      <div class="review-top">
        <div class="review-user">${escapeHtml(maskCustomerName(customerName))}</div>
        <div class="review-time">${escapeHtml(formatReviewDate(review))}</div>
      </div>
      <div class="review-stars">${createStars(rating)}</div>
      <div class="review-comment">${escapeHtml(comment)}</div>`;
    list.appendChild(item);
  });
}

function refreshStaticLanguage(){
  const language=window.MDYLanguage&&typeof window.MDYLanguage.getLanguage==="function"
    ?window.MDYLanguage.getLanguage():"zh";
  document.documentElement.lang=language==="my"?"my":language==="en"?"en":"zh-CN";
  if(currentRestaurant)renderRestaurant();
  renderReviews(currentReviews);
  renderFoods(getCurrentSearchResults());
  updateCart();
}

window.addEventListener("mdyLanguageChanged",refreshStaticLanguage);

function initializePage(){
  updateCart();
  if(!restaurantId){showRestaurantNotFound();return;}
  loadRestaurant();
  loadFoods();
  loadReviews();
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",initializePage);
}else{
  initializePage();
}
</script>
</body>
</html>
