<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>我的收藏 - MDY FOOD</title>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="language.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    background: #f7f7f7;

    color: #222;

    padding-bottom: 75px;
}


/* =========================
   顶部
========================= */

.header {

    background:
        linear-gradient(
            135deg,
            #ff6a2a,
            #ff4d1f
        );

    color: #fff;

    padding:
        18px
        15px
        22px;
}


.header-top {

    display: flex;

    align-items: center;

    gap: 12px;
}


.back {

    width: 38px;

    height: 38px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(
            255,
            255,
            255,
            .18
        );

    color: #fff;

    font-size: 22px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}


.title {

    font-size: 22px;

    font-weight: 800;
}


/* =========================
   内容
========================= */

.container {

    max-width: 900px;

    margin: auto;

    padding: 15px;
}


/* =========================
   登录
========================= */

.login {

    background: #fff;

    border-radius: 15px;

    padding:
        28px
        20px;

    text-align: center;

    margin-top: 15px;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            .06
        );

    font-size: 15px;

    color: #666;
}


.login a {

    display: inline-block;

    margin-top: 15px;

    padding:
        11px
        20px;

    background: #ff5a1f;

    color: #fff;

    border-radius: 10px;

    text-decoration: none;

    font-weight: 700;
}


/* =========================
   空状态 / 加载
========================= */

.empty {

    background: #fff;

    border-radius: 15px;

    padding:
        50px
        20px;

    text-align: center;

    margin-top: 15px;

    color: #888;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            .05
        );

    line-height: 1.6;
}


.empty-icon {

    font-size: 55px;

    margin-bottom: 12px;
}


/* =========================
   收藏餐厅列表
========================= */

.grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            1fr
        );

    gap: 14px;

    margin-top: 15px;
}


.card {

    background: #fff;

    border-radius: 15px;

    overflow: hidden;

    box-shadow:
        0 4px 15px
        rgba(
            0,
            0,
            0,
            .06
        );

    cursor: pointer;

    position: relative;

    transition:
        transform .15s ease;
}


.card:active {

    transform:
        scale(.98);
}


/* =========================
   餐厅图片
========================= */

.image {

    height: 145px;

    background:
        #fff1eb;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 48px;

    overflow: hidden;
}


.image img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;
}


/* =========================
   餐厅信息
========================= */

.body {

    padding: 13px;
}


.name {

    font-size: 17px;

    font-weight: 800;

    margin-bottom: 7px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.meta {

    font-size: 13px;

    color: #777;

    line-height: 1.6;

    min-height: 20px;
}


/* =========================
   营业状态
========================= */

.status {

    display: inline-block;

    margin-top: 8px;

    padding:
        4px
        8px;

    border-radius: 8px;

    font-size: 12px;

    background: #eaf8ee;

    color: #218838;
}


.status.closed {

    background: #f1f1f1;

    color: #888;
}


/* =========================
   收藏按钮
========================= */

.heart {

    position: absolute;

    right: 9px;

    top: 9px;

    width: 38px;

    height: 38px;

    border: 0;

    border-radius: 50%;

    background: #fff;

    color: #ff5a1f;

    font-size: 23px;

    box-shadow:
        0 2px 8px
        rgba(
            0,
            0,
            0,
            .15
        );

    cursor: pointer;

    z-index: 2;

    display: flex;

    align-items: center;

    justify-content: center;
}


.heart:active {

    transform:
        scale(.9);
}


/* =========================
   底部导航
========================= */

.bottom {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    height: 64px;

    background: #fff;

    border-top:
        1px solid
        #eee;

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    z-index: 10;

    box-shadow:
        0 -2px 10px
        rgba(
            0,
            0,
            0,
            .04
        );
}


.nav {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-decoration: none;

    color: #888;

    font-size: 11px;

    font-weight: 600;

    gap: 3px;
}


.nav span:first-child {

    font-size: 21px;
}


.nav.active {

    color: #ff5a1f;
}


/* =========================
   手机端
========================= */

@media (
    max-width: 500px
) {

    .grid {

        grid-template-columns:
            1fr 1fr;

        gap: 10px;
    }


    .image {

        height: 125px;
    }


    .name {

        font-size: 15px;
    }


    .body {

        padding: 11px;
    }

}


</style>

</head>


<body>


<!-- =========================
     顶部
========================= -->

<header class="header">

    <div class="header-top">

        <button
            class="back"
            onclick="goBack()"
        >
            ‹
        </button>


        <div class="title">

            ❤️ 我的收藏

        </div>

    </div>

</header>



<!-- =========================
     内容
========================= -->

<main class="container">

    <div id="content"></div>

</main>



<!-- =========================
     底部导航
========================= -->

<nav class="bottom">

    <a
        class="nav"
        href="index.html"
    >

        <span>🏠</span>

        首页

    </a>


    <a
        class="nav"
        href="restaurants.html"
    >

        <span>🍜</span>

        餐厅

    </a>


    <a
        class="nav"
        href="orders.html"
    >

        <span>📋</span>

        订单

    </a>


    <a
        class="nav active"
        href="profile.html"
    >

        <span>👤</span>

        我的

    </a>

</nav>



<script>


/* =========================================================
   Firebase 配置
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}


const db =
    firebase.firestore();


const auth =
    firebase.auth();


const content =
    document.getElementById(
        "content"
    );



/* =========================================================
   HTML 安全处理
========================================================= */

function esc(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   餐厅图标
========================================================= */

function getRestaurantIcon(
    category
) {

    const text =
        String(
            category || ""
        ).toLowerCase();


    if (
        text.includes("川") ||
        text.includes("sichuan")
    ) {

        return "🌶️";

    }


    if (
        text.includes("缅") ||
        text.includes("myanmar")
    ) {

        return "🇲🇲";

    }


    if (
        text.includes("烧") ||
        text.includes("bbq")
    ) {

        return "🔥";

    }


    return "🍜";

}



/* =========================================================
   返回
========================================================= */

function goBack() {

    if (
        document.referrer &&
        document.referrer.indexOf(
            window.location.hostname
        ) !== -1
    ) {

        window.history.back();

    } else {

        window.location.href =
            "profile.html";

    }

}



/* =========================================================
   打开餐厅
========================================================= */

function openRestaurant(
    id,
    status
) {

    /*
       如果餐厅有明确的休息状态，
       点击后提示用户。
    */

    if (
        status === "休息中" ||
        status === "已关闭" ||
        status === "关闭" ||
        status === "closed" ||
        status === "offline"
    ) {

        alert(
            "这家餐厅目前休息中，请稍后再来"
        );

        return;

    }


    /*
       MDY FOOD 当前菜单页面
       使用：

       menu.html?id=餐厅ID
    */

    location.href =
        "menu.html?id=" +
        encodeURIComponent(
            id
        );

}



/* =========================================================
   取消收藏
========================================================= */

async function removeFavorite(
    event,
    restaurantId
) {

    event.stopPropagation();


    const user =
        auth.currentUser;


    if (!user) {

        location.href =
            "login.html";

        return;

    }


    try {

        await db
            .collection("customers")
            .doc(user.uid)
            .set(

                {

                    favorites:
                        firebase.firestore
                            .FieldValue
                            .arrayRemove(
                                String(
                                    restaurantId
                                )
                            )

                },

                {
                    merge: true
                }

            );


        /*
           取消成功以后重新读取，
           让页面马上消失该餐厅。
        */

        await load();


    }

    catch (error) {

        console.error(
            "取消收藏失败：",
            error
        );


        alert(
            "取消收藏失败，请稍后再试"
        );

    }

}



/* =========================================================
   加载收藏
========================================================= */

async function load() {

    const user =
        auth.currentUser;


    /*
       Firebase Auth 还没有登录
    */

    if (!user) {

        content.innerHTML = `

            <div class="login">

                ❤️

                <br><br>

                请先登录后查看收藏

                <br>

                <a
                    href="login.html"
                >
                    去登录
                </a>

            </div>

        `;

        return;

    }



    /*
       显示读取状态
    */

    content.innerHTML = `

        <div class="empty">

            <div
                class="empty-icon"
            >
                🍜
            </div>

            正在读取收藏...

        </div>

    `;



    try {

        /*
           当前用户收藏数据：

           customers
             └── UID
                  └── favorites: [
                       restaurantId
                  ]
        */

        const customerSnap =
            await db
                .collection("customers")
                .doc(user.uid)
                .get();



        let favoriteIds = [];


        if (
            customerSnap.exists
        ) {

            const data =
                customerSnap.data() || {};


            if (
                Array.isArray(
                    data.favorites
                )
            ) {

                favoriteIds =
                    data.favorites.map(
                        function(id) {

                            return String(
                                id
                            );

                        }
                    );

            }

        }



        /*
           没有收藏
        */

        if (
            favoriteIds.length === 0
        ) {

            content.innerHTML = `

                <div class="empty">

                    <div
                        class="empty-icon"
                    >
                        ♡
                    </div>

                    <div>

                        还没有收藏餐厅

                    </div>

                    <div
                        style="
                            margin-top:8px;
                        "
                    >

                        去餐厅页面点
                        ❤️
                        收藏吧

                    </div>

                </div>

            `;

            return;

        }



        /*
           根据收藏的餐厅 ID
           分别读取 restaurants
        */

        const snapshots =
            await Promise.all(

                favoriteIds.map(
                    function(id) {

                        return db
                            .collection(
                                "restaurants"
                            )
                            .doc(id)
                            .get();

                    }
                )

            );



        const restaurants = [];



        snapshots.forEach(
            function(snapshot, index) {

                if (
                    snapshot.exists
                ) {

                    restaurants.push({

                        id:
                            favoriteIds[
                                index
                            ],

                        ...snapshot.data()

                    });

                }

            }
        );



        /*
           收藏的餐厅不存在
        */

        if (
            restaurants.length === 0
        ) {

            content.innerHTML = `

                <div class="empty">

                    <div
                        class="empty-icon"
                    >
                        ♡
                    </div>

                    <div>

                        还没有收藏餐厅

                    </div>

                    <div
                        style="
                            margin-top:8px;
                        "
                    >

                        去餐厅页面点
                        ❤️
                        收藏吧

                    </div>

                </div>

            `;

            return;

        }



        /*
           生成餐厅卡片
        */

        content.innerHTML = `

            <div class="grid">

                ${
                    restaurants
                        .map(
                            function(
                                restaurant
                            ) {

                                return createRestaurantCard(
                                    restaurant
                                );

                            }
                        )
                        .join("")

                }

            </div>

        `;

    }

    catch (error) {

        console.error(
            "读取收藏失败：",
            error
        );


        content.innerHTML = `

            <div class="empty">

                <div
                    class="empty-icon"
                >
                    ⚠️
                </div>

                <div>

                    收藏读取失败

                </div>

                <div
                    style="
                        margin-top:8px;
                        font-size:12px;
                        word-break:break-word;
                    "
                >

                    ${
                        esc(
                            error.message ||
                            "请检查网络连接"
                        )
                    }

                </div>

            </div>

        `;

    }

}



/* =========================================================
   创建餐厅卡片
========================================================= */

function createRestaurantCard(
    restaurant
) {

    const id =
        String(
            restaurant.id || ""
        );


    /*
       餐厅名称兼容多个字段
    */

    const name =
        restaurant.name ||
        restaurant.restaurantName ||
        restaurant.title ||
        "MDY FOOD 餐厅";



    /*
       餐厅分类兼容多个字段
    */

    const category =
        restaurant.category ||
        restaurant.restaurantType ||
        restaurant.type ||
        "";



    /*
       图片兼容多个字段
    */

    const image =
        restaurant.image ||
        restaurant.imageUrl ||
        restaurant.cover ||
        restaurant.photo ||
        "";



    /*
       营业状态

       优先读取 status。

       如果没有 status，
       enabled=false 视为休息中。
    */

    let status =
        restaurant.status;


    if (
        !status
    ) {

        if (
            restaurant.enabled === false
        ) {

            status =
                "休息中";

        } else {

            status =
                "营业中";

        }

    }



    /*
       如果 status 是布尔值
    */

    if (
        status === true
    ) {

        status =
            "营业中";

    }


    if (
        status === false
    ) {

        status =
            "休息中";

    }



    /*
       图片失败以后显示餐厅图标
    */

    const icon =
        getRestaurantIcon(
            category
        );



    /*
       防止单引号影响 onclick
    */

    const safeId =
        esc(id)
            .replace(
                /'/g,
                "\\'"
            );


    const safeStatus =
        esc(status)
            .replace(
                /'/g,
                "\\'"
            );



    let imageHTML = "";



    if (image) {

        imageHTML = `

            <img
                src="${esc(image)}"
                alt="${esc(name)}"
                onerror="
                    this.style.display='none';
                    this.parentElement.innerHTML='${icon}';
                "
            >

        `;

    } else {

        imageHTML =
            icon;

    }



    const isClosed =
        status === "休息中" ||
        status === "已关闭" ||
        status === "关闭" ||
        status === "closed" ||
        status === "offline";



    return `

        <div
            class="card"
            onclick="
                openRestaurant(
                    '${safeId}',
                    '${safeStatus}'
                )
            "
        >


            <button
                class="heart"
                type="button"
                onclick="
                    removeFavorite(
                        event,
                        '${safeId}'
                    )
                "
                aria-label="取消收藏"
            >

                ♥️

            </button>



            <div class="image">

                ${imageHTML}

            </div>



            <div class="body">


                <div class="name">

                    ${esc(name)}

                </div>



                <div class="meta">

                    ${esc(
                        category ||
                        "餐厅"
                    )}

                </div>



                <span
                    class="
                        status
                        ${
                            isClosed
                                ? "closed"
                                : ""
                        }
                    "
                >

                    ${
                        isClosed
                            ? "🔴 休息中"
                            : "🟢 营业中"
                    }

                </span>


            </div>

        </div>

    `;

}



/* =========================================================
   Firebase 登录状态
========================================================= */

auth
    .setPersistence(
        firebase.auth.Auth.Persistence.LOCAL
    )
    .catch(
        function(error) {

            console.error(
                "登录持久化设置失败：",
                error
            );

        }
    );



/*
   必须使用 onAuthStateChanged
   等 Firebase Auth 完成初始化以后
   再读取收藏。

   这样可以避免：

   “明明已经登录，
    favorites.html 却显示请先登录”
*/

auth.onAuthStateChanged(
    function(user) {

        if (user) {

            console.log(
                "当前登录用户：",
                user.uid
            );

        } else {

            console.log(
                "当前没有登录用户"
            );

        }


        load();

    }
);


</script>

</body>

</html>
