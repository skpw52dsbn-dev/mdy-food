<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MDY FOOD - 商家入驻</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            background: #f7f7f7;

            color: #222;

        }


        .container {

            max-width: 500px;

            margin: 0 auto;

            padding: 30px 20px;

        }


        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: bold;

            margin-top: 15px;

            color: #ff5a36;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin: 8px 0 25px;

        }


        .card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);

        }


        h2 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 8px;

        }


        .tip {

            text-align: center;

            color: #888;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-top: 15px;

            font-size: 14px;

            font-weight: bold;

        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 14px;

            margin-top: 7px;

            border:
                1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #ff5a36;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        .submit-btn {

            width: 100%;

            padding: 14px;

            margin-top: 25px;

            border: none;

            border-radius: 10px;

            background: #ff5a36;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        .submit-btn:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        .back {

            text-align: center;

            margin-top: 18px;

        }


        .back a {

            color: #ff5a36;

            text-decoration: none;

            font-size: 14px;

        }


        #message {

            text-align: center;

            margin-top: 15px;

            line-height: 1.6;

            color: #e74c3c;

            font-size: 14px;

        }


        #message.success {

            color: #2e8b57;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        MDY FOOD

    </div>


    <div class="subtitle">

        Mandalay Food Delivery

    </div>


    <div class="card">


        <h2>

            🏪 商家入驻

        </h2>


        <div class="tip">

            欢迎加入 MDY FOOD

            <br>

            填写餐厅资料后，我们会进行审核

        </div>


        <!-- ========================================
             餐厅信息
        ======================================== -->

        <label>

            餐厅名称 *

        </label>

        <input
            type="text"
            id="restaurantName"
            placeholder="例如：四川饭馆"
        >


        <label>

            餐厅类型 *

        </label>

        <select id="restaurantType">

            <option value="">

                请选择餐厅类型

            </option>

            <option value="中餐">

                中餐

            </option>

            <option value="缅餐">

                缅餐

            </option>

            <option value="烧烤">

                烧烤

            </option>

            <option value="火锅">

                火锅

            </option>

            <option value="快餐">

                快餐

            </option>

            <option value="饮品">

                饮品

            </option>

            <option value="甜品">

                甜品

            </option>

            <option value="其他">

                其他

            </option>

        </select>


        <label>

            餐厅地址 *

        </label>

        <input
            type="text"
            id="restaurantAddress"
            placeholder="例如：Chanayethazan, Mandalay"
        >


        <label>

            餐厅简介

        </label>

        <textarea
            id="restaurantDescription"
            placeholder="简单介绍一下你的餐厅，例如特色菜、经营时间等"
        ></textarea>


        <!-- ========================================
             商家负责人信息
        ======================================== -->

        <label>

            商家姓名 *

        </label>

        <input
            type="text"
            id="ownerName"
            placeholder="请输入负责人姓名"
        >


        <label>

            联系电话 *

        </label>

        <input
            type="tel"
            id="phone"
            placeholder="例如：09xxxxxxxxx"
        >


        <label>

            邮箱 *

        </label>

        <input
            type="email"
            id="email"
            placeholder="请输入登录邮箱"
        >


        <label>

            登录密码 *

        </label>

        <input
            type="password"
            id="password"
            placeholder="至少 6 位密码"
        >


        <label>

            确认密码 *

        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="再次输入密码"
        >


        <button
            id="submitButton"
            class="submit-btn"
            onclick="submitApplication()"
        >

            提交商家入驻申请

        </button>


        <div id="message"></div>


        <div class="back">

            <a href="register.html">

                ← 返回顾客注册

            </a>

        </div>


    </div>


</div>



<!-- Firebase 10.12.2 -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>



<script>


// ========================================
// Firebase 配置
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


// 初始化 Firebase

firebase.initializeApp(
    firebaseConfig
);


const auth =
    firebase.auth();


const db =
    firebase.firestore();



/* ========================================
   显示提示
======================================== */

function showMessage(
    message,
    success = false
) {

    const element =
        document.getElementById(
            "message"
        );


    element.innerText =
        message;


    if (success) {

        element.className =
            "success";

    } else {

        element.className =
            "";

    }

}



/* ========================================
   提交商家申请
======================================== */

async function submitApplication() {


    const restaurantName =
        document
            .getElementById(
                "restaurantName"
            )
            .value
            .trim();


    const restaurantType =
        document
            .getElementById(
                "restaurantType"
            )
            .value;


    const restaurantAddress =
        document
            .getElementById(
                "restaurantAddress"
            )
            .value
            .trim();


    const restaurantDescription =
        document
            .getElementById(
                "restaurantDescription"
            )
            .value
            .trim();


    const ownerName =
        document
            .getElementById(
                "ownerName"
            )
            .value
            .trim();


    const phone =
        document
            .getElementById(
                "phone"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "email"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    const confirmPassword =
        document
            .getElementById(
                "confirmPassword"
            )
            .value;



    // ========================================
    // 基础检查
    // ========================================

    if (
        !restaurantName ||
        !restaurantType ||
        !restaurantAddress ||
        !ownerName ||
        !phone ||
        !email ||
        !password ||
        !confirmPassword
    ) {

        showMessage(
            "请填写所有带 * 的信息"
        );

        return;

    }



    if (
        password.length < 6
    ) {

        showMessage(
            "密码至少需要 6 位"
        );

        return;

    }



    if (
        password !==
        confirmPassword
    ) {

        showMessage(
            "两次密码不一致"
        );

        return;

    }



    const button =
        document.getElementById(
            "submitButton"
        );


    button.disabled =
        true;


    button.innerText =
        "正在提交...";



    try {


        // ========================================
        // 创建商家 Firebase 账号
        // ========================================

        const userCredential =
            await auth
                .createUserWithEmailAndPassword(
                    email,
                    password
                );


        const user =
            userCredential.user;



        // ========================================
        // 保存商家申请
        // ========================================

        await db
            .collection(
                "merchantApplications"
            )
            .doc(user.uid)
            .set({

                uid:
                    user.uid,

                restaurantName:
                    restaurantName,

                restaurantType:
                    restaurantType,

                restaurantAddress:
                    restaurantAddress,

                restaurantDescription:
                    restaurantDescription,

                ownerName:
                    ownerName,

                phone:
                    phone,

                email:
                    email,

                status:
                    "pending",

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });



        // ========================================
        // 成功
        // ========================================

        showMessage(
            "申请提交成功！请等待 MDY FOOD 审核。",
            true
        );


        button.innerText =
            "申请已提交";


        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            2000
        );


    }

    catch (error) {


        console.error(
            "商家注册错误：",
            error
        );


        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            showMessage(
                "这个邮箱已经注册过了"
            );

        }


        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            showMessage(
                "邮箱格式不正确"
            );

        }


        else if (
            error.code ===
            "auth/weak-password"
        ) {

            showMessage(
                "密码至少需要 6 位"
            );

        }


        else if (
            error.code ===
            "auth/network-request-failed"
        ) {

            showMessage(
                "网络连接失败，请检查网络后重试"
            );

        }


        else {

            showMessage(
                "申请失败：" +
                (
                    error.message ||
                    "未知错误"
                )
            );

        }


        button.disabled =
            false;


        button.innerText =
            "提交商家入驻申请";

    }

}

</script>


</body>

</html>
