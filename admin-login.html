<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>商家登录 - MDY FOOD</title>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #ff5a1f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #e94d17;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }

        .success {
            color: #16a34a;
            text-align: center;
            margin-top: 15px;
            line-height: 1.6;
        }

    </style>

</head>


<body>


    <header>
        🏪 MDY FOOD 商家端
    </header>


    <div class="container">

        <div class="login-box">

            <h1>商家登录</h1>

            <div class="subtitle">
                MDY FOOD Merchant
            </div>


            <input
                id="email"
                type="email"
                placeholder="注册时使用的邮箱"
            >


            <input
                id="password"
                type="password"
                placeholder="密码"
            >


            <button
                id="loginButton"
                onclick="login()"
            >
                登录
            </button>


            <div
                id="error"
                class="error"
            ></div>


            <div
                id="success"
                class="success"
            ></div>

        </div>

    </div>



    <script>


        // =========================
        // Firebase 配置
        // =========================

        const firebaseConfig = {

            apiKey:
                "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

            authDomain:
                "mdy-food.firebaseapp.com",

            projectId:
                "mdy-food",

            storageBucket:
                "mdy-food.firebasestorage.app",

            messagingSenderId:
                "498327590625",

            appId:
                "1:498327590625:web:cceafb7febb689e7ad09a0",

            measurementId:
                "G-6Q5G2862XQ"

        };


        firebase.initializeApp(firebaseConfig);


        const auth =
            firebase.auth();


        const db =
            firebase.firestore();



        // =========================
        // 商家登录
        // =========================

        async function login() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value
                    .trim();


            const error =
                document.getElementById("error");


            const success =
                document.getElementById("success");


            const button =
                document.getElementById("loginButton");


            error.innerText = "";

            success.innerText = "";


            // =========================
            // 检查输入
            // =========================

            if (!email || !password) {

                error.innerText =
                    "请输入邮箱和密码";

                return;

            }


            button.disabled = true;

            button.innerText =
                "登录中...";


            try {


                // =========================
                // Firebase Auth 登录
                // =========================

                const userCredential =
                    await auth
                        .signInWithEmailAndPassword(
                            email,
                            password
                        );


                const user =
                    userCredential.user;


                // =========================
                // 读取商家申请
                // =========================

                const applicationDoc =
                    await db
                        .collection("merchantApplications")
                        .doc(user.uid)
                        .get();


                if (!applicationDoc.exists) {

                    await auth.signOut();


                    error.innerText =
                        "没有找到商家申请资料，请先申请商家入驻";


                    button.disabled = false;

                    button.innerText =
                        "登录";

                    return;

                }


                const application =
                    applicationDoc.data();


                const status =
                    application.status || "pending";


                // =========================
                // 审核状态
                // =========================

                if (status === "pending") {

                    await auth.signOut();


                    error.innerText =
                        "您的商家申请正在审核中，请等待平台审核";


                    button.disabled = false;

                    button.innerText =
                        "登录";

                    return;

                }


                if (status === "rejected") {

                    await auth.signOut();


                    error.innerText =
                        "您的商家申请未通过审核";


                    button.disabled = false;

                    button.innerText =
                        "登录";

                    return;

                }


                if (status !== "approved") {

                    await auth.signOut();


                    error.innerText =
                        "商家账号状态异常，请联系平台管理员";


                    button.disabled = false;

                    button.innerText =
                        "登录";

                    return;

                }


                // =========================
                // 审核通过
                // =========================

                const restaurantId =
                    application.uid || user.uid;


                // =========================
                // 保存商家登录状态
                // =========================

                localStorage.setItem(
                    "merchantLogin",
                    "true"
                );


                localStorage.setItem(
                    "merchantUsername",
                    application.email || email
                );


                localStorage.setItem(
                    "merchantRestaurantId",
                    restaurantId
                );


                localStorage.setItem(
                    "merchantUid",
                    user.uid
                );


                localStorage.setItem(
                    "merchantRestaurantName",
                    application.restaurantName || ""
                );


                // =========================
                // 提示
                // =========================

                success.innerText =
                    "登录成功，正在进入商家后台...";


                // =========================
                // 进入商家后台
                // =========================

                setTimeout(function() {

                    window.location.href =
                        "admin.html";

                }, 800);


            } catch (errorObject) {

                console.error(
                    "商家登录失败：",
                    errorObject
                );


                let message =
                    "登录失败";


                if (
                    errorObject.code ===
                    "auth/invalid-credential"
                ) {

                    message =
                        "邮箱或密码错误";

                }

                else if (
                    errorObject.code ===
                    "auth/user-not-found"
                ) {

                    message =
                        "该邮箱尚未注册";

                }

                else if (
                    errorObject.code ===
                    "auth/wrong-password"
                ) {

                    message =
                        "密码错误";

                }

                else if (
                    errorObject.code ===
                    "auth/invalid-email"
                ) {

                    message =
                        "邮箱格式不正确";

                }

                else if (
                    errorObject.code ===
                    "auth/too-many-requests"
                ) {

                    message =
                        "登录尝试次数过多，请稍后再试";

                }

                else {

                    message =
                        "登录失败：" +
                        errorObject.message;

                }


                error.innerText =
                    message;


                button.disabled = false;

                button.innerText =
                    "登录";

            }

        }


        // =========================
        // 回车登录
        // =========================

        document
            .getElementById("password")
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        login();

                    }

                }
            );


    </script>


</body>

</html>
