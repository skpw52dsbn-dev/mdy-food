
<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>商家登录 - MDY FOOD</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 400px;
            margin: 60px auto;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #ff5a1f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #e94d17;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <header>
        🏪 MDY FOOD 商家端
    </header>

    <div class="container">

        <div class="login-box">

            <h1>商家登录</h1>

            <div class="subtitle">
                MDY FOOD Merchant
            </div>

            <input
                id="username"
                type="text"
                placeholder="商家账号"
            >

            <input
                id="password"
                type="password"
                placeholder="密码"
            >

            <button
                id="loginButton"
                onclick="login()"
            >
                登录
            </button>

            <div
                id="error"
                class="error"
            ></div>

        </div>

    </div>


    <script>

        // =========================
        // Firebase 配置
        // =========================

        const firebaseConfig = {

            apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

            authDomain: "mdy-food.firebaseapp.com",

            projectId: "mdy-food",

            storageBucket: "mdy-food.firebasestorage.app",

            messagingSenderId: "498327590625",

            appId: "1:498327590625:web:cceafb7febb689e7ad09a0",

            measurementId: "G-6Q5G2862XQ"

        };


        firebase.initializeApp(firebaseConfig);

        const db =
            firebase.firestore();


        // =========================
        // 商家登录
        // =========================

        async function login() {

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value
                    .trim();

            const error =
                document.getElementById("error");

            const button =
                document.getElementById("loginButton");


            error.innerText = "";


            if (!username || !password) {

                error.innerText =
                    "请输入账号和密码";

                return;

            }


            button.disabled = true;

            button.innerText =
                "登录中...";


            try {

                const snapshot =
                    await db
                        .collection("merchants")
                        .where(
                            "username",
                            "==",
                            username
                        )
                        .where(
                            "password",
                            "==",
                            password
                        )
                        .get();


                if (snapshot.empty) {

                    error.innerText =
                        "账号或密码错误";

                    button.disabled = false;

                    button.innerText =
                        "登录";

                    return;

                }


                const merchant =
                    snapshot.docs[0].data();


                // 保存登录状态

                localStorage.setItem(
                    "merchantLogin",
                    "true"
                );


                // 保存商家账号

                localStorage.setItem(
                    "merchantUsername",
                    merchant.username
                );


                // 保存餐厅 ID

                localStorage.setItem(
                    "merchantRestaurantId",
                    merchant.restaurantId
                );


                // 进入商家后台

                window.location.href =
                    "admin.html";


            } catch (errorObject) {

                console.error(errorObject);

                error.innerText =
                    "登录失败：" +
                    errorObject.message;

                button.disabled = false;

                button.innerText =
                    "登录";

            }

        }

    </script>

</body>

</html>
