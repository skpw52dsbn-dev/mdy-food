<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>购物车 - Mandalay Food</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .container {
            max-width: 800px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .cart-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
        }

        .item-price {
            color: #ff5a1f;
            margin-top: 5px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            background: #ff5a1f;
            color: white;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .summary {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #ff5a1f;
        }

        .checkout {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            background: #ff5a1f;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 40px 0;
        }
    </style>
</head>

<body>

    <header>

        <a class="back" href="menu.html">
            ← 返回菜单
        </a>

    </header>


    <div class="container">

        <div class="cart-box">

            <h1>🛒 我的购物车</h1>

            <div id="cartItems"></div>


            <div class="summary">

                <div class="row">
                    <span>商品小计</span>
                    <span id="subtotal">0 Ks</span>
                </div>

                <div class="row">
                    <span>配送费</span>
                    <span id="delivery">2,000 Ks</span>
                </div>

                <div class="row total">
                    <span>总计</span>
                    <span id="total">2,000 Ks</span>
                </div>

                <button class="checkout" onclick="checkout()">
                    去结算
                </button>

            </div>

        </div>

    </div>


    <script>

    let cart = JSON.parse(localStorage.getItem("cart")) || [];


    function showCart() {

        const cartItems = document.getElementById("cartItems");

        if (cart.length === 0) {

            cartItems.innerHTML =
                '<div class="empty">购物车还是空的</div>';

            document.getElementById("subtotal").innerText = "0 Ks";

            document.getElementById("total").innerText = "2,000 Ks";

            return;
        }


        cartItems.innerHTML = "";

        let subtotal = 0;


        cart.forEach(function(item, index) {

            subtotal += item.price * item.quantity;


            const div = document.createElement("div");

            div.className = "cart-item";


            div.innerHTML = `

                <div>

                    <div class="item-name">
                        ${item.name}
                    </div>

                    <div class="item-price">
                        ${(item.price * item.quantity).toLocaleString()} Ks
                    </div>

                </div>


                <div class="quantity">

                    <button onclick="changeQuantity(${index}, -1)">
                        −
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                    <button
                        type="button"
                        onclick="deleteItem(${index})"
                        style="background:#555;"
                    >
                        删除
                    </button>

                </div>

            `;


            cartItems.appendChild(div);

        });


        document.getElementById("subtotal").innerText =
            subtotal.toLocaleString() + " Ks";


        document.getElementById("total").innerText =
            (subtotal + 2000).toLocaleString() + " Ks";

    }


    function changeQuantity(index, change) {

        cart[index].quantity += change;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        showCart();

    }


    function deleteItem(index) {

        cart.splice(index, 1);


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        showCart();

    }


    function checkout() {

        if (cart.length === 0) {

            alert("购物车是空的");

            return;

        }


        window.location.href = "checkout.html";

    }


    showCart();

</script>

</body>

</html>
