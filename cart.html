<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>购物车 - Mandalay Food</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- MDY FOOD 全站语言系统 -->
    <script src="language.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .container {
            max-width: 800px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .cart-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
        }

        .item-price {
            color: #ff5a1f;
            margin-top: 5px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            background: #ff5a1f;
            color: white;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity button:hover {
            opacity: 0.9;
        }

        .quantity .delete-btn {
            width: auto;
            padding: 0 12px;
            background: #555;
            font-size: 14px;
        }

        .summary {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            color: #ff5a1f;
        }

        .checkout {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            background: #ff5a1f;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .checkout:hover {
            opacity: 0.92;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 40px 0;
            line-height: 1.8;
        }

        @media (max-width: 600px) {

            .container {
                padding: 0 12px;
            }

            .cart-box {
                padding: 16px;
            }

            .cart-item {
                align-items: flex-start;
            }

            .quantity {
                gap: 6px;
            }

            .quantity button {
                width: 30px;
                height: 30px;
            }

            .quantity .delete-btn {
                padding: 0 8px;
            }
        }
    </style>
</head>

<body>

<header>

    <a
        class="back"
        href="menu.html"
        data-i18n="backToRestaurant"
    >
        ← 返回菜单
    </a>

</header>


<div class="container">

    <div class="cart-box">

        <h1 data-i18n="shoppingCart">
            🛒 我的购物车
        </h1>

        <div id="cartItems"></div>


        <div class="summary">

            <div class="row">

                <span data-i18n="subtotal">
                    商品小计
                </span>

                <span id="subtotal">
                    0 Ks
                </span>

            </div>


            <div class="row">

                <span data-i18n="deliveryFee">
                    配送费
                </span>

                <span id="delivery">
                    2,000 Ks
                </span>

            </div>


            <div class="row total">

                <span data-i18n="total">
                    总计
                </span>

                <span id="total">
                    2,000 Ks
                </span>

            </div>


            <button
                id="checkoutButton"
                class="checkout"
                type="button"
                data-i18n="checkout"
            >
                去结算
            </button>

        </div>

    </div>

</div>


<script>

    /* =========================================
       Firebase
    ========================================= */

    const firebaseConfig = {
        apiKey:
            "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

        authDomain:
            "mdy-food.firebaseapp.com",

        projectId:
            "mdy-food",

        storageBucket:
            "mdy-food.firebasestorage.app",

        messagingSenderId:
            "498327590625",

        appId:
            "1:498327590625:web:cceafb7febb689e7ad09a0",

        measurementId:
            "G-6Q5G2862XQ"
    };


    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }


    const db = firebase.firestore();
    const auth = firebase.auth();


    /* =========================================
       语言
       
       注意：
       这里绝对不再手动调用 MDYLanguage.apply()
       language.js 自己负责初始化和语言切换。
    ========================================= */

    function t(key, fallback) {

        if (
            window.MDYLanguage &&
            typeof window.MDYLanguage.t === "function"
        ) {

            const result =
                window.MDYLanguage.t(
                    key,
                    {},
                    fallback || key
                );

            if (
                result &&
                result !== key
            ) {
                return result;
            }
        }

        return fallback || key;
    }


    /* =========================================
       更新页面语言
    ========================================= */

    function updatePageLanguage() {

        /*
         * language.js 已经负责：
         *
         * 1. 读取 localStorage
         * 2. 应用当前语言
         * 3. 翻译 data-i18n
         * 4. 翻译 placeholder
         *
         * 所以这里不再调用 MDYLanguage.apply()
         */

        showCart();


        document.title =
            t(
                "shoppingCart",
                "购物车"
            ) +
            " - Mandalay Food";

    }


    /* =========================================
       监听全站语言变化
    ========================================= */

    window.addEventListener(
        "mdyLanguageChanged",
        function() {

            /*
             * 不调用 MDYLanguage.apply()
             *
             * language.js 已经完成语言切换，
             * 这里只重新渲染购物车里的动态文字。
             */

            showCart();

            document.title =
                t(
                    "shoppingCart",
                    "购物车"
                ) +
                " - Mandalay Food";

        }
    );


    /* =========================================
       购物车
    ========================================= */

    let cart = [];

    try {

        const savedCart =
            localStorage.getItem("cart");

        cart =
            savedCart
                ? JSON.parse(savedCart)
                : [];

        if (!Array.isArray(cart)) {
            cart = [];
        }

    } catch (error) {

        console.error(
            "读取购物车失败:",
            error
        );

        cart = [];

    }


    /* =========================================
       显示购物车
    ========================================= */

    function showCart() {

        const cartItems =
            document.getElementById(
                "cartItems"
            );

        const subtotalElement =
            document.getElementById(
                "subtotal"
            );

        const deliveryElement =
            document.getElementById(
                "delivery"
            );

        const totalElement =
            document.getElementById(
                "total"
            );


        if (!cartItems) {
            return;
        }


        /* =====================================
           空购物车
        ===================================== */

        if (cart.length === 0) {

            cartItems.innerHTML = `
                <div class="empty">
                    🛒<br>
                    ${t(
                        "emptyCart",
                        "购物车还是空的"
                    )}
                    <br>
                    <small>
                        ${t(
                            "emptyCartDesc",
                            "去餐厅看看有什么好吃的吧"
                        )}
                    </small>
                </div>
            `;


            if (subtotalElement) {
                subtotalElement.innerText =
                    "0 Ks";
            }


            if (deliveryElement) {
                deliveryElement.innerText =
                    "2,000 Ks";
            }


            if (totalElement) {
                totalElement.innerText =
                    "2,000 Ks";
            }


            return;

        }


        /* =====================================
           有商品
        ===================================== */

        cartItems.innerHTML = "";


        let subtotal = 0;


        cart.forEach(
            function(item, index) {

                const price =
                    Number(item.price) || 0;

                const quantity =
                    Number(item.quantity) || 0;

                const itemTotal =
                    price * quantity;


                subtotal += itemTotal;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "cart-item";


                const itemName =
                    item.name ||
                    t(
                        "food",
                        "菜品"
                    );


                div.innerHTML = `

                    <div>

                        <div class="item-name">
                            ${escapeHtml(itemName)}
                        </div>

                        <div class="item-price">
                            ${itemTotal.toLocaleString()} Ks
                        </div>

                    </div>


                    <div class="quantity">

                        <button
                            type="button"
                            onclick="changeQuantity(${index}, -1)"
                            aria-label="减少"
                        >
                            −
                        </button>


                        <span>
                            ${quantity}
                        </span>


                        <button
                            type="button"
                            onclick="changeQuantity(${index}, 1)"
                            aria-label="增加"
                        >
                            +
                        </button>


                        <button
                            type="button"
                            class="delete-btn"
                            onclick="deleteItem(${index})"
                        >
                            ${escapeHtml(
                                t(
                                    "delete",
                                    "删除"
                                )
                            )}
                        </button>

                    </div>

                `;


                cartItems.appendChild(div);

            }
        );


        if (subtotalElement) {

            subtotalElement.innerText =
                subtotal.toLocaleString() +
                " Ks";

        }


        if (deliveryElement) {

            deliveryElement.innerText =
                "2,000 Ks";

        }


        if (totalElement) {

            totalElement.innerText =
                (
                    subtotal + 2000
                ).toLocaleString() +
                " Ks";

        }

    }


    /* =========================================
       HTML 安全处理
    ========================================= */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================
       修改数量
    ========================================= */

    function changeQuantity(
        index,
        change
    ) {

        if (
            index < 0 ||
            index >= cart.length
        ) {
            return;
        }


        const currentQuantity =
            Number(
                cart[index].quantity
            ) || 0;


        cart[index].quantity =
            currentQuantity + change;


        if (
            cart[index].quantity <= 0
        ) {

            cart.splice(
                index,
                1
            );

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        showCart();

    }


    /* =========================================
       删除商品
    ========================================= */

    function deleteItem(index) {

        if (
            index < 0 ||
            index >= cart.length
        ) {
            return;
        }


        cart.splice(
            index,
            1
        );


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        showCart();

    }


    /* =========================================
       去结算
    ========================================= */

    function checkout() {

        if (cart.length === 0) {

            alert(
                t(
                    "cartEmptyAlert",
                    "购物车是空的"
                )
            );

            return;

        }


        window.location.href =
            "checkout.html";

    }


    /* =========================================
       绑定结算按钮
    ========================================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            const checkoutButton =
                document.getElementById(
                    "checkoutButton"
                );


            if (checkoutButton) {

                checkoutButton.addEventListener(
                    "click",
                    checkout
                );

            }


            /*
             * language.js 会自己初始化语言。
             * 页面第一次显示时，只渲染购物车。
             */

            showCart();


            document.title =
                t(
                    "shoppingCart",
                    "购物车"
                ) +
                " - Mandalay Food";

        }
    );

</script>

</body>

</html>
