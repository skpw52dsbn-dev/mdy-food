<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD - 配送员注册</title>


<!-- =====================================================
     Firebase
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff7ed,
            #f8fafc
        );

    color: #1f2937;

    min-height: 100vh;

}


.container {

    width: 100%;

    max-width: 680px;

    margin: 0 auto;

    padding: 30px 18px 50px;

}


.header {

    text-align: center;

    margin-bottom: 25px;

}


.logo {

    width: 76px;

    height: 76px;

    margin: 0 auto 14px;

    border-radius: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 40px;

    background: #fff;

    box-shadow:
        0 10px 30px rgba(
            0,
            0,
            0,
            0.08
        );

}


.header h1 {

    margin: 0;

    font-size: 28px;

    color: #111827;

}


.header p {

    margin: 8px 0 0;

    color: #6b7280;

    font-size: 14px;

}


.card {

    background: #ffffff;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 15px 40px rgba(
            0,
            0,
            0,
            0.08
        );

}


.section-title {

    font-size: 18px;

    font-weight: 700;

    margin: 0 0 18px;

    color: #111827;

}


.form-group {

    margin-bottom: 17px;

}


.form-group label {

    display: block;

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 7px;

    color: #374151;

}


.required {

    color: #ef4444;

}


input,
select,
textarea {

    width: 100%;

    border: 1px solid #d1d5db;

    border-radius: 11px;

    padding: 13px 14px;

    font-size: 15px;

    outline: none;

    background: #fff;

    color: #111827;

    transition:
        border-color .2s,
        box-shadow .2s;

}


input:focus,
select:focus,
textarea:focus {

    border-color: #f97316;

    box-shadow:
        0 0 0 3px rgba(
            249,
            115,
            22,
            0.12
        );

}


textarea {

    min-height: 100px;

    resize: vertical;

}


.grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;

}


.info-box {

    background: #fff7ed;

    border: 1px solid #fed7aa;

    border-radius: 12px;

    padding: 14px;

    margin-bottom: 20px;

    color: #9a3412;

    font-size: 13px;

    line-height: 1.7;

}


.submit-btn {

    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 15px;

    background: #f97316;

    color: #ffffff;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    transition:
        opacity .2s,
        transform .1s;

}


.submit-btn:hover {

    opacity: .92;

}


.submit-btn:active {

    transform: scale(.99);

}


.submit-btn:disabled {

    opacity: .55;

    cursor: not-allowed;

}


.status-box {

    display: none;

    margin-top: 20px;

    border-radius: 14px;

    padding: 18px;

    line-height: 1.7;

}


.status-box.success {

    display: block;

    background: #ecfdf5;

    border: 1px solid #a7f3d0;

    color: #065f46;

}


.status-box.error {

    display: block;

    background: #fef2f2;

    border: 1px solid #fecaca;

    color: #991b1b;

}


.success-icon {

    font-size: 38px;

    margin-bottom: 5px;

}


.application-id {

    display: inline-block;

    margin-top: 8px;

    padding: 8px 12px;

    border-radius: 8px;

    background: #ffffff;

    border: 1px solid #a7f3d0;

    font-weight: 700;

    word-break: break-all;

}


.footer {

    text-align: center;

    color: #9ca3af;

    font-size: 12px;

    margin-top: 20px;

}


.back-link {

    display: inline-block;

    margin-top: 15px;

    color: #f97316;

    text-decoration: none;

    font-size: 14px;

    font-weight: 600;

}


@media (
    max-width: 600px
) {

    .container {

        padding:
            20px 12px 40px;

    }


    .card {

        padding: 20px 16px;

        border-radius: 16px;

    }


    .grid {

        grid-template-columns:
            1fr;

        gap: 0;

    }


    .header h1 {

        font-size: 24px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         顶部
    ================================================== -->

    <div class="header">

        <div class="logo">
            🛵
        </div>

        <h1>
            MDY FOOD
        </h1>

        <p>
            配送员申请注册
        </p>

    </div>



    <!-- =================================================
         注册表单
    ================================================== -->

    <div
        class="card"
        id="registerCard"
    >

        <h2 class="section-title">
            🛵 配送员资料
        </h2>


        <div class="info-box">

            📌 提交申请后，您的资料会进入
            <b>管理员审核</b>。<br>

            📌 审核通过后，您才会成为 MDY FOOD
            的正式配送员。<br>

            📌 请填写真实、有效的信息，方便管理员联系您。

        </div>


        <form id="deliveryForm">


            <!-- =========================================
                 姓名
            ========================================== -->

            <div class="form-group">

                <label>
                    姓名
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="请输入您的姓名"
                    maxlength="100"
                    required
                >

            </div>



            <!-- =========================================
                 电话 / 邮箱
            ========================================== -->

            <div class="grid">


                <div class="form-group">

                    <label>
                        手机号码
                        <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="例如：09xxxxxxxxx"
                        maxlength="30"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        邮箱
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        maxlength="150"
                    >

                </div>


            </div>



            <!-- =========================================
                 身份证
            ========================================== -->

            <div class="form-group">

                <label>
                    身份证号码
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="idNumber"
                    placeholder="请输入身份证号码"
                    maxlength="100"
                    required
                >

            </div>



            <!-- =========================================
                 交通工具
            ========================================== -->

            <div class="grid">


                <div class="form-group">

                    <label>
                        交通工具
                        <span class="required">*</span>
                    </label>

                    <select
                        id="vehicleType"
                        required
                    >

                        <option value="">
                            请选择
                        </option>

                        <option value="摩托车">
                            🛵 摩托车
                        </option>

                        <option value="自行车">
                            🚲 自行车
                        </option>

                        <option value="汽车">
                            🚗 汽车
                        </option>

                        <option value="电动车">
                            🛵 电动车
                        </option>

                        <option value="其他">
                            其他
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        车牌号码
                    </label>

                    <input
                        type="text"
                        id="vehicleNumber"
                        placeholder="没有车牌可留空"
                        maxlength="50"
                    >

                </div>


            </div>



            <!-- =========================================
                 配送区域
            ========================================== -->

            <div class="form-group">

                <label>
                    配送区域
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="deliveryArea"
                    placeholder="例如：Mandalay / Chanayethazan"
                    maxlength="200"
                    required
                >

            </div>



            <!-- =========================================
                 个人说明
            ========================================== -->

            <div class="form-group">

                <label>
                    个人说明
                </label>

                <textarea
                    id="description"
                    placeholder="可以填写您的配送经验、工作时间、其他信息等"
                    maxlength="1000"
                ></textarea>

            </div>



            <!-- =========================================
                 提交
            ========================================== -->

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >

                🛵 提交配送员申请

            </button>


        </form>



        <!-- =============================================
             状态提示
        ============================================== -->

        <div
            id="statusBox"
            class="status-box"
        ></div>


    </div>



    <div class="footer">

        MDY FOOD 配送员申请系统

        <br>

        <a
            href="index.html"
            class="back-link"
        >
            ← 返回 MDY FOOD
        </a>

    </div>


</div>



<script>


/* =========================================================
   Firebase 配置
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


if (
    !firebase.apps.length
) {

    firebase.initializeApp(
        firebaseConfig
    );

}


const db =
    firebase.firestore();



/* =========================================================
   DOM
========================================================= */

const form =
    document.getElementById(
        "deliveryForm"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


const statusBox =
    document.getElementById(
        "statusBox"
    );



/* =========================================================
   工具
========================================================= */

function cleanValue(value) {

    return String(
        value || ""
    ).trim();

}


function showError(message) {

    statusBox.className =
        "status-box error";

    statusBox.innerHTML =

        `
            ❌ <b>提交失败</b>

            <br><br>

            ${escapeHtml(message)}
        `;

}


function showSuccess(
    applicationId
) {

    statusBox.className =
        "status-box success";

    statusBox.innerHTML =

        `
            <div class="success-icon">
                ✅
            </div>

            <b>
                配送员申请提交成功！
            </b>

            <br><br>

            您的申请已经进入
            <b>管理员审核</b>。

            <br>

            请耐心等待审核结果。

            <br><br>

            申请编号：

            <br>

            <span class="application-id">
                ${escapeHtml(
                    applicationId
                )}
            </span>

            <br><br>

            <small>
                请保存这个申请编号，
                后续查询申请状态时可以使用。
            </small>
        `;

}


function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   表单提交
========================================================= */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /*
         * 防止重复点击
         */

        if (
            submitBtn.disabled
        ) {

            return;

        }


        /* ================================================
           获取数据
        ================================================ */

        const name =
            cleanValue(
                document.getElementById(
                    "name"
                ).value
            );


        const phone =
            cleanValue(
                document.getElementById(
                    "phone"
                ).value
            );


        const email =
            cleanValue(
                document.getElementById(
                    "email"
                ).value
            );


        const idNumber =
            cleanValue(
                document.getElementById(
                    "idNumber"
                ).value
            );


        const vehicleType =
            cleanValue(
                document.getElementById(
                    "vehicleType"
                ).value
            );


        const vehicleNumber =
            cleanValue(
                document.getElementById(
                    "vehicleNumber"
                ).value
            );


        const deliveryArea =
            cleanValue(
                document.getElementById(
                    "deliveryArea"
                ).value
            );


        const description =
            cleanValue(
                document.getElementById(
                    "description"
                ).value
            );



        /* ================================================
           基础验证
        ================================================ */

        if (!name) {

            showError(
                "请输入您的姓名。"
            );

            return;

        }


        if (!phone) {

            showError(
                "请输入手机号码。"
            );

            return;

        }


        if (!idNumber) {

            showError(
                "请输入身份证号码。"
            );

            return;

        }


        if (!vehicleType) {

            showError(
                "请选择交通工具。"
            );

            return;

        }


        if (!deliveryArea) {

            showError(
                "请输入配送区域。"
            );

            return;

        }


        /*
         * 手机号码长度检查
         */

        if (
            phone.length < 6
        ) {

            showError(
                "请输入正确的手机号码。"
            );

            return;

        }


        /*
         * 邮箱如果填写则检查格式
         */

        if (
            email &&
            !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
                .test(email)
        ) {

            showError(
                "请输入正确的邮箱地址。"
            );

            return;

        }



        /* ================================================
           确认
        ================================================ */

        const confirmed =
            confirm(

                "确认提交配送员申请吗？\n\n" +

                "姓名：" +
                name +
                "\n\n" +

                "电话：" +
                phone +
                "\n\n" +

                "配送区域：" +
                deliveryArea

            );


        if (!confirmed) {

            return;

        }



        /* ================================================
           Loading
        ================================================ */

        submitBtn.disabled =
            true;

        submitBtn.innerText =
            "⏳ 正在提交...";


        statusBox.className =
            "status-box";

        statusBox.innerHTML =
            "";



        try {


            /* ============================================
               检查是否存在相同身份证申请
            ============================================ */

            const duplicateSnapshot =
                await db
                    .collection(
                        "deliveryApplications"
                    )
                    .where(
                        "idNumber",
                        "==",
                        idNumber
                    )
                    .limit(1)
                    .get();


            if (
                !duplicateSnapshot.empty
            ) {

                const existing =
                    duplicateSnapshot
                        .docs[0]
                        .data() || {};


                const existingStatus =
                    existing.status ||
                    "pending";


                if (
                    existingStatus ===
                    "pending"
                ) {

                    throw new Error(
                        "您已经提交过配送员申请，目前正在审核中，请不要重复提交。"
                    );

                }


                if (
                    existingStatus ===
                    "approved"
                ) {

                    throw new Error(
                        "该身份证已经注册为正式配送员。"
                    );

                }

            }



            /* ============================================
               创建配送员申请
            ============================================ */

            const applicationRef =
                db
                    .collection(
                        "deliveryApplications"
                    )
                    .doc();


            await applicationRef.set({

                /*
                 * 基本身份
                 */

                uid:
                    applicationRef.id,

                name:
                    name,

                phone:
                    phone,

                email:
                    email,

                idNumber:
                    idNumber,


                /*
                 * 交通工具
                 */

                vehicleType:
                    vehicleType,

                vehicleNumber:
                    vehicleNumber,


                /*
                 * 配送区域
                 */

                deliveryArea:
                    deliveryArea,


                /*
                 * 个人说明
                 */

                description:
                    description,


                /*
                 * 审核状态
                 */

                status:
                    "pending",


                /*
                 * 创建时间
                 */

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });



            /* ============================================
               成功
            ============================================ */

            showSuccess(
                applicationRef.id
            );


            /*
             * 清空表单
             */

            form.reset();


            /*
             * 禁止再次提交
             */

            submitBtn.disabled =
                true;

            submitBtn.innerText =
                "✅ 申请已提交";


        }

        catch (error) {

            console.error(
                "配送员申请提交失败:",
                error
            );


            showError(
                error.message ||
                "提交失败，请稍后再试。"
            );


            submitBtn.disabled =
                false;

            submitBtn.innerText =
                "🛵 提交配送员申请";

        }

    }
);


</script>


</body>

</html>
