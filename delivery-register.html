<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD - 配送员注册</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff7ed,
            #fef3c7
        );

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.container {

    width: 100%;
    max-width: 520px;

    background: #ffffff;

    border-radius: 20px;

    padding: 30px;

    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.10);
}

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: 800;

    color: #f97316;

    margin-bottom: 5px;
}

.subtitle {

    text-align: center;

    color: #666;

    margin-bottom: 25px;

    font-size: 15px;
}

.form-group {

    margin-bottom: 16px;
}

label {

    display: block;

    margin-bottom: 7px;

    font-weight: 600;

    color: #333;

    font-size: 14px;
}

input,
select,
textarea {

    width: 100%;

    padding: 13px 14px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

    outline: none;

    transition: 0.2s;

    font-family: inherit;
}

input:focus,
select:focus,
textarea:focus {

    border-color: #f97316;

    box-shadow:
        0 0 0 3px rgba(249, 115, 22, 0.10);
}

textarea {

    min-height: 90px;

    resize: vertical;
}

.required {

    color: #ef4444;
}

button {

    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 14px;

    background: #f97316;

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    margin-top: 8px;

    transition: 0.2s;
}

button:hover {

    background: #ea580c;
}

button:disabled {

    background: #aaa;

    cursor: not-allowed;
}

.message {

    display: none;

    margin-top: 18px;

    padding: 13px;

    border-radius: 10px;

    text-align: center;

    font-size: 14px;

    line-height: 1.6;
}

.success {

    display: block;

    background: #ecfdf5;

    color: #047857;

    border: 1px solid #a7f3d0;
}

.error {

    display: block;

    background: #fef2f2;

    color: #b91c1c;

    border: 1px solid #fecaca;
}

.back {

    display: block;

    text-align: center;

    margin-top: 20px;

    color: #666;

    text-decoration: none;

    font-size: 14px;
}

.back:hover {

    color: #f97316;
}

.notice {

    background: #fff7ed;

    border: 1px solid #fed7aa;

    color: #9a3412;

    border-radius: 10px;

    padding: 12px;

    margin-bottom: 20px;

    font-size: 13px;

    line-height: 1.6;
}

</style>

</head>


<body>


<div class="container">

    <div class="logo">
        🛵 MDY FOOD
    </div>

    <div class="subtitle">
        配送员注册申请
    </div>


    <div class="notice">

        提交申请后，需要等待 MDY FOOD 管理员审核。
        <br>
        审核通过后，您就可以登录配送员后台接单。

    </div>


    <form id="deliveryForm">


        <!-- 姓名 -->

        <div class="form-group">

            <label>
                配送员姓名
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="name"
                placeholder="请输入真实姓名"
                required
            >

        </div>


        <!-- 手机 -->

        <div class="form-group">

            <label>
                手机号码
                <span class="required">*</span>
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="请输入手机号码"
                required
            >

        </div>


        <!-- 邮箱 -->

        <div class="form-group">

            <label>
                登录邮箱
                <span class="required">*</span>
            </label>

            <input
                type="email"
                id="email"
                placeholder="请输入邮箱"
                required
            >

        </div>


        <!-- 密码 -->

        <div class="form-group">

            <label>
                登录密码
                <span class="required">*</span>
            </label>

            <input
                type="password"
                id="password"
                placeholder="至少 6 位密码"
                minlength="6"
                required
            >

        </div>


        <!-- 确认密码 -->

        <div class="form-group">

            <label>
                确认密码
                <span class="required">*</span>
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="请再次输入密码"
                minlength="6"
                required
            >

        </div>


        <!-- 身份证 -->

        <div class="form-group">

            <label>
                身份证 / 证件号码
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="idNumber"
                placeholder="请输入身份证或证件号码"
                required
            >

        </div>


        <!-- 交通工具 -->

        <div class="form-group">

            <label>
                配送交通工具
                <span class="required">*</span>
            </label>

            <select id="vehicleType" required>

                <option value="">
                    请选择交通工具
                </option>

                <option value="摩托车">
                    🛵 摩托车
                </option>

                <option value="自行车">
                    🚲 自行车
                </option>

                <option value="汽车">
                    🚗 汽车
                </option>

                <option value="其他">
                    其他
                </option>

            </select>

        </div>


        <!-- 车牌 -->

        <div class="form-group">

            <label>
                车牌号码
            </label>

            <input
                type="text"
                id="vehicleNumber"
                placeholder="如有车辆，请填写车牌号码"
            >

        </div>


        <!-- 配送区域 -->

        <div class="form-group">

            <label>
                常用配送区域
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="deliveryArea"
                placeholder="例如：Mandalay 市区"
                required
            >

        </div>


        <!-- 备注 -->

        <div class="form-group">

            <label>
                其他说明
            </label>

            <textarea
                id="description"
                placeholder="可以填写其他需要说明的信息"
            ></textarea>

        </div>


        <button
            type="submit"
            id="submitBtn"
        >
            🛵 提交配送员申请
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back"
    >
        ← 返回 MDY FOOD 首页
    </a>

</div>



<script>

/* =========================================================
   Firebase 配置
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


/* =========================================================
   初始化 Firebase
========================================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();


/* =========================================================
   表单提交
========================================================= */

document
    .getElementById("deliveryForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const submitBtn =
            document.getElementById("submitBtn");

        const message =
            document.getElementById("message");


        /* -------------------------
           获取表单
        ------------------------- */

        const name =
            document
                .getElementById("name")
                .value
                .trim();

        const phone =
            document
                .getElementById("phone")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;

        const idNumber =
            document
                .getElementById("idNumber")
                .value
                .trim();

        const vehicleType =
            document
                .getElementById("vehicleType")
                .value;

        const vehicleNumber =
            document
                .getElementById("vehicleNumber")
                .value
                .trim();

        const deliveryArea =
            document
                .getElementById("deliveryArea")
                .value
                .trim();

        const description =
            document
                .getElementById("description")
                .value
                .trim();


        /* -------------------------
           基础检查
        ------------------------- */

        if (
            !name ||
            !phone ||
            !email ||
            !password ||
            !confirmPassword ||
            !idNumber ||
            !vehicleType ||
            !deliveryArea
        ) {

            showMessage(
                "请填写所有必填项目。",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "密码至少需要 6 位。",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "两次输入的密码不一致。",
                "error"
            );

            return;
        }


        /* -------------------------
           禁用按钮
        ------------------------- */

        submitBtn.disabled = true;

        submitBtn.innerText =
            "正在提交申请...";


        try {


            /* =================================================
               1. 创建 Firebase Auth 账号
            ================================================= */

            const userCredential =
                await auth.createUserWithEmailAndPassword(
                    email,
                    password
                );


            const user =
                userCredential.user;


            /* =================================================
               2. 保存配送员申请
            ================================================= */

            await db
                .collection("deliveryApplications")
                .doc(user.uid)
                .set({

                    uid:
                        user.uid,

                    name:
                        name,

                    phone:
                        phone,

                    email:
                        email,

                    idNumber:
                        idNumber,

                    vehicleType:
                        vehicleType,

                    vehicleNumber:
                        vehicleNumber,

                    deliveryArea:
                        deliveryArea,

                    description:
                        description,

                    status:
                        "pending",

                    createdAt:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                });


            /* =================================================
               3. 退出当前账号
            ================================================= */

            await auth.signOut();


            /* =================================================
               4. 显示成功
            ================================================= */

            showMessage(
                "✅ 配送员申请提交成功！<br><br>" +
                "您的申请正在等待管理员审核。<br>" +
                "审核通过后即可登录配送员后台。",
                "success"
            );


            document
                .getElementById("deliveryForm")
                .reset();


            submitBtn.innerText =
                "申请已提交";


            /* 3 秒后回首页 */

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 3000);


        } catch (error) {

            console.error(
                "配送员注册失败:",
                error
            );


            let errorMessage =
                "注册失败，请稍后再试。";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                errorMessage =
                    "这个邮箱已经注册过账号。";

            }
            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                errorMessage =
                    "邮箱格式不正确。";

            }
            else if (
                error.code ===
                "auth/weak-password"
            ) {

                errorMessage =
                    "密码强度不足，请使用至少 6 位密码。";

            }
            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                errorMessage =
                    "网络连接失败，请检查网络后重试。";

            }
            else if (
                error.code ===
                "permission-denied"
            ) {

                errorMessage =
                    "没有权限写入配送员申请，请检查 Firestore Rules。";

            }
            else if (error.message) {

                errorMessage =
                    error.message;

            }


            showMessage(
                "❌ " + errorMessage,
                "error"
            );


            submitBtn.disabled = false;

            submitBtn.innerText =
                "🛵 提交配送员申请";

        }

    });



/* =========================================================
   显示消息
========================================================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById("message");


    message.innerHTML =
        text;


    message.className =
        "message " + type;

}

</script>


</body>

</html>
