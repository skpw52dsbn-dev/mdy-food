<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDY FOOD - 骑手中心</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .header {
      background: #ff6b00;
      color: white;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 12px;
      margin-top: 4px;
      opacity: .9;
    }

    .logout {
      border: none;
      background: white;
      color: #ff6b00;
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: 20px auto 50px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 9px rgba(0,0,0,.06);
    }

    .rider-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .rider-name {
      font-size: 20px;
      font-weight: bold;
    }

    .username {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .status {
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .online {
      background: #e9f8ee;
      color: #168a43;
    }

    .accepted {
      background: #fff3df;
      color: #dc7600;
    }

    .delivering-status {
      background: #eaf3ff;
      color: #2471c8;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 18px;
    }

    .stat {
      text-align: center;
      background: #f7f7f7;
      padding: 11px 5px;
      border-radius: 9px;
    }

    .stat-number {
      font-size: 19px;
      font-weight: bold;
    }

    .stat-label {
      margin-top: 4px;
      color: #777;
      font-size: 11px;
    }

    .title {
      font-size: 19px;
      font-weight: bold;
      margin: 24px 0 12px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .order-id {
      font-weight: bold;
      font-size: 14px;
    }

    .order-status {
      color: #ff6b00;
      font-weight: bold;
      font-size: 13px;
    }

    .restaurant {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .row {
      font-size: 14px;
      line-height: 1.6;
      margin: 5px 0;
    }

    .label {
      color: #777;
      display: inline-block;
      width: 65px;
    }

    .items {
      background: #fafafa;
      padding: 10px;
      border-radius: 9px;
      margin: 12px 0;
    }

    .item {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin: 6px 0;
    }

    .total {
      color: #ff6b00;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      margin-top: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .accept-btn {
      background: #ff6b00;
      color: white;
    }

    .pickup-btn {
      background: #2475d0;
      color: white;
    }

    .complete-btn {
      background: #168a43;
      color: white;
    }

    .waiting {
      background: #fff7e9;
      color: #d87500;
      border-radius: 9px;
      padding: 12px;
      text-align: center;
      margin-top: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    .ready {
      background: #eaf4ff;
      color: #2471c8;
      border-radius: 9px;
      padding: 12px;
      text-align: center;
      margin-top: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    .delivery-box {
      background: #edf8ff;
      color: #1671b8;
      border-radius: 9px;
      padding: 12px;
      text-align: center;
      margin-top: 10px;
      line-height: 1.6;
      font-size: 14px;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 30px 15px;
      text-align: center;
      color: #888;
      line-height: 1.7;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 25px;
    }

    .refresh {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin-top: 20px;
    }

    @media(max-width:600px) {

      .container {
        width: 95%;
      }

      .header {
        padding: 14px;
      }

      .logo {
        font-size: 20px;
      }

      .card {
        padding: 15px;
      }

    }

  </style>
</head>

<body>

  <div class="header">

    <div>
      <div class="logo">🛵 MDY FOOD</div>
      <div class="subtitle">骑手配送中心</div>
    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      退出登录
    </button>

  </div>


  <div class="container">

    <!-- 骑手资料 -->

    <div class="card">

      <div class="rider-top">

        <div>
          <div class="rider-name">
            🛵 <span id="riderName">加载中...</span>
          </div>

          <div class="username">
            账号：
            <span id="riderUsername">-</span>
          </div>
        </div>

        <div
          id="riderStatus"
          class="status online"
        >
          🟢 在线
        </div>

      </div>


      <div class="stats">

        <div class="stat">

          <div
            id="completedOrders"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            已完成
          </div>

        </div>


        <div class="stat">

          <div
            id="availableCount"
            class="stat-number"
          >
            0
          </div>

          <div class="stat-label">
            可抢订单
          </div>

        </div>


        <div class="stat">

          <div
            id="currentState"
            class="stat-number"
          >
            空闲
          </div>

          <div class="stat-label">
            当前状态
          </div>

        </div>

      </div>

    </div>


    <!-- 我的订单 -->

    <div class="title">
      📦 我的订单
    </div>

    <div id="myOrders">

      <div class="loading">
        正在加载...
      </div>

    </div>


    <!-- 可抢订单 -->

    <div class="title">
      🔥 可抢订单
    </div>

    <div id="availableOrders">

      <div class="loading">
        正在寻找订单...
      </div>

    </div>


    <div class="refresh">
      系统每 4 秒自动刷新订单
    </div>

  </div>


  <!-- Firebase -->

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqxv5X7Q",
      authDomain: "mdy-food.firebaseapp.com",
      projectId: "mdy-food",
      storageBucket: "mdy-food.firebasestorage.app",
      messagingSenderId: "498327590625",
      appId: "1:498327590625:web:cceafb7febb689e7ad09a0"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    /* =========================
       登录资料
    ========================= */

    if (
      localStorage.getItem("deliveryLogin")
      !== "true"
    ) {

      window.location.href =
        "delivery-login.html";

    }


    const deliveryUsername =
      localStorage.getItem(
        "deliveryUsername"
      ) || "";


    let deliveryDocId =
      localStorage.getItem(
        "deliveryId"
      );


    let riderData = null;

    let hasCurrentOrder = false;

    let refreshTimer = null;


    /* =========================
       获取骑手
    ========================= */

    async function getRider() {

      /*
        优先使用保存的 ID
      */

      if (deliveryDocId) {

        const doc =
          await db.collection("delivery")
            .doc(deliveryDocId)
            .get();

        if (doc.exists) {

          riderData =
            doc.data();

          return doc;
        }

      }


      /*
        如果没有 ID，
        根据 username 找
      */

      const snapshot =
        await db.collection("delivery")
          .where(
            "username",
            "==",
            deliveryUsername
          )
          .limit(1)
          .get();


      if (snapshot.empty) {

        alert(
          "没有找到骑手账号"
        );

        localStorage.removeItem(
          "deliveryId"
        );

        window.location.href =
          "delivery-login.html";

        return null;
      }


      const doc =
        snapshot.docs[0];


      deliveryDocId =
        doc.id;


      localStorage.setItem(
        "deliveryId",
        deliveryDocId
      );


      riderData =
        doc.data();


      return doc;
    }


    /* =========================
       加载骑手资料
    ========================= */

    async function loadRiderInfo() {

      const doc =
        await getRider();

      if (!doc) {
        return false;
      }


      riderData =
        doc.data();


      document.getElementById(
        "riderName"
      ).textContent =
        riderData.name ||
        riderData.username ||
        deliveryUsername;


      document.getElementById(
        "riderUsername"
      ).textContent =
        riderData.username ||
        deliveryUsername;


      document.getElementById(
        "completedOrders"
      ).textContent =
        riderData.completedOrders || 0;


      updateStatus(
        riderData.status || "在线"
      );


      /*
        判断是否有进行中的订单
      */

      hasCurrentOrder =
        !!(
          riderData.currentOrderId &&
          riderData.currentOrderId !== ""
        );


      return true;
    }


    /* =========================
       状态显示
    ========================= */

    function updateStatus(status) {

      const element =
        document.getElementById(
          "riderStatus"
        );

      const state =
        document.getElementById(
          "currentState"
        );


      element.className =
        "status";


      if (status === "在线") {

        element.classList.add(
          "online"
        );

        element.textContent =
          "🟢 在线";

        state.textContent =
          "空闲";

      }

      else if (status === "已接单") {

        element.classList.add(
          "accepted"
        );

        element.textContent =
          "🟠 已接单";

        state.textContent =
          "等待取餐";

      }

      else if (status === "配送中") {

        element.classList.add(
          "delivering-status"
        );

        element.textContent =
          "🔵 配送中";

        state.textContent =
          "配送中";

      }

      else {

        element.classList.add(
          "accepted"
        );

        element.textContent =
          status;

        state.textContent =
          status;
      }
    }


    /* =========================
       检查当前订单
    ========================= */

    async function checkCurrentOrder() {

      if (!deliveryDocId) {
        return;
      }


      const riderDoc =
        await db.collection("delivery")
          .doc(deliveryDocId)
          .get();


      if (!riderDoc.exists) {
        return;
      }


      const rider =
        riderDoc.data();


      const orderId =
        rider.currentOrderId;


      if (!orderId) {

        hasCurrentOrder = false;

        return;
      }


      const orderDoc =
        await db.collection("orders")
          .doc(orderId)
          .get();


      /*
        订单不存在
        或订单已经完成
        → 骑手恢复在线
      */

      if (
        !orderDoc.exists ||
        orderDoc.data().status === "已完成"
      ) {

        await db.collection("delivery")
          .doc(deliveryDocId)
          .update({

            currentOrderId: "",

            previousStatus: "",

            status: "在线"

          });


        hasCurrentOrder = false;

      }

      else {

        hasCurrentOrder = true;

      }

    }


    /* =========================
       加载订单
    ========================= */

    async function loadOrders() {

      try {

        const snapshot =
          await db.collection("orders")
            .get();


        const orders = [];


        snapshot.forEach(doc => {

          orders.push({

            id: doc.id,

            ...doc.data()

          });

        });


        /*
          新订单排前面
        */

        orders.sort((a,b) => {

          const aTime =
            a.created_at?.seconds || 0;

          const bTime =
            b.created_at?.seconds || 0;

          return bTime - aTime;

        });


        /*
          我的订单
        */

        const myOrders =
          orders.filter(order =>
            order.deliveryId ===
            deliveryDocId
          );


        /*
          可抢订单
        */

        let availableOrders =
          orders.filter(order =>
            order.status ===
              "商家已接单" &&
            !order.deliveryId
          );


        /*
          有订单就不能继续抢
        */

        if (hasCurrentOrder) {

          availableOrders = [];

        }


        document.getElementById(
          "availableCount"
        ).textContent =
          availableOrders.length;


        renderMyOrders(
          myOrders
        );


        renderAvailableOrders(
          availableOrders
        );


      } catch (error) {

        console.error(
          "加载订单失败",
          error
        );


        document.getElementById(
          "myOrders"
        ).innerHTML = `
          <div class="empty">
            ❌ 订单加载失败
          </div>
        `;

      }
    }


    /* =========================
       我的订单
    ========================= */

    function renderMyOrders(orders) {

      const container =
        document.getElementById(
          "myOrders"
        );


      const active =
        orders.filter(order =>
          order.status !== "已完成"
        );


      if (active.length === 0) {

        container.innerHTML = `
          <div class="empty">
            🛵 目前没有配送中的订单
          </div>
        `;

        return;
      }


      container.innerHTML =
        active.map(order =>
          createMyOrder(order)
        ).join("");
    }


    /* =========================
       我的订单卡片
    ========================= */

    function createMyOrder(order) {

      const status =
        order.status || "未知";


      let action = "";


      /*
        骑手已经抢到
      */

      if (
        status ===
        "骑手已接单"
      ) {

        action = `
          <div class="waiting">
            🛵 抢单成功<br>
            <strong>等待商家做好外卖</strong>
          </div>
        `;

      }


      /*
        商家已经做好
      */

      else if (
        status ===
        "外卖好了"
      ) {

        action = `
          <div class="ready">
            🍱 商家已经做好外卖<br>
            <strong>现在可以去取餐</strong>
          </div>

          <button
            class="btn pickup-btn"
            onclick="pickupOrder('${order.id}')"
          >
            ✓ 已取餐，开始配送
          </button>
        `;

      }


      /*
        配送中
      */

      else if (
        status ===
        "配送中"
      ) {

        action = `
          <div class="delivery-box">
            🛵 已取餐<br>
            <strong>正在配送给顾客</strong>
          </div>

          <button
            class="btn complete-btn"
            onclick="completeOrder('${order.id}')"
          >
            ✓ 确认送达
          </button>
        `;

      }


      return `

        <div class="card">

          <div class="order-header">

            <div class="order-id">
              订单 #${shortId(order.id)}
            </div>

            <div class="order-status">
              ${status}
            </div>

          </div>


          <div class="restaurant">
            🍽️ ${safe(
              order.restaurantName ||
              "餐厅"
            )}
          </div>


          <div class="row">
            <span class="label">顾客：</span>
            ${safe(
              order.customername ||
              "顾客"
            )}
          </div>


          <div class="row">
            <span class="label">电话：</span>
            ${safe(
              order.phone ||
              "-"
            )}
          </div>


          <div class="row">
            <span class="label">地址：</span>
            ${safe(
              order.address ||
              order.adress ||
              "-"
            )}
          </div>


          ${itemsHTML(order.items)}


          <div class="total">
            💰 ${Number(
              order.total || 0
            ).toLocaleString()} MMK
          </div>


          ${action}

        </div>

      `;
    }


    /* =========================
       可抢订单
    ========================= */

    function renderAvailableOrders(
      orders
    ) {

      const container =
        document.getElementById(
          "availableOrders"
        );


      if (hasCurrentOrder) {

        container.innerHTML = `
          <div class="empty">
            📦 你现在已经有一个订单<br>
            <small>
              完成当前订单后才能继续抢单
            </small>
          </div>
        `;

        return;
      }


      if (orders.length === 0) {

        container.innerHTML = `
          <div class="empty">
            🛵 暂时没有可抢订单<br>
            <small>
              商家接单后会出现在这里
            </small>
          </div>
        `;

        return;
      }


      container.innerHTML =
        orders.map(order =>
          createAvailableOrder(order)
        ).join("");
    }


    /* =========================
       可抢订单卡片
    ========================= */

    function createAvailableOrder(
      order
    ) {

      return `

        <div class="card">

          <div class="order-header">

            <div class="order-id">
              订单 #${shortId(order.id)}
            </div>

            <div class="order-status">
              商家已接单
            </div>

          </div>


          <div class="restaurant">
            🍽️ ${safe(
              order.restaurantName ||
              "餐厅"
            )}
          </div>


          <div class="row">
            <span class="label">顾客：</span>
            ${safe(
              order.customername ||
              "顾客"
            )}
          </div>


          <div class="row">
            <span class="label">电话：</span>
            ${safe(
              order.phone ||
              "-"
            )}
          </div>


          <div class="row">
            <span class="label">地址：</span>
            ${safe(
              order.address ||
              order.adress ||
              "-"
            )}
          </div>


          ${itemsHTML(order.items)}


          <div class="total">
            💰 ${Number(
              order.total || 0
            ).toLocaleString()} MMK
          </div>


          <button
            class="btn accept-btn"
            onclick="acceptOrder('${order.id}')"
          >
            🛵 抢这个订单
          </button>

        </div>

      `;
    }


    /* =========================
       抢单
    ========================= */

    async function acceptOrder(
      orderId
    ) {

      if (hasCurrentOrder) {

        alert(
          "你已经有一个订单了"
        );

        return;
      }


      try {

        /*
          Transaction 防止多人同时抢
        */

        await db.runTransaction(
          async transaction => {

            const orderRef =
              db.collection("orders")
                .doc(orderId);


            const riderRef =
              db.collection("delivery")
                .doc(deliveryDocId);


            const orderSnap =
              await transaction.get(
                orderRef
              );


            const riderSnap =
              await transaction.get(
                riderRef
              );


            if (!orderSnap.exists) {

              throw new Error(
                "订单不存在"
              );
            }


            if (!riderSnap.exists) {

              throw new Error(
                "骑手不存在"
              );
            }


            const order =
              orderSnap.data();


            const rider =
              riderSnap.data();


            /*
              骑手已经有订单
            */

            if (
              rider.currentOrderId
            ) {

              throw new Error(
                "你已经有订单"
              );

            }


            /*
              订单必须是商家已接单
            */

            if (
              order.status !==
              "商家已接单"
            ) {

              throw new Error(
                "订单已经不能抢"
              );

            }


            /*
              已经有人抢走
            */

            if (
              order.deliveryId
            ) {

              throw new Error(
                "订单已经被抢"
              );

            }


            /*
              订单 → 骑手已接单
            */

            transaction.update(
              orderRef,
              {

                status:
                  "骑手已接单",

                deliveryId:
                  deliveryDocId,

                deliveryUsername:
                  rider.username ||
                  deliveryUsername

              }
            );


            /*
              骑手 → 已接单
            */

            transaction.update(
              riderRef,
              {

                currentOrderId:
                  orderId,

                previousStatus:
                  rider.status ||
                  "在线",

                status:
                  "已接单"

              }
            );

          }
        );


        hasCurrentOrder = true;


        alert(
          "🎉 抢单成功！\n\n请等待商家做好外卖。"
        );


        await loadRiderInfo();

        await loadOrders();


      } catch (error) {

        console.error(
          "抢单失败",
          error
        );


        alert(
          error.message ||
          "抢单失败，请稍后再试"
        );


        await checkCurrentOrder();

        await loadOrders();

      }

    }


    /* =========================
       取餐
    ========================= */

    async function pickupOrder(
      orderId
    ) {

      try {

        const orderRef =
          db.collection("orders")
            .doc(orderId);


        const riderRef =
          db.collection("delivery")
            .doc(deliveryDocId);


        const orderSnap =
          await orderRef.get();


        if (!orderSnap.exists) {

          alert(
            "订单不存在"
          );

          return;
        }


        const order =
          orderSnap.data();


        if (
          order.deliveryId !==
          deliveryDocId
        ) {

          alert(
            "这个订单不是你的"
          );

          return;
        }


        if (
          order.status !==
          "外卖好了"
        ) {

          alert(
            "商家还没有做好外卖"
          );

          return;
        }


        /*
          外卖好了
          →
          配送中
        */

        await orderRef.update({

          status:
            "配送中"

        });


        await riderRef.update({

          status:
            "配送中",

          previousStatus:
            "已接单"

        });


        alert(
          "🛵 已取餐！\n\n现在开始配送。"
        );


        await loadRiderInfo();

        await loadOrders();


      } catch (error) {

        console.error(
          "取餐失败",
          error
        );

        alert(
          "取餐失败，请稍后再试"
        );
      }

    }


    /* =========================
       完成订单
    ========================= */

    async function completeOrder(
      orderId
    ) {

      if (
        !confirm(
          "确定顾客已经收到外卖了吗？"
        )
      ) {

        return;

      }


      try {

        const orderRef =
          db.collection("orders")
            .doc(orderId);


        const riderRef =
          db.collection("delivery")
            .doc(deliveryDocId);


        const orderSnap =
          await orderRef.get();


        if (!orderSnap.exists) {

          alert(
            "订单不存在"
          );

          return;
        }


        const order =
          orderSnap.data();


        if (
          order.deliveryId !==
          deliveryDocId
        ) {

          alert(
            "这个订单不是你的"
          );

          return;
        }


        if (
          order.status !==
          "配送中"
        ) {

          alert(
            "这个订单目前不能完成"
          );

          return;
        }


        /*
          订单 → 已完成
        */

        await orderRef.update({

          status:
            "已完成"

        });


        /*
          骑手 → 在线
        */

        const riderSnap =
          await riderRef.get();


        const rider =
          riderSnap.exists
            ? riderSnap.data()
            : {};


        await riderRef.update({

          currentOrderId:
            "",

          previousStatus:
            "",

          status:
            "在线",

          completedOrders:
            Number(
              rider.completedOrders || 0
            ) + 1

        });


        hasCurrentOrder = false;


        alert(
          "🎉 配送完成！\n\n你现在可以继续抢下一单。"
        );


        await loadRiderInfo();

        await loadOrders();


      } catch (error) {

        console.error(
          "完成订单失败",
          error
        );

        alert(
          "完成订单失败，请稍后再试"
        );
      }

    }


    /* =========================
       商品显示
    ========================= */

    function itemsHTML(items) {

      if (
        !Array.isArray(items) ||
        items.length === 0
      ) {

        return "";

      }


      return `

        <div class="items">

          ${items.map(item => {

            const name =
              item.name ||
              item.foodName ||
              "商品";


            const quantity =
              item.quantity ||
              item.qty ||
              1;


            const price =
              Number(
                item.price || 0
              );


            return `

              <div class="item">

                <span>
                  ${safe(name)}
                  × ${quantity}
                </span>

                <span>
                  ${(
                    price * quantity
                  ).toLocaleString()}
                  MMK
                </span>

              </div>

            `;

          }).join("")}

        </div>

      `;
    }


    /* =========================
       安全文字
    ========================= */

    function safe(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* =========================
       短订单号
    ========================= */

    function shortId(id) {

      if (!id) {
        return "------";
      }

      return id.substring(
        0,
        8
      );
    }


    /* =========================
       自动刷新
    ========================= */

    function startRefresh() {

      if (refreshTimer) {

        clearInterval(
          refreshTimer
        );

      }


      refreshTimer =
        setInterval(
          async () => {

            try {

              await checkCurrentOrder();

              await loadRiderInfo();

              await loadOrders();

            } catch (error) {

              console.error(
                "刷新失败",
                error
              );

            }

          },
          4000
        );
    }


    /* =========================
       退出登录
    ========================= */

    function logout() {

      if (
        !confirm(
          "确定退出骑手账号吗？"
        )
      ) {

        return;

      }


      if (refreshTimer) {

        clearInterval(
          refreshTimer
        );

        refreshTimer = null;

      }


      localStorage.removeItem(
        "deliveryLogin"
      );

      localStorage.removeItem(
        "deliveryUsername"
      );

      localStorage.removeItem(
        "deliveryId"
      );


      window.location.href =
        "delivery-login.html";
    }


    /* =========================
       启动
    ========================= */

    async function init() {

      const rider =
        await getRider();


      if (!rider) {
        return;
      }


      await checkCurrentOrder();

      await loadRiderInfo();

      await loadOrders();

      startRefresh();

    }


    init();

  </script>

</body>
</html>
