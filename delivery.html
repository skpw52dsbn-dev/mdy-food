<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDY FOOD - 配送员</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
}

.header {
    background: #ff6b00;
    color: white;
    padding: 18px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 24px;
}

.container {
    max-width: 700px;
    margin: 20px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.rider-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.rider-name {
    font-size: 22px;
    font-weight: bold;
}

.online {
    color: #16a34a;
    font-weight: bold;
}

.offline {
    color: #999;
    font-weight: bold;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 18px;
}

.stat {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
}

.stat-label {
    font-size: 13px;
    color: #777;
    margin-top: 5px;
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.order-card {
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
}

.order-id {
    font-size: 13px;
    color: #888;
    margin-bottom: 8px;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 8px;
    background: #fff1e6;
    color: #ff6b00;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 12px;
}

.restaurant {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.info {
    line-height: 1.8;
    font-size: 15px;
}

.total {
    font-size: 18px;
    font-weight: bold;
    margin-top: 12px;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

.btn-orange {
    background: #ff6b00;
    color: white;
}

.btn-green {
    background: #16a34a;
    color: white;
}

.btn-red {
    background: #dc2626;
    color: white;
}

.btn-gray {
    background: #eee;
    color: #555;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.empty {
    text-align: center;
    color: #999;
    padding: 25px 10px;
}

.waiting {
    background: #fff8e8;
    color: #a16207;
    padding: 13px;
    border-radius: 10px;
    margin-top: 12px;
    line-height: 1.6;
}

.ready {
    background: #ecfdf5;
    color: #15803d;
    padding: 13px;
    border-radius: 10px;
    margin-top: 12px;
    line-height: 1.6;
}

.delivery {
    background: #eff6ff;
    color: #1d4ed8;
    padding: 13px;
    border-radius: 10px;
    margin-top: 12px;
    line-height: 1.6;
}

.logout {
    text-align: center;
    margin: 20px 0 30px;
}

.logout button {
    width: auto;
    padding: 10px 25px;
    background: #ddd;
    color: #444;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #888;
}

/* ===============================
   我的收入
=============================== */

.income-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.income-item {
    background: #fff8e8;
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
}

.income-number {
    font-size: 20px;
    font-weight: bold;
    color: #ff6b00;
}

.income-label {
    font-size: 12px;
    color: #777;
    margin-top: 5px;
}

.income-note {
    margin-top: 12px;
    padding: 11px 13px;
    background: #f7f7f7;
    border-radius: 10px;
    color: #777;
    font-size: 13px;
    line-height: 1.6;
}

@media (max-width: 500px) {

    .container {
        padding: 0 10px;
    }

    .stats {
        gap: 6px;
    }

    .stat {
        padding: 10px 5px;
    }

    .income-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🛵 MDY FOOD 配送员</h1>
</div>

<div class="container">

    <!-- 骑手信息 -->
    <div class="card">

        <div class="rider-top">

            <div>

                <div

                    id="riderName"

                    配送员
                </div>

                    <span id="riderUsername">
                        -
                    </span>
                </div>

            </div>

            <div
                id="riderStatus"
                class="online"
            >

            </div>

        </div>


        <div class="stats">

                <div
                    class="stat-number"
                    id="completedOrders"
                >
                    0
                </div>

                <div class="stat-label">

                </div>

                    class="stat-number"
                    id="availableCount"

                <div
                    class="stat-number"

                </div>

        </div>

    </div>


    <!-- 我的收入 -->
    <div class="card">

        <div class="section-title">
            💰 我的收入
        </div>


        <div class="income-grid">

            <div class="income-item">

                <div
                    class="income-number"
                    id="todayIncome"
                >
                    0 Ks
                </div>

                <div class="income-label">
                    今日收入
                </div>

            </div>


            <div class="income-item">

                <div
                    class="income-number"
                    id="weekIncome"
                >
                    0 Ks
                </div>

                <div class="income-label">
                    本周收入
                </div>

            </div>


            <div class="income-item">

                <div
                    class="income-number"
                    id="totalIncome"
                >
                    0 Ks
                </div>

                <div class="income-label">
                    累计收入
                </div>

            </div>


            <div class="income-item">

                <div
                    class="income-number"
                    id="incomeCompletedOrders"
                >
                    0
                </div>

                <div class="income-label">
                    累计完成
                </div>

            </div>

        </div>


        <div class="income-note">

            💡 当前系统配送费为
            <b>2,000 Ks / 单</b>。
            订单完成后，配送费计入骑手收入。

        </div>

    </div>


    <!-- 可抢订单 -->
    <div
        class="card"
        id="availableSection"
    >

        <div class="section-title">
            📦 可抢订单
        </div>

        <div id="availableOrders">

            <div class="loading">
                正在加载订单...
            </div>

        </div>

    </div>


    <!-- 当前订单 -->
    <div
        class="card"
        id="currentSection"
    >

        <div class="section-title">
            📦 我的订单
        </div>

        <div id="currentOrder">

            <div class="empty">
                🛵 目前没有配送中的订单
            </div>

        </div>

    </div>


    <!-- 退出 -->
    <div class="logout">

        <button
            onclick="logout()"
        >
            退出登录
        </button>

    </div>

</div>


<script>

const firebaseConfig = {

    apiKey:
        "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqxv5X7Q",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


// ===============================
// 登录信息
// ===============================

let deliveryId =
    localStorage.getItem(
        "deliveryId"
    );


let deliveryUsername =
    localStorage.getItem(
        "deliveryUsername"
    );


// 没登录直接回登录页面

if (!deliveryUsername) {

    window.location.href =
        "delivery-login.html";

}


// ===============================
// 骑手数据
// ===============================

let riderData = null;

let currentOrder = null;


// ===============================
// 初始化
// ===============================

async function init() {

    try {

        // 如果没有 deliveryId
        // 根据 username 找真正的骑手文档

        if (!deliveryId) {

            const snap =
                await db
                    .collection("delivery")
                    .where(
                        "username",
                        "==",
                        deliveryUsername
                    )
                    .limit(1)
                    .get();


            if (snap.empty) {

                alert(
                    "找不到配送员账号"
                );

                logout();

                return;
            }


            deliveryId =
                snap.docs[0].id;


            localStorage.setItem(
                "deliveryId",
                deliveryId
            );

        }


        await loadRider();

        await checkCurrentOrder();

        await loadAvailableOrders();

        await loadIncome();


    } catch (error) {

        console.error(error);

        alert(
            "加载失败：" +
            error.message
        );

    }

}


// ===============================
// 加载骑手
// ===============================

async function loadRider() {

    const doc =
        await db
            .collection("delivery")
            .doc(deliveryId)
            .get();


    if (!doc.exists) {

        alert(
            "配送员不存在"
        );

        logout();

        return;
    }


    riderData =
        doc.data();


    document.getElementById(
        "riderName"
    ).innerText =
        "🛵 " +
        (
            riderData.name ||
            "配送员"
        );


    document.getElementById(
        "riderUsername"
    ).innerText =
        riderData.username ||
        deliveryUsername ||
        riderData.phone ||
        "-";


    document.getElementById(
        "completedOrders"
    ).innerText =
        riderData.completedOrders ||
        0;


    let status =
        riderData.status ||
        "在线";


    if (
        status === "已接单" ||
        status === "配送中" ||
        riderData.currentOrderId
    ) {

        document.getElementById(
            "riderStatus"
        ).innerHTML =
            status === "配送中"
                ? "🔵 配送中"
                : "🟠 已接单";


        document.getElementById(
            "riderStatus"
        ).className =
            "online";


        document.getElementById(
            "currentState"
        ).innerText =
            status === "配送中"
                ? "配送中"
                : "已接单";


    } else {

        document.getElementById(
            "riderStatus"
        ).innerHTML =
            "🟢 在线";


        document.getElementById(
            "riderStatus"
        ).className =
            "online";


        document.getElementById(
            "currentState"
        ).innerText =
            "空闲";

    }

}


// ===============================
// 检查当前订单
// ===============================

async function checkCurrentOrder() {

    const riderDoc =
        await db
            .collection("delivery")
            .doc(deliveryId)
            .get();


    if (!riderDoc.exists) {
        return;
    }


    riderData =
        riderDoc.data();


    const orderId =
        riderData.currentOrderId;


    if (!orderId) {

        currentOrder = null;

        renderCurrentOrder();

        return;
    }


    const orderDoc =
        await db
            .collection("orders")
            .doc(orderId)
            .get();


    if (!orderDoc.exists) {

        currentOrder = null;

        renderCurrentOrder();

        return;
    }


    currentOrder = {

        id: orderDoc.id,

        ...orderDoc.data()

    };


    renderCurrentOrder();

}


// ===============================
// 判断是否可以抢单
// ===============================

function isWaitingForDelivery(order) {

    const status =
        order.status || "";


    if (
        order.deliveryId ||
        order.riderId ||
        order.driverId ||
        order.deliveryPersonId
    ) {

        return false;
    }


    if (
        status === "已完成" ||
        status === "completed" ||
        status === "complete" ||
        status === "完成"
    ) {

        return false;
    }


    if (
        status === "已取消" ||
        status === "取消" ||
        status === "cancelled" ||
        status === "canceled"
    ) {

        return false;
    }


    if (
        status === "配送中" ||
        status === "delivering" ||
        status === "delivery"
    ) {

        return false;
    }


    return (
        status === "商家已接单" ||
        status === "ready" ||
        status === "food_ready" ||
        status === "外卖好了"
    );

}


// ===============================
// 加载可抢订单
// ===============================

async function loadAvailableOrders() {

    const box =
        document.getElementById(
            "availableOrders"
        );


    if (
        riderData &&
        riderData.currentOrderId
    ) {

        document.getElementById(
            "availableCount"
        ).innerText =
            "0";


        box.innerHTML = `

            <div class="empty">

                🛵 你目前已有配送订单

                <br><br>

                完成当前订单后才能继续抢单

            </div>

        `;

        return;
    }


    try {

        const snapshot =
            await db
                .collection("orders")
                .get();


        const orders = [];


        snapshot.forEach(doc => {

            const order =
                doc.data() || {};


            console.log(
                "订单：",
                order.order_number ||
                doc.id,
                "状态：",
                order.status,
                "骑手：",
                order.deliveryId ||
                order.riderId ||
                ""
            );


            if (
                isWaitingForDelivery(
                    order
                )
            ) {

                orders.push({

                    id: doc.id,

                    ...order

                });

            }

        });


        document.getElementById(
            "availableCount"
        ).innerText =
            orders.length;


        if (!orders.length) {

            box.innerHTML = `

                <div class="empty">

                    📦 目前没有可抢订单

                </div>

            `;

            return;
        }


        orders.sort(
            function(a, b) {

                const aTime =
                    getTimestampDate(
                        a.created_at
                    );

                const bTime =
                    getTimestampDate(
                        b.created_at
                    );


                return (
                    (bTime
                        ? bTime.getTime()
                        : 0) -
                    (aTime
                        ? aTime.getTime()
                        : 0)
                );

            }
        );


        box.innerHTML = "";


        orders.forEach(
            function(order) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "order-card";


                div.innerHTML = `

                    <div class="order-id">

                        📦 订单号：

                        ${escapeHtml(
                            order.order_number ||
                            order.id
                        )}

                    </div>


                    <div class="status">

                        ${escapeHtml(
                            normalizeStatus(
                                order.status
                            )
                        )}

                    </div>


                    <div class="restaurant">

                        🏪

                        ${escapeHtml(
                            order.restaurantName ||
                            "本餐厅"
                        )}

                    </div>


                    <div class="info">

                        👤 顾客：

                        ${escapeHtml(
                            order.customername ||
                            order.customerName ||
                            "-"
                        )}

                        <br>


                        📞 电话：

                        ${escapeHtml(
                            order.phone ||
                            "-"
                        )}

                        <br>


                        📍 地址：

                        ${escapeHtml(
                            order.adress ||
                            order.address ||
                            "-"
                        )}

                    </div>


                    <div class="total">

                        💰 订单金额：

                        ${formatMoney(
                            order.total
                        )}

                        Ks

                    </div>


                    <button
                        class="btn-orange"
                        onclick="acceptOrder('${order.id}')"
                    >

                        🛵 抢这个订单

                    </button>

                `;


                box.appendChild(
                    div
                );

            }
        );


    } catch (error) {

        console.error(
            "加载可抢订单失败：",
            error
        );


        box.innerHTML = `

            <div class="empty">

                ⚠️ 加载订单失败

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


// ===============================
// 抢单
// ===============================

async function acceptOrder(orderId) {

    if (
        riderData &&
        riderData.currentOrderId
    ) {

        alert(
            "你已经有一个配送订单了。\n\n" +
            "完成当前订单后才能继续抢单。"
        );

        return;
    }


    const ok =
        confirm(
            "确定要抢这个订单吗？\n\n" +
            "抢单后，这个订单将归你配送。"
        );


    if (!ok) {
        return;
    }


    try {

        await db.runTransaction(
            async function(transaction) {

                const riderRef =
                    db
                        .collection("delivery")
                        .doc(deliveryId);


                const orderRef =
                    db
                        .collection("orders")
                        .doc(orderId);


                const riderSnap =
                    await transaction.get(
                        riderRef
                    );


                const orderSnap =
                    await transaction.get(
                        orderRef
                    );


                if (!riderSnap.exists) {

                    throw new Error(
                        "配送员不存在"
                    );

                }


                if (!orderSnap.exists) {

                    throw new Error(
                        "订单不存在"
                    );

                }


                const rider =
                    riderSnap.data();


                const order =
                    orderSnap.data();


                if (
                    rider.currentOrderId
                ) {

                    throw new Error(
                        "你已经有配送订单了"
                    );

                }


                if (
                    !isWaitingForDelivery(
                        order
                    )
                ) {

                    throw new Error(
                        "这个订单已经被其他配送员接走，或者订单状态已经发生变化"
                    );

                }


                transaction.update(
                    orderRef,
                    {

                        deliveryId:
                            deliveryId,

                        riderId:
                            deliveryId,

                        deliveryName:
                            rider.name ||
                            "",

                        deliveryPhone:
                            rider.phone ||
                            "",

                        status:
                            "骑手已接单",

                        riderAcceptedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp(),

                        acceptedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    }
                );


                transaction.update(
                    riderRef,
                    {

                        currentOrderId:
                            orderId,

                        previousStatus:
                            rider.status ||
                            "在线",

                        status:
                            "已接单",

                        available:
                            false

                    }
                );

            }
        );


        alert(
            "🎉 抢单成功！\n\n" +
            "这个订单现在由你配送。"
        );


        await refreshAll();


    } catch (error) {

        console.error(
            "抢单失败：",
            error
        );


        alert(
            error.message ||
            "抢单失败"
        );


        await refreshAll();

    }

}


// ===============================
// 当前订单显示
// ===============================

function renderCurrentOrder() {

    const box =
        document.getElementById(
            "currentOrder"
        );


    if (!currentOrder) {

        box.innerHTML = `

            <div class="empty">

                🛵 目前没有配送中的订单

            </div>

        `;

        return;
    }


    const order =
        currentOrder;


    const status =
        normalizeStatus(
            order.status
        );


    let actionHtml = "";


    if (
        status === "骑手已接单"
    ) {

        actionHtml = `

            <div class="waiting">

                🛵 你已经成功抢到这个订单。

                <br>

                等餐厅把外卖做好后，你可以取餐。

            </div>


            <button
                class="btn-red"
                onclick="cancelAcceptedOrder('${order.id}')"
            >

                ❌ 取消抢单

            </button>

        `;

    }


    if (
        status === "商家已接单"
    ) {

        actionHtml = `

            <div class="waiting">

                ⏳ 等待餐厅准备外卖。

            </div>

        `;

    }


    if (
        status === "外卖好了"
    ) {

        actionHtml = `

            <div class="ready">

                🍱 餐厅已经做好外卖。

                <br>

                请前往餐厅取餐。

            </div>


            <button
                class="btn-green"
                onclick="pickupOrder('${order.id}')"
            >

                🍱 我已经取到外卖

            </button>

        `;

    }


    if (
        status === "配送中"
    ) {

        actionHtml = `

            <div class="delivery">

                🚴 外卖正在配送中。

                <br>

                请尽快送到顾客手里。

            </div>


            <button
                class="btn-green"
                onclick="completeOrder('${order.id}')"
            >

                ✅ 已送达，完成订单

            </button>

        `;

    }

async function cancelAcceptedOrder(

) {

        confirm(
            "确定要取消这个订单吗？\n\n" +
            "取消后，这个订单会重新回到「可抢订单」。"
        );


    if (!ok) {
        return;
    }


    try {

        await db.runTransaction(
            async function(transaction) {

                const riderRef =
                    db
                        .collection("delivery")
                        .doc(deliveryId);


                const orderRef =
                    db
                        .collection("orders")
                        .doc(orderId);


                const riderSnap =
                    await transaction.get(
                        riderRef
                    );


                const orderSnap =
                    await transaction.get(
                        orderRef
                    );


                if (!riderSnap.exists) {

                    throw new Error(
                        "配送员不存在"
                    );

                }


                if (!orderSnap.exists) {

                    throw new Error(
                        "订单不存在"
                    );

                }


                const rider =
                    riderSnap.data();


                const order =
                    orderSnap.data();


                if (
                    rider.currentOrderId !==
                    orderId
                ) {

                    throw new Error(
                        "这个订单不是你当前的订单"
                    );

                }


                if (
                    order.status !==
                    "骑手已接单"
                ) {

                    throw new Error(
                        "现在已经不能取消抢单了"
                    );

                }


                transaction.update(
                    orderRef,
                    {

                        status:
                            "商家已接单",

                        deliveryId:
                            firebase.firestore
                                .FieldValue
                                .delete(),

                        riderId:
                            firebase.firestore
                                .FieldValue
                                .delete(),

                        deliveryName:
                            firebase.firestore
                                .FieldValue
                                .delete(),

                        deliveryPhone:
                            firebase.firestore
                                .FieldValue
                                .delete(),

                        riderAcceptedAt:
                            firebase.firestore
                                .FieldValue
                                .delete(),

                        acceptedAt:
                            firebase.firestore
                                .FieldValue
                                .delete()

                    }
                );


                transaction.update(
                    riderRef,
                    {

                        currentOrderId:
                            "",

                        previousStatus:
                            "",

                        status:

                        available:
                            true

            "已取消抢单。\n\n" +

    } catch (error) {

        console.error(error);


        alert(
            error.message ||

        );


        await refreshAll();

    }

}

// ===============================
// 我的收入
// ===============================

function getTimestampDate(
    timestamp
) {

    if (!timestamp) {
        return null;
    }


    try {

        if (
            timestamp.toDate
        ) {

            return timestamp.toDate();

        }


        if (
            timestamp instanceof Date
        ) {

            return timestamp;

        }


        if (
            timestamp.seconds
        ) {

            return new Date(
                timestamp.seconds *
                1000
            );

        }

    } catch (error) {

        console.error(error);

    }


    return null;

}


// ===============================
// 完成状态判断
// ===============================

function isCompletedStatus(
    status
) {

    return (

        status === "已完成" ||

        status === "completed" ||

        status === "complete" ||

        status === "完成"

    );

}


// ===============================
// 获取骑手收入
// ===============================

function getRiderEarning(
    order
) {

    if (
        order.riderEarnings !==
        undefined &&
        order.riderEarnings !==
        null
    ) {

        return Number(
            order.riderEarnings
        ) || 0;

    }


    if (
        order.deliveryFee !==
        undefined &&
        order.deliveryFee !==
        null
    ) {

        return Number(
            order.deliveryFee
        ) || 0;

    }


    // 兼容以前完成的旧订单
    // 当前系统配送费为 2,000 Ks

    return 2000;

}


// ===============================
// 判断是否同一天
// ===============================

function isSameDay(
    dateA,
    dateB
) {

    if (
        !dateA ||
        !dateB
    ) {

        return false;

    }


    return (

        dateA.getFullYear() ===
        dateB.getFullYear() &&

        dateA.getMonth() ===
        dateB.getMonth() &&

        dateA.getDate() ===
        dateB.getDate()

    );

}


// ===============================
// 判断是否同一周
// ===============================

function isSameWeek(
    date
) {

    if (!date) {
        return false;
    }


    const now =
        new Date();


    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );


    const target =
        new Date(
            date.getFullYear(),
            date.getMonth(),
            date.getDate()
        );


    // 周一作为每周第一天

    const day =
        today.getDay();


    const diff =
        day === 0
            ? 6
            : day - 1;


    const weekStart =
        new Date(today);


    weekStart.setDate(
        today.getDate() -
        diff
    );


    const weekEnd =
        new Date(
            weekStart
        );


    weekEnd.setDate(
        weekStart.getDate() +
        7
    );


    return (
        target >= weekStart &&
        target < weekEnd
    );

}


// ===============================
// 读取骑手收入
// ===============================

async function loadIncome() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .get();


        let todayIncome = 0;

        let weekIncome = 0;

        let totalIncome = 0;

        let completedCount = 0;


        const now =
            new Date();


        snapshot.forEach(
            function(doc) {

                const order =
                    doc.data() || {};


                // 只统计当前骑手的订单

                const belongsToRider =

                    order.deliveryId ===
                    deliveryId ||

                    order.riderId ===
                    deliveryId ||

                    order.driverId ===
                    deliveryId ||

                    order.deliveryPersonId ===
                    deliveryId;


                if (
                    !belongsToRider ||
                    !isCompletedStatus(
                        order.status
                    )
                ) {

                    return;

                }


                const earning =
                    getRiderEarning(
                        order
                    );


                const date =
                    getTimestampDate(
                        order.completedAt ||
                        order.completed_at ||
                        order.created_at
                    );


                completedCount++;

                totalIncome +=
                    earning;


                if (
                    isSameDay(
                        date,
                        now
                    )
                ) {

                    todayIncome +=
                        earning;

                }


                if (
                    isSameWeek(
                        date
                    )
                ) {

                    weekIncome +=
                        earning;

                }

            }
        );


        document.getElementById(
            "todayIncome"
        ).innerText =
            formatMoney(
                todayIncome
            ) +
            " Ks";


        document.getElementById(
            "weekIncome"
        ).innerText =
            formatMoney(
                weekIncome
            ) +
            " Ks";


        document.getElementById(
            "totalIncome"
        ).innerText =
            formatMoney(
                totalIncome
            ) +
            " Ks";


        document.getElementById(
            "incomeCompletedOrders"
        ).innerText =
            completedCount;


    } catch (error) {

        console.error(
            "读取骑手收入失败：",
            error
        );


        document.getElementById(
            "todayIncome"
        ).innerText =
            "读取失败";


        document.getElementById(
            "weekIncome"
        ).innerText =
            "读取失败";


        document.getElementById(
            "totalIncome"
        ).innerText =
            "读取失败";


        document.getElementById(
            "incomeCompletedOrders"
        ).innerText =
            "-";

    }

}

// ===============================
// 金额格式
// ===============================

function formatMoney(
    number
) {

    return Number(
        number || 0
    ).toLocaleString(
        "en-US"
    );

}


// ===============================
// HTML 安全处理
// ===============================

function escapeHtml(
    value
) {

    return String(
        value === undefined ||
        value === null
            ? ""
            : value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
