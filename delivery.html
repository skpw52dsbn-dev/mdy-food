<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD - 骑手工作台</title>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #f5f6f8;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    color: #222;

}


button,
input {

    font-family: inherit;

}


.topbar {

    background: #ff6b00;

    color: white;

    padding: 15px 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    position: sticky;

    top: 0;

    z-index: 100;

}


.logo {

    font-size: 21px;

    font-weight: bold;

}


.rider-mini {

    text-align: right;

    font-size: 13px;

}


.container {

    width: 94%;

    max-width: 1100px;

    margin: 18px auto 40px;

}


.card {

    background: white;

    border-radius: 15px;

    padding: 18px;

    margin-bottom: 15px;

    box-shadow:
        0 3px 14px
        rgba(0,0,0,0.06);

}


.profile {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

}


.profile-left {

    display: flex;

    align-items: center;

    gap: 13px;

}


.avatar {

    width: 58px;

    height: 58px;

    border-radius: 50%;

    background: #fff1e7;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 30px;

}


.profile-name {

    font-size: 19px;

    font-weight: bold;

}


.profile-info {

    color: #777;

    font-size: 13px;

    margin-top: 5px;

}


.online-btn {

    border: none;

    border-radius: 10px;

    padding: 11px 16px;

    font-weight: bold;

    cursor: pointer;

}


.online {

    background: #e9f9ef;

    color: #159447;

}


.offline {

    background: #f1f1f1;

    color: #666;

}


.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

}


.stat {

    background: #fafafa;

    border-radius: 12px;

    padding: 15px;

    text-align: center;

}


.stat-number {

    font-size: 24px;

    font-weight: bold;

    color: #ff6b00;

}


.stat-label {

    color: #777;

    font-size: 13px;

    margin-top: 5px;

}


.section-title {

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 14px;

}


.order-card {

    border: 1px solid #eee;

    border-radius: 13px;

    padding: 15px;

    margin-bottom: 12px;

}


.order-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

}


.order-number {

    font-weight: bold;

    font-size: 16px;

}


.status {

    padding: 5px 9px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

}


.status-pending {

    background: #fff4e8;

    color: #f27b00;

}


.status-accepted {

    background: #eaf4ff;

    color: #1671d9;

}


.status-delivering {

    background: #eaf9ef;

    color: #168c45;

}


.status-completed {

    background: #eeeeee;

    color: #666;

}


.order-row {

    margin-top: 10px;

    line-height: 1.6;

    font-size: 14px;

}


.order-label {

    color: #888;

}


.order-items {

    background: #fafafa;

    padding: 10px;

    border-radius: 9px;

    margin-top: 10px;

    line-height: 1.7;

}


.order-actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 13px;

}


.action-btn {

    border: none;

    border-radius: 9px;

    padding: 10px 14px;

    cursor: pointer;

    font-weight: bold;

}


.accept-btn {

    background: #ff6b00;

    color: white;

}


.start-btn {

    background: #1671d9;

    color: white;

}


.complete-btn {

    background: #159447;

    color: white;

}


.call-btn {

    background: #edf7ff;

    color: #1671d9;

}


.map-btn {

    background: #f3f3f3;

    color: #444;

}


.logout-btn {

    background: white;

    color: #ff6b00;

    border: none;

    border-radius: 8px;

    padding: 8px 12px;

    cursor: pointer;

}


.empty {

    text-align: center;

    color: #888;

    padding: 35px 10px;

}


.loading {

    text-align: center;

    color: #888;

    padding: 30px;

}


.message {

    display: none;

    padding: 12px;

    border-radius: 9px;

    margin-bottom: 15px;

    line-height: 1.5;

}


.error {

    background: #fff0f0;

    color: #d33;

}


.success {

    background: #edf9f1;

    color: #168a43;

}


.refresh-text {

    color: #999;

    font-size: 12px;

    text-align: right;

    margin-top: 8px;

}


.history-card {

    border-top: 1px solid #eee;

    padding: 13px 0;

}


.history-card:first-child {

    border-top: none;

}


.history-top {

    display: flex;

    justify-content: space-between;

    gap: 10px;

}


.history-money {

    font-weight: bold;

    color: #ff6b00;

}


@media (max-width: 650px) {

    .stats {

        grid-template-columns:
            1fr 1fr 1fr;

        gap: 7px;

    }

    .stat {

        padding: 12px 5px;

    }

    .stat-number {

        font-size: 19px;

    }

    .profile {

        align-items: flex-start;

    }

    .profile {

        flex-direction: column;

    }

    .online-btn {

        width: 100%;

    }

}

</style>

</head>


<body>


<div class="topbar">

    <div class="logo">
        🛵 MDY FOOD
    </div>

    <div class="rider-mini">

        <div id="topRiderName">
            骑手
        </div>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            退出登录
        </button>

    </div>

</div>


<div class="container">


    <div
        id="errorMessage"
        class="message error"
    ></div>


    <div
        id="successMessage"
        class="message success"
    ></div>


    <!-- 骑手资料 -->

    <div class="card">

        <div class="profile">

            <div class="profile-left">

                <div class="avatar">
                    🛵
                </div>

                <div>

                    <div
                        class="profile-name"
                        id="riderName"
                    >
                        骑手
                    </div>

                    <div
                        class="profile-info"
                        id="riderPhone"
                    >
                        电话：
                    </div>

                    <div
                        class="profile-info"
                        id="riderArea"
                    >
                        配送区域：
                    </div>

                </div>

            </div>


            <button
                id="onlineBtn"
                class="online-btn offline"
                onclick="toggleOnline()"
            >
                🔴 当前下线
            </button>

        </div>

    </div>


    <!-- 数据统计 -->

    <div class="card">

        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="todayOrders"
                >
                    0
                </div>

                <div class="stat-label">
                    今日完成
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="todayAmount"
                >
                    0 Ks
                </div>

                <div class="stat-label">
                    今日订单金额
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="totalOrders"
                >
                    0
                </div>

                <div class="stat-label">
                    累计完成
                </div>

            </div>

        </div>

    </div>


    <!-- 当前订单 -->

    <div class="card">

        <div class="section-title">
            📦 当前配送订单
        </div>

        <div id="currentOrder">

            <div class="empty">
                当前没有配送订单
            </div>

        </div>

    </div>


    <!-- 可接订单 -->

    <div class="card">

        <div class="section-title">
            🔔 待配送订单
        </div>

        <div id="availableOrders">

            <div class="loading">
                正在读取订单...
            </div>

        </div>

        <div class="refresh-text">
            每 10 秒自动刷新
        </div>

    </div>


    <!-- 配送记录 -->

    <div class="card">

        <div class="section-title">
            📋 我的配送记录
        </div>

        <div id="historyOrders">

            <div class="loading">
                正在读取记录...
            </div>

        </div>

    </div>


</div>


<script>


/* =========================================================
   Firebase
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqxv5X7Q",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


/* =========================================================
   登录检查
========================================================= */

const deliveryLogin =
    localStorage.getItem(
        "deliveryLogin"
    );


const deliveryId =
    localStorage.getItem(
        "deliveryId"
    );


const deliveryUsername =
    localStorage.getItem(
        "deliveryUsername"
    );


if (
    deliveryLogin !== "true" ||
    !deliveryId
) {

    window.location.href =
        "delivery-login.html";

}


/* =========================================================
   全局变量
========================================================= */

let rider = null;

let availableOrders = [];

let currentOrder = null;

let historyOrders = [];

let refreshTimer = null;


/* =========================================================
   工具
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function formatMoney(value) {

    const number =
        Number(value) || 0;

    return (
        number.toLocaleString(
            "en-US"
        )
        +
        " Ks"
    );

}


function formatDate(value) {

    if (!value) {

        return "-";

    }


    let date;


    if (
        value &&
        typeof value.toDate ===
        "function"
    ) {

        date =
            value.toDate();

    }

    else if (
        value instanceof Date
    ) {

        date =
            value;

    }

    else {

        date =
            new Date(value);

    }


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "zh-CN",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        4000
    );

}


function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        3000
    );

}


/* =========================================================
   状态判断
========================================================= */

function getOrderStatus(order) {

    return String(
        order.status || ""
    ).toLowerCase();

}


function isPendingOrder(order) {

    const status =
        getOrderStatus(order);


    return (

        status === "pending" ||

        status === "待配送" ||

        status === "new" ||

        status === "已接单" && false

    );

}


function isAcceptedByMe(order) {

    const riderId =
        order.deliveryId ||
        order.riderId ||
        order.driverId ||
        order.deliveryPersonId ||
        "";


    return (
        String(riderId) ===
        String(deliveryId)
    );

}


function isCompleted(order) {

    const status =
        getOrderStatus(order);


    return (

        status === "completed" ||

        status === "complete" ||

        status === "已完成" ||

        status === "配送完成"

    );

}


/* =========================================================
   读取骑手
========================================================= */

async function loadRider() {

    try {

        const doc =
            await db
                .collection("delivery")
                .doc(deliveryId)
                .get();


        if (!doc.exists) {

            showError(
                "骑手资料不存在，请重新登录。"
            );

            logout();

            return;

        }


        rider = {

            id: doc.id,

            ...doc.data()

        };


        document.getElementById(
            "riderName"
        ).textContent =
            rider.name ||
            rider.username ||
            deliveryUsername ||
            "骑手";


        document.getElementById(
            "topRiderName"
        ).textContent =
            rider.name ||
            rider.username ||
            deliveryUsername ||
            "骑手";


        document.getElementById(
            "riderPhone"
        ).textContent =
            "电话：" +
            (
                rider.phone ||
                "暂无"
            );


        document.getElementById(
            "riderArea"
        ).textContent =
            "配送区域：" +
            (
                rider.deliveryArea ||
                "暂无"
            );


        updateOnlineButton();

    }

    catch (error) {

        console.error(
            "读取骑手失败：",
            error
        );

        showError(
            "读取骑手资料失败：" +
            error.message
        );

    }

}


/* =========================================================
   上线 / 下线
========================================================= */

function isRiderOnline() {

    if (!rider) {

        return false;

    }


    if (
        rider.online === true
    ) {

        return true;

    }


    if (
        rider.status === "在线"
    ) {

        return true;

    }


    return false;

}


function updateOnlineButton() {

    const button =
        document.getElementById(
            "onlineBtn"
        );


    if (
        isRiderOnline()
    ) {

        button.className =
            "online-btn online";

        button.textContent =
            "🟢 当前在线";

    }

    else {

        button.className =
            "online-btn offline";

        button.textContent =
            "🔴 当前下线";

    }

}


async function toggleOnline() {

    if (!rider) {

        return;

    }


    const online =
        !isRiderOnline();


    try {

        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                online:
                    online,

                status:
                    online
                        ? "在线"
                        : "离线"

            });


        rider.online =
            online;

        rider.status =
            online
                ? "在线"
                : "离线";


        updateOnlineButton();


        showSuccess(
            online
                ? "你已经上线，可以接收订单。"
                : "你已经下线。"
        );


        await loadOrders();

    }

    catch (error) {

        console.error(
            "修改在线状态失败：",
            error
        );

        showError(
            "操作失败：" +
            error.message
        );

    }

}


/* =========================================================
   读取订单
========================================================= */

async function loadOrders() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .get();


        const all = [];


        snapshot.forEach(
            function(doc) {

                all.push({

                    id: doc.id,

                    ...doc.data()

                });

            }
        );


        availableOrders =
            all.filter(
                function(order) {

                    const assigned =
                        order.deliveryId ||
                        order.riderId ||
                        order.driverId ||
                        order.deliveryPersonId;


                    return (

                        !assigned &&

                        isPendingOrder(
                            order
                        )

                    );

                }
            );


        const myOrders =
            all.filter(
                function(order) {

                    return isAcceptedByMe(
                        order
                    );

                }
            );


        currentOrder =
            myOrders.find(
                function(order) {

                    return !isCompleted(
                        order
                    );

                }
            ) || null;


        historyOrders =
            myOrders.filter(
                function(order) {

                    return isCompleted(
                        order
                    );

                }
            );


        renderCurrentOrder();

        renderAvailableOrders();

        renderHistory();

        updateStats(
            historyOrders
        );

    }

    catch (error) {

        console.error(
            "读取订单失败：",
            error
        );

        showError(
            "读取订单失败：" +
            error.message
        );

    }

}


/* =========================================================
   当前订单
========================================================= */

function renderCurrentOrder() {

    const container =
        document.getElementById(
            "currentOrder"
        );


    if (!currentOrder) {

        container.innerHTML = `

            <div class="empty">

                🛵 当前没有正在配送的订单

                <br><br>

                ${
                    isRiderOnline()
                        ? "你现在在线，可以接收新订单。"
                        : "请先上线，然后接收订单。"
                }

            </div>

        `;

        return;

    }


    container.innerHTML =
        createOrderHtml(
            currentOrder,
            true
        );

}


/* =========================================================
   待接订单
========================================================= */

function renderAvailableOrders() {

    const container =
        document.getElementById(
            "availableOrders"
        );


    if (!isRiderOnline()) {

        container.innerHTML = `

            <div class="empty">

                🔴 你目前处于下线状态

                <br><br>

                请点击上方
                「当前下线」
                按钮上线后接收订单。

            </div>

        `;

        return;

    }


    if (!availableOrders.length) {

        container.innerHTML = `

            <div class="empty">

                📦 暂时没有新的配送订单

            </div>

        `;

        return;

    }


    container.innerHTML =
        availableOrders
            .map(
                function(order) {

                    return createOrderHtml(
                        order,
                        false
                    );

                }
            )
            .join("");

}


/* =========================================================
   创建订单 HTML
========================================================= */

function createOrderHtml(
    order,
    mine
) {

    const status =
        getOrderStatus(order);


    let statusText =
        order.status ||
        "待配送";


    let statusClass =
        "status-pending";


    if (
        status === "accepted" ||
        status === "已接单"
    ) {

        statusText =
            "已接单";

        statusClass =
            "status-accepted";

    }


    if (
        status === "delivering" ||
        status === "配送中"
    ) {

        statusText =
            "配送中";

        statusClass =
            "status-delivering";

    }


    if (
        isCompleted(order)
    ) {

        statusText =
            "已完成";

        statusClass =
            "status-completed";

    }


    let itemsHtml =
        "";


    if (
        Array.isArray(
            order.items
        )
    ) {

        itemsHtml =
            order.items
                .map(
                    function(item) {

                        return (

                            escapeHtml(
                                item.name ||
                                item.title ||
                                "商品"
                            )

                            +

                            " × "

                            +

                            (
                                item.quantity ||
                                item.qty ||
                                1
                            )

                        );

                    }
                )
                .join("<br>");

    }

    else {

        itemsHtml =
            "商品信息暂无";

    }


    let buttons =
        "";


    if (!mine) {

        buttons += `

            <button
                class="action-btn accept-btn"
                onclick="acceptOrder('${escapeHtml(order.id)}')"
            >
                ✅ 接受订单
            </button>

        `;

    }

    else {

        const statusLower =
            getOrderStatus(order);


        if (
            statusLower !== "delivering" &&
            statusLower !== "配送中"
        ) {

            buttons += `

                <button
                    class="action-btn start-btn"
                    onclick="startDelivery('${escapeHtml(order.id)}')"
                >
                    🚚 开始配送
                </button>

            `;

        }

        else {

            buttons += `

                <button
                    class="action-btn complete-btn"
                    onclick="completeOrder('${escapeHtml(order.id)}')"
                >
                    ✅ 完成配送
                </button>

            `;

        }

    }


    const phone =
        order.phone ||
        order.customerPhone ||
        order.customer_phone ||
        "";


    const address =
        order.adress ||
        order.address ||
        order.deliveryAddress ||
        "";


    const restaurantName =
        order.restaurantName ||
        "未知商家";


    return `

        <div class="order-card">

            <div class="order-header">

                <div class="order-number">

                    📦
                    ${escapeHtml(
                        order.order_number ||
                        order.id
                    )}

                </div>

                <span
                    class="status ${statusClass}"
                >
                    ${escapeHtml(
                        statusText
                    )}
                </span>

            </div>


            <div class="order-row">

                <span class="order-label">
                    🏪 商家：
                </span>

                <b>
                    ${escapeHtml(
                        restaurantName
                    )}
                </b>

            </div>


            <div class="order-row">

                <span class="order-label">
                    👤 客户：
                </span>

                ${escapeHtml(
                    order.customername ||
                    order.customerName ||
                    "未知"
                )}

            </div>


            <div class="order-row">

                <span class="order-label">
                    📍 地址：
                </span>

                ${escapeHtml(
                    address ||
                    "暂无地址"
                )}

            </div>


            <div class="order-row">

                <span class="order-label">
                    💰 订单金额：
                </span>

                <b>
                    ${formatMoney(
                        order.total
                    )}
                </b>

            </div>


            <div class="order-items">

                <b>
                    🍱 商品：
                </b>

                <br>

                ${itemsHtml}

            </div>


            ${
                order.created_at

                    ?

                    `
                    <div class="order-row">

                        <span class="order-label">
                            🕐 下单时间：
                        </span>

                        ${formatDate(
                            order.created_at
                        )}

                    </div>
                    `

                    :

                    ""
            }


            <div class="order-actions">

                ${buttons}


                ${
                    phone

                        ?

                        `
                        <button
                            class="action-btn call-btn"
                            onclick="callCustomer('${escapeHtml(phone)}')"
                        >
                            📞 联系客户
                        </button>
                        `

                        :

                        ""
                }


                ${
                    address

                        ?

                        `
                        <button
                            class="action-btn map-btn"
                            onclick="openMap('${escapeHtml(address)}')"
                        >
                            📍 导航
                        </button>
                        `

                        :

                        ""
                }

            </div>

        </div>

    `;

}


/* =========================================================
   接单
========================================================= */

async function acceptOrder(
    orderId
) {

    if (!isRiderOnline()) {

        showError(
            "请先上线后再接单。"
        );

        return;

    }


    if (currentOrder) {

        showError(
            "你已经有一个正在配送的订单，请先完成当前订单。"
        );

        return;

    }


    if (
        !confirm(
            "确定要接受这个配送订单吗？"
        )
    ) {

        return;

    }


    try {

        const orderRef =
            db
                .collection("orders")
                .doc(orderId);


        await db.runTransaction(
            async function(
                transaction
            ) {

                const snapshot =
                    await transaction.get(
                        orderRef
                    );


                if (!snapshot.exists) {

                    throw new Error(
                        "订单不存在。"
                    );

                }


                const order =
                    snapshot.data();


                const assigned =
                    order.deliveryId ||
                    order.riderId ||
                    order.driverId ||
                    order.deliveryPersonId;


                if (assigned) {

                    throw new Error(
                        "这个订单已经被其他骑手接走了。"
                    );

                }


                const status =
                    String(
                        order.status ||
                        ""
                    ).toLowerCase();


                if (
                    status !== "pending" &&
                    status !== "待配送" &&
                    status !== "new"
                ) {

                    throw new Error(
                        "这个订单当前已经不能接单。"
                    );

                }


                transaction.update(
                    orderRef,
                    {

                        deliveryId:
                            deliveryId,

                        riderId:
                            deliveryId,

                        deliveryName:
                            rider.name ||
                            rider.username ||
                            deliveryUsername ||
                            "",

                        deliveryPhone:
                            rider.phone ||
                            "",

                        status:
                            "accepted",

                        acceptedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    }
                );

            }
        );


        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                currentOrderId:
                    orderId,

                previousStatus:
                    rider.status ||
                    "在线"

            });


        showSuccess(
            "接单成功！"
        );


        await loadRider();

        await loadOrders();

    }

    catch (error) {

        console.error(
            "接单失败：",
            error
        );

        showError(
            "接单失败：" +
            error.message
        );

        await loadOrders();

    }

}


/* =========================================================
   开始配送
========================================================= */

async function startDelivery(
    orderId
) {

    if (!isAcceptedByMe(
        currentOrder || {}
    ) &&
        (!currentOrder ||
        currentOrder.id !== orderId)
    ) {

        return;

    }


    if (
        !confirm(
            "确定开始配送这个订单吗？"
        )
    ) {

        return;

    }


    try {

        await db
            .collection("orders")
            .doc(orderId)
            .update({

                status:
                    "delivering",

                deliveringAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                status:
                    "配送中",

                currentOrderId:
                    orderId

            });


        showSuccess(
            "订单已进入配送中状态。"
        );


        await loadRider();

        await loadOrders();

    }

    catch (error) {

        console.error(
            "开始配送失败：",
            error
        );

        showError(
            "开始配送失败：" +
            error.message
        );

    }

}


/* =========================================================
   完成配送
========================================================= */

async function completeOrder(
    orderId
) {

    if (
        !confirm(
            "确定客户已经收到订单，并完成配送吗？"
        )
    ) {

        return;

    }


    try {

        const orderRef =
            db
                .collection("orders")
                .doc(orderId);


        await db.runTransaction(
            async function(
                transaction
            ) {

                const snapshot =
                    await transaction.get(
                        orderRef
                    );


                if (!snapshot.exists) {

                    throw new Error(
                        "订单不存在。"
                    );

                }


                const order =
                    snapshot.data();


                if (
                    !isAcceptedByMe(
                        order
                    )
                ) {

                    throw new Error(
                        "这个订单不属于当前骑手。"
                    );

                }


                transaction.update(
                    orderRef,
                    {

                        status:
                            "completed",

                        completedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp(),

                        deliveryCompletedBy:
                            deliveryId

                    }
                );

            }
        );


        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                currentOrderId:
                    "",

                status:
                    "在线",

                online:
                    true,

                lastCompletedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        showSuccess(
            "配送完成！订单已经完成。"
        );


        await loadRider();

        await loadOrders();

    }

    catch (error) {

        console.error(
            "完成配送失败：",
            error
        );

        showError(
            "完成配送失败：" +
            error.message
        );

    }

}


/* =========================================================
   统计
========================================================= */

function updateStats(
    orders
) {

    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    let todayCount = 0;

    let todayAmount = 0;


    orders.forEach(
        function(order) {

            const date =
                getOrderDate(
                    order
                );


            const amount =
                Number(
                    order.total
                ) || 0;


            if (
                date &&
                date.getTime() >=
                today.getTime()
            ) {

                todayCount++;

                todayAmount +=
                    amount;

            }

        }
    );


    document.getElementById(
        "todayOrders"
    ).textContent =
        todayCount;


    document.getElementById(
        "todayAmount"
    ).textContent =
        formatMoney(
            todayAmount
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;

}


function getOrderDate(
    order
) {

    return getDateValue(
        order.completedAt ||
        order.completed_at ||
        order.created_at
    );

}


function getDateValue(
    value
) {

    if (!value) {

        return null;

    }


    if (
        value &&
        typeof value.toDate ===
        "function"
    ) {

        return value.toDate();

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return null;

    }


    return date;

}


/* =========================================================
   配送历史
========================================================= */

function renderHistory() {

    const container =
        document.getElementById(
            "historyOrders"
        );


    if (!historyOrders.length) {

        container.innerHTML = `

            <div class="empty">

                暂无配送记录

            </div>

        `;

        return;

    }


    const list =
        [...historyOrders]
            .sort(
                function(a, b) {

                    const da =
                        getOrderDate(a);

                    const dbDate =
                        getOrderDate(b);


                    return (
                        (
                            dbDate?.getTime() ||
                            0
                        )
                        -
                        (
                            da?.getTime() ||
                            0
                        )
                    );

                }
            )
            .slice(
                0,
                30
            );


    container.innerHTML =
        list
            .map(
                function(order) {

                    return `

                        <div
                            class="history-card"
                        >

                            <div
                                class="history-top"
                            >

                                <b>
                                    📦
                                    ${escapeHtml(
                                        order.order_number ||
                                        order.id
                                    )}
                                </b>

                                <span
                                    class="history-money"
                                >
                                    ${formatMoney(
                                        order.total
                                    )}
                                </span>

                            </div>


                            <div
                                class="order-row"
                            >

                                🏪
                                ${escapeHtml(
                                    order.restaurantName ||
                                    "未知商家"
                                )}

                            </div>


                            <div
                                class="order-row"
                            >

                                👤
                                ${escapeHtml(
                                    order.customername ||
                                    order.customerName ||
                                    "未知客户"
                                )}

                            </div>


                            <div
                                class="order-row"
                            >

                                🕐
                                ${formatDate(
                                    order.completedAt ||
                                    order.completed_at ||
                                    order.created_at
                                )}

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   电话
========================================================= */

function callCustomer(
    phone
) {

    if (!phone) {

        showError(
            "没有客户电话号码。"
        );

        return;

    }


    window.location.href =
        "tel:" +
        phone;

}


/* =========================================================
   地图导航
========================================================= */

function openMap(
    address
) {

    if (!address) {

        showError(
            "没有客户地址。"
        );

        return;

    }


    const url =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
            address
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   退出
========================================================= */

function logout() {

    if (
        !confirm(
            "确定要退出骑手账号吗？"
        )
    ) {

        return;

    }


    localStorage.removeItem(
        "deliveryLogin"
    );

    localStorage.removeItem(
        "deliveryUsername"
    );

    localStorage.removeItem(
        "deliveryId"
    );


    window.location.href =
        "delivery-login.html";

}


/* =========================================================
   初始化
========================================================= */

async function init() {

    await loadRider();

    await loadOrders();


    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

    }


    refreshTimer =
        setInterval(
            async function() {

                await loadOrders();

            },
            10000
        );

}


init();


</script>
