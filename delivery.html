<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD - 骑手工作台</title>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f6f8;
    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;
    color: #222;
}

button,
input {
    font-family: inherit;
}

.topbar {
    background: #ff6b00;
    color: white;
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.rider-mini {
    text-align: right;
    font-size: 13px;
}

.logout-btn {
    margin-top: 5px;
    background: white;
    color: #ff6b00;
    border: none;
    border-radius: 8px;
    padding: 7px 11px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    width: 94%;
    max-width: 1100px;
    margin: 18px auto 40px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow:
        0 3px 14px rgba(0,0,0,0.06);
}

.profile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.profile-left {
    display: flex;
    align-items: center;
    gap: 13px;
}

.avatar {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: #fff1e7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

.profile-name {
    font-size: 19px;
    font-weight: bold;
}

.profile-info {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.online-btn {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    font-weight: bold;
    cursor: pointer;
}

.online {
    background: #e9f9ef;
    color: #159447;
}

.offline {
    background: #f1f1f1;
    color: #666;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.stat {
    background: #fafafa;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.stat-number {
    font-size: 24px;
    font-weight: bold;
    color: #ff6b00;
}

.stat-label {
    color: #777;
    font-size: 13px;
    margin-top: 5px;
}

.section-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 14px;
}

.order-card {
    border: 1px solid #eee;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 12px;
}

.order-card:last-child {
    margin-bottom: 0;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.order-number {
    font-weight: bold;
    font-size: 16px;
}

.status {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
}

.status-pending {
    background: #fff4e8;
    color: #f27b00;
}

.status-accepted {
    background: #eaf4ff;
    color: #1671d9;
}

.status-delivering {
    background: #eaf9ef;
    color: #168c45;
}

.status-completed {
    background: #eeeeee;
    color: #666;
}

.order-row {
    margin-top: 10px;
    line-height: 1.6;
    font-size: 14px;
}

.order-label {
    color: #888;
}

.order-items {
    background: #fafafa;
    padding: 10px;
    border-radius: 9px;
    margin-top: 10px;
    line-height: 1.7;
}

.order-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 13px;
}

.action-btn {
    border: none;
    border-radius: 9px;
    padding: 10px 14px;
    cursor: pointer;
    font-weight: bold;
}

.action-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.accept-btn {
    background: #ff6b00;
    color: white;
}

.start-btn {
    background: #1671d9;
    color: white;
}

.complete-btn {
    background: #159447;
    color: white;
}

.call-btn {
    background: #edf7ff;
    color: #1671d9;
}

.map-btn {
    background: #f3f3f3;
    color: #444;
}

.empty {
    text-align: center;
    color: #888;
    padding: 35px 10px;
}

.loading {
    text-align: center;
    color: #888;
    padding: 30px;
}

.message {
    display: none;
    padding: 12px;
    border-radius: 9px;
    margin-bottom: 15px;
    line-height: 1.5;
}

.error {
    background: #fff0f0;
    color: #d33;
}

.success {
    background: #edf9f1;
    color: #168a43;
}

.refresh-text {
    color: #999;
    font-size: 12px;
    text-align: right;
    margin-top: 8px;
}

.history-card {
    border-top: 1px solid #eee;
    padding: 13px 0;
}

.history-card:first-child {
    border-top: none;
}

.history-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.history-money {
    font-weight: bold;
    color: #ff6b00;
}

.online-tip {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #fafafa;
    color: #777;
    font-size: 13px;
    line-height: 1.5;
}

@media (max-width: 650px) {

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 7px;
    }

    .stat {
        padding: 12px 5px;
    }

    .stat-number {
        font-size: 19px;
    }

    .profile {
        flex-direction: column;
        align-items: flex-start;
    }

    .online-btn {
        width: 100%;
    }

    .order-header {
        align-items: flex-start;
    }

}

</style>

</head>


<body>


<div class="topbar">

    <div class="logo">
        🛵 MDY FOOD
    </div>

    <div class="rider-mini">

        <div id="topRiderName">
            骑手
        </div>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            退出登录
        </button>

    </div>

</div>


<div class="container">


    <div
        id="errorMessage"
        class="message error"
    ></div>


    <div
        id="successMessage"
        class="message success"
    ></div>


    <!-- 骑手资料 -->

    <div class="card">

        <div class="profile">

            <div class="profile-left">

                <div class="avatar">
                    🛵
                </div>

                <div>

                    <div
                        class="profile-name"
                        id="riderName"
                    >
                        骑手
                    </div>

                    <div
                        class="profile-info"
                        id="riderPhone"
                    >
                        电话：
                    </div>

                    <div
                        class="profile-info"
                        id="riderArea"
                    >
                        配送区域：
                    </div>

                </div>

            </div>


            <button
                id="onlineBtn"
                class="online-btn offline"
                onclick="toggleOnline()"
            >
                🔴 当前下线
            </button>

        </div>


        <div class="online-tip">

            💡 上线后可以看到并接受新的配送订单。
            <br>
            每个骑手同时只能配送一个订单。

        </div>

    </div>


    <!-- 数据统计 -->

    <div class="card">

        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="todayOrders"
                >
                    0
                </div>

                <div class="stat-label">
                    今日完成
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="todayAmount"
                >
                    0 Ks
                </div>

                <div class="stat-label">
                    今日订单金额
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="totalOrders"
                >
                    0
                </div>

                <div class="stat-label">
                    累计完成
                </div>

            </div>

        </div>

    </div>


    <!-- 当前订单 -->

    <div class="card">

        <div class="section-title">
            📦 当前配送订单
        </div>

        <div id="currentOrder">

            <div class="empty">
                当前没有配送订单
            </div>

        </div>

    </div>


    <!-- 可接订单 -->

    <div class="card">

        <div class="section-title">
            🔔 待配送订单
        </div>

        <div id="availableOrders">

            <div class="loading">
                正在读取订单...
            </div>

        </div>

        <div class="refresh-text">
            每 10 秒自动刷新
        </div>

    </div>


    <!-- 配送记录 -->

    <div class="card">

        <div class="section-title">
            📋 我的配送记录
        </div>

        <div id="historyOrders">

            <div class="loading">
                正在读取记录...
            </div>

        </div>

    </div>


</div>


<script>


/* =========================================================
   Firebase
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqxv5X7Q",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


/* =========================================================
   登录信息
========================================================= */

const deliveryLogin =
    localStorage.getItem(
        "deliveryLogin"
    );


const deliveryId =
    localStorage.getItem(
        "deliveryId"
    );


const deliveryUsername =
    localStorage.getItem(
        "deliveryUsername"
    );


if (
    deliveryLogin !== "true" ||
    !deliveryId
) {

    window.location.href =
        "delivery-login.html";

}


/* =========================================================
   全局变量
========================================================= */

let rider = null;

let availableOrders = [];

let currentOrder = null;

let historyOrders = [];

let refreshTimer = null;


/* =========================================================
   HTML 安全
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   金额
========================================================= */

function formatMoney(value) {

    const number =
        Number(value) || 0;

    return (
        number.toLocaleString("en-US")
        +
        " Ks"
    );

}


/* =========================================================
   日期
========================================================= */

function getDateValue(value) {

    if (!value) {
        return null;
    }

    if (
        value &&
        typeof value.toDate === "function"
    ) {

        return value.toDate();

    }

    const date =
        new Date(value);

    if (
        isNaN(
            date.getTime()
        )
    ) {

        return null;

    }

    return date;

}


function formatDate(value) {

    const date =
        getDateValue(value);

    if (!date) {
        return "-";
    }

    return date.toLocaleString(
        "zh-CN",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* =========================================================
   消息
========================================================= */

function showError(message) {

    const box =
        document.getElementById(
            "errorMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        4500
    );

}


function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );

    box.textContent =
        message;

    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        3500
    );

}


/* =========================================================
   订单状态
========================================================= */

function normalizeStatus(order) {

    return String(
        order.status || ""
    )
    .trim()
    .toLowerCase();

}


/*
 * 客户下单时：
 * status = 待接单
 *
 * 所以这里必须支持待接单。
 */

function isWaitingForDelivery(order) {

    const status =
        normalizeStatus(order);

    return (

        status === "待接单" ||

        status === "待配送" ||

        status === "pending" ||

        status === "new"

    );

}


function isOrderCompleted(order) {

    const status =
        normalizeStatus(order);

    return (

        status === "completed" ||

        status === "complete" ||

        status === "已完成" ||

        status === "配送完成"

    );

}


function isOrderDelivering(order) {

    const status =
        normalizeStatus(order);

    return (

        status === "delivering" ||

        status === "配送中"

    );

}


function isOrderAccepted(order) {

    const status =
        normalizeStatus(order);

    return (

        status === "accepted" ||

        status === "已接单"

    );

}


/* =========================================================
   判断是不是我的订单
========================================================= */

function getAssignedRiderId(order) {

    return String(

        order.deliveryId ||

        order.riderId ||

        order.driverId ||

        order.deliveryPersonId ||

        ""

    );

}


function isMine(order) {

    return (

        getAssignedRiderId(order) ===
        String(deliveryId)

    );

}


/* =========================================================
   骑手资料
========================================================= */

async function loadRider() {

    try {

        const doc =
            await db
                .collection("delivery")
                .doc(deliveryId)
                .get();


        if (!doc.exists) {

            showError(
                "骑手资料不存在，请重新登录。"
            );

            logout(false);

            return;

        }


        rider = {

            id: doc.id,

            ...doc.data()

        };


        document.getElementById(
            "riderName"
        ).textContent =

            rider.name ||

            rider.username ||

            deliveryUsername ||

            "骑手";


        document.getElementById(
            "topRiderName"
        ).textContent =

            rider.name ||

            rider.username ||

            deliveryUsername ||

            "骑手";


        document.getElementById(
            "riderPhone"
        ).textContent =

            "电话：" +

            (
                rider.phone ||
                "暂无"
            );


        document.getElementById(
            "riderArea"
        ).textContent =

            "配送区域：" +

            (
                rider.deliveryArea ||
                "暂无"
            );


        updateOnlineButton();

    }

    catch (error) {

        console.error(
            "读取骑手资料失败：",
            error
        );

        showError(
            "读取骑手资料失败：" +
            error.message
        );

    }

}


/* =========================================================
   在线状态
========================================================= */

function isRiderOnline() {

    if (!rider) {
        return false;
    }

    return rider.online === true;

}


function updateOnlineButton() {

    const button =
        document.getElementById(
            "onlineBtn"
        );


    if (isRiderOnline()) {

        button.className =
            "online-btn online";

        button.textContent =
            "🟢 当前在线";

    }

    else {

        button.className =
            "online-btn offline";

        button.textContent =
            "🔴 当前下线";

    }

}


/* =========================================================
   上线 / 下线
========================================================= */

async function toggleOnline() {

    if (!rider) {
        return;
    }


    /*
     * 如果当前正在配送订单，
     * 不允许直接下线。
     */

    if (
        isRiderOnline() &&
        currentOrder
    ) {

        showError(
            "你正在配送订单，完成当前订单后才能下线。"
        );

        return;

    }


    const nextOnline =
        !isRiderOnline();


    try {

        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                online:
                    nextOnline,

                available:
                    nextOnline,

                status:
                    nextOnline
                        ? "在线"
                        : "离线"

            });


        rider.online =
            nextOnline;

        rider.available =
            nextOnline;

        rider.status =
            nextOnline
                ? "在线"
                : "离线";


        updateOnlineButton();


        if (nextOnline) {

            showSuccess(
                "上线成功，现在可以接收配送订单。"
            );

        }

        else {

            showSuccess(
                "你已经下线。"
            );

        }


        renderAvailableOrders();

    }

    catch (error) {

        console.error(
            "修改在线状态失败：",
            error
        );

        showError(
            "修改在线状态失败：" +
            error.message
        );

    }

}


/* =========================================================
   读取订单
========================================================= */

async function loadOrders() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .get();


        const all = [];


        snapshot.forEach(
            function(doc) {

                all.push({

                    id: doc.id,

                    ...doc.data()

                });

            }
        );


        /*
         * 待接订单
         *
         * 必须：
         * 1. 没有骑手
         * 2. 状态是待接单
         */

        availableOrders =
            all.filter(
                function(order) {

                    const assigned =
                        getAssignedRiderId(
                            order
                        );


                    return (

                        !assigned &&

                        isWaitingForDelivery(
                            order
                        )

                    );

                }
            );


        /*
         * 当前骑手的全部订单
         */

        const myOrders =
            all.filter(
                function(order) {

                    return isMine(order);

                }
            );


        /*
         * 当前正在处理的订单
         */

        currentOrder =
            myOrders.find(
                function(order) {

                    return (
                        !isOrderCompleted(order)
                    );

                }
            ) || null;


        /*
         * 已完成历史
         */

        historyOrders =
            myOrders.filter(
                function(order) {

                    return isOrderCompleted(
                        order
                    );

                }
            );


        renderCurrentOrder();

        renderAvailableOrders();

        renderHistory();

        updateStats(
            historyOrders
        );

    }

    catch (error) {

        console.error(
            "读取订单失败：",
            error
        );

        showError(
            "读取订单失败：" +
            error.message
        );

    }

}


/* =========================================================
   当前订单
========================================================= */

function renderCurrentOrder() {

    const container =
        document.getElementById(
            "currentOrder"
        );


    if (!currentOrder) {

        container.innerHTML = `

            <div class="empty">

                🛵 当前没有正在配送的订单

                <br><br>

                ${
                    isRiderOnline()

                    ?

                    "你现在在线，可以接收新订单。"

                    :

                    "请先上线，然后接收订单。"

                }

            </div>

        `;

        return;

    }


    container.innerHTML =
        createOrderHtml(
            currentOrder,
            true
        );

}


/* =========================================================
   待接订单
========================================================= */

function renderAvailableOrders() {

    const container =
        document.getElementById(
            "availableOrders"
        );


    if (!isRiderOnline()) {

        container.innerHTML = `

            <div class="empty">

                🔴 你目前处于下线状态

                <br><br>

                请点击上方
                「当前下线」
                按钮上线后接收订单。

            </div>

        `;

        return;

    }


    if (currentOrder) {

        container.innerHTML = `

            <div class="empty">

                🚴 你正在配送一个订单

                <br><br>

                完成当前订单后才能继续接单。

            </div>

        `;

        return;

    }


    if (!availableOrders.length) {

        container.innerHTML = `

            <div class="empty">

                📦 暂时没有新的配送订单

            </div>

        `;

        return;

    }


    container.innerHTML =
        availableOrders
            .map(
                function(order) {

                    return createOrderHtml(
                        order,
                        false
                    );

                }
            )
            .join("");

}


/* =========================================================
   创建订单 HTML
========================================================= */

function createOrderHtml(
    order,
    mine
) {

    const status =
        normalizeStatus(order);


    let statusText =
        order.status ||
        "待接单";


    let statusClass =
        "status-pending";


    if (
        status === "accepted" ||
        status === "已接单"
    ) {

        statusText =
            "已接单";

        statusClass =
            "status-accepted";

    }


    if (
        status === "delivering" ||
        status === "配送中"
    ) {

        statusText =
            "配送中";

        statusClass =
            "status-delivering";

    }


    if (
        isOrderCompleted(order)
    ) {

        statusText =
            "已完成";

        statusClass =
            "status-completed";

    }


    let itemsHtml =
        "商品信息暂无";


    if (
        Array.isArray(order.items)
    ) {

        itemsHtml =
            order.items
                .map(
                    function(item) {

                        return (

                            escapeHtml(
                                item.name ||
                                item.title ||
                                "商品"
                            )

                            +

                            " × "

                            +

                            (
                                item.quantity ||
                                item.qty ||
                                1
                            )

                        );

                    }
                )
                .join("<br>");

    }


    const phone =
        order.phone ||
        order.customerPhone ||
        order.customer_phone ||
        "";


    const address =
        order.adress ||
        order.address ||
        order.deliveryAddress ||
        "";


    const restaurantName =
        order.restaurantName ||
        "未知商家";


    let buttons = "";


    if (!mine) {

        buttons += `

            <button
                class="action-btn accept-btn"
                onclick="acceptOrder('${order.id}')"
            >
                ✅ 接受订单
            </button>

        `;

    }

    else {

        if (
            isOrderAccepted(order)
        ) {

            buttons += `

                <button
                    class="action-btn start-btn"
                    onclick="startDelivery('${order.id}')"
                >
                    🚚 开始配送
                </button>

            `;

        }

        else if (
            isOrderDelivering(order)
        ) {

            buttons += `

                <button
                    class="action-btn complete-btn"
                    onclick="completeOrder('${order.id}')"
                >
                    ✅ 完成配送
                </button>

            `;

        }

    }


    if (phone) {

        buttons += `

            <button
                class="action-btn call-btn"
                onclick="callCustomer('${phone}')"
            >
                📞 联系客户
            </button>

        `;

    }


    if (address) {

        buttons += `

            <button
                class="action-btn map-btn"
                onclick="openMap('${address}')"
            >
                📍 导航
            </button>

        `;

    }


    return `

        <div class="order-card">

            <div class="order-header">

                <div class="order-number">

                    📦
                    ${escapeHtml(
                        order.order_number ||
                        order.id
                    )}

                </div>

                <span
                    class="status ${statusClass}"
                >

                    ${escapeHtml(
                        statusText
                    )}

                </span>

            </div>


            <div class="order-row">

                <span class="order-label">
                    🏪 商家：
                </span>

                <b>
                    ${escapeHtml(
                        restaurantName
                    )}
                </b>

            </div>


            <div class="order-row">

                <span class="order-label">
                    👤 客户：
                </span>

                ${escapeHtml(
                    order.customername ||
                    order.customerName ||
                    "未知"
                )}

            </div>


            <div class="order-row">

                <span class="order-label">
                    📞 客户电话：
                </span>

                ${escapeHtml(
                    phone ||
                    "暂无"
                )}

            </div>


            <div class="order-row">

                <span class="order-label">
                    📍 配送地址：
                </span>

                ${escapeHtml(
                    address ||
                    "暂无地址"
                )}

            </div>


            <div class="order-row">

                <span class="order-label">
                    💰 订单金额：
                </span>

                <b>
                    ${formatMoney(
                        order.total
                    )}
                </b>

            </div>


            <div class="order-items">

                <b>
                    🍱 商品：
                </b>

                <br>

                ${itemsHtml}

            </div>


            ${
                order.created_at

                ?

                `

                <div class="order-row">

                    <span class="order-label">
                        🕐 下单时间：
                    </span>

                    ${formatDate(
                        order.created_at
                    )}

                </div>

                `

                :

                ""

            }


            <div class="order-actions">

                ${buttons}

            </div>

        </div>

    `;

}


/* =========================================================
   接单
========================================================= */

async function acceptOrder(
    orderId
) {

    if (!isRiderOnline()) {

        showError(
            "请先上线后再接单。"
        );

        return;

    }


    if (currentOrder) {

        showError(
            "你已经有一个正在配送的订单。"
        );

        return;

    }


    if (
        !confirm(
            "确定要接受这个配送订单吗？"
        )
    ) {

        return;

    }


    try {

        const orderRef =
            db
                .collection("orders")
                .doc(orderId);


        await db.runTransaction(
            async function(transaction) {

                const snapshot =
                    await transaction.get(
                        orderRef
                    );


                if (!snapshot.exists) {

                    throw new Error(
                        "订单不存在。"
                    );

                }


                const order =
                    snapshot.data();


                /*
                 * 再次检查有没有其他骑手抢走
                 */

                const assigned =
                    getAssignedRiderId(
                        order
                    );


                if (assigned) {

                    throw new Error(
                        "这个订单已经被其他骑手接走了。"
                    );

                }


                /*
                 * 再次检查状态
                 */

                if (
                    !isWaitingForDelivery(
                        order
                    )
                ) {

                    throw new Error(
                        "这个订单当前已经不能接单。"
                    );

                }


                transaction.update(
                    orderRef,
                    {

                        deliveryId:
                            deliveryId,

                        riderId:
                            deliveryId,

                        deliveryName:
                            rider.name ||
                            deliveryUsername ||
                            "骑手",

                        deliveryPhone:
                            rider.phone ||
                            "",

                        status:
                            "accepted",

                        acceptedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp()

                    }
                );

            }
        );


        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                currentOrderId:
                    orderId,

                available:
                    false

            });


        showSuccess(
            "接单成功！"
        );


        await loadRider();

        await loadOrders();

    }

    catch (error) {

        console.error(
            "接单失败：",
            error
        );

        showError(
            "接单失败：" +
            error.message
        );

        await loadOrders();

    }

}


/* =========================================================
   开始配送
========================================================= */

async function startDelivery(
    orderId
) {

    if (!currentOrder) {

        showError(
            "当前没有正在处理的订单。"
        );

        return;

    }


    if (
        currentOrder.id !== orderId
    ) {

        showError(
            "订单状态已经发生变化，请刷新页面。"
        );

        return;

    }


    if (
        !isMine(currentOrder)
    ) {

        showError(
            "这个订单不属于当前骑手。"
        );

        return;

    }


    if (
        !confirm(
            "确定开始配送这个订单吗？"
        )
    ) {

        return;

    }


    try {

        await db
            .collection("orders")
            .doc(orderId)
            .update({

                status:
                    "delivering",

                deliveringAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                status:
                    "配送中",

                currentOrderId:
                    orderId,

                available:
                    false

            });


        showSuccess(
            "订单已经进入配送中。"
        );


        await loadRider();

        await loadOrders();

    }

    catch (error) {

        console.error(
            "开始配送失败：",
            error
        );

        showError(
            "开始配送失败：" +
            error.message
        );

    }

}


/* =========================================================
   完成配送
========================================================= */

async function completeOrder(
    orderId
) {

    if (
        !confirm(
            "确定客户已经收到订单，并完成配送吗？"
        )
    ) {

        return;

    }


    try {

        const orderRef =
            db
                .collection("orders")
                .doc(orderId);


        await db.runTransaction(
            async function(transaction) {

                const snapshot =
                    await transaction.get(
                        orderRef
                    );


                if (!snapshot.exists) {

                    throw new Error(
                        "订单不存在。"
                    );

                }


                const order =
                    snapshot.data();


                if (
                    !isMine(order)
                ) {

                    throw new Error(
                        "这个订单不属于当前骑手。"
                    );

                }


                if (
                    !isOrderDelivering(order)
                ) {

                    throw new Error(
                        "订单当前不是配送中状态。"
                    );

                }


                transaction.update(
                    orderRef,
                    {

                        status:
                            "completed",

                        completedAt:
                            firebase.firestore
                                .FieldValue
                                .serverTimestamp(),

                        deliveryCompletedBy:
                            deliveryId

                    }
                );

            }
        );


        await db
            .collection("delivery")
            .doc(deliveryId)
            .update({

                currentOrderId:
                    "",

                status:
                    "在线",

                online:
                    true,

                available:
                    true,

                lastCompletedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        showSuccess(
            "配送完成！订单已经完成。"
        );


        await loadRider();

        await loadOrders();

    }

    catch (error) {

        console.error(
            "完成配送失败：",
            error
        );

        showError(
            "完成配送失败：" +
            error.message
        );

    }

}


/* =========================================================
   统计
========================================================= */

function updateStats(
    orders
) {

    const now =
        new Date();


    const todayStart =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
            0,
            0,
            0,
            0
        );


    let todayCount = 0;

    let todayAmount = 0;


    orders.forEach(
        function(order) {

            const date =
                getDateValue(
                    order.completedAt ||
                    order.completed_at ||
                    order.created_at
                );


            const amount =
                Number(
                    order.total
                ) || 0;


            if (
                date &&
                date.getTime() >=
                todayStart.getTime()
            ) {

                todayCount++;

                todayAmount +=
                    amount;

            }

        }
    );


    document.getElementById(
        "todayOrders"
    ).textContent =
        todayCount;


    document.getElementById(
        "todayAmount"
    ).textContent =
        formatMoney(
            todayAmount
        );


    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;

}


/* =========================================================
   历史
========================================================= */

function renderHistory() {

    const container =
        document.getElementById(
            "historyOrders"
        );


    if (!historyOrders.length) {

        container.innerHTML = `

            <div class="empty">

                暂无配送记录

            </div>

        `;

        return;

    }


    const list =
        [...historyOrders]
            .sort(
                function(a, b) {

                    const da =
                        getDateValue(
                            a.completedAt ||
                            a.completed_at ||
                            a.created_at
                        );


                    const dbDate =
                        getDateValue(
                            b.completedAt ||
                            b.completed_at ||
                            b.created_at
                        );


                    return (

                        (
                            dbDate?.getTime() ||
                            0
                        )

                        -

                        (
                            da?.getTime() ||
                            0
                        )

                    );

                }
            )
            .slice(
                0,
                30
            );


    container.innerHTML =
        list
            .map(
                function(order) {

                    return `

                        <div
                            class="history-card"
                        >

                            <div
                                class="history-top"
                            >

                                <b>

                                    📦
                                    ${escapeHtml(
                                        order.order_number ||
                                        order.id
                                    )}

                                </b>

                                <span
                                    class="history-money"
                                >

                                    ${formatMoney(
                                        order.total
                                    )}

                                </span>

                            </div>


                            <div
                                class="order-row"
                            >

                                🏪
                                ${escapeHtml(
                                    order.restaurantName ||
                                    "未知商家"
                                )}

                            </div>


                            <div
                                class="order-row"
                            >

                                👤
                                ${escapeHtml(
                                    order.customername ||
                                    order.customerName ||
                                    "未知客户"
                                )}

                            </div>


                            <div
                                class="order-row"
                            >

                                📍
                                ${escapeHtml(
                                    order.adress ||
                                    order.address ||
                                    "暂无地址"
                                )}

                            </div>


                            <div
                                class="order-row"
                            >

                                🕐
                                ${formatDate(
                                    order.completedAt ||
                                    order.completed_at ||
                                    order.created_at
                                )}

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   联系客户
========================================================= */

function callCustomer(
    phone
) {

    if (!phone) {

        showError(
            "没有客户电话号码。"
        );

        return;

    }


    window.location.href =
        "tel:" +
        phone;

}


/* =========================================================
   地图
========================================================= */

function openMap(
    address
) {

    if (!address) {

        showError(
            "没有客户地址。"
        );

        return;

    }


    const url =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
            address
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   退出
========================================================= */

function logout(
    ask = true
) {

    if (
        ask &&
        !confirm(
            "确定要退出骑手账号吗？"
        )
    ) {

        return;

    }


    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

        refreshTimer =
            null;

    }


    localStorage.removeItem(
        "deliveryLogin"
    );

    localStorage.removeItem(
        "deliveryUsername"
    );

    localStorage.removeItem(
        "deliveryId"
    );

    localStorage.removeItem(
        "deliveryName"
    );

    localStorage.removeItem(
        "deliveryPhone"
    );

    localStorage.removeItem(
        "deliveryUid"
    );


    window.location.href =
        "delivery-login.html";

}


/* =========================================================
   初始化
========================================================= */

async function init() {

    await loadRider();

    await loadOrders();


    if (refreshTimer) {

        clearInterval(
            refreshTimer
        );

    }


    /*
     * 每 10 秒刷新一次订单。
     */

    refreshTimer =
        setInterval(
            async function() {

                await loadOrders();

            },
            10000
        );

}


init();


</script>
