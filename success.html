<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>订单成功 - MDY FOOD</title>

    <!-- MDY FOOD 共享语言系统 -->
    <script src="language.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;
        }

        .success-icon {
            font-size: 60px;
        }

        h1 {
            margin: 15px 0;
            color: #333;
        }

        .message {
            color: #666;
            line-height: 1.6;
        }

        .order-number {
            margin: 25px 0;
            padding: 18px;
            background: #fff3ed;
            border-radius: 10px;
        }

        .order-number span {
            display: block;
            color: #777;
            margin-bottom: 8px;
        }

        .order-number strong {
            font-size: 22px;
            color: #ff5a1f;
            word-break: break-all;
        }

        .button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff5a1f;
            color: white;
            font-size: 18px;
            text-decoration: none;
            cursor: pointer;
        }

        .button.secondary {
            background: #eee;
            color: #333;
        }

        @media (max-width: 500px) {

            .container {
                margin: 30px auto;
            }

            .box {
                padding: 30px 20px;
            }

            .success-icon {
                font-size: 55px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- ================================
         顶部
    ================================= -->

    <header>

        <strong>
            🍜 MDY FOOD
        </strong>

    </header>


    <!-- ================================
         成功内容
    ================================= -->

    <div class="container">

        <div class="box">


            <div class="success-icon">
                ✅
            </div>


            <h1
                data-i18n="orderSuccessTitle"
            >
                订单提交成功！
            </h1>


            <p class="message">

                <span
                    data-i18n="orderSuccessMessage"
                >
                    感谢你的订单！
                </span>

                <br>

                <span
                    data-i18n="orderSuccessPreparing"
                >
                    商家收到订单后会尽快准备。
                </span>

            </p>


            <!-- ================================
                 订单号
            ================================= -->

            <div class="order-number">

                <span
                    data-i18n="orderNumber"
                >
                    订单号
                </span>


                <strong id="orderNumber">
                    --
                </strong>

            </div>


            <!-- ================================
                 返回首页
            ================================= -->

            <a
                class="button"
                href="index.html"
                data-i18n="backHome"
            >
                返回首页
            </a>


            <!-- ================================
                 继续点餐
            ================================= -->

            <a
                class="button secondary"
                href="menu.html"
                data-i18n="continueOrdering"
            >
                继续点餐
            </a>


        </div>

    </div>


    <script>

        "use strict";


        /* =====================================================
           MDY FOOD - SUCCESS
           统一使用 language.js
        ===================================================== */


        /* ================================
           翻译
        ================================= */

        function t(
            key,
            fallback
        ){

            if(
                window.MDYLanguage &&
                typeof window.MDYLanguage.t ===
                "function"
            ){

                return window.MDYLanguage.t(
                    key,
                    {},
                    fallback || key
                );

            }


            return fallback || key;

        }


        /* ================================
           更新页面标题
        ================================= */

        function updateSuccessTitle(){

            document.title =
                t(
                    "orderSuccessTitle",
                    "订单提交成功！"
                ) +
                " - MDY FOOD";

        }


        /* ================================
           读取订单号
        ================================= */

        function loadLastOrder(){

            const orderNumberElement =
                document.getElementById(
                    "orderNumber"
                );


            if(!orderNumberElement){

                return;

            }


            let order = null;


            try{

                const savedOrder =
                    localStorage.getItem(
                        "lastOrder"
                    );


                if(savedOrder){

                    order =
                        JSON.parse(
                            savedOrder
                        );

                }

            }

            catch(error){

                console.error(
                    "读取最后订单失败：",
                    error
                );

            }


            if(order){

                orderNumberElement.innerText =
                    order.orderNumber ||
                    order.order_number ||
                    "--";

            }

            else{

                orderNumberElement.innerText =
                    "--";

            }

        }


        /* ================================
           页面语言刷新
        ================================= */

        function refreshLanguage(){

            updateSuccessTitle();

            /*
             * language.js 会自动处理
             * data-i18n 元素。
             *
             * 这里只负责动态内容。
             */

        }


        /* ================================
           监听语言切换
        ================================= */

        window.addEventListener(
            "mdyLanguageChanged",
            function(){

                refreshLanguage();

            }
        );


        /* ================================
           页面初始化
        ================================= */

        function initializePage(){

            loadLastOrder();

            refreshLanguage();

        }


        if(
            document.readyState ===
            "loading"
        ){

            document.addEventListener(
                "DOMContentLoaded",
                initializePage
            );

        }

        else{

            initializePage();

        }

    </script>


</body>

</html>
