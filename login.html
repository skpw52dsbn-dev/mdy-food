<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD - 登录</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff7ed 0%,
            #ffffff 48%,
            #f8fafc 100%
        );

    color: #1f2937;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px 16px;

    position: relative;
}

/* =========================
   语言选择器
========================= */

.language-box {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 100;
}

/* =========================
   登录卡片
========================= */

.login-card {
    width: 100%;
    max-width: 430px;

    background: rgba(255,255,255,0.97);

    border-radius: 24px;

    padding: 34px 28px 30px;

    box-shadow:
        0 20px 60px rgba(15,23,42,0.10),
        0 4px 18px rgba(15,23,42,0.05);
}

/* =========================
   品牌
========================= */

.brand {
    text-align: center;
    margin-bottom: 28px;
}

.brand-logo {
    width: 76px;
    height: 76px;

    margin: 0 auto 14px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #ff6b35,
            #ff8a4c
        );

    color: #ffffff;

    font-size: 38px;

    box-shadow:
        0 10px 24px rgba(255,107,53,0.25);
}

.brand-title {
    margin: 0;

    font-size: 28px;
    font-weight: 800;

    letter-spacing: 0.5px;

    color: #111827;
}

.brand-subtitle {
    margin-top: 6px;

    font-size: 13px;

    color: #9ca3af;

    letter-spacing: 0.5px;
}

/* =========================
   表单
========================= */

.form-group {
    margin-bottom: 17px;
}

.form-label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;
    font-weight: 600;

    color: #374151;
}

.input-wrap {
    position: relative;
}

.input {
    width: 100%;
    height: 52px;

    padding: 0 16px;

    border: 1px solid #e5e7eb;

    border-radius: 14px;

    outline: none;

    background: #f9fafb;

    color: #111827;

    transition:
        border-color 0.2s,
        background 0.2s,
        box-shadow 0.2s;
}

.input:focus {
    border-color: #ff6b35;

    background: #ffffff;

    box-shadow:
        0 0 0 4px rgba(255,107,53,0.10);
}

.input::placeholder {
    color: #b6bcc6;
}

/* =========================
   主按钮
========================= */

.login-button {
    width: 100%;
    height: 52px;

    margin-top: 4px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #ff6b35,
            #ff7f45
        );

    color: #ffffff;

    font-size: 16px;
    font-weight: 700;

    box-shadow:
        0 8px 20px rgba(255,107,53,0.22);

    transition:
        transform 0.15s,
        opacity 0.15s,
        box-shadow 0.15s;
}

.login-button:hover {
    box-shadow:
        0 10px 24px rgba(255,107,53,0.28);
}

.login-button:active {
    transform: scale(0.985);
}

.login-button:disabled {
    opacity: 0.65;

    cursor: not-allowed;

    box-shadow: none;
}

/* =========================
   分隔线
========================= */

.divider {
    display: flex;
    align-items: center;

    gap: 12px;

    margin: 22px 0;
}

.divider-line {
    flex: 1;

    height: 1px;

    background: #e5e7eb;
}

.divider-text {
    font-size: 13px;

    color: #9ca3af;
}

/* =========================
   Google
========================= */

.google-button {
    width: 100%;
    height: 50px;

    border:
        1px solid #e5e7eb;

    border-radius: 14px;

    background: #ffffff;

    color: #374151;

    font-size: 15px;
    font-weight: 600;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    transition:
        background 0.15s,
        border-color 0.15s;
}

.google-button:hover {
    background: #f9fafb;

    border-color: #d1d5db;
}

.google-icon {
    width: 20px;
    height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
}

/* =========================
   手机登录
========================= */

.phone-button {
    width: 100%;
    height: 50px;

    margin-top: 12px;

    border:
        1px solid #fed7aa;

    border-radius: 14px;

    background: #fff7ed;

    color: #ea580c;

    font-size: 15px;
    font-weight: 600;

    transition:
        background 0.15s;
}

.phone-button:hover {
    background: #ffedd5;
}

/* =========================
   注册
========================= */

.register-area {
    text-align: center;

    margin-top: 24px;

    font-size: 14px;

    color: #9ca3af;
}

.register-link {
    color: #f97316;

    font-weight: 700;

    text-decoration: none;

    margin-left: 4px;
}

.register-link:hover {
    text-decoration: underline;
}

/* =========================
   错误提示
========================= */

.message {
    display: none;

    margin-top: 15px;

    padding: 12px 14px;

    border-radius: 12px;

    font-size: 13px;

    line-height: 1.6;
}

.message.error {
    display: block;

    background: #fef2f2;

    border: 1px solid #fecaca;

    color: #b91c1c;
}

.message.success {
    display: block;

    background: #f0fdf4;

    border: 1px solid #bbf7d0;

    color: #15803d;
}

/* =========================
   手机登录区域
========================= */

.phone-login-panel {
    display: none;
}

.phone-login-panel.show {
    display: block;
}

.email-login-panel.hide {
    display: none;
}

.back-login-button {
    width: 100%;
    height: 46px;

    margin-top: 12px;

    border: none;

    background: transparent;

    color: #f97316;

    font-size: 14px;
    font-weight: 600;
}

.code-row {
    display: flex;

    gap: 10px;
}

.code-row .input {
    flex: 1;
}

.code-button {
    width: 125px;

    flex-shrink: 0;

    height: 52px;

    border: none;

    border-radius: 14px;

    background: #fff7ed;

    color: #ea580c;

    font-size: 13px;

    font-weight: 700;
}

.code-button:disabled {
    opacity: 0.5;

    cursor: not-allowed;
}

/* =========================
   reCAPTCHA
========================= */

#recaptcha-container {
    margin-top: 12px;

    display: flex;

    justify-content: center;
}

/* =========================
   底部
========================= */

.footer {
    margin-top: 24px;

    text-align: center;

    font-size: 11px;

    color: #c4c8ce;
}

/* =========================
   小屏幕
========================= */

@media (max-width: 480px) {

    .page {
        padding:
            70px 14px
            20px;
    }

    .login-card {
        padding:
            30px 20px
            26px;

        border-radius: 20px;
    }

    .brand-title {
        font-size: 25px;
    }

    .brand-logo {
        width: 68px;
        height: 68px;

        font-size: 34px;
    }

    .language-box {
        top: 12px;
        right: 12px;
    }

}

</style>

</head>

<body>

<div class="page">

    <div
        id="languageSelector"
        class="language-box"
    ></div>


    <div class="login-card">

        <div class="brand">

            <div class="brand-logo">
                🍜
            </div>

            <h1
                id="brandTitle"
                class="brand-title"
            >
                MDY FOOD
            </h1>

            <div
                id="brandSubtitle"
                class="brand-subtitle"
            >
                Mandalay Food Delivery
            </div>

        </div>


        <!-- =========================
             邮箱登录
        ========================== -->

        <div
            id="emailLoginPanel"
            class="email-login-panel"
        >

            <div class="form-group">

                <label
                    id="emailLabel"
                    class="form-label"
                >
                    邮箱
                </label>

                <input
                    id="email"
                    class="input"
                    type="email"
                    autocomplete="email"
                    placeholder="请输入邮箱"
                >

            </div>


            <div class="form-group">

                <label
                    id="passwordLabel"
                    class="form-label"
                >
                    密码
                </label>

                <input
                    id="password"
                    class="input"
                    type="password"
                    autocomplete="current-password"
                    placeholder="请输入密码"
                >

            </div>


            <button
                id="loginButton"
                class="login-button"
                type="button"
                onclick="login()"
            >
                登录
            </button>


            <div
                id="emailMessage"
                class="message"
            ></div>


            <div class="divider">

                <div class="divider-line"></div>

                <div
                    id="orText"
                    class="divider-text"
                >
                    或
                </div>

                <div class="divider-line"></div>

            </div>


            <button
                id="googleButton"
                class="google-button"
                type="button"
                onclick="googleLogin()"
            >

                <span class="google-icon">
                    G
                </span>

                <span id="googleText">
                    使用 Google 登录
                </span>

            </button>


            <button
                id="phoneButton"
                class="phone-button"
                type="button"
                onclick="showPhoneLogin()"
            >
                📱 使用手机号登录
            </button>

        </div>


        <!-- =========================
             手机登录
        ========================== -->

        <div
            id="phoneLoginPanel"
            class="phone-login-panel"
        >

            <div class="form-group">

                <label
                    id="phoneLabel"
                    class="form-label"
                >
                    手机号
                </label>

                <input
                    id="phoneNumber"
                    class="input"
                    type="tel"
                    autocomplete="tel"
                    placeholder="+95 9xxxxxxxxx"
                >

            </div>


            <div
                id="phoneHint"
                style="
                    margin-top:-8px;
                    margin-bottom:14px;
                    font-size:12px;
                    line-height:1.6;
                    color:#9ca3af;
                "
            >
                请输入国际格式手机号，例如 +959xxxxxxxxx
            </div>


            <div class="form-group">

                <div class="code-row">

                    <input
                        id="verificationCode"
                        class="input"
                        type="text"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="验证码"
                    >

                    <button
                        id="codeButton"
                        class="code-button"
                        type="button"
                        onclick="sendVerificationCode()"
                    >
                        获取验证码
                    </button>

                </div>

            </div>


            <div id="recaptcha-container"></div>


            <button
                id="phoneLoginButton"
                class="login-button"
                type="button"
                onclick="phoneLogin()"
            >
                手机号登录
            </button>


            <button
                id="backLoginButton"
                class="back-login-button"
                type="button"
                onclick="showEmailLogin()"
            >
                ← 返回邮箱登录
            </button>


            <div
                id="phoneMessage"
                class="message"
            ></div>

        </div>


        <!-- =========================
             注册
        ========================== -->

        <div class="register-area">

            <span id="noAccountText">
                还没有账户？
            </span>

            <a
                id="registerLink"
                class="register-link"
                href="register.html"
            >
                立即注册
            </a>

        </div>


        <div
            id="footerText"
            class="footer"
        >
            MDY FOOD · Mandalay Food Delivery
        </div>

    </div>

</div>


<!-- =========================
     Firebase
========================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<!-- =========================
     MDY FOOD Language
========================== -->

<script src="language.js"></script>


<script>

/* =========================================================
   Firebase 配置
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngcFhNfWPUlv0",

        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:

};


/* =========================================================
   Firebase 初始化

try {

/* =========================================================
   Firebase Auth
========================================================= */

const auth = firebase.auth();


/* =========================================================
   Firebase 实际配置检测
========================================================= */

try {

    const actualFirebaseConfig =
        firebase.app().options;

    console.log(
        "========== MDY FOOD Firebase 检测 =========="
    );

    console.log(
        "Firebase Project ID:",
        actualFirebaseConfig.projectId
    );

    console.log(
        "Firebase Auth Domain:",
        actualFirebaseConfig.authDomain
    );

    console.log(
        "Firebase API Key:",

    );

    console.log(
        "Firebase App ID:",
        actualFirebaseConfig.appId
    );

    console.log(
        "Firebase Auth:",
        auth
    );

    console.log(
        "============================================"
    );

} catch (error) {

    console.error(
        "Firebase 配置检测失败:",
        error
    );

}


/* =========================================================
   全局变量
========================================================= */

let confirmationResult = null;

let recaptchaVerifier = null;

let countdownTimer = null;


/* =========================================================
   翻译函数
========================================================= */

function t(key, fallback) {

    try {

        if (
            window.MDYLanguage &&
            typeof window.MDYLanguage.t === "function"
        ) {

            return window.MDYLanguage.t(
                key,
                {},
                fallback
            );

        }

    } catch (error) {

        console.warn(
            "语言翻译读取失败:",
            error
        );

    }

    return fallback || key;

}


/* =========================================================
   当前语言
========================================================= */

function getCurrentLanguage() {

    try {

        if (
            window.MDYLanguage &&
            typeof window.MDYLanguage.getLanguage === "function"
        ) {

            return window.MDYLanguage.getLanguage();

        }

    } catch (error) {

        console.warn(
            "读取当前语言失败:",
            error
        );

    }

    return "zh";

}


/* =========================================================
   页面语言
========================================================= */

function renderLoginLanguage() {

    const lang =
        getCurrentLanguage();


    document.documentElement.lang =
        lang === "my"
            ? "my"
            : lang === "en"
                ? "en"
                : "zh-CN";


    document.title =
        t(
            "loginPageTitle",
            "MDY FOOD - 登录"
        );


    document.getElementById(
        "brandTitle"
    ).textContent =
        t(
            "brandName",
            "MDY FOOD"
        );


    document.getElementById(
        "brandSubtitle"
    ).textContent =
        t(
            "brandSubtitle",
            "Mandalay Food Delivery"
        );


    document.getElementById(
        "emailLabel"
    ).textContent =
        t(
            "email",
            "邮箱"
        );


    document.getElementById(
        "email"
    ).placeholder =
        t(
            "emailPlaceholder",
            "请输入邮箱"
        );


    document.getElementById(
        "passwordLabel"
    ).textContent =
        t(
            "password",
            "密码"
        );


    document.getElementById(
        "password"
    ).placeholder =
        t(
            "passwordPlaceholder",
            "请输入密码"
        );


    document.getElementById(
        "loginButton"
    ).textContent =
        t(
            "loginButton",
            "登录"
        );


    document.getElementById(
        "orText"
    ).textContent =
        t(
            "or",
            "或"
        );


    document.getElementById(
        "googleText"
    ).textContent =
        t(
            "googleLogin",
            "使用 Google 登录"
        );


    document.getElementById(
        "phoneButton"
    ).textContent =
        "📱 " +
        t(
            "phoneLogin",
            "使用手机号登录"
        );


    document.getElementById(
        "phoneLabel"
    ).textContent =
        t(
            "phoneInternationalPlaceholder",
            "手机号"
        );


    document.getElementById(
        "phoneNumber"
    ).placeholder =
        t(
            "phoneInternationalPlaceholder",
            "+95 9xxxxxxxxx"
        );


    document.getElementById(
        "phoneHint"
    ).textContent =
        t(
            "phoneInternationalHint",
            "请输入国际格式手机号，例如 +959xxxxxxxxx"
        );


    document.getElementById(
        "verificationCode"
    ).placeholder =
        t(
            "verificationCode",
            "验证码"
        );


    document.getElementById(
        "codeButton"
    ).textContent =
        t(
            "getVerificationCode",
            "获取验证码"
        );


    document.getElementById(
        "phoneLoginButton"
    ).textContent =
        t(
            "phoneLoginButton",
            "手机号登录"
        );


    document.getElementById(
        "backLoginButton"
    ).textContent =
        "← " +
        t(
            "backToLoginMethods",
            "返回邮箱登录"
        );


    document.getElementById(
        "noAccountText"
    ).textContent =
        t(
            "noAccount",
            "还没有账户？"
        );


    document.getElementById(
        "registerLink"
    ).textContent =
        t(
            "registerNow",
            "立即注册"
        );


    document.getElementById(
        "footerText"
    ).textContent =
        "MDY FOOD · Mandalay Food Delivery";

}


/* =========================================================
   显示消息
========================================================= */

function showMessage(
    elementId,
    message,
    type = "error"
) {

    const element =
        document.getElementById(
            elementId
        );


    if (!element) {
        return;
    }


    element.textContent =
        message;


    element.className =
        "message " +
        type;

}


/* =========================================================
   清除消息
========================================================= */

function clearMessage(
    elementId
) {

    const element =
        document.getElementById(
            elementId
        );


    if (!element) {
        return;
    }


    element.textContent =
        "";

    element.className =
        "message";

}


/* =========================================================
   Firebase 错误翻译
========================================================= */

function getFirebaseErrorMessage(
    error
) {

    if (!error) {

        return t(
            "loginFailed",
            "登录失败"
        );

    }


    console.error(
        "Firebase 登录错误:",
        error
    );


    const code =
        error.code || "";


    switch (code) {

        case "auth/invalid-api-key":

        case "auth/api-key-not-valid":

            return t(
                "firebaseApiKeyInvalid",
                "Firebase API Key 无效，请检查 Firebase 配置。"
            );


        case "auth/invalid-email":

            return t(
                "invalidEmail",
                "邮箱格式不正确"
            );


        case "auth/invalid-credential":

        case "auth/user-not-found":

        case "auth/wrong-password":

            return t(
                "emailOrPasswordWrong",
                "邮箱或密码错误"
            );


        case "auth/user-disabled":

            return getCurrentLanguage() === "my"

                ? "ဤအကောင့်ကို ပိတ်ထားပါသည်။"

                : getCurrentLanguage() === "en"

                    ? "This account has been disabled."

                    : "此账号已被禁用";


        case "auth/too-many-requests":

            return getCurrentLanguage() === "my"

                ? "ကြိုးစားမှုများလွန်းပါသည်။ ခဏစောင့်ပြီး ထပ်မံကြိုးစားပါ။"

                : getCurrentLanguage() === "en"

                    ? "Too many attempts. Please try again later."

                    : "尝试次数过多，请稍后再试";


        case "auth/network-request-failed":

            return t(
                "networkConnectionFailed",
                "网络连接失败，请检查网络后重试"
            );


        case "auth/operation-not-allowed":

            return getCurrentLanguage() === "my"

                ? "Firebase Authentication တွင် ဤဝင်ရောက်နည်းကို ဖွင့်ထားခြင်းမရှိပါ။"

                : getCurrentLanguage() === "en"

                    ? "This sign-in method is not enabled in Firebase Authentication."

                    : "Firebase Authentication 尚未启用此登录方式";


        case "auth/popup-blocked":

            return getCurrentLanguage() === "my"

                ? "Browser သည် popup ကို ပိတ်ထားပါသည်။"

                : getCurrentLanguage() === "en"

                    ? "The browser blocked the sign-in popup."

                    : "浏览器阻止了登录弹窗";


        case "auth/popup-closed-by-user":

            return getCurrentLanguage() === "my"

                ? "ဝင်ရောက်ရန် popup ကို ပိတ်လိုက်ပါသည်။"

                : getCurrentLanguage() === "en"

                    ? "The sign-in popup was closed."

                    : "登录窗口已关闭";


        case "auth/invalid-verification-code":

            return t(
                "verificationCodeInvalid",
                "验证码错误"
            );


        case "auth/code-expired":

            return getCurrentLanguage() === "my"

                ? "အတည်ပြုကုဒ် သက်တမ်းကုန်သွားပါပြီ။"

                : getCurrentLanguage() === "en"

                    ? "The verification code has expired."

                    : "验证码已过期";


        default:

            return (
                t(
                    "loginFailed",
                    "登录失败"
                ) +
                " (" +
                (
                    error.message ||
                    code ||
                    "Unknown error"
                ) +
                ")"
            );

    }

}


/* =========================================================
   LOCAL 持久化
========================================================= */

async function setLocalPersistence() {

    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );

        return true;

    } catch (error) {

        console.error(
            "Firebase Auth Persistence 设置失败:",
            error
        );

        return false;

    }

}


/* =========================================================
   邮箱登录
========================================================= */

async function login() {

    clearMessage(
        "emailMessage"
    );


    const email =
        document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("password")
            .value;


    if (!email || !password) {

        showMessage(
            "emailMessage",
            t(
                "pleaseEnterEmailPassword",
                "请输入邮箱和密码"
            )
        );

        return;

    }


    const button =
        document.getElementById(
            "loginButton"
        );


    button.disabled =
        true;


    button.textContent =
        t(
            "loggingIn",
            "正在登录..."
        );


    try {

        await setLocalPersistence();


        const credential =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        if (
            !credential ||
            !credential.user
        ) {

            throw new Error(
                "Firebase 登录成功，但没有返回用户。"
            );

        }


        console.log(
            "登录成功:",
            credential.user.uid
        );


        showMessage(
            "emailMessage",

            t(
                "loginSuccess",
                "登录成功"
            ),

            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            300
        );


    } catch (error) {

        const message =
            getFirebaseErrorMessage(
                error
            );


        showMessage(
            "emailMessage",
            message
        );


        button.disabled =
            false;


        button.textContent =
            t(
                "loginButton",
                "登录"
            );

    }

}


/* =========================================================
   Google 登录
========================================================= */

async function googleLogin() {

    clearMessage(
        "emailMessage"
    );


    const button =
        document.getElementById(
            "googleButton"
        );


    button.disabled =
        true;


    const textElement =
        document.getElementById(
            "googleText"
        );


    const originalText =
        textElement.textContent;


    textElement.textContent =
        t(
            "loggingIn",
            "正在登录..."
        );


    try {

        await setLocalPersistence();


        const provider =
            new firebase.auth.GoogleAuthProvider();


        provider.setCustomParameters({
            prompt: "select_account"
        });


        const result =
            await auth.signInWithPopup(
                provider
            );


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "Google 登录没有返回用户。"
            );

        }


        console.log(
            "Google 登录成功:",
            result.user.uid
        );


        window.location.replace(
            "index.html"
        );


    } catch (error) {

        console.error(
            "Google 登录失败:",
            error
        );


        if (
            error.code ===
            "auth/popup-blocked"
        ) {

            try {

                const provider =
                    new firebase.auth.GoogleAuthProvider();


                provider.setCustomParameters({
                    prompt: "select_account"
                });


                await auth.signInWithRedirect(
                    provider
                );


                return;

            } catch (redirectError) {

                showMessage(
                    "emailMessage",
                    getFirebaseErrorMessage(
                        redirectError
                    )
                );

            }

        } else {

            showMessage(
                "emailMessage",
                getFirebaseErrorMessage(
                    error
                )
            );

        }


        button.disabled =
            false;


        textElement.textContent =
            originalText;

    }

}


/* =========================================================
   显示手机号登录
========================================================= */

function showPhoneLogin() {

    clearMessage(
        "emailMessage"
    );

    clearMessage(
        "phoneMessage"
    );


    document
        .getElementById(
            "emailLoginPanel"
        )
        .classList
        .add("hide");


    document
        .getElementById(
            "phoneLoginPanel"
        )
        .classList
        .add("show");


    createRecaptcha();

}


/* =========================================================
   返回邮箱登录
========================================================= */

function showEmailLogin() {

    clearMessage(
        "phoneMessage"
    );


    document
        .getElementById(
            "phoneLoginPanel"
        )
        .classList
        .remove("show");


    document
        .getElementById(
            "emailLoginPanel"
        )
        .classList
        .remove("hide");

}


/* =========================================================
   创建 reCAPTCHA
========================================================= */

function createRecaptcha() {

    try {

        if (recaptchaVerifier) {
            return;
        }


        recaptchaVerifier =
            new firebase.auth.RecaptchaVerifier(
                "recaptcha-container",
                {

                    size:
                        "normal",

                    callback:
                        function() {

                            console.log(
                                "reCAPTCHA 验证成功"
                            );

                        },

                    "expired-callback":
                        function() {

                            console.log(
                                "reCAPTCHA 已过期"
                            );

                        }

                }
            );


        recaptchaVerifier
            .render()
            .catch(
                function(error) {

                    console.error(
                        "reCAPTCHA 加载失败:",
                        error
                    );

                }
            );


    } catch (error) {

        console.error(
            "创建 reCAPTCHA 失败:",
            error
        );

    }

}


/* =========================================================
   获取验证码
========================================================= */

async function sendVerificationCode() {

    clearMessage(
        "phoneMessage"
    );


    const phoneNumber =
        document
            .getElementById(
                "phoneNumber"
            )
            .value
            .trim();


    if (!phoneNumber) {

        showMessage(
            "phoneMessage",
            t(
                "phoneInternationalRequired",
                "请输入国际格式手机号"
            )
        );

        return;

    }


    if (
        !phoneNumber.startsWith("+")
    ) {

        showMessage(
            "phoneMessage",
            t(
                "phoneInternationalRequired",
                "请输入国际格式手机号"
            )
        );

        return;

    }


    const button =
        document.getElementById(
            "codeButton"
        );


    button.disabled =
        true;


    button.textContent =
        t(
            "sendingCode",
            "发送中..."
        );


    try {

        await setLocalPersistence();


        createRecaptcha();


        if (!recaptchaVerifier) {

            throw new Error(
                "reCAPTCHA 初始化失败"
            );

        }


        confirmationResult =
            await auth.signInWithPhoneNumber(
                phoneNumber,
                recaptchaVerifier
            );


        showMessage(
            "phoneMessage",

            t(
                "verificationCodeSent",
                "验证码已发送"
            ),

            "success"
        );


        startCodeCountdown();


    } catch (error) {

        console.error(
            "发送验证码失败:",
            error
        );


        showMessage(
            "phoneMessage",
            getFirebaseErrorMessage(
                error
            )
        );


        button.disabled =
            false;


        button.textContent =
            t(
                "getVerificationCode",
                "获取验证码"
            );


        resetRecaptcha();

    }

}


/* =========================================================
   验证码倒计时
========================================================= */

function startCodeCountdown() {

    const button =
        document.getElementById(
            "codeButton"
        );


    let seconds =
        60;


    button.disabled =
        true;


    button.textContent =
        seconds + "s";


    clearInterval(
        countdownTimer
    );


    countdownTimer =
        setInterval(
            function() {

                seconds--;


                if (seconds <= 0) {

                    clearInterval(
                        countdownTimer
                    );


                    button.disabled =
                        false;


                    button.textContent =
                        t(
                            "getVerificationCode",
                            "获取验证码"
                        );


                    return;

                }


                button.textContent =
                    seconds + "s";

            },
            1000
        );

}


/* =========================================================
   手机号登录
========================================================= */

async function phoneLogin() {

    clearMessage(
        "phoneMessage"
    );


    const code =
        document
            .getElementById(
                "verificationCode"
            )
            .value
            .trim();


    if (!confirmationResult) {

        showMessage(
            "phoneMessage",
            t(
                "getCodeFirst",
                "请先获取验证码"
            )
        );

        return;

    }


    if (!code) {

        showMessage(
            "phoneMessage",
            t(
                "enterVerificationCode",
                "请输入验证码"
            )
        );

        return;

    }


    const button =
        document.getElementById(
            "phoneLoginButton"
        );


    button.disabled =
        true;


    button.textContent =
        t(
            "loggingIn",
            "正在登录..."
        );


    try {

        const result =
            await confirmationResult.confirm(
                code
            );


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "手机号登录没有返回用户。"
            );

        }


        console.log(
            "手机号登录成功:",
            result.user.uid
        );


        showMessage(
            "phoneMessage",

            t(
                "loginSuccess",
                "登录成功"
            ),

            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            300
        );


    } catch (error) {

        console.error(
            "手机号登录失败:",
            error
        );


        showMessage(
            "phoneMessage",
            getFirebaseErrorMessage(
                error
            )
        );


        button.disabled =
            false;


        button.textContent =
            t(
                "phoneLoginButton",
                "手机号登录"
            );

    }

}


/* =========================================================
   重置 reCAPTCHA
========================================================= */

function resetRecaptcha() {

    try {

        if (recaptchaVerifier) {

            recaptchaVerifier.clear();

        }

    } catch (error) {

        console.warn(
            "清理 reCAPTCHA 失败:",
            error
        );

    }


    recaptchaVerifier =
        null;


    const container =
        document.getElementById(
            "recaptcha-container"
        );


    if (container) {

        container.innerHTML =
            "";

    }

}


/* =========================================================
   Firebase Auth 状态
========================================================= */

auth.onAuthStateChanged(
    function(user) {

        if (user) {

            console.log(
                "Firebase Auth 状态：已登录",
                user.uid,
                user.email ||
                user.phoneNumber ||
                ""
            );

        } else {

            console.log(
                "Firebase Auth 状态：未登录"
            );

        }

    }
);


/* =========================================================
   语言选择器
========================================================= */

function renderLanguageSelector() {

    try {

        if (
            window.MDYLanguage &&
            typeof window.MDYLanguage.renderLanguageSelector ===
                "function"
        ) {

            window.MDYLanguage.renderLanguageSelector(
                "languageSelector"
            );

        }

    } catch (error) {

        console.warn(
            "语言选择器加载失败:",
            error
        );

    }

}


/* =========================================================
   语言切换
========================================================= */

window.addEventListener(
    "mdyLanguageChanged",
    function() {

        renderLoginLanguage();

        renderLanguageSelector();

    }
);


/* =========================================================
   Enter 登录
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !document
                .getElementById(
                    "phoneLoginPanel"
                )
                .classList
                .contains("show")
        ) {

            login();

        }

    }
);


/* =========================================================
   页面启动
========================================================= */

async function initLoginPage() {

    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );

        console.log(
            "Firebase Auth Persistence: LOCAL"
        );

    } catch (error) {

        console.error(
            "Firebase Auth Persistence 设置失败:",
            error
        );

    }


    renderLoginLanguage();

    renderLanguageSelector();

}


/* =========================================================
   启动
========================================================= */

initLoginPage();

</script>
