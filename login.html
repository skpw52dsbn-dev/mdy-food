<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MDY FOOD - 登录</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="language.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff7f2,
            #fff
        );

    color: #222;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px 15px;
}

.login-container {
    width: 100%;
    max-width: 430px;
}

.header {
    text-align: center;
    margin-bottom: 22px;
}

.logo {
    width: 76px;
    height: 76px;

    margin: 0 auto 15px;

    border-radius: 24px;

    background:
        linear-gradient(
            135deg,
            #ff6a2a,
            #ff4d1f
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;

    box-shadow:
        0 10px 30px
        rgba(255,90,31,.22);
}

.title {
    margin: 0;

    font-size: 28px;
    font-weight: 800;
}

.subtitle {
    margin-top: 7px;

    color: #999;

    font-size: 13px;
}

.language-box {
    display: flex;
    justify-content: center;

    margin-bottom: 15px;
}

.login-card {
    background: white;

    border-radius: 22px;

    padding: 25px 22px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.08);
}

.method-title {
    font-size: 19px;
    font-weight: 800;

    margin-bottom: 18px;
}

.input-group {
    margin-bottom: 14px;
}

.input-label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    color: #555;

    font-weight: 600;
}

.input {
    width: 100%;

    height: 48px;

    border: 1px solid #e4e4e4;

    border-radius: 11px;

    padding: 0 14px;

    font-size: 14px;

    outline: none;

    background: #fafafa;

    transition:
        border-color .2s,
        box-shadow .2s;
}

.input:focus {
    border-color: #ff5a1f;

    box-shadow:
        0 0 0 3px
        rgba(255,90,31,.08);

    background: #fff;
}

.primary-button {
    width: 100%;

    height: 48px;

    border: none;

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #ff6a2a,
            #ff4d1f
        );

    color: white;

    font-size: 15px;

    font-weight: 700;

    margin-top: 5px;
}

.primary-button:disabled {
    opacity: .65;

    cursor: wait;
}

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 20px 0;

    color: #aaa;

    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";

    flex: 1;

    height: 1px;

    background: #eee;
}

.secondary-button {
    width: 100%;

    height: 46px;

    border:
        1px solid #e5e5e5;

    border-radius: 11px;

    background: white;

    color: #333;

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 10px;
}

.secondary-button:hover {
    background: #fafafa;
}

.phone-button {
    width: 100%;

    height: 46px;

    border: none;

    border-radius: 11px;

    background: #f7f7f7;

    color: #333;

    font-size: 14px;

    font-weight: 600;
}

.bottom-text {
    text-align: center;

    margin-top: 20px;

    color: #888;

    font-size: 13px;
}

.bottom-text a {
    color: #ff5a1f;

    text-decoration: none;

    font-weight: 700;
}

.phone-login {
    display: none;
}

.phone-row {
    display: flex;

    gap: 8px;
}

.phone-row .input {
    flex: 1;
}

.code-button {
    flex-shrink: 0;

    width: 115px;

    border: none;

    border-radius: 11px;

    background: #fff0ea;

    color: #ff5a1f;

    font-size: 12px;

    font-weight: 700;
}

.code-button:disabled {
    opacity: .55;
}

.back-method-button {
    width: 100%;

    margin-top: 12px;

    border: none;

    background: transparent;

    color: #888;

    font-size: 13px;
}

.message {
    display: none;

    margin-bottom: 14px;

    padding: 11px 13px;

    border-radius: 10px;

    font-size: 13px;

    line-height: 1.5;
}

.message.show {
    display: block;
}

.message.error {
    background: #fff1f1;

    color: #d93025;
}

.message.success {
    background: #effaf2;

    color: #218739;
}

.recaptcha-wrap {
    margin-top: 10px;
}

@media (max-width: 500px) {

    .page {
        align-items: flex-start;

        padding-top: 30px;
    }

    .logo {
        width: 68px;
        height: 68px;

        font-size: 34px;
    }

    .title {
        font-size: 25px;
    }

    .login-card {
        padding: 22px 18px;
    }

}

</style>

</head>


<body>

<div class="page">

<div class="login-container">


<div class="header">

    <div class="logo">
        🍜
    </div>

    <h1
        class="title"
        data-i18n="loginPageTitle"
    >
        登录
    </h1>

    <div
        class="subtitle"
        data-i18n="brandSubtitle"
    >
        美味就在身边
    </div>

</div>


<div
    id="languageSelector"
    class="language-box"
></div>


<div class="login-card">


<div
    id="message"
    class="message"
></div>


<!-- 邮箱登录 -->

<div id="emailLoginSection">

    <div
        class="method-title"
        data-i18n="loginButton"
    >
        邮箱登录
    </div>


    <div class="input-group">

        <label
            class="input-label"
            data-i18n="email"
        >
            邮箱
        </label>

        <input
            id="email"
            class="input"
            type="email"
            autocomplete="email"
            data-i18n-placeholder="emailPlaceholder"
            placeholder="请输入邮箱"
        >

    </div>


    <div class="input-group">

        <label
            class="input-label"
            data-i18n="password"
        >
            密码
        </label>

        <input
            id="password"
            class="input"
            type="password"
            autocomplete="current-password"
            data-i18n-placeholder="passwordPlaceholder"
            placeholder="请输入密码"
        >

    </div>


    <button
        id="emailLoginButton"
        class="primary-button"
        type="button"
        onclick="emailLogin()"
        data-i18n="loginButton"
    >
        登录
    </button>


    <div class="divider">
        <span data-i18n="or">
            或
        </span>
    </div>


    <button
        class="secondary-button"
        type="button"
        onclick="googleLogin()"
        data-i18n="googleLogin"
    >
        使用 Google 登录
    </button>


    <button
        class="phone-button"
        type="button"
        onclick="showPhoneLogin()"
        data-i18n="phoneLogin"
    >
        📱 使用手机号登录
    </button>


    <div class="bottom-text">

        <span data-i18n="noAccount">
            还没有账户？
        </span>

        <a
            href="register.html"
            data-i18n="registerNow"
        >
            立即注册
        </a>

    </div>

</div>


<!-- 手机号登录 -->

<div
    id="phoneLoginSection"
    class="phone-login"
>

    <div
        class="method-title"
        data-i18n="phoneLogin"
    >
        手机号登录
    </div>


    <div class="input-group">

        <label
            class="input-label"
            data-i18n="phoneInternationalPlaceholder"
        >
            国际手机号
        </label>


        <div class="phone-row">

            <input
                id="phoneNumber"
                class="input"
                type="tel"
                autocomplete="tel"
                data-i18n-placeholder="phoneInternationalPlaceholder"
                placeholder="+959xxxxxxxxx"
            >


            <button
                id="sendCodeButton"
                class="code-button"
                type="button"
                onclick="sendVerificationCode()"
                data-i18n="getVerificationCode"
            >
                获取验证码
            </button>

        </div>


        <div
            style="
                margin-top:7px;
                color:#aaa;
                font-size:11px;
                line-height:1.5;
            "
            data-i18n="phoneInternationalHint"
        >
            请使用国际格式，例如 +959xxxxxxxxx
        </div>

    </div>


    <div class="input-group">

        <label
            class="input-label"
            data-i18n="verificationCode"
        >
            验证码
        </label>

        <input
            id="verificationCode"
            class="input"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            data-i18n-placeholder="verificationCode"
            placeholder="请输入验证码"
        >

    </div>


    <button
        id="phoneLoginButton"
        class="primary-button"
        type="button"
        onclick="verifyPhoneCode()"
        data-i18n="phoneLoginButton"
    >
        登录
    </button>


    <button
        class="back-method-button"
        type="button"
        onclick="showEmailLogin()"
        data-i18n="backToLoginMethods"
    >
        ← 返回邮箱登录
    </button>


</div>


<div
    id="recaptcha-container"
    class="recaptcha-wrap"
></div>


</div>


</div>

</div>


<script>

/* =========================================================
   Firebase
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngcFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();



/* =========================================================
   翻译
========================================================= */

function t(
    key,
    fallback
) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
            "function"
    ) {

        return window.MDYLanguage.t(
            key,
            {},
            fallback
        );

    }

    return fallback || key;

}


function applyPageTranslations() {

    document
        .querySelectorAll(
            "[data-i18n]"
        )
        .forEach(
            function(element) {

                const key =
                    element.dataset.i18n;

                const translated =
                    t(
                        key,
                        element.innerText
                    );

                element.innerText =
                    translated;

            }
        );


    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(
            function(element) {

                const key =
                    element.dataset.i18nPlaceholder;

                const translated =
                    t(
                        key,
                        element.placeholder
                    );

                element.placeholder =
                    translated;

            }
        );


    document.title =
        "MDY FOOD - " +
        t(
            "loginPageTitle",
            "登录"
        );

}



/* =========================================================
   Firebase Auth 持久化
========================================================= */

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.catch(
    function(error) {

        console.error(
            "设置登录持久化失败:",
            error
        );

    }
);



/* =========================================================
   页面元素
========================================================= */

const messageElement =
    document.getElementById(
        "message"
    );


function showMessage(
    message,
    type
) {

    messageElement.innerText =
        message;

    messageElement.className =
        "message show " +
        (
            type || "error"
        );

}


function hideMessage() {

    messageElement.className =
        "message";

    messageElement.innerText =
        "";

}



/* =========================================================
   邮箱登录
========================================================= */

async function emailLogin() {

    hideMessage();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if (
        !email ||
        !password
    ) {

        showMessage(
            t(
                "pleaseEnterEmailPassword",
                "请输入邮箱和密码"
            ),
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "emailLoginButton"
        );


    button.disabled =
        true;

    button.innerText =
        t(
            "loggingIn",
            "正在登录..."
        );


    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        const result =
            await auth
                .signInWithEmailAndPassword(
                    email,
                    password
                );


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "LOGIN_USER_EMPTY"
            );

        }


        console.log(
            "登录成功:",
            result.user.uid
        );


        showMessage(
            t(
                "loginSuccess",
                "登录成功"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            300
        );


    } catch (error) {

        console.error(
            "邮箱登录失败:",
            error
        );


        let errorMessage =
            t(
                "loginFailed",
                "登录失败，请稍后再试"
            );


        if (
            error &&
            error.code
        ) {

            switch (
                error.code
            ) {

                case
                    "auth/user-not-found":

                    errorMessage =
                        t(
                            "emailNotRegistered",
                            "该邮箱尚未注册"
                        );

                    break;


                case
                    "auth/wrong-password":

                    errorMessage =
                        t(
                            "wrongPassword",
                            "密码错误"
                        );

                    break;


                case
                    "auth/invalid-credential":

                    errorMessage =
                        t(
                            "emailOrPasswordWrong",
                            "邮箱或密码错误"
                        );

                    break;


                case
                    "auth/invalid-email":

                    errorMessage =
                        t(
                            "invalidEmail",
                            "邮箱格式不正确"
                        );

                    break;


                case
                    "auth/network-request-failed":

                    errorMessage =
                        t(
                            "networkConnectionFailed",
                            "网络连接失败"
                        );

                    break;

            }

        }


        showMessage(
            errorMessage,
            "error"
        );


        button.disabled =
            false;

        button.innerText =
            t(
                "loginButton",
                "登录"
            );

    }

}



/* =========================================================
   Google 登录
========================================================= */

async function googleLogin() {

    hideMessage();


    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        const provider =
            new firebase.auth.GoogleAuthProvider();


        const result =
            await auth.signInWithPopup(
                provider
            );


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "GOOGLE_USER_EMPTY"
            );

        }


        showMessage(
            t(
                "loginSuccess",
                "登录成功"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            300
        );


    } catch (error) {

        console.error(
            "Google 登录失败:",
            error
        );


        showMessage(
            t(
                "loginFailed",
                "登录失败，请稍后再试"
            ),
            "error"
        );

    }

}



/* =========================================================
   手机号登录
========================================================= */

let confirmationResult =
    null;

let recaptchaVerifier =
    null;


function showPhoneLogin() {

    hideMessage();


    document
        .getElementById(
            "emailLoginSection"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "phoneLoginSection"
        )
        .style.display =
        "block";


    setupRecaptcha();

}


function showEmailLogin() {

    hideMessage();


    document
        .getElementById(
            "emailLoginSection"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "phoneLoginSection"
        )
        .style.display =
        "none";

}


function setupRecaptcha() {

    if (recaptchaVerifier) {

        return;

    }


    recaptchaVerifier =
        new firebase.auth.RecaptchaVerifier(
            "recaptcha-container",
            {
                size: "invisible",

                callback:
                    function() {

                        console.log(
                            "reCAPTCHA 验证成功"
                        );

                    },

                "expired-callback":
                    function() {

                        console.log(
                            "reCAPTCHA 已过期"
                        );

                    }

            },
            auth
        );


    recaptchaVerifier
        .render()
        .catch(
            function(error) {

                console.error(
                    "reCAPTCHA 初始化失败:",
                    error
                );

            }
        );

}



/* =========================================================
   获取验证码
========================================================= */

async function sendVerificationCode() {

    hideMessage();


    const phone =
        document
            .getElementById(
                "phoneNumber"
            )
            .value
            .trim();


    if (!phone) {

        showMessage(
            t(
                "phoneInternationalRequired",
                "请输入国际手机号"
            ),
            "error"
        );

        return;

    }


    if (
        !phone.startsWith("+")
    ) {

        showMessage(
            t(
                "phoneInternationalRequired",
                "请输入国际格式手机号，例如 +959xxxxxxxxx"
            ),
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "sendCodeButton"
        );


    button.disabled =
        true;

    button.innerText =
        t(
            "sendingCode",
            "发送中..."
        );


    try {

        setupRecaptcha();


        confirmationResult =
            await auth
                .signInWithPhoneNumber(
                    phone,
                    recaptchaVerifier
                );


        showMessage(
            t(
                "verificationCodeSent",
                "验证码已发送"
            ),
            "success"
        );


        let seconds =
            60;


        const timer =
            setInterval(
                function() {

                    seconds--;


                    if (
                        seconds <= 0
                    ) {

                        clearInterval(
                            timer
                        );

                        button.disabled =
                            false;

                        button.innerText =
                            t(
                                "getVerificationCode",
                                "获取验证码"
                            );

                        return;

                    }


                    button.innerText =
                        seconds +
                        "s";

                },
                1000
            );


    } catch (error) {

        console.error(
            "发送验证码失败:",
            error
        );


        button.disabled =
            false;

        button.innerText =
            t(
                "getVerificationCode",
                "获取验证码"
            );


        showMessage(
            t(
                "verificationCodeSendFailed",
                "验证码发送失败，请稍后再试"
            ),
            "error"
        );

    }

}



/* =========================================================
   验证手机号验证码
========================================================= */

async function verifyPhoneCode() {

    hideMessage();


    if (
        !confirmationResult
    ) {

        showMessage(
            t(
                "getCodeFirst",
                "请先获取验证码"
            ),
            "error"
        );

        return;

    }


    const code =
        document
            .getElementById(
                "verificationCode"
            )
            .value
            .trim();


    if (!code) {

        showMessage(
            t(
                "enterVerificationCode",
                "请输入验证码"
            ),
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "phoneLoginButton"
        );


    button.disabled =
        true;

    button.innerText =
        t(
            "loggingIn",
            "正在登录..."
        );


    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        const result =
            await confirmationResult
                .confirm(code);


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "PHONE_USER_EMPTY"
            );

        }


        showMessage(
            t(
                "loginSuccess",
                "登录成功"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            300
        );


    } catch (error) {

        console.error(
            "手机号登录失败:",
            error
        );


        showMessage(
            t(
                "verificationCodeInvalid",
                "验证码错误或已失效"
            ),
            "error"
        );


        button.disabled =
            false;

        button.innerText =
            t(
                "phoneLoginButton",
                "登录"
            );

    }

}



/* =========================================================
   已经登录时直接进入首页
========================================================= */

auth.onAuthStateChanged(
    function(user) {

        console.log(
            "Login Auth 状态:",
            user
                ? user.uid
                : "未登录"
        );

    }
);



/* =========================================================
   language.js
========================================================= */

if (
    window.MDYLanguage &&
    typeof
    window.MDYLanguage
        .renderLanguageSelector
    === "function"
) {

    window.MDYLanguage
        .renderLanguageSelector(
            document.getElementById(
                "languageSelector"
            )
        );

}


applyPageTranslations();


window.addEventListener(
    "mdyLanguageChanged",
    function() {

        applyPageTranslations();
