<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff7ed 0%,
            #ffffff 50%,
            #fff1f2 100%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    color: #333;
}


.login-wrapper {
    width: 100%;
    max-width: 430px;
}


.login-card {
    background: rgba(255,255,255,.97);

    border-radius: 24px;

    padding: 34px 30px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.10);
}


.top-bar {
    display: flex;
    justify-content: flex-end;

    margin-bottom: 10px;
}


.logo {
    text-align: center;

    margin-bottom: 28px;
}


.logo-icon {
    width: 72px;
    height: 72px;

    margin: 0 auto 14px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #ff6b35,
            #ff3d00
        );

    color: white;

    font-size: 36px;

    box-shadow:
        0 10px 25px rgba(255,91,45,.25);
}


.logo h1 {
    margin: 0;

    font-size: 28px;

    font-weight: 800;

    color: #222;
}


.logo p {
    margin: 8px 0 0;

    color: #888;

    font-size: 14px;
}


.form-group {
    margin-bottom: 18px;
}


.form-group label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 600;

    color: #444;
}


.input {
    width: 100%;

    height: 50px;

    border: 1px solid #ddd;

    border-radius: 12px;

.message.error {

}


.message.success {

.phone-login {
    display: none;

.phone-login.active {
    display: block;
}


.login-methods.hidden {
    display: none;
}


.back-button {
    width: 100%;

    height: 44px;

    border: none;

    background: transparent;

    color: #777;

    cursor: pointer;

    margin-top: 8px;

    font-size: 14px;

.phone-hint {

    color: #999;

    line-height: 1.5;
}


.code-row {
    display: flex;

}


.code-row .input {

}


.code-btn {
    width: 125px;

    flex-shrink: 0;

    border: 1px solid #ff7043;

    background: white;

    color: #f4511e;

/* =========================================================

function showMessage(

    type = "error"
) {

}


function clearMessage() {

    messageBox.textContent =

    messageBox.className =

}



/* =========================================================
   Firebase 错误
   ========================================================= */

function getFirebaseErrorMessage(
    error
) {

    console.error(
        "Firebase 登录错误:",
        error
    );


    const code =
        error &&
        error.code
            ? error.code
            : "";


    const t =
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
        "function"
            ? window.MDYLanguage.t
            : function(
                key,
                params,
                fallback
            ) {

                return (
                    fallback ||
                    key
                );

            };


    if (
        code ===
        "auth/api-key-not-valid"
    ) {

        return t(
            "firebaseApiKeyInvalid",
            {},
            "Firebase API Key 无效，请检查 Firebase 配置。"
        );

    }


    if (
        code ===
        "auth/invalid-email"
    ) {

        return t(
            "invalidEmail",
            {},
            "邮箱格式不正确。"
        );

    }


    if (
        code ===
        "auth/user-not-found"
    ) {

        return t(
            "emailNotRegistered",
            {},
            "该邮箱尚未注册。"
        );

    }


    if (
        code ===
        "auth/wrong-password"
        ||
        code ===
        "auth/invalid-credential"
    ) {

        return t(
            "emailOrPasswordWrong",
            {},
            "邮箱或密码错误。"
        );

    }


    if (
        code ===
        "auth/too-many-requests"
    ) {

        return t(
            "loginFailed",
            {},
            "尝试次数过多，请稍后再试。"
        );

    }


    if (
        code ===
        "auth/network-request-failed"
    ) {

        return t(
            "networkConnectionFailed",
            {},
            "网络连接失败，请检查网络后重试。"
        );

    }


    if (
        code ===
        "auth/operation-not-allowed"
    ) {

        return t(
            "loginFailed",
            {},
            "当前登录方式尚未启用。"
        );

    }


    if (
        code ===
        "auth/user-disabled"
    ) {

        return t(
            "loginFailed",
            {},
            "该账号已被禁用。"
        );

    }


    if (
        code ===
        "auth/invalid-api-key"
    ) {

        return t(
            "firebaseApiKeyInvalid",
            {},
            "Firebase API Key 无效。"
        );

    }


    return (
        error &&
        error.message
            ? error.message
            : t(
                "loginFailed",
                {},
                "登录失败，请稍后再试。"
            )
    );

}



/* =========================================================
   邮箱登录
   ========================================================= */

async function login() {

    clearMessage();


    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const t =
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
        "function"
            ? window.MDYLanguage.t
            : function(
                key,
                params,
                fallback
            ) {

                return (
                    fallback ||
                    key
                );

            };


    if (
        !email ||
        !password
    ) {

        showMessage(
            t(
                "pleaseEnterEmailPassword",
                {},
                "请输入邮箱和密码。"
            )
        );

        return;

    }


    const button =
        document.getElementById(
            "loginButton"
        );


    const originalText =
        button.textContent;


    button.disabled =
        true;


    button.textContent =
        t(
            "loggingIn",
            {},
            "正在登录..."
        );


    try {

        await setLocalPersistence();


        const result =
            await auth
                .signInWithEmailAndPassword(
                    email,
                    password
                );


        console.log(
            "Firebase 登录成功:",
            result.user.uid
        );


        showMessage(
            t(
                "loginSuccess",
                {},
                "登录成功！"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            700
        );


    } catch (error) {

        showMessage(
            getFirebaseErrorMessage(
                error
            )
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            originalText;

    }

}



/* =========================================================
   Google 登录
   ========================================================= */

async function googleLogin() {

    clearMessage();


    const t =
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
        "function"
            ? window.MDYLanguage.t
            : function(
                key,
                params,
                fallback
            ) {

                return (
                    fallback ||
                    key
                );

            };


    try {

        await setLocalPersistence();


        const provider =
            new firebase
                .auth
                .GoogleAuthProvider();


        provider.setCustomParameters({
            prompt:
                "select_account"
        });


        const result =
            await auth.signInWithPopup(
                provider
            );


        console.log(
            "Google 登录成功:",
            result.user.uid
        );


        showMessage(
            t(
                "loginSuccess",
                {},
                "登录成功！"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            700
        );


    } catch (error) {

        console.error(
            "Google 登录错误:",
            error
        );


        if (
            error.code ===
            "auth/popup-closed-by-user"
        ) {

            return;

        }


        showMessage(
            getFirebaseErrorMessage(
                error
            )
        );

    }

}

            "phoneLogin"

    document

            "loginMethods"

        .classList
        .remove("hidden");

}



/* =========================================================
   reCAPTCHA
   ========================================================= */

function initRecaptcha() {

    try {

        if (
            recaptchaVerifier
        ) {

            return;

        }


        recaptchaVerifier =
            new firebase
                .auth
                .RecaptchaVerifier(
                    "recaptcha-container",
                    {
                        size: "normal"
                    }
                );


        recaptchaVerifier
            .render()
            .then(
                function(widgetId) {

                    window
                        .recaptchaWidgetId =
                        widgetId;

                }
            );


    } catch (error) {

        console.error(
            "reCAPTCHA 初始化失败:",
            error
        );

    }

}



/* =========================================================
   发送验证码
   ========================================================= */

async function sendVerificationCode() {

    clearMessage();


    const phone =
        document
            .getElementById(
                "phoneNumber"
            )
            .value
            .trim();


    const t =
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
        "function"
            ? window.MDYLanguage.t
            : function(
                key,
                params,
                fallback
            ) {

                return (
                    fallback ||
                    key
                );

            };


    if (!phone) {

        showMessage(
            t(
                "phoneInternationalRequired",
                {},
                "请输入国际格式手机号。"
            )
        );

        return;

    }


    if (
        !phone.startsWith("+")
    ) {

        showMessage(
            t(
                "phoneInternationalRequired",
                {},
                "手机号必须使用国际格式，例如 +95 9xxxxxxxxx。"
            )
        );

        return;

    }


    try {

        await setLocalPersistence();


        if (
            !recaptchaVerifier
        ) {

            initRecaptcha();

        }


        const codeButton =
            document.getElementById(
                "codeButton"
            );


        codeButton.disabled =
            true;


        codeButton.textContent =
            t(
                "sendingCode",
                {},
                "发送中..."
            );


        confirmationResult =
            await auth
                .signInWithPhoneNumber(
                    phone,
                    recaptchaVerifier
                );


        showMessage(
            t(
                "verificationCodeSent",
                {},
                "验证码已发送，请查收短信。"
            ),
            "success"
        );


        let countdown =
            60;


        const timer =
            setInterval(
                function() {

                    countdown--;


                    codeButton.textContent =
                        countdown +
                        "s";


                    if (
                        countdown <=
                        0
                    ) {

                        clearInterval(
                            timer
                        );


                        codeButton.disabled =
                            false;


                        codeButton.textContent =
                            t(
                                "getVerificationCode",
                                {},
                                "获取验证码"
                            );

                    }

                },
                1000
            );


    } catch (error) {

        console.error(
            "发送验证码失败:",
            error
        );


        const codeButton =
            document.getElementById(
                "codeButton"
            );


        codeButton.disabled =
            false;


        codeButton.textContent =
            t(
                "getVerificationCode",
                {},
                "获取验证码"
            );


        showMessage(
            getFirebaseErrorMessage(
                error
            )
        );

    }

}



/* =========================================================
   手机验证码登录
   ========================================================= */

async function phoneLogin() {

    clearMessage();


    const code =
        document
            .getElementById(
                "verificationCode"
            )
            .value
            .trim();


    const t =
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
        "function"
            ? window.MDYLanguage.t
            : function(
                key,
                params,
                fallback
            ) {

                return (
                    fallback ||
                    key
                );

            };


    if (
        !confirmationResult
    ) {

        showMessage(
            t(
                "getCodeFirst",
                {},
                "请先获取验证码。"
            )
        );

        return;

    }


    if (!code) {

        showMessage(
            t(
                "enterVerificationCode",
                {},
                "请输入验证码。"
            )
        );

        return;

    }


    const button =
        document.getElementById(
            "phoneLoginButton"
        );


    const originalText =
        button.textContent;


    button.disabled =
        true;


    button.textContent =
        t(
            "loggingIn",
            {},
            "正在登录..."
        );


    try {

        const result =
            await confirmationResult
                .confirm(code);


        console.log(
            "手机号登录成功:",
            result.user.uid
        );


        showMessage(
            t(
                "loginSuccess",
                {},
                "登录成功！"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            700
        );


    } catch (error) {

        console.error(
            "手机号登录错误:",
            error
        );


        showMessage(
            getFirebaseErrorMessage(
                error
            )
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            originalText;

    }

}



/* =========================================================
   Enter 登录
   ========================================================= */

document
    .getElementById(
        "password"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                login();

            }

        }
    );



/* =========================================================
   语言切换
   ========================================================= */

window.addEventListener(
    "mdyLanguageChanged",
    function() {

        renderLoginLanguage();

        renderLanguageSelector();

    }
);



/* =========================================================
   初始化
   ========================================================= */

async function initLoginPage() {

    await setLocalPersistence();

    renderLoginLanguage();

    renderLanguageSelector();

}



/* =========================================================
   启动
   ========================================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initLoginPage
    );

} else {

    initLoginPage();

}

</script>
