<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>MDY FOOD - 登录</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="language.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #fff7f2,
            #f7f8fa
        );

    color: #222;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.page {
    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px 15px;
}

.login-card {
    width: 100%;
    max-width: 430px;

    background: #fff;

    border-radius: 22px;

    padding: 30px 24px 26px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.08);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo-name {
    font-size: 31px;
    font-weight: 900;
    color: #ff5a1f;
}

.logo-subtitle {
    margin-top: 5px;
    font-size: 12px;
    color: #aaa;
}

.page-title {
    text-align: center;

    font-size: 24px;
    font-weight: 800;

    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 15px;
}

.form-label {
    display: block;

    margin-bottom: 7px;

    font-size: 13px;
    font-weight: 700;

    color: #555;
}

.input {
    width: 100%;

    border:
        1px solid #e5e5e5;

    border-radius: 11px;

    background: #fafafa;

    padding:
        13px
        14px;

    font-size: 14px;

    outline: none;

    transition:
        border-color .2s,
        background .2s;
}

.input:focus {
    border-color: #ff5a1f;
    background: #fff;
}

.primary-button {
    width: 100%;

    border: none;

    background:
        linear-gradient(
            135deg,
            #ff6a2a,
            #ff4d1f
        );

    color: white;

    padding: 13px;

    border-radius: 11px;

    font-size: 15px;
    font-weight: 800;

    margin-top: 4px;
}

.primary-button:disabled {
    opacity: .6;
    cursor: wait;
}

.divider {
    display: flex;
    align-items: center;

    gap: 12px;

    margin:
        22px
        0;
}

.divider-line {
    flex: 1;
    height: 1px;
    background: #eee;
}

.divider-text {
    color: #aaa;
    font-size: 12px;
}

.secondary-button {
    width: 100%;

    border:
        1px solid #e5e5e5;

    background: #fff;

    color: #333;

    padding: 12px;

    border-radius: 11px;

    font-size: 14px;
    font-weight: 700;

    margin-bottom: 10px;
}

.secondary-button:hover {
    background: #fafafa;
}

.phone-section {
    display: none;
}

.phone-section.show {
    display: block;
}

.email-section.hide {
    display: none;
}

.phone-row {
    display: flex;
    gap: 8px;
}

.phone-row .input {
    flex: 1;
}

.code-button {
    flex-shrink: 0;

    border: none;

    background: #fff1eb;

    color: #ff5a1f;

    border-radius: 10px;

    padding:
        0
        13px;

    font-size: 12px;
    font-weight: 700;
}

.code-button:disabled {
    opacity: .5;
    cursor: wait;
}

.hint {
    margin-top: 7px;

    font-size: 11px;
    line-height: 1.5;

    color: #999;
}

.message {
    display: none;

    margin:
        14px
        0
        0;

    padding:
        11px
        13px;

    border-radius: 10px;

    font-size: 12px;
    line-height: 1.5;
}

.message.show {
    display: block;
}

.message.error {
    background: #fff1f1;
    color: #d93025;
}

.message.success {
    background: #effaf2;
    color: #188038;
}

.register-link {
    text-align: center;

    margin-top: 21px;

    font-size: 13px;

    color: #999;
}

.register-link a {
    color: #ff5a1f;

    text-decoration: none;

    font-weight: 700;
}

.back-home {
    display: block;

    margin:
        17px
        auto
        0;

    border: none;

    background: transparent;

    color: #999;

    font-size: 12px;
}

#recaptcha-container {
    margin-top: 10px;
}

@media (max-width: 500px) {

    .page {
        padding:
            15px;
    }

    .login-card {
        padding:
            26px
            18px
            22px;
    }

    .logo-name {
        font-size: 28px;
    }

}

</style>

</head>


<body>


<div class="page">

<div class="login-card">


    <div class="logo">

        <div class="logo-name">
            MDY FOOD
        </div>

        <div
            class="logo-subtitle"
            data-i18n="brandSubtitle"
        >
            美味就在身边
        </div>

    </div>


    <div
        class="page-title"
        data-i18n="loginPageTitle"
    >
        登录
    </div>


    <!-- =========================
         邮箱登录
    ========================= -->

    <div
        id="emailSection"
        class="email-section"
    >

        <div class="form-group">

            <label
                class="form-label"
                data-i18n="email"
            >
                邮箱
            </label>

            <input
                id="email"
                class="input"
                type="email"
                autocomplete="email"
                data-i18n-placeholder="emailPlaceholder"
                placeholder="请输入邮箱"
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                data-i18n="password"
            >
                密码
            </label>

            <input
                id="password"
                class="input"
                type="password"
                autocomplete="current-password"
                data-i18n-placeholder="passwordPlaceholder"
                placeholder="请输入密码"
            >

        </div>


        <button
            id="emailLoginButton"
            class="primary-button"
            onclick="loginWithEmail()"
            data-i18n="loginButton"
        >
            登录
        </button>

    </div>


    <div class="divider">

        <div class="divider-line"></div>

        <div
            class="divider-text"
            data-i18n="or"
        >
            或
        </div>

        <div class="divider-line"></div>

    </div>


    <button
        id="googleButton"
        class="secondary-button"
        onclick="loginWithGoogle()"
        data-i18n="googleLogin"
    >
        使用 Google 登录
    </button>


    <button
        id="phoneToggleButton"
        class="secondary-button"
        onclick="showPhoneLogin()"
        data-i18n="phoneLogin"
    >
        📱 使用手机号登录
    </button>


    <!-- =========================
         手机号登录
    ========================= -->

    <div
        id="phoneSection"
        class="phone-section"
    >

        <div class="form-group">

            <label
                class="form-label"
                data-i18n="phoneInternationalPlaceholder"
            >
                国际手机号
            </label>


            <div class="phone-row">

                <input
                    id="phoneNumber"
                    class="input"
                    type="tel"
                    autocomplete="tel"
                    data-i18n-placeholder="phoneInternationalPlaceholder"
                    placeholder="+959xxxxxxxxx"
                >


                <button
                    id="sendCodeButton"
                    class="code-button"
                    onclick="sendVerificationCode()"
                    data-i18n="getVerificationCode"
                >
                    获取验证码
                </button>

            </div>


            <div
                class="hint"
                data-i18n="phoneInternationalHint"
            >
                请使用国际格式，例如 +959xxxxxxxxx
            </div>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                data-i18n="verificationCode"
            >
                验证码
            </label>

            <input
                id="verificationCode"
                class="input"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                data-i18n-placeholder="verificationCode"
                placeholder="请输入验证码"
            >

        </div>


        <button
            id="phoneLoginButton"
            class="primary-button"
            onclick="verifyPhoneCode()"
            data-i18n="phoneLoginButton"
        >
            登录
        </button>


        <button
            class="back-home"
            onclick="showEmailLogin()"
            data-i18n="backToLoginMethods"
        >
            返回邮箱登录
        </button>


        <div id="recaptcha-container"></div>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <div class="register-link">

        <span data-i18n="noAccount">
            还没有账户？
        </span>

        <a
            href="register.html"
            data-i18n="registerNow"
        >
            立即注册
        </a>

    </div>


    <button
        class="back-home"
        onclick="goHome()"
        data-i18n="backHome"
    >
        返回首页
    </button>


</div>

</div>


<script>

/* =========================================================
   Firebase
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngcFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();



/* =========================================================
   页面状态
========================================================= */

let confirmationResult = null;

let recaptchaVerifier = null;

let recaptchaReady = false;



/* =========================================================
   翻译
========================================================= */

function t(
    key,
    fallback
) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t ===
            "function"
    ) {

        return window.MDYLanguage.t(
            key,
            {},
            fallback
        );

    }

    return fallback || key;

}



/* =========================================================
   消息
========================================================= */

function showMessage(
    message,
    type = "error"
) {

    const box =
        document.getElementById(
            "message"
        );

    box.textContent =
        message;

    box.className =
        "message show " +
        type;

}


function hideMessage() {

    const box =
        document.getElementById(
            "message"
        );

    box.className =
        "message";

}



/* =========================================================
   返回首页
========================================================= */

function goHome() {

    window.location.href =
        "index.html";

}



/* =========================================================
   邮箱登录
========================================================= */

async function loginWithEmail() {

    hideMessage();


    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    if (!email || !password) {

        showMessage(
            t(
                "pleaseEnterEmailPassword",
                "请输入邮箱和密码"
            )
        );

        return;

    }


    const button =
        document.getElementById(
            "emailLoginButton"
        );


    button.disabled =
        true;

    button.textContent =
        t(
            "loggingIn",
            "正在登录..."
        );


    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        const result =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "AUTH_USER_EMPTY"
            );

        }


        console.log(
            "登录成功:",
            result.user.uid
        );


        showMessage(
            t(
                "loginSuccess",
                "登录成功"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            500
        );


    } catch (error) {

        console.error(
            "邮箱登录失败:",
            error
        );


        let message =
            t(
                "loginFailed",
                "登录失败，请检查邮箱和密码"
            );


        const code =
            error &&
            error.code
                ? error.code
                : "";


        if (
            code ===
            "auth/user-not-found"
        ) {

            message =
                t(
                    "emailNotRegistered",
                    "该邮箱尚未注册"
                );

        } else if (
            code ===
            "auth/wrong-password"
        ) {

            message =
                t(
                    "wrongPassword",
                    "密码错误"
                );

        } else if (
            code ===
            "auth/invalid-credential"
        ) {

            message =
                t(
                    "emailOrPasswordWrong",
                    "邮箱或密码错误"
                );

        } else if (
            code ===
            "auth/invalid-email"
        ) {

            message =
                t(
                    "invalidEmail",
                    "邮箱格式不正确"
                );

        } else if (
            code ===
            "auth/too-many-requests"
        ) {

            message =
                "登录尝试次数过多，请稍后再试";

        } else if (
            code ===
            "auth/network-request-failed"
        ) {

            message =
                t(
                    "networkConnectionFailed",
                    "网络连接失败，请检查网络"
                );

        } else if (
            code ===
            "auth/operation-not-allowed"
        ) {

            message =
                "Firebase 当前未启用邮箱/密码登录";

        } else if (
            code ===
            "auth/invalid-api-key"
        ) {

            message =
                t(
                    "firebaseApiKeyInvalid",
                    "Firebase API Key 无效"
                );

        } else if (
            error &&
            error.message
        ) {

            message +=
                " (" +
                error.message +
                ")";

        }


        showMessage(
            message,
            "error"
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            t(
                "loginButton",
                "登录"
            );

    }

}



/* =========================================================
   Google 登录
========================================================= */

async function loginWithGoogle() {

    hideMessage();


    const button =
        document.getElementById(
            "googleButton"
        );


    button.disabled =
        true;

    button.textContent =
        "正在登录...";


    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        const provider =
            new firebase.auth.GoogleAuthProvider();


        const result =
            await auth.signInWithPopup(
                provider
            );


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "AUTH_USER_EMPTY"
            );

        }


        console.log(
            "Google 登录成功:",
            result.user.uid
        );


        showMessage(
            t(
                "loginSuccess",
                "登录成功"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            500
        );


    } catch (error) {

        console.error(
            "Google 登录失败:",
            error
        );


        let message =
            t(
                "loginFailed",
                "登录失败，请稍后再试"
            );


        if (
            error &&
            error.code
        ) {

            message +=
                " [" +
                error.code +
                "]";

        }


        showMessage(
            message
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            t(
                "googleLogin",
                "使用 Google 登录"
            );

    }

}



/* =========================================================
   显示手机号登录
========================================================= */

function showPhoneLogin() {

    hideMessage();


    document
        .getElementById(
            "emailSection"
        )
        .classList.add("hide");


    document
        .getElementById(
            "phoneSection"
        )
        .classList.add("show");


    document
        .getElementById(
            "phoneToggleButton"
        )
        .style.display =
        "none";


    initRecaptcha();

}



/* =========================================================
   返回邮箱登录
========================================================= */

function showEmailLogin() {

    hideMessage();


    document
        .getElementById(
            "emailSection"
        )
        .classList.remove("hide");


    document
        .getElementById(
            "phoneSection"
        )
        .classList.remove("show");


    document
        .getElementById(
            "phoneToggleButton"
        )
        .style.display =
        "block";

}



/* =========================================================
   reCAPTCHA
========================================================= */

function initRecaptcha() {

    if (recaptchaReady) {
        return;
    }


    try {

        recaptchaVerifier =
            new firebase.auth.RecaptchaVerifier(
                "recaptcha-container",
                {
                    size: "normal"
                }
            );


        recaptchaVerifier
            .render()
            .then(
                function() {

                    recaptchaReady =
                        true;

                }
            );


    } catch (error) {

        console.error(
            "reCAPTCHA 初始化失败:",
            error
        );

        showMessage(
            "验证码组件初始化失败，请刷新页面后重试"
        );

    }

}



/* =========================================================
   发送验证码
========================================================= */

async function sendVerificationCode() {

    hideMessage();


    const phone =
        document
            .getElementById(
                "phoneNumber"
            )
            .value
            .trim();


    if (!phone) {

        showMessage(
            t(
                "phoneInternationalRequired",
                "请输入国际格式手机号"
            )
        );

        return;

    }


    if (
        !phone.startsWith("+")
    ) {

        showMessage(
            t(
                "phoneInternationalRequired",
                "请输入国际格式手机号，例如 +959xxxxxxxxx"
            )
        );

        return;

    }


    if (!recaptchaReady) {

        initRecaptcha();

        showMessage(
            "请先完成验证码验证"
        );

        return;

    }


    const button =
        document.getElementById(
            "sendCodeButton"
        );


    button.disabled =
        true;

    button.textContent =
        t(
            "sendingCode",
            "发送中..."
        );


    try {

        confirmationResult =
            await auth.signInWithPhoneNumber(
                phone,
                recaptchaVerifier
            );


        showMessage(
            t(
                "verificationCodeSent",
                "验证码已发送"
            ),
            "success"
        );


        button.textContent =
            t(
                "verificationCodeSent",
                "已发送"
            );


    } catch (error) {

        console.error(
            "发送验证码失败:",
            error
        );


        let message =
            t(
                "verificationCodeSendFailed",
                "验证码发送失败"
            );


        if (
            error &&
            error.code
        ) {

            message +=
                " [" +
                error.code +
                "]";

        }


        showMessage(
            message
        );


        button.disabled =
            false;

        button.textContent =
            t(
                "getVerificationCode",
                "获取验证码"
            );


        try {

            if (recaptchaVerifier) {

                recaptchaVerifier.clear();

            }

        } catch (e) {}

        recaptchaVerifier =
            null;

        recaptchaReady =
            false;


        setTimeout(
            initRecaptcha,
            300
        );

    }

}



/* =========================================================
   验证手机号验证码
========================================================= */

async function verifyPhoneCode() {

    hideMessage();


    if (!confirmationResult) {

        showMessage(
            t(
                "getCodeFirst",
                "请先获取验证码"
            )
        );

        return;

    }


    const code =
        document
            .getElementById(
                "verificationCode"
            )
            .value
            .trim();


    if (!code) {

        showMessage(
            t(
                "enterVerificationCode",
                "请输入验证码"
            )
        );

        return;

    }


    const button =
        document.getElementById(
            "phoneLoginButton"
        );


    button.disabled =
        true;

    button.textContent =
        t(
            "loggingIn",
            "正在登录..."
        );


    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );


        const result =
            await confirmationResult.confirm(
                code
            );


        if (
            !result ||
            !result.user
        ) {

            throw new Error(
                "AUTH_USER_EMPTY"
            );

        }


        console.log(
            "手机号登录成功:",
            result.user.uid
        );


        showMessage(
            t(
                "loginSuccess",
                "登录成功"
            ),
            "success"
        );


        setTimeout(
            function() {

                window.location.replace(
                    "index.html"
                );

            },
            500
        );


    } catch (error) {

        console.error(
            "手机号登录失败:",
            error
        );


        let message =
            t(
                "verificationCodeInvalid",
                "验证码错误或已过期"
            );


        if (
            error &&
            error.code ===
            "auth/code-expired"
        ) {

            message =
                "验证码已过期，请重新获取";

        }


        showMessage(
            message
        );


    } finally {

        button.disabled =
            false;

        button.textContent =
            t(
                "phoneLoginButton",
                "登录"
            );

    }

}



/* =========================================================
   Firebase Auth 状态
========================================================= */

auth.onAuthStateChanged(
    function(user) {

        console.log(
            "登录页 Firebase Auth:",
            user
                ? user.uid
                : "未登录"
        );

    }
);



/* =========================================================
   语言
========================================================= */

if (
    window.MDYLanguage &&
    typeof window.MDYLanguage
        .renderLanguageSelector ===
        "function"
) {

    /*

     * language.js 仍然负责全局语言。

}


window.addEventListener(
    "mdyLanguageChanged",
