
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MDY FOOD 商家后台</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #fff1eb;
            color: #ff5a1f;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            line-height: 1.8;
            color: #444;
        }

        .items {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .total {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 18px;
            font-weight: bold;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            margin-top: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .accept {
            background: #28a745;
        }

        .delivery {
            background: #007bff;
        }

        .complete {
            background: #6f42c1;
        }

        .done {
            background: #eee;
            color: #555;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            margin-top: 12px;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            color: #888;
        }

        .logout {
            background: #555;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>🍜 MDY FOOD</h1>
    <div>商家订单后台</div>
</header>

<div class="container">

    <button class="logout" onclick="logout()">
        退出商家账号
    </button>

    <div id="orders"></div>

</div>

<script>

    // 检查商家是否登录
    if (localStorage.getItem("merchantLogin") !== "true") {
        window.location.href = "admin-login.html";
    }

    // 获取所有订单
    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];

    // 如果以前只有 lastOrder，也保留下来
    if (
        orders.length === 0 &&
        localStorage.getItem("lastOrder")
    ) {

        const oldOrder =
            JSON.parse(
                localStorage.getItem("lastOrder")
            );

        orders.push(oldOrder);

        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );
    }

    function showOrders() {

        const container =
            document.getElementById("orders");

        orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];

        if (orders.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <div style="font-size:40px;">
                        📦
                    </div>

                    <h3>目前没有订单</h3>

                    <p>
                        新订单会显示在这里
                    </p>
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        // 最新订单放最上面
        orders
            .slice()
            .reverse()
            .forEach(function(order, reverseIndex) {

                const realIndex =
                    orders.length - 1 - reverseIndex;

                let buttonHTML = "";

                if (order.status === "待接单") {

                    buttonHTML = `
                        <button
                            class="accept"
                            onclick="changeStatus(${realIndex}, '商家已接单')"
                        >
                            ✅ 接受订单
                        </button>
                    `;

                } else if (
                    order.status === "商家已接单"
                ) {

                    buttonHTML = `
                        <button
                            class="delivery"
                            onclick="changeStatus(${realIndex}, '配送中')"
                        >
                            🛵 开始配送
                        </button>
                    `;

                } else if (
                    order.status === "配送中"
                ) {

                    buttonHTML = `
                        <button
                            class="complete"
                            onclick="changeStatus(${realIndex}, '已完成')"
                        >
                            ✅ 完成订单
                        </button>
                    `;

                } else {

                    buttonHTML = `
                        <div class="done">
                            🎉 订单已完成
                        </div>
                    `;
                }

                let itemsHTML = "";

                order.items.forEach(function(item) {

                    itemsHTML += `
                        <div class="item">
                            <span>
                                ${item.name} × ${item.quantity}
                            </span>

                            <span>
                                ${(item.price * item.quantity).toLocaleString()} Ks
                            </span>
                        </div>
                    `;

                });

                const div =
                    document.createElement("div");

                div.className = "order";

                div.innerHTML = `

                    <div class="order-number">
                        📦 订单号：${order.orderNumber}
                    </div>

                    <div class="status">
                        ${order.status}
                    </div>

                    <div class="info">

                        👤 姓名：
                        ${order.name}
                        <br>

                        📞 电话：
                        ${order.phone}
                        <br>

                        📍 地址：
                        ${order.address}
                        <br>

                        💳 支付：
                        ${order.payment}
                        <br>

                        🕐 时间：
                        ${order.createdAt}

                    </div>

                    <div class="items">

                        <strong>
                            🍜 订单内容
                        </strong>

                        ${itemsHTML}

                    </div>

                    <div class="total">
                        💰 总计：
                        ${order.total.toLocaleString()} Ks
                    </div>

                    ${buttonHTML}

                `;

                container.appendChild(div);

            });
    }


    function changeStatus(index, newStatus) {

        orders[index].status =
            newStatus;

        // 保存所有订单
        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );

        // 同时更新 lastOrder
        // 保持用户端旧系统兼容
        localStorage.setItem(
            "lastOrder",
            JSON.stringify(orders[index])
        );

        showOrders();
    }


    function logout() {

        localStorage.removeItem(
            "merchantLogin"
        );

        window.location.href =
            "admin-login.html";
    }


    // 第一次显示
    showOrders();


    // 每2秒检查一次新订单
    setInterval(function() {

        showOrders();

    }, 2000);

</script>

</body>
</html>
