<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>四川味道 - Mandalay Food</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
        }

        .back {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .container {
            max-width: 800px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .restaurant-header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .restaurant-name {
            font-size: 28px;
            font-weight: bold;
        }

        .restaurant-info {
            color: #777;
            margin-top: 8px;
        }

        .food {
            background: white;
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-name {
            font-size: 19px;
            font-weight: bold;
        }

        .food-description {
            color: #777;
            margin-top: 6px;
        }

        .price {
            margin-top: 8px;
            color: #ff5a1f;
            font-weight: bold;
        }

        .add-button {
            background: #ff5a1f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .cart {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            min-width: 220px;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <a class="back" href="index.html">
            ← 返回餐厅列表
        </a>
    </header>

    <div class="container">

        <div class="restaurant-header">

            <div class="restaurant-name">
                四川味道
            </div>

            <div class="restaurant-info">
                川菜 · 中餐 · ⭐ 4.8
            </div>

            <div class="restaurant-info">
                📍 Mandalay
            </div>

        </div>


        <div class="food">

            <div>
                <div class="food-name">
                    麻婆豆腐
                </div>

                <div class="food-description">
                    香辣豆腐，经典川菜
                </div>

                <div class="price">
                    8,000 Ks
                </div>
            </div>

            <button class="add-button" onclick="addFood('麻婆豆腐', 8000)">
                ＋
            </button>

        </div>


        <div class="food">

            <div>
                <div class="food-name">
                    担担面
                </div>

                <div class="food-description">
                    四川特色面食
                </div>

                <div class="price">
                    6,000 Ks
                </div>
            </div>

            <button class="add-button" onclick="addFood('担担面', 6000)">
                ＋
            </button>

        </div>


        <div class="food">

            <div>
                <div class="food-name">
                    水煮牛肉
                </div>

                <div class="food-description">
                    香辣牛肉，适合多人分享
                </div>

                <div class="price">
                    15,000 Ks
                </div>
            </div>

            <button class="add-button" onclick="addFood('水煮牛肉', 15000)">
                ＋
            </button>

        </div>


        <div class="food">

            <div>
                <div class="food-name">
                    四川饺子
                </div>

                <div class="food-description">
                    手工饺子
                </div>

                <div class="price">
                    7,000 Ks
                </div>
            </div>

            <button class="add-button" onclick="addFood('四川饺子', 7000)">
                ＋
            </button>

        </div>

    </div>


    <div class="cart" onclick="openCart()">
        🛒 购物车：<span id="cartCount">0</span> 件
        <br>
        总计：<span id="cartTotal">0</span> Ks
    </div>


    <script>

      let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addFood(name, price) {

    let existingFood = cart.find(function(item) {
        return item.name === name;
    });

    if (existingFood) {

        existingFood.quantity += 1;

    } else {

        cart.push({
            name: name,
            price: price,
            quantity: 1
        });

    }

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    updateCart();

    alert(name + " 已加入购物车！");
}


function updateCart() {

    let count = 0;
    let total = 0;

    cart.forEach(function(item) {

        count += item.quantity;

        total += item.price * item.quantity;

    });

    document.getElementById("cartCount").innerText = count;

    document.getElementById("cartTotal").innerText =
        total.toLocaleString();
}


function openCart() {

    window.location.href = "cart.html";

}


updateCart();   
    

        

            

    

        

            


            
        



            

        

    </script>

</body>

</html>
