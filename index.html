<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mandalay Food</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 15px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .orders-link {
            display: block;
            margin: 15px 0;
            padding: 14px;
            background: white;
            color: #ff5a1f;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .restaurant {
            background: white;
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .restaurant h3 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .restaurant p {
            margin: 5px 0;
            color: #666;
        }

        .restaurant button {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border: none;
            background: #ff5a1f;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>🍜 Mandalay Food</h1>
    <p>缅甸曼德勒外卖平台</p>
</header>

<div class="container">

    <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="搜索餐厅 / အစားအစာ ရှာရန်"
        oninput="searchRestaurants()"
    >

    <a href="orders.html" class="orders-link">
        📦 我的订单
    </a>

    <div id="restaurantList">

        <div class="restaurant">
            <h3>四川味道</h3>
            <p>川菜 · 中餐</p>
            <p>⭐ 4.8</p>
            <button onclick="window.location.href='menu.html'">
                查看菜单
            </button>
        </div>

        <div class="restaurant">
            <h3>Mandalay Kitchen</h3>
            <p>缅甸菜</p>
            <p>⭐ 4.7</p>
            <button onclick="window.location.href='menu.html'">
                查看菜单
            </button>
        </div>

        <div class="restaurant">
            <h3>夜猫子烧烤</h3>
            <p>烧烤 · 夜宵</p>
            <p>⭐ 4.9</p>
            <button onclick="window.location.href='menu.html'">
                查看菜单
            </button>
        </div>

    </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",
    authDomain: "mdy-food.firebaseapp.com",
    projectId: "mdy-food",
    storageBucket: "mdy-food.firebasestorage.app",
    messagingSenderId: "498327590625",
    appId: "1:498327590625:web:cceafb7febb689e7ad09a0",
    measurementId: "G-6Q5G2862XQ"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


// 搜索餐厅
function searchRestaurants() {

    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const restaurants =
        document.querySelectorAll(".restaurant");

    restaurants.forEach(function(restaurant) {

        const text =
            restaurant.innerText.toLowerCase();

        if (text.includes(keyword)) {
            restaurant.style.display = "";
        } else {
            restaurant.style.display = "none";
        }

    });
}


// 从 Firebase 读取餐厅
function loadRestaurants() {

    db.collection("restaurants")
        .get()
        .then(function(snapshot) {

            const restaurants =
                document.querySelectorAll(".restaurant");

            snapshot.forEach(function(doc, index) {

                if (index >= restaurants.length) {
                    return;
                }

                const data = doc.data();

                const restaurant =
                    restaurants[index];

                const title =
                    restaurant.querySelector("h3");

                const info =
                    restaurant.querySelector("p");

                if (title) {
                    title.innerText =
                        data.name || "";
                }

                if (info) {
                    info.innerText =
                        data.category || "";
                }

                const paragraphs =
                    restaurant.querySelectorAll("p");

                if (paragraphs.length > 1) {

                    paragraphs[1].innerText =
                        "⭐ " +
                        (data.rating || "");
                }

            });

        })
        .catch(function(error) {

            console.error(
                "读取餐厅失败：",
                error
            );

        });

}


// 开始读取
loadRestaurants();

</script>

</body>
</html>
