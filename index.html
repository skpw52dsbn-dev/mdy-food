<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD</title>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        "Microsoft YaHei",
        sans-serif;

    background: #f5f5f5;

    color: #333;

}


header {

    background: #ff5a1f;

    color: white;

    padding: 22px 15px;

    text-align: center;

}


header h1 {

    margin: 0;

    font-size: 28px;

}


header p {

    margin: 7px 0 0;

    font-size: 14px;

}


.container {

    max-width: 800px;

    margin: auto;

    padding: 15px;

}


/* =========================
   账号
========================= */

.account-box {

    background: white;

    border-radius: 10px;

    margin-bottom: 15px;

    padding: 14px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    text-align: center;

}


.account-login {

    display: block;

    width: 100%;

    padding: 13px;

    background: #ff5a1f;

    color: white;

    text-decoration: none;

    border-radius: 8px;

    font-weight: bold;

}


.account-user {

    font-size: 14px;

    color: #555;

    margin-bottom: 10px;

}


.account-user strong {

    color: #ff5a1f;

}


.account-buttons {

    display: flex;

    gap: 10px;

}


.account-buttons a,
.logout-btn {

    flex: 1;

    padding: 11px;

    border-radius: 8px;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;

    text-align: center;

    cursor: pointer;

}


.account-buttons a {

    background: #fff1ed;

    color: #ff5a1f;

}


.logout-btn {

    border: none;

    background: #eee;

    color: #555;

}


/* =========================
   搜索
========================= */

.search {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    outline: none;

}


.orders-link {

    display: block;

    margin: 15px 0;

    padding: 14px;

    background: white;

    color: #ff5a1f;

    text-align: center;

    text-decoration: none;

    border-radius: 10px;

    font-weight: bold;

}


/* =========================
   餐厅
========================= */

.restaurant {

    background: white;

    border-radius: 12px;

    margin-bottom: 15px;

    padding: 18px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

}


.restaurant h2 {

    margin: 0 0 8px;

    font-size: 21px;

}


.category {

    color: #777;

    margin-bottom: 8px;

}


.description {

    color: #666;

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 8px;

}


.rating {

    margin-bottom: 8px;

}


.status {

    font-weight: bold;

    margin-bottom: 15px;

}


.open-status {

    color: #2e8b57;

}


.closed-status {

    color: #d33;

}


.restaurant button {

    width: 100%;

    border: none;

    background: #ff5a1f;

    color: white;

    padding: 13px;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

}


.restaurant button:hover {

    opacity: 0.9;

}


.restaurant button.closed {

    background: #999 !important;

}


.loading {

    background: white;

    border-radius: 12px;

    padding: 35px 15px;

    text-align: center;

    color: #888;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

}


.empty {

    background: white;

    border-radius: 12px;

    padding: 35px 15px;

    text-align: center;

    color: #888;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

}


.error-box {

    background: #fff0f0;

    color: #d33;

    padding: 14px;

    border-radius: 10px;

    margin-bottom: 15px;

    display: none;

}


/* =========================
   新商家标签
========================= */

.new-badge {

    display: inline-block;

    background: #fff1e7;

    color: #ff5a1f;

    font-size: 12px;

    padding: 4px 8px;

    border-radius: 20px;

    margin-left: 6px;

    vertical-align: middle;

}


@media (max-width: 650px) {

    .container {

        width: 100%;

        padding: 12px;

    }

}

</style>

</head>


<body>


<header>

    <h1>
        🍜 MDY FOOD
    </h1>

    <p>
        缅甸外卖 · အစားအစာ Delivery
    </p>

</header>


<div class="container">


    <!-- =========================
         用户账号
    ========================= -->

    <div
        class="account-box"
        id="accountBox"
    >

        <!-- 未登录 -->

        <div id="loggedOut">

            <a
                href="login.html"
                class="account-login"
            >
                👤 登录 / 注册
            </a>

        </div>


        <!-- 已登录 -->

        <div
            id="loggedIn"
            style="display:none;"
        >

            <div class="account-user">

                👋 欢迎回来，

                <strong id="userEmail">
                    用户
                </strong>

            </div>


            <div class="account-buttons">

                <a href="orders.html">
                    📦 我的订单
                </a>

                <button
                    class="logout-btn"
                    onclick="logout()"
                >
                    退出登录
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         搜索
    ========================= -->

    <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="搜索餐厅 / အစားအစာ ရှာရန်"
        oninput="searchRestaurants()"
    >


    <!-- =========================
         我的订单
    ========================= -->

    <a
        href="orders.html"
        class="orders-link"
    >
        📦 我的订单
    </a>


    <!-- =========================
         错误
    ========================= -->

    <div
        id="errorBox"
        class="error-box"
    ></div>


    <!-- =========================
         餐厅列表
    ========================= -->

    <div id="restaurantList">

        <div class="loading">

            🍜 正在读取餐厅...

        </div>

    </div>


</div>


<script>


/* =========================================================
   Firebase
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();


/* =========================================================
   全局
========================================================= */

let allRestaurants = [];


/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   用户登录状态
========================================================= */

auth.onAuthStateChanged(
    function(user) {

        const loggedOut =
            document.getElementById(
                "loggedOut"
            );

        const loggedIn =
            document.getElementById(
                "loggedIn"
            );

        const userEmail =
            document.getElementById(
                "userEmail"
            );


        if (user) {

            loggedOut.style.display =
                "none";

            loggedIn.style.display =
                "block";


            userEmail.innerText =
                user.email ||
                "用户";

        }

        else {

            loggedOut.style.display =
                "block";

            loggedIn.style.display =
                "none";

        }

    }
);


/* =========================================================
   退出登录
========================================================= */

async function logout() {

    try {

        await auth.signOut();

        alert(
            "已退出登录"
        );

    }

    catch (error) {

        console.error(
            error
        );

        alert(
            "退出登录失败，请稍后再试"
        );

    }

}


/* =========================================================
   读取所有商家
========================================================= */

async function loadRestaurants() {

    const container =
        document.getElementById(
            "restaurantList"
        );


    try {

        container.innerHTML = `

            <div class="loading">

                🍜 正在读取餐厅...

            </div>

        `;


        const snapshot =
            await db
                .collection("restaurants")
                .get();


        allRestaurants = [];


        snapshot.forEach(
            function(doc) {

                const data =
                    doc.data();


                allRestaurants.push({

                    id: doc.id,

                    ...data

                });

            }
        );


        /*
         * 只显示：
         *
         * 1. 审核通过
         * 2. 没有明确被禁用
         *
         * 这样新商家审核通过以后
         * 就会自动出现在顾客端。
         */

        allRestaurants =
            allRestaurants.filter(
                function(restaurant) {

                    const approvalStatus =
                        String(
                            restaurant.approvalStatus ||
                            ""
                        ).toLowerCase();


                    const status =
                        String(
                            restaurant.status ||
                            ""
                        ).toLowerCase();


                    const enabled =
                        restaurant.enabled;


                    /*
                     * 如果明确 enabled=false
                     * 就不显示
                     */

                    if (
                        enabled === false
                    ) {

                        return false;

                    }


                    /*
                     * 如果明确是 rejected
                     * 不显示
                     */

                    if (
                        approvalStatus === "rejected" ||
                        status === "rejected"
                    ) {

                        return false;

                    }


                    /*
                     * 如果有审核字段，
                     * 必须是 approved
                     */

                    if (
                        approvalStatus &&
                        approvalStatus !== "approved"
                    ) {

                        return false;

                    }


                    /*
                     * 兼容旧商家
                     *
                     * 有些老商家可能没有
                     * approvalStatus 字段。
                     */

                    return true;

                }
            );


        /*
         * 排序
         *
         * 新商家也会正常显示。
         */

        allRestaurants.sort(
            function(a, b) {

                const timeA =
                    getTimestamp(
                        a.createdAt
                    );


                const timeB =
                    getTimestamp(
                        b.createdAt
                    );


                return timeB - timeA;

            }
        );


        renderRestaurants(
            allRestaurants
        );


    }

    catch (error) {

        console.error(
            "读取餐厅失败：",
            error
        );


        container.innerHTML = `

            <div class="empty">

                ⚠️ 餐厅读取失败

                <br><br>

                ${escapeHtml(
                    error.message ||
                    "请稍后再试"
                )}

            </div>

        `;


        const errorBox =
            document.getElementById(
                "errorBox"
            );


        errorBox.textContent =
            "读取商家失败：" +
            (
                error.message ||
                "未知错误"
            );


        errorBox.style.display =
            "block";

    }

}


/* =========================================================
   时间转换
========================================================= */

function getTimestamp(
    value
) {

    if (!value) {

        return 0;

    }


    if (
        value &&
        typeof value.toDate ===
        "function"
    ) {

        return value
            .toDate()
            .getTime();

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return 0;

    }


    return date.getTime();

}


/* =========================================================
   渲染餐厅
========================================================= */

function renderRestaurants(
    restaurants
) {

    const container =
        document.getElementById(
            "restaurantList"
        );


    if (!restaurants.length) {

        container.innerHTML = `

            <div class="empty">

                🍜 目前还没有可点餐的餐厅

                <br><br>

                请稍后再来看看。

            </div>

        `;

        return;

    }


    container.innerHTML =
        restaurants
            .map(
                function(restaurant) {

                    return createRestaurantHtml(
                        restaurant
                    );

                }
            )
            .join("");


}


/* =========================================================
   创建餐厅卡片
========================================================= */

function createRestaurantHtml(
    restaurant
) {

    const id =
        restaurant.id;


    const name =
        restaurant.name ||
        restaurant.restaurantName ||
        "我的餐厅";


    const category =
        restaurant.category ||
        restaurant.restaurantType ||
        "餐厅";


    const description =
        restaurant.description ||
        restaurant.restaurantDescription ||
        "欢迎光临";


    const restaurantStatus =
        String(
            restaurant.status ||
            "营业中"
        );


    /*
     * 新商家判断
     *
     * 最近 7 天创建的商家显示
     * “新商家”
     */

    const createdTime =
        getTimestamp(
            restaurant.createdAt
        );


    const isNew =
        createdTime > 0 &&
        (
            Date.now() -
            createdTime
        ) <
        (
            7 *
            24 *
            60 *
            60 *
            1000
        );


    const rating =
        restaurant.rating;


    let ratingText =
        "暂无评分";


    if (
        rating !== undefined &&
        rating !== null &&
        rating !== ""
    ) {

        ratingText =
            Number(rating)
                .toFixed(1);

    }


    let statusHtml = "";

    let buttonHtml = "";


    if (
        restaurantStatus === "营业中" ||
        restaurantStatus === "open" ||
        restaurantStatus === "online"
    ) {

        statusHtml = `

            <div class="status open-status">

                🟢 营业中

            </div>

        `;


        buttonHtml = `

            <button
                onclick="openRestaurant('${escapeHtml(id)}')"
            >
                查看菜单
            </button>

        `;

    }

    else {

        statusHtml = `

            <div class="status closed-status">

                🔴 休息中

            </div>

        `;


        buttonHtml = `

            <button
                class="closed"
                onclick="showClosedMessage()"
            >
                休息中
            </button>

        `;

    }


    return `

        <div
            class="restaurant"
            data-restaurant-id="${escapeHtml(id)}"
        >

            <h2>

                ${escapeHtml(name)}

                ${
                    isNew
                        ? `
                            <span class="new-badge">
                                新商家
                            </span>
                          `
                        : ""
                }

            </h2>


            <div class="category">

                ${escapeHtml(category)}

            </div>


            <div class="description">

                ${escapeHtml(description)}

            </div>


            <div class="rating">

                ⭐ ${escapeHtml(ratingText)}

            </div>


            ${statusHtml}


            ${buttonHtml}

        </div>

    `;

}


/* =========================================================
   打开餐厅
========================================================= */

function openRestaurant(
    id
) {

    if (!id) {

        alert(
            "餐厅信息错误。"
        );

        return;

    }


    window.location.href =
        "menu.html?id=" +
        encodeURIComponent(id);

}


/* =========================================================
   休息提示
========================================================= */

function showClosedMessage() {

    alert(
        "这家餐厅目前休息中，请稍后再来。"
    );

}


/* =========================================================
   搜索
========================================================= */

function searchRestaurants() {

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const cards =
        document.querySelectorAll(
            ".restaurant"
        );


    cards.forEach(
        function(card) {

            const text =
                card.innerText
                    .toLowerCase();


            if (
                text.includes(keyword)
            ) {

                card.style.display =
                    "";

            }

            else {

                card.style.display =
                    "none";

            }

        }
    );

}


/* =========================================================
   启动
========================================================= */

loadRestaurants();


</script>


</body>

</html>
