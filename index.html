<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MDY FOOD</title>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}


body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}


header {
    background: #ff5a1f;
    color: white;
    padding: 22px 15px;
    text-align: center;
}


header h1 {
    margin: 0;
    font-size: 28px;
}


header p {
    margin: 7px 0 0;
    font-size: 14px;
}


.container {
    max-width: 800px;
    margin: auto;
    padding: 15px;
}


/* =========================
   用户账号
========================= */

.account-box {
    background: white;
    border-radius: 12px;
    margin-bottom: 15px;
    padding: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    text-align: center;
}


.account-login {
    display: block;
    width: 100%;
    padding: 13px;
    background: #ff5a1f;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
}


.account-user {
    font-size: 14px;
    color: #555;
    margin-bottom: 10px;
}


.account-user strong {
    color: #ff5a1f;
}


.account-buttons {
    display: flex;
    gap: 10px;
}


.account-buttons a,
.logout-btn {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
}


.account-buttons a {
    background: #fff1ed;
    color: #ff5a1f;
}


.logout-btn {
    border: none;
    background: #eee;
    color: #555;
}


/* =========================
   搜索
========================= */

.search {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    outline: none;
}


.search:focus {
    box-shadow: 0 0 0 2px #ff5a1f;
}


/* =========================
   分类
========================= */

.category-bar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin: 12px 0 15px;
    padding-bottom: 3px;
}


.category-bar::-webkit-scrollbar {
    display: none;
}


.category-btn {
    flex-shrink: 0;
    border: none;
    background: white;
    color: #555;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}


.category-btn.active {
    background: #ff5a1f;
    color: white;
    font-weight: bold;
}


/* =========================
   我的订单
========================= */

.orders-link {
    display: block;
    margin: 15px 0;
    padding: 14px;
    background: white;
    color: #ff5a1f;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    font-weight: bold;
}


/* =========================
   餐厅
========================= */

#restaurantList {
    display: flex;
    flex-direction: column;
}


.restaurant {
    background: white;
    border-radius: 14px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}


.restaurant-image-box {
    position: relative;
    width: 100%;
    height: 190px;
    overflow: hidden;
    background: #eee;
}


.restaurant-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}


.image-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        135deg,
        #fff1eb,
        #ffe0d4
    );
    color: #ff5a1f;
    font-size: 55px;
}


.status-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 7px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}


.status-badge.open {
    color: #238b57;
}


.status-badge.closed {
    color: #d33;
}


.restaurant-content {
    padding: 17px;
}


.restaurant h2 {
    margin: 0 0 7px;
    font-size: 21px;
}


.category {
    color: #777;
    font-size: 14px;
    margin-bottom: 8px;
}


.description {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 9px;
}


.restaurant-info {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 13px;
    font-size: 13px;
    color: #666;
}


.restaurant-rating {
    color: #f59e0b;
    font-weight: bold;
}


.food-count {
    color: #666;
}


.food-match {
    display: none;
    margin-bottom: 12px;
    padding: 9px 12px;
    background: #fff4ef;
    border-radius: 8px;
    color: #ff5a1f;
    font-size: 13px;
}


.restaurant button {
    width: 100%;
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}


.restaurant button:hover {
    opacity: 0.9;
}


.restaurant button.closed {
    background: #999 !important;
}


.no-menu {
    background: #999 !important;
}


/* =========================
   Loading
========================= */

.loading {
    background: white;
    border-radius: 12px;
    padding: 35px 15px;
    text-align: center;
    color: #777;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 18px;
}


.loading-icon {
    font-size: 38px;
    margin-bottom: 10px;
}


/* =========================
   无结果
========================= */

#noResult {
    display: none;
    background: white;
    border-radius: 12px;
    padding: 30px 15px;
    text-align: center;
    color: #777;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}


.no-result-icon {
    font-size: 40px;
    margin-bottom: 10px;
}


.no-result-title {
    font-size: 17px;
    font-weight: bold;
    color: #555;
    margin-bottom: 6px;
}


.no-result-text {
    font-size: 14px;
}


/* =========================
   错误
========================= */

.error-box {
    background: white;
    border-radius: 12px;
    padding: 30px 15px;
    text-align: center;
    color: #777;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 18px;
}


/* =========================
   手机
========================= */

@media (max-width: 500px) {

    header {
        padding: 18px 12px;
    }


    header h1 {
        font-size: 25px;
    }


    .container {
        padding: 12px;
    }


    .restaurant-image-box {
        height: 170px;
    }


    .restaurant-content {
        padding: 15px;
    }

}

</style>

</head>

<header>

    <h1>
        🍜 MDY FOOD
    </h1>

    <p>
        缅甸外卖 · အစားအစာ Delivery

</header>


<div class="container">


    <!-- =========================

<script>


// =========================
// Firebase
// =========================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();


// =========================
// 全局数据
// =========================

let currentCategory =
    "全部";


let allFoods = [];


let allRestaurants = [];


// =========================
// 评价实时监听
// =========================

let reviewsUnsubscribe =
    null;


// =========================
// 默认图片
// =========================

const defaultImages = {

    "川菜":
        "https://images.unsplash.com/photo-1582450871972-ab5ca641643d",

    "缅甸菜":
        "",

    "烧烤":
        ""

};


// =========================
// 登录状态
// =========================

auth.onAuthStateChanged(
    function(user) {

        const loggedOut =
            document.getElementById(
                "loggedOut"
            );


        const loggedIn =
            document.getElementById(
                "loggedIn"
            );


        const userEmail =
            document.getElementById(
                "userEmail"
            );


        if (user) {

            loggedOut.style.display =
                "none";


            loggedIn.style.display =
                "block";


            userEmail.innerText =
                user.email ||
                "用户";

        } else {

            loggedOut.style.display =
                "block";


            loggedIn.style.display =
                "none";

        }

    }
);


// =========================
// 退出登录
// =========================

async function logout() {

    try {

        await auth.signOut();

        alert(
            "已退出登录"
        );

    } catch (error) {

        console.error(error);

        alert(
            "退出登录失败，请稍后再试"
        );

    }

}


// =========================
// 分类名称
// =========================

function getCategoryName(
    category
) {

    if (!category) {

        return "其他";

    }


    const value =
        String(category)
            .trim();


    if (
        value.includes("川") ||
        value.includes("四川")
    ) {

        return "川菜";

    }


    if (
        value.includes("缅甸") ||
        value.includes("Myanmar") ||
        value.includes("Myanmar Food")
    ) {

        return "缅甸菜";

    }


    if (
        value.includes("烧烤") ||
        value.includes("夜宵")
    ) {

        return "烧烤";

    }


    return value;

}


// =========================
// 默认图标
// =========================

function getRestaurantIcon(
    category
) {

    const normalized =
        getCategoryName(
            category
        );


    if (
        normalized === "川菜"
    ) {

        return "🌶️";

    }


    if (
        normalized === "缅甸菜"
    ) {

        return "🇲🇲";

    }


    if (
        normalized === "烧烤"
    ) {

        return "🔥";

    }


    return "🍜";

}


// =========================
// 设置图片
// =========================

function getRestaurantImage(
    restaurant
) {

    if (
        restaurant.image
    ) {

        return restaurant.image;

    }


    const category =
        getCategoryName(
            restaurant.category ||
            restaurant.restaurantType ||
            ""
        );


    return (
        defaultImages[category] ||
        ""
    );

}


// =========================
// 创建餐厅卡片
// =========================

function createRestaurantCard(
    restaurant,
    id
) {

    const name =
        restaurant.name ||
        restaurant.restaurantName ||
        "MDY FOOD 餐厅";


    const category =
        restaurant.category ||
        restaurant.restaurantType ||
        "餐厅";


    const normalizedCategory =
        getCategoryName(
            category
        );


    const description =
        restaurant.description ||
        restaurant.restaurantDescription ||
        "欢迎光临";


    const status =
        restaurant.status ||
        (
            restaurant.enabled === false
                ? "休息中"
                : "营业中"
        );


    const image =
        getRestaurantImage(
            restaurant
        );


    const icon =
        getRestaurantIcon(
            category
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "restaurant";


    card.dataset.category =
        normalizedCategory;


    card.dataset.restaurantId =
        id;


    card.dataset.name =
        name.toLowerCase();


    card.dataset.description =
        description.toLowerCase();


    card.innerHTML = `

        <div class="restaurant-image-box">

            ${
                image
                ?
                `
                <img
                    class="restaurant-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                >

                <div
                    class="image-placeholder"
                    style="display:none;"
                >
                    ${icon}
                </div>
                `
                :
                `
                <div class="image-placeholder">
                    ${icon}
                </div>
                `
            }

            <div
                class="status-badge ${
                    status === "营业中"
                        ? "open"
                        : "closed"
                }"
            >

                ${
                    status === "营业中"
                        ? "🟢 营业中"
                        : "🔴 休息中"
                }

            </div>

        </div>


        <div class="restaurant-content">

            <h2>
                ${escapeHtml(name)}
            </h2>


            <div class="category">
                ${escapeHtml(normalizedCategory)}
            </div>


            <div class="description">
                ${escapeHtml(description)}
            </div>


            <div class="restaurant-info">

                <span
                    class="restaurant-rating"
                    id="rating-${id}"
                >
                    ⭐ 读取评价中
                </span>


                <span
                    class="food-count"
                    id="food-count-${id}"
                >
                    🍽️ 菜品读取中
                </span>

            </div>


            <div
                class="food-match"
                id="food-match-${id}"
            >
            </div>


            <button
                id="button-${id}"
                class="${
                    status === "营业中"
                        ? ""
                        : "closed"
                }"
                onclick="openRestaurant('${escapeJs(id)}')"
            >

                ${
                    status === "营业中"
                        ? "查看菜单"
                        : "休息中"
                }

            </button>

        </div>

    `;


    return card;

}


// =========================
// 防止 HTML 注入
// =========================

function escapeHtml(
    value
) {

    return String(
        value || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// =========================
// 防止 JS 注入
// =========================

function escapeJs(
    value
) {

    return String(
        value || ""
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


// =========================
// 读取所有商家
// =========================

async function loadRestaurants() {

    const restaurantList =
        document.getElementById(
            "restaurantList"
        );


    restaurantList.innerHTML = `

        <div class="loading">

            <div class="loading-icon">
                🍜
            </div>

            正在读取餐厅...

        </div>

    `;


    try {

        const snapshot =
            await db
                .collection("restaurants")
                .get();


        allRestaurants = [];


        snapshot.forEach(
            function(doc) {

                const restaurant =
                    doc.data() || {};


                /*
                 * 只显示正式可用的商家
                 */

                const approvalStatus =
                    String(
                        restaurant.approvalStatus ||
                        ""
                    )
                    .toLowerCase();


                const approved =
                    restaurant.approved === true ||
                    approvalStatus === "approved";


                const enabled =
                    restaurant.enabled !== false;


                const shouldShow =
                    enabled &&
                    (
                        approved ||
                        (
                            !restaurant.approvalStatus &&
                            restaurant.enabled !== false
                        )
                    );


                if (!shouldShow) {

                    return;

                }


                allRestaurants.push({

                    id: doc.id,

                    ...restaurant

                });

            }
        );


        /*
         * 新商家优先
         */

        allRestaurants.sort(
            function(a, b) {

                const timeA =
                    getTimestampMillis(
                        a.createdAt ||
                        a.approvedAt
                    );


                const timeB =
                    getTimestampMillis(
                        b.createdAt ||
                        b.approvedAt
                    );


                return (
                    timeB - timeA
                );

            }
        );


        restaurantList.innerHTML =
            "";


        if (
            allRestaurants.length === 0
        ) {

            restaurantList.innerHTML = `

                <div class="error-box">

                    <div style="font-size:40px;">
                        🍜
                    </div>

                    <div
                        style="
                            font-size:17px;
                            font-weight:bold;
                            margin:10px 0;
                        "
                    >
                        暂时还没有营业餐厅
                    </div>

                    <div>
                        请稍后再来看看
                    </div>

                </div>

            `;

            return;

        }


        /*
         * 创建全部商家卡片
         */

        allRestaurants.forEach(
            function(restaurant) {

                const card =
                    createRestaurantCard(
                        restaurant,
                        restaurant.id
                    );


                restaurantList.appendChild(
                    card
                );


                /*
                 * 每家商家自己的菜品数量
                 */

                updateFoodCount(
                    restaurant.id
                );

            }
        );


        /*
         * 启动一次全局评价实时监听
         *
         * 不管以后有 1 家、10 家还是 100 家商家，
         * 都按照 restaurantId 自动分开统计。
         */

        loadAllRestaurantRatings();


        searchRestaurants();


    } catch (error) {

        console.error(
            "读取餐厅失败:",
            error
        );


        restaurantList.innerHTML = `

            <div class="error-box">

                <div style="font-size:40px;">
                    ⚠️
                </div>

                <div
                    style="
                        font-size:17px;
                        font-weight:bold;
                        margin:10px 0;
                    "
                >
                    餐厅读取失败
                </div>

                <div>
                    ${escapeHtml(
                        error.message ||
                        "请检查网络连接"
                    )}
                </div>

            </div>

        `;

    }

}


// =========================
// 时间转换
// =========================

function getTimestampMillis(
    value
) {

    if (!value) {

        return 0;

    }


    if (
        value &&
        typeof value.toMillis ===
        "function"
    ) {

        return value.toMillis();

    }


    if (
        value &&
        value.seconds
    ) {

        return (
            value.seconds *
            1000
        );

    }


    const date =
        new Date(value);


    if (
        !isNaN(
            date.getTime()
        )
    ) {

        return date.getTime();

    }


    return 0;

}


// =========================
// 读取所有商家的评价
// =========================

function loadAllRestaurantRatings() {

    /*
     * 如果之前已经建立过监听，
     * 先取消，避免重复监听。
     */

    if (
        reviewsUnsubscribe
    ) {

        reviewsUnsubscribe();

        reviewsUnsubscribe =
            null;

    }


    /*
     * 一次监听 reviews 集合。
     *
     * 每条评价都有 restaurantId。
     *
     * 我们根据 restaurantId 分组：
     *
     * 四川饭馆 → 四川饭馆自己的评价
     * 烧烤店 → 烧烤店自己的评价
     * 其他商家 → 其他商家自己的评价
     */

    reviewsUnsubscribe =
        db.collection("reviews")
            .onSnapshot(

                function(snapshot) {

                    const ratingMap = {};


                    snapshot.forEach(
                        function(doc) {

                            const review =
                                doc.data() ||
                                {};


                            const restaurantId =
                                String(
                                    review.restaurantId ||
                                    ""
                                );


                            if (
                                !restaurantId
                            ) {

                                return;

                            }


                            const rating =
                                Number(
                                    review.rating ||
                                    review.star ||
                                    review.stars ||
                                    review.score ||
                                    0
                                );


                            if (
                                rating < 1 ||
                                rating > 5
                            ) {

                                return;

                            }


                            if (
                                !ratingMap[
                                    restaurantId
                                ]
                            ) {

                                ratingMap[
                                    restaurantId
                                ] = {

                                    total: 0,

                                    count: 0

                                };

                            }


                            ratingMap[
                                restaurantId
                            ].total +=
                                rating;


                            ratingMap[
                                restaurantId
                            ].count +=
                                1;

                        }
                    );


                    /*
                     * 更新每一家商家的评分
                     */

                    allRestaurants.forEach(
                        function(restaurant) {

                            const data =
                                ratingMap[
                                    restaurant.id
                                ];


                            const element =
                                document.getElementById(
                                    "rating-" +
                                    restaurant.id
                                );


                            if (!element) {

                                return;

                            }


                            if (
                                !data ||
                                data.count === 0
                            ) {

                                element.innerText =
                                    "⭐ 暂无评价";

                                return;

                            }


                            const average =
                                data.total /
                                data.count;


                            element.innerText =
                                "⭐ " +
                                average.toFixed(1) +
                                " · " +
                                data.count +
                                "条评价";

                        }
                    );

                },

                function(error) {

                    console.error(
                        "读取所有商家评价失败:",
                        error
                    );


                    /*
                     * 出错时不要影响餐厅和菜单。
                     * 只把评分显示为暂无评价。
                     */

                    allRestaurants.forEach(
                        function(restaurant) {

                            const element =
                                document.getElementById(
                                    "rating-" +
                                    restaurant.id
                                );


                            if (element) {

                                element.innerText =
                                    "⭐ 暂无评价";

                            }

                        }
                    );

                }

            );

}


// =========================
// 菜品数量
// =========================

async function updateFoodCount(
    restaurantId
) {

    const element =
        document.getElementById(
            "food-count-" +
            restaurantId
        );


    if (!element) {

        return;

    }


    try {

        const snapshot =
            await db
                .collection("foods")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();


        let count = 0;


        snapshot.forEach(
            function(doc) {

                const food =
                    doc.data() || {};


                /*
                 * 下架菜品不计算
                 */

                if (
                    food.status !==
                    "下架"
                ) {

                    count++;

                }

            }
        );


        element.innerText =
            "🍽️ " +
            count +
            " 道菜品";


    } catch (error) {

        console.error(
            "菜品数量读取失败:",
            error
        );


        element.innerText =
            "🍽️ 菜品";

    }

}


// =========================
// 查找菜品
// =========================

function findFoodMatches(
    restaurantId,
    keyword
) {

    if (!keyword) {

        return [];

    }


    return allFoods.filter(
        function(food) {

            const foodRestaurantId =
                food.restaurantId ||
                "";


            const foodName =
                String(
                    food.name ||
                    ""
                )
                .toLowerCase();


            const foodDescription =
                String(
                    food.description ||
                    ""
                )
                .toLowerCase();


            const foodStatus =
                food.status ||
                "营业中";


            if (
                foodStatus ===
                "下架"
            ) {

                return false;

            }


            return (
                foodRestaurantId ===
                restaurantId
                &&
                (
                    foodName.includes(
                        keyword
                    )
                    ||
                    foodDescription.includes(
                        keyword
                    )
                )
            );

        }
    );

}


// =========================
// 搜索
// =========================

function searchRestaurants() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const keyword =
        input.value
            .trim()
            .toLowerCase();


    const restaurants =
        document.querySelectorAll(
            ".restaurant"
        );


    let visibleCount = 0;


    restaurants.forEach(
        function(restaurant) {

            const restaurantText =
                restaurant.innerText
                    .toLowerCase();


            const category =
                restaurant.dataset.category ||
                "";


            const restaurantId =
                restaurant.dataset.restaurantId ||
                "";


            const foodMatches =
                findFoodMatches(
                    restaurantId,
                    keyword
                );


            const foodMatch =
                foodMatches.length > 0;


            const keywordMatch =
                !keyword ||
                restaurantText.includes(
                    keyword
                ) ||
                foodMatch;


            const categoryMatch =
                currentCategory ===
                "全部" ||
                category ===
                currentCategory;


            const show =
                keywordMatch &&
                categoryMatch;


            if (show) {

                restaurant.style.display =
                    "";

                visibleCount++;

            } else {

                restaurant.style.display =
                    "none";

            }


            const foodMatchElement =
                document.getElementById(
                    "food-match-" +
                    restaurantId
                );


            if (
                foodMatchElement
            ) {

                if (
                    keyword &&
                    foodMatches.length > 0
                ) {

                    const names =
                        foodMatches
                            .slice(0, 3)
                            .map(
                                function(food) {

                                    return (
                                        food.name ||
                                        "菜品"
                                    );

                                }
                            );


                    foodMatchElement.innerText =
                        "🍽️ 找到菜品：" +
                        names.join("、");


                    if (
                        foodMatches.length > 3
                    ) {

                        foodMatchElement.innerText +=
                            " 等";

                    }


                    foodMatchElement.style.display =
                        "block";

                } else {

                    foodMatchElement.style.display =
                        "none";

                }

            }

        }
    );


    const noResult =
        document.getElementById(
            "noResult"
        );


    if (
        visibleCount === 0 &&
        allRestaurants.length > 0
    ) {

        noResult.style.display =
            "block";

    } else {

        noResult.style.display =
            "none";

    }

}


// =========================
// 分类筛选
// =========================

function filterCategory(
    category,
    button
) {

    currentCategory =
        category;


    const buttons =
        document.querySelectorAll(
            ".category-btn"
        );


    buttons.forEach(
        function(btn) {

            btn.classList.remove(
                "active"
            );

        }
    );


    button.classList.add(
        "active"
    );


    searchRestaurants();

}


// =========================
// 打开餐厅
// =========================

function openRestaurant(
    id
) {

    if (!id) {

        alert(
            "这家餐厅的菜单还在准备中"
        );

        return;

    }


    const restaurant =
        allRestaurants.find(
            function(item) {

                return (
                    item.id === id
                );

            }
        );


    if (restaurant) {

        const status =
            restaurant.status ||
            (
                restaurant.enabled === false
                    ? "休息中"
                    : "营业中"
            );


        if (
            status !== "营业中"
        ) {

            alert(
                "这家餐厅目前休息中，请稍后再来"
            );

            return;

        }

    }


    window.location.href =
        "menu.html?id=" +
        encodeURIComponent(id);

}


// =========================
// 读取所有菜品
// =========================

async function loadFoods() {

    try {

        const snapshot =
            await db
                .collection("foods")
                .get();


        allFoods = [];


        snapshot.forEach(
            function(doc) {

                const food =
                    doc.data() || {};


                allFoods.push({

                    id: doc.id,

                    ...food

                });

            }
        );


        searchRestaurants();


    } catch (error) {

        console.error(
            "读取菜品失败:",
            error
        );

    }

}


// =========================
// 页面启动
// =========================

async function init() {

    await Promise.all([

        loadRestaurants(),

        loadFoods()

    ]);

}


init();


</script>
