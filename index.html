<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MDY FOOD - Mandalay Food Delivery</title>


    <!-- Firebase 10.12.2 -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            background:
                #f7f7f7;

            color: #222;

            padding-bottom: 75px;

        }


        button,
        input {
            font-family: inherit;
        }


        /* ========================================
           顶部
        ======================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            background:
                linear-gradient(
                    135deg,
                    #ff5a1f,
                    #ff7043
                );

            color: white;

            padding:
                16px 15px 18px;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.12);

        }


        .header-inner {

            max-width: 800px;

            margin: 0 auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

        }


        .brand {

            min-width: 0;

        }


        .brand-title {

            margin: 0;

            font-size: 25px;

            font-weight: 800;

            letter-spacing: 0.3px;

        }


        .brand-subtitle {

            margin-top: 4px;

            font-size: 12px;

            opacity: 0.9;

        }


        .header-order-btn {

            flex-shrink: 0;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            min-width: 88px;

            padding: 9px 12px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.18);

            border:
                1px solid
                rgba(255,255,255,0.35);

            color: white;

            text-decoration: none;

            font-size: 13px;

            font-weight: bold;

            backdrop-filter: blur(8px);

        }


        /* ========================================
           主容器
        ======================================== */

        .container {

            max-width: 800px;

            margin: 0 auto;

            padding:
                15px 15px 25px;

        }


        /* ========================================
           欢迎区域
        ======================================== */

        .welcome-box {

            position: relative;

            overflow: hidden;

            margin-bottom: 14px;

            padding: 20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #fff4ef,
                    #fffaf8
                );

            border:
                1px solid
                #ffe2d7;

        }


        .welcome-box::after {

            content: "🍜";

            position: absolute;

            right: 18px;

            bottom: -8px;

            font-size: 70px;

            opacity: 0.13;

            transform: rotate(-10deg);

        }


        .welcome-title {

            position: relative;

            z-index: 1;

            margin: 0;

            font-size: 20px;

            font-weight: 800;

            color: #222;

        }


        .welcome-text {

            position: relative;

            z-index: 1;

            margin:
                6px 0 0;

            color: #777;

            font-size: 13px;

            line-height: 1.6;

        }


        /* ========================================
           用户账号
        ======================================== */

        .account-box {

            background: white;

            border-radius: 16px;

            margin-bottom: 14px;

            padding: 14px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

        }


        .account-login {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            width: 100%;

            padding: 13px;

            background:
                #fff1ed;

            color:
                #ff5a1f;

            text-decoration: none;

            border-radius: 11px;

            font-weight: bold;

            font-size: 15px;

        }


        .account-user {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

        }


        .account-user-info {

            min-width: 0;

        }


        .account-welcome {

            color: #999;

            font-size: 12px;

            margin-bottom: 3px;

        }


        .account-user strong {

            display: block;

            color: #222;

            font-size: 15px;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            max-width: 230px;

        }


        .account-actions {

            flex-shrink: 0;

            display: flex;

            gap: 7px;

        }


        .account-action {

            border: none;

            padding:
                9px 11px;

            border-radius: 9px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            white-space: nowrap;

        }


        .account-action.order {

            background:
                #fff1ed;

            color:
                #ff5a1f;

        }


        .account-action.logout {

            background:
                #f1f1f1;

            color:
                #666;

        }


        /* ========================================
           搜索区域
        ======================================== */

        .search-section {

            margin-bottom: 15px;

        }


        .search-label {

            margin:
                0 0 8px 2px;

            font-size: 14px;

            font-weight: bold;

            color: #444;

        }


        .search-wrap {

            position: relative;

        }


        .search-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;

            pointer-events: none;

        }


        .search {

            width: 100%;

            padding:
                14px 44px 14px 44px;

            border:
                1px solid
                #eeeeee;

            border-radius: 13px;

            font-size: 15px;

            background: white;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

            outline: none;

            transition:
                0.2s ease;

        }


        .search:focus {

            border-color:
                #ff5a1f;

            box-shadow:
                0 0 0 3px
                rgba(255,90,31,0.10);

        }


        .search-clear {

            position: absolute;

            right: 10px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 30px;

            height: 30px;

            border: none;

            border-radius: 50%;

            background:
                #f0f0f0;

            color: #777;

            cursor: pointer;

            display: none;

        }


        /* ========================================
           分类
        ======================================== */

        .section-heading {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin:
                5px 2px 9px;

        }


        .section-heading h2 {

            margin: 0;

            font-size: 17px;

        }


        .section-heading span {

            font-size: 12px;

            color: #999;

        }


        .category-bar {

            display: flex;

            gap: 9px;

            overflow-x: auto;

            margin:
                0 0 17px;

            padding:
                2px 2px 5px;

            scrollbar-width: none;

        }


        .category-bar::-webkit-scrollbar {

            display: none;

        }


        .category-btn {

            flex-shrink: 0;

            border:
                1px solid
                #eeeeee;

            background: white;

            color: #555;

            padding:
                9px 15px;

            border-radius: 22px;

            font-size: 13px;

            cursor: pointer;

            box-shadow:
                0 2px 7px
                rgba(0,0,0,0.05);

            transition:
                0.2s ease;

        }


        .category-btn.active {

            background:
                #ff5a1f;

            border-color:
                #ff5a1f;

            color: white;

            font-weight: bold;

            box-shadow:
                0 4px 10px
                rgba(255,90,31,0.22);

        }


        /* ========================================
           我的订单快捷入口
        ======================================== */

        .quick-order {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 18px;

            padding:
                14px 15px;

            background: white;

            border-radius: 14px;

            text-decoration: none;

            color: #222;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

        }


        .quick-order-left {

            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;

        }


        .quick-order-icon {

            width: 42px;

            height: 42px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background:
                #fff1ed;

            font-size: 21px;

        }


        .quick-order-title {

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 3px;

        }


        .quick-order-desc {

            font-size: 12px;

            color: #999;

        }


        .quick-order-arrow {

            color:
                #ff5a1f;

            font-size: 22px;

        }


        /* ========================================
           餐厅列表标题
        ======================================== */

        .restaurant-heading {

            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            margin:
                0 2px 11px;

        }


        .restaurant-heading h2 {

            margin: 0;

            font-size: 19px;

        }


        .restaurant-heading span {

            color: #999;

            font-size: 12px;

        }


        /* ========================================
           餐厅列表
        ======================================== */

        #restaurantList {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        /* ========================================
           餐厅卡片
        ======================================== */

        .restaurant {

            position: relative;

            background: white;

            border-radius: 17px;

            overflow: hidden;

            box-shadow:
                0 4px 16px
                rgba(0,0,0,0.07);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;

        }


        .restaurant:active {

            transform:
                scale(0.99);

        }


        .restaurant-image-box {

            position: relative;

            width: 100%;

            height: 205px;

            overflow: hidden;

            background: #eeeeee;

        }


        .restaurant-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.35s ease;

        }


        .restaurant:hover
        .restaurant-image {

            transform:
                scale(1.03);

        }


        .image-placeholder {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #fff2ec,
                    #ffe2d6
                );

            color:
                #ff5a1f;

            font-size: 58px;

        }


        .status-badge {

            position: absolute;

            top: 12px;

            left: 12px;

            padding:
                7px 11px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            background:
                rgba(255,255,255,0.95);

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.14);

            backdrop-filter:
                blur(5px);

        }


        .status-badge.open {

            color:
                #218c55;

        }


        .status-badge.closed {

            color:
                #d33;

        }


        .restaurant-content {

            padding:
                15px 16px 16px;

        }


        .restaurant-title-row {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 6px;

        }


        .restaurant h2 {

            margin: 0;

            font-size: 20px;

            line-height: 1.3;

            color: #222;

        }


        .restaurant-category-tag {

            flex-shrink: 0;

            padding:
                4px 8px;

            border-radius: 7px;

            background:
                #f7f7f7;

            color: #777;

            font-size: 11px;

        }


        .description {

            color: #777;

            font-size: 13px;

            line-height: 1.55;

            margin-bottom: 10px;

            display:
                -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient:
                vertical;

            overflow: hidden;

        }


        .restaurant-info {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;

            margin-bottom: 12px;

            font-size: 12px;

        }


        .restaurant-rating {

            display: inline-flex;

            align-items: center;

            padding:
                5px 8px;

            border-radius: 7px;

            background:
                #fff8e7;

            color:
                #e89b00;

            font-weight: bold;

        }


        .food-count {

            color: #777;

            padding:
                5px 0;

        }


        .food-match {

            display: none;

            margin-bottom: 11px;

            padding:
                9px 11px;

            background:
                #fff5f0;

            border-radius: 9px;

            color:
                #e95620;

            font-size: 12px;

            line-height: 1.5;

        }


        .restaurant-bottom {

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .restaurant button {

            flex: 1;

            width: 100%;

            border: none;

            background:
                #ff5a1f;

            color: white;

            padding:
                13px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.18s ease;

        }


        .restaurant button:active {

            transform:
                scale(0.98);

        }


        .restaurant button.closed {

            background:
                #b5b5b5 !important;

        }


        .no-menu {

            background:
                #999 !important;

        }


        /* ========================================
           Loading
        ======================================== */

        .loading {

            background: white;

            border-radius: 16px;

            padding:
                42px 15px;

            text-align: center;

            color: #777;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

        }


        .loading-icon {

            font-size: 40px;

            margin-bottom: 10px;

            animation:
                loadingFloat 1.2s
                ease-in-out infinite;

        }


        @keyframes loadingFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-6px);
            }

        }


        /* ========================================
           无结果
        ======================================== */

        #noResult {

            display: none;

            background: white;

            border-radius: 16px;

            padding:
                38px 15px;

            text-align: center;

            color: #777;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

        }


        .no-result-icon {

            font-size: 44px;

            margin-bottom: 10px;

        }


        .no-result-title {

            font-size: 17px;

            font-weight: bold;

            color: #555;

            margin-bottom: 6px;

        }


        .no-result-text {

            font-size: 13px;

            color: #999;

        }


        /* ========================================
           错误
        ======================================== */

        .error-box {

            background: white;

            border-radius: 16px;

            padding:
                35px 15px;

            text-align: center;

            color: #777;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

        }


        /* ========================================
           手机底部导航
        ======================================== */

        .bottom-nav {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 2000;

            height: 62px;

            background:
                rgba(255,255,255,0.97);

            border-top:
                1px solid
                #eeeeee;

            box-shadow:
                0 -3px 15px
                rgba(0,0,0,0.08);

            display: flex;

            justify-content: center;

        }


        .bottom-nav-inner {

            width: 100%;

            max-width: 800px;

            display: flex;

            align-items: center;

            justify-content: space-around;

        }


        .bottom-nav-item {

            flex: 1;

            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 2px;

            text-decoration: none;

            color: #888;

            font-size: 10px;

            font-weight: bold;

        }


        .bottom-nav-icon {

            font-size: 20px;

            line-height: 1;

        }


        .bottom-nav-item.active {

            color:
                #ff5a1f;

        }


        /* ========================================
           小屏手机
        ======================================== */

        @media (max-width: 500px) {

            body {
                padding-bottom: 68px;
            }


            header {

                padding:
                    14px 12px 15px;

            }


            .brand-title {

                font-size: 22px;

            }


            .brand-subtitle {

                font-size: 11px;

            }


            .header-order-btn {

                min-width: 76px;

                padding:
                    8px 9px;

                font-size: 12px;

            }


            .container {

                padding:
                    12px 12px 20px;

            }


            .welcome-box {

                padding:
                    17px;

            }


            .welcome-title {

                font-size: 18px;

            }


            .account-user strong {

                max-width: 155px;

            }


            .account-action {

                padding:
                    8px 9px;

                font-size: 11px;

            }


            .restaurant-image-box {

                height: 180px;

            }


            .restaurant-content {

                padding:
                    14px;

            }


            .restaurant h2 {

                font-size: 18px;

            }


            .description {

                font-size: 12px;

            }


            .restaurant-info {

                font-size: 11px;

            }

        }


        @media (min-width: 501px) {

            .bottom-nav {

                display: none;

            }


            body {

                padding-bottom: 0;

            }

        }

    </style>

</head>


<body>


<!-- ========================================
     顶部
======================================== -->

<header>

    <div class="header-inner">

        <div class="brand">

            <h1 class="brand-title">
                🍜 MDY FOOD
            </h1>

            <div class="brand-subtitle">
                缅甸外卖 · အစားအစာ Delivery
            </div>

        </div>


        <a
            href="orders.html"
            class="header-order-btn"
        >
            📦 我的订单
        </a>

    </div>

</header>



<div class="container">


    <!-- ========================================
         欢迎
    ======================================== -->

    <div class="welcome-box">

        <h2
            class="welcome-title"
            id="welcomeTitle"
        >
            今天想吃点什么？🍜
        </h2>

        <p class="welcome-text">
            找一家喜欢的餐厅，选好菜品，我们帮你送到家。
        </p>

    </div>



    <!-- ========================================
         用户账号
    ======================================== -->

    <div
        class="account-box"
        id="accountBox"
    >

        <div id="loggedOut">

            <a
                href="login.html"
                class="account-login"
            >
                👤 登录 / 注册
            </a>

        </div>


        <div
            id="loggedIn"
            style="display:none;"
        >

            <div class="account-user">

                <div class="account-user-info">

                    <div class="account-welcome">
                        👋 欢迎回来
                    </div>

                    <strong id="userEmail">
                        用户
                    </strong>

                </div>


                <div class="account-actions">

                    <a
                        href="orders.html"
                        class="account-action order"
                    >
                        📦 订单
                    </a>


                    <button
                        class="account-action logout"
                        onclick="logout()"
                    >
                        退出
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ========================================
         搜索
    ======================================== -->

    <div class="search-section">

        <div class="search-label">
            🔎 找餐厅 / 找菜品
        </div>


        <div class="search-wrap">

            <span class="search-icon">
                🔍
            </span>


            <input
                id="searchInput"
                class="search"
                type="text"
                placeholder="搜索餐厅、菜品..."
                oninput="searchRestaurants()"
            >


            <button
                id="searchClear"
                class="search-clear"
                onclick="clearSearch()"
            >
                ×
            </button>

        </div>

    </div>



    <!-- ========================================
         分类
    ======================================== -->

    <div class="section-heading">

        <h2>
            🍽️ 食物分类
        </h2>

        <span>
            左右滑动查看更多
        </span>

    </div>


    <div class="category-bar">

        <button
            class="category-btn active"
            onclick="filterCategory('全部', this)"
        >
            🍜 全部
        </button>


        <button
            class="category-btn"
            onclick="filterCategory('川菜', this)"
        >
            🌶️ 川菜
        </button>


        <button
            class="category-btn"
            onclick="filterCategory('缅甸菜', this)"
        >
            🇲🇲 缅甸菜
        </button>


        <button
            class="category-btn"
            onclick="filterCategory('烧烤', this)"
        >
            🔥 烧烤
        </button>

    </div>



    <!-- ========================================
         我的订单快捷入口
    ======================================== -->

    <a
        href="orders.html"
        class="quick-order"
    >

        <div class="quick-order-left">

            <div class="quick-order-icon">
                📦
            </div>


            <div>

                <div class="quick-order-title">
                    我的订单
                </div>

                <div class="quick-order-desc">
                    查看订单状态和历史订单
                </div>

            </div>

        </div>


        <div class="quick-order-arrow">
            ›
        </div>

    </a>



    <!-- ========================================
         餐厅
    ======================================== -->

    <div class="restaurant-heading">

        <h2>
            🏪 附近餐厅
        </h2>

        <span id="restaurantCountText">
            正在加载...
        </span>

    </div>



    <div id="restaurantList">

        <div class="loading">

            <div class="loading-icon">
                🍜
            </div>

            正在读取餐厅...

        </div>

    </div>



    <!-- ========================================
         无结果
    ======================================== -->

    <div id="noResult">

        <div class="no-result-icon">
            🔍
        </div>

// ========================================
// 分类名称
// ========================================

function getCategoryName(
    category
) {

    if (!category) {

        return "其他";

    }


    const value =
        String(category)
            .trim();


    if (
        value.includes("川") ||
        value.includes("四川")
    ) {

        return "川菜";

    }


    if (
        value.includes("缅甸") ||
        value.includes("Myanmar") ||
        value.includes("Myanmar Food")
    ) {

        return "缅甸菜";

    }


    if (
        value.includes("烧烤") ||
        value.includes("夜宵")
    ) {

        return "烧烤";

    }


    return value;

}


// ========================================
// 默认图标
// ========================================

function getRestaurantIcon(
    category
) {

    const normalized =
        getCategoryName(
            category
        );


    if (
        normalized === "川菜"
    ) {

        return "🌶️";

    }


    if (
        normalized === "缅甸菜"
    ) {

        return "🇲🇲";

    }


    if (
        normalized === "烧烤"
    ) {

        return "🔥";

    }


    return "🍜";

}


// ========================================
// 设置图片
// ========================================

function getRestaurantImage(
    restaurant
) {

    if (
        restaurant.image
    ) {

        return restaurant.image;

    }


    const category =
        getCategoryName(
            restaurant.category ||
            restaurant.restaurantType ||
            ""
        );


    return (
        defaultImages[category] ||
        ""
    );

}


// ========================================
// 创建餐厅卡片
// ========================================

function createRestaurantCard(
    restaurant,
    id
) {

    const name =
        restaurant.name ||
        restaurant.restaurantName ||
        "MDY FOOD 餐厅";


    const category =
        restaurant.category ||
        restaurant.restaurantType ||
        "餐厅";


    const normalizedCategory =
        getCategoryName(
            category
        );


    const description =
        restaurant.description ||
        restaurant.restaurantDescription ||
        "欢迎光临";


    const status =
        restaurant.status ||
        (
            restaurant.enabled === false
                ? "休息中"
                : "营业中"
        );


    const image =
        getRestaurantImage(
            restaurant
        );


    const icon =
        getRestaurantIcon(
            category
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "restaurant";


    card.dataset.category =
        normalizedCategory;


    card.dataset.restaurantId =
        id;


    card.dataset.name =
        String(name)
            .toLowerCase();


    card.dataset.description =
        String(description)
            .toLowerCase();


    card.innerHTML = `

        <div class="restaurant-image-box">

            ${
                image
                ?
                `

                <img
                    class="restaurant-image"
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >

                <div
                    class="image-placeholder"
                    style="display:none;"
                >
                    ${icon}
                </div>

                `
                :
                `

                <div class="image-placeholder">
                    ${icon}
                </div>

                `
            }


            <div
                class="status-badge ${
                    status === "营业中"
                        ? "open"
                        : "closed"
                }"
            >

                ${
                    status === "营业中"
                        ? "🟢 营业中"
                        : "🔴 休息中"
                }

            </div>

        </div>


        <div class="restaurant-content">


            <div class="restaurant-title-row">

                <h2>
                    ${escapeHtml(name)}
                </h2>

                <div class="restaurant-category-tag">
                    ${escapeHtml(normalizedCategory)}
                </div>

            </div>


            <div class="description">
                ${escapeHtml(description)}
            </div>


            <div class="restaurant-info">

                <span
                    class="restaurant-rating"
                    id="rating-${escapeHtml(id)}"
                >
                    ⭐ 读取评价中
                </span>


                <span
                    class="food-count"
                    id="food-count-${escapeHtml(id)}"
                >
                    🍽️ 菜品读取中
                </span>

            </div>


            <div
                class="food-match"
                id="food-match-${escapeHtml(id)}"
            >
            </div>


            <div class="restaurant-bottom">

                <button
                    id="button-${escapeHtml(id)}"
                    class="${
                        status === "营业中"
                            ? ""
                            : "closed"
                    }"
                    onclick="
                        openRestaurant(
                            '${escapeJs(id)}'
                        )
                    "
                >

                    ${
                        status === "营业中"
                            ? "查看菜单 →"
                            : "休息中"
                    }

                </button>

            </div>


        </div>

    `;


    return card;

}


// ========================================
// 防止 HTML 注入
// ========================================

function escapeHtml(
    value
) {

    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ========================================
// 防止 JS 注入
// ========================================

function escapeJs(
    value
) {

    return String(
        value || ""
    )

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        );

}


// ========================================
// 读取所有商家
// ========================================

async function loadRestaurants() {

    const restaurantList =
        document.getElementById(
            "restaurantList"
        );


    restaurantList.innerHTML = `

        <div class="loading">

            <div class="loading-icon">
                🍜
            </div>

            正在读取餐厅...

        </div>

    `;


    try {

        const snapshot =
            await db
                .collection("restaurants")
                .get();


        allRestaurants = [];


        snapshot.forEach(
            function(doc) {

                const restaurant =
                    doc.data() || {};


                /*
                 * 只显示正式可用的商家
                 */

                const approvalStatus =
                    String(
                        restaurant.approvalStatus ||
                        ""
                    )
                    .toLowerCase();


                const approved =
                    restaurant.approved === true ||
                    approvalStatus === "approved";


                const enabled =
                    restaurant.enabled !== false;


                const shouldShow =
                    enabled &&
                    (
                        approved ||
                        (
                            !restaurant.approvalStatus &&
                            restaurant.enabled !== false
                        )
                    );


                if (!shouldShow) {

                    return;

                }


                allRestaurants.push({

                    id:
                        doc.id,

                    ...restaurant

                });

            }
        );


        /*
         * 新商家优先
         */

        allRestaurants.sort(
            function(a, b) {

                const timeA =
                    getTimestampMillis(
                        a.createdAt ||
                        a.approvedAt
                    );


                const timeB =
                    getTimestampMillis(
                        b.createdAt ||
                        b.approvedAt
                    );


                return (
                    timeB -
                    timeA
                );

            }
        );


        restaurantList.innerHTML =
            "";


        updateRestaurantCount();


        if (
            allRestaurants.length === 0
        ) {

            restaurantList.innerHTML = `

                <div class="error-box">

                    <div
                        style="
                            font-size:45px;
                            margin-bottom:10px;
                        "
                    >
                        🍜
                    </div>

                    <div
                        style="
                            font-size:17px;
                            font-weight:bold;
                            margin-bottom:7px;
                        "
                    >
                        暂时还没有营业餐厅
                    </div>

                    <div>
                        请稍后再来看看
                    </div>

                </div>

            `;

            return;

        }


        /*
         * 创建全部商家卡片
         */

        allRestaurants.forEach(
            function(restaurant) {

                const card =
                    createRestaurantCard(
                        restaurant,
                        restaurant.id
                    );


                restaurantList.appendChild(
                    card
                );


                /*
                 * 每家商家自己的菜品数量
                 */

                updateFoodCount(
                    restaurant.id
                );

            }
        );


        /*
         * 启动一次全局评价实时监听
         */

        loadAllRestaurantRatings();


        searchRestaurants();


    } catch (error) {

        console.error(
            "读取餐厅失败:",
            error
        );


        restaurantList.innerHTML = `

            <div class="error-box">

                <div
                    style="
                        font-size:40px;
                        margin-bottom:10px;
                    "
                >
                    ⚠️
                </div>

                <div
                    style="
                        font-size:17px;
                        font-weight:bold;
                        margin-bottom:8px;
                    "
                >
                    餐厅读取失败
                </div>

                <div>
                    ${escapeHtml(
                        error.message ||
                        "请检查网络连接"
                    )}
                </div>

            </div>

        `;

    }

}


// ========================================
// 餐厅数量
// ========================================

function updateRestaurantCount() {

    const element =
        document.getElementById(
            "restaurantCountText"
        );


    if (!element) {
        return;
    }


    const count =
        allRestaurants.length;


    if (count === 0) {

        element.innerText =
            "暂无餐厅";

        return;

    }


    element.innerText =
        count +
        " 家餐厅";

}


// ========================================
// 时间转换
// ========================================

function getTimestampMillis(
    value
) {

    if (!value) {

        return 0;

    }


    if (
        value &&
        typeof value.toMillis ===
        "function"
    ) {

        return value.toMillis();

    }


    if (
        value &&
        value.seconds
    ) {

        return (
            value.seconds *
            1000
        );

    }


    const date =
        new Date(value);


    if (
        !isNaN(
            date.getTime()
        )
    ) {

        return date.getTime();

    }


    return 0;

}


// ========================================
// 读取所有商家的评价
// ========================================

function loadAllRestaurantRatings() {

    /*
     * 如果之前已经建立过监听，
     * 先取消，避免重复监听。
     */

    if (
        reviewsUnsubscribe
    ) {

        reviewsUnsubscribe();

        reviewsUnsubscribe =
            null;

    }


    reviewsUnsubscribe =
        db.collection("reviews")

            .onSnapshot(

                function(snapshot) {

                    const ratingMap = {};


                    snapshot.forEach(
                        function(doc) {

                            const review =
                                doc.data() ||
                                {};


                            const restaurantId =
                                String(
                                    review.restaurantId ||
                                    ""
                                );


                            if (
                                !restaurantId
                            ) {

                                return;

                            }


                            const rating =
                                Number(
                                    review.rating ||
                                    review.star ||
                                    review.stars ||
                                    review.score ||
                                    0
                                );


                            if (
                                rating < 1 ||
                                rating > 5
                            ) {

                                return;

                            }


                            if (
                                !ratingMap[
                                    restaurantId
                                ]
                            ) {

                                ratingMap[
                                    restaurantId
                                ] = {

                                    total: 0,

                                    count: 0

                                };

                            }


                            ratingMap[
                                restaurantId
                            ].total +=
                                rating;


                            ratingMap[
                                restaurantId
                            ].count +=
                                1;

                        }
                    );


                    /*
                     * 更新每一家商家的评分
                     */

                    allRestaurants.forEach(
                        function(restaurant) {

                            const data =
                                ratingMap[
                                    restaurant.id
                                ];


                            const element =
                                document.getElementById(
                                    "rating-" +
                                    restaurant.id
                                );


                            if (!element) {

                                return;

                            }


                            if (
                                !data ||
                                data.count === 0
                            ) {

                                element.innerText =
                                    "⭐ 暂无评价";

                                return;

                            }


                            const average =
                                data.total /
                                data.count;


                            element.innerText =
                                "⭐ " +
                                average.toFixed(1) +
                                " · " +
                                data.count +
                                "条评价";

                        }
                    );

                },

                function(error) {

                    console.error(
                        "读取所有商家评价失败:",
                        error
                    );


                    allRestaurants.forEach(
                        function(restaurant) {

                            const element =
                                document.getElementById(
                                    "rating-" +
                                    restaurant.id
                                );


                            if (element) {

                                element.innerText =
                                    "⭐ 暂无评价";

                            }

                        }
                    );

                }

            );

}


// ========================================
// 菜品数量
// ========================================

async function updateFoodCount(
    restaurantId
) {

    const element =
        document.getElementById(
            "food-count-" +
            restaurantId
        );


    if (!element) {

        return;

    }


    try {

        const snapshot =
            await db
                .collection("foods")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();


        let count = 0;


        snapshot.forEach(
            function(doc) {

                const food =
                    doc.data() || {};


                /*
                 * 下架菜品不计算
                 */

                if (
                    food.status !==
                    "下架"
                ) {

                    count++;

                }

            }
        );


        element.innerText =
            "🍽️ " +
            count +
            " 道菜品";


    } catch (error) {

        console.error(
            "菜品数量读取失败:",
            error
        );


        element.innerText =
            "🍽️ 菜品";

    }

}


// ========================================
// 查找菜品
// ========================================

function findFoodMatches(
    restaurantId,
    keyword
) {

    if (!keyword) {

        return [];

    }


    return allFoods.filter(
        function(food) {

            const foodRestaurantId =
                food.restaurantId ||
                "";


            const foodName =
                String(
                    food.name ||
                    ""
                )
                .toLowerCase();


            const foodDescription =
                String(
                    food.description ||
                    ""
                )
                .toLowerCase();


            const foodStatus =
                food.status ||
                "营业中";


            if (
                foodStatus ===
                "下架"
            ) {

                return false;

            }


            return (

                foodRestaurantId ===
                restaurantId

                &&

                (

                    foodName.includes(
                        keyword
                    )

                    ||

                    foodDescription.includes(
                        keyword
                    )

                )

            );

        }
    );

}


// ========================================
// 搜索
// ========================================

function searchRestaurants() {

    const input =
        document.getElementById(
            "searchInput"
        );


    if (!input) {
        return;
    }


    const keyword =
        input.value
            .trim()
            .toLowerCase();


    const clearButton =
        document.getElementById(
            "searchClear"
        );


    if (clearButton) {

        clearButton.style.display =
            keyword
                ? "block"
                : "none";

    }


    const restaurants =
        document.querySelectorAll(
            ".restaurant"
        );


    let visibleCount = 0;


    restaurants.forEach(
        function(restaurant) {

            const restaurantText =
                restaurant.innerText
                    .toLowerCase();


            const category =
                restaurant.dataset.category ||
                "";


            const restaurantId =
                restaurant.dataset.restaurantId ||
                "";


            const foodMatches =
                findFoodMatches(
                    restaurantId,
                    keyword
                );


            const foodMatch =
                foodMatches.length > 0;


            const keywordMatch =
                !keyword ||

                restaurantText.includes(
                    keyword
                ) ||

                foodMatch;


            const categoryMatch =
                currentCategory ===
                "全部" ||

                category ===
                currentCategory;


            const show =
                keywordMatch &&
                categoryMatch;


            if (show) {

                restaurant.style.display =
                    "";

                visibleCount++;

            } else {

                restaurant.style.display =
                    "none";

            }


            const foodMatchElement =
                document.getElementById(
                    "food-match-" +
                    restaurantId
                );


            if (
                foodMatchElement
            ) {

                if (
                    keyword &&
                    foodMatches.length > 0
                ) {

                    const names =
                        foodMatches
                            .slice(0, 3)
                            .map(
                                function(food) {

                                    return (
                                        food.name ||
                                        "菜品"
                                    );

                                }
                            );


                    foodMatchElement.innerText =
                        "🍽️ 找到菜品：" +
                        names.join("、");


                    if (
                        foodMatches.length > 3
                    ) {

                        foodMatchElement.innerText +=
                            " 等";

                    }


                    foodMatchElement.style.display =
                        "block";

                } else {

                    foodMatchElement.style.display =
                        "none";

                }

            }

        }
    );


    const noResult =
        document.getElementById(
            "noResult"
        );


    if (
        visibleCount === 0 &&
        allRestaurants.length > 0
    ) {

        noResult.style.display =
            "block";

    } else {

        noResult.style.display =
            "none";

    }

}


// ========================================
// 清除搜索
// ========================================

function clearSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );


    if (!input) {
        return;
    }


    input.value =
        "";


    input.focus();


    searchRestaurants();

}


// ========================================
// 分类筛选
// ========================================

function filterCategory(
    category,
    button
) {

    currentCategory =
        category;


    const buttons =
        document.querySelectorAll(
            ".category-btn"
        );


    buttons.forEach(
        function(btn) {

            btn.classList.remove(
                "active"
            );

        }
    );


    if (button) {

        button.classList.add(
            "active"
        );

    }


    searchRestaurants();

}


// ========================================
// 打开餐厅
// ========================================

function openRestaurant(
    id
) {

    if (!id) {

        alert(
            "这家餐厅的菜单还在准备中"
        );

        return;

    }


    const restaurant =
        allRestaurants.find(
            function(item) {

                return (
                    item.id === id
                );

            }
        );


    if (restaurant) {

        const status =
            restaurant.status ||
            (
                restaurant.enabled === false
                    ? "休息中"
                    : "营业中"
            );


        if (
            status !==
            "营业中"
        ) {

            alert(
                "这家餐厅目前休息中，请稍后再来"
            );

            return;

        }

    }


    window.location.href =
        "menu.html?id=" +
        encodeURIComponent(id);

}


// ========================================
// 读取所有菜品
// ========================================

async function loadFoods() {

    try {

        const snapshot =
            await db
                .collection("foods")
                .get();


        allFoods = [];


        snapshot.forEach(
            function(doc) {

                const food =
                    doc.data() || {};


                allFoods.push({

                    id:
                        doc.id,

                    ...food

                });

            }
        );


        searchRestaurants();


    } catch (error) {

        console.error(
            "读取菜品失败:",
            error
        );

    }

}


// ========================================
// 滚动到餐厅
// ========================================

function scrollToRestaurants(
    event
) {

    if (event) {

        event.preventDefault();

    }


    const element =
        document.getElementById(
            "restaurantList"
        );


    if (element) {

        element.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }

}


// ========================================
// 页面启动
// ========================================

async function init() {

    await Promise.all([

        loadRestaurants(),

        loadFoods()

    ]);

}


init();

</script>
