<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MDY FOOD</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 7px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            outline: none;
        }

        .orders-link {
            display: block;
            margin: 15px 0;
            padding: 14px;
            background: white;
            color: #ff5a1f;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .restaurant {
            background: white;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .restaurant h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .category {
            color: #777;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .rating {
            margin-bottom: 8px;
        }

        .status {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .open-status {
            color: #2e8b57;
        }

        .closed-status {
            color: #d33;
        }

        .restaurant button {
            width: 100%;
            border: none;
            background: #ff5a1f;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .restaurant button:hover {
            opacity: 0.9;
        }

        .restaurant button.closed {
            background: #999 !important;
        }

        .no-menu {
            background: #999 !important;
        }

    </style>

</head>


<body>

<header>

    <h1>
        🍜 MDY FOOD
    </h1>

    <p>
        缅甸外卖 · အစားအစာ Delivery
    </p>

</header>


<div class="container">

    <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="搜索餐厅 / အစားအစာ ရှာရန်"
        oninput="searchRestaurants()"
    >


    <a
        href="orders.html"
        class="orders-link"
    >
        📦 我的订单
    </a>


    <!-- 四川味道 -->

    <div
        class="restaurant"
        id="restaurant-sichuan"
    >

        <h2 id="name-sichuan">
            正在读取...
        </h2>

        <div
            id="category-sichuan"
            class="category"
        >
            正在读取...
        </div>

        <div
            id="description-sichuan"
            class="description"
        >
        </div>

        <div
            id="rating-sichuan"
            class="rating"
        >
            ⭐
        </div>

        <div
            id="status-sichuan"
            class="status"
        >
            正在读取营业状态...
        </div>

        <button
            id="button-sichuan"
            onclick="openRestaurant('AxVX8H1owO7IKe0EJcmb')"
        >
            正在读取...
        </button>

    </div>


    <!-- Mandalay Kitchen -->

    <div
        class="restaurant"
        id="restaurant-mandalay"
    >

        <h2 id="name-mandalay">
            正在读取...
        </h2>

        <div
            id="category-mandalay"
            class="category"
        >
            正在读取...
        </div>

        <div
            id="description-mandalay"
            class="description"
        >
        </div>

        <div
            id="rating-mandalay"
            class="rating"
        >
            ⭐
        </div>

        <div
            id="status-mandalay"
            class="status"
        >
            正在读取营业状态...
        </div>

        <button
            id="button-mandalay"
            onclick="openRestaurant('DKIiikHUTmC5bFtuSVdb')"
        >
            正在读取...
        </button>

    </div>


    <!-- 夜猫子烧烤 -->

    <div
        class="restaurant"
        id="restaurant-night"
    >

        <h2>
            夜猫子烧烤
        </h2>

        <div class="category">
            烧烤 · 夜宵
        </div>

        <div class="description">
            夜宵烧烤，菜单准备中
        </div>

        <div class="rating">
            ⭐ 4.9
        </div>

        <div class="status closed-status">
            🔴 菜单准备中
        </div>

        <button
            class="no-menu"
            onclick="openRestaurant('')"
        >
            菜单准备中
        </button>

    </div>

</div>


<script>


// =========================
// Firebase
// =========================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


// =========================
// 读取餐厅资料
// =========================

async function loadRestaurant(
    restaurantId,
    key
) {

    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();


        if (!doc.exists) {

            showRestaurantError(key);

            return;

        }


        const restaurant =
            doc.data();


        // 餐厅名称

        document.getElementById(
            "name-" + key
        ).innerText =
            restaurant.name ||
            "我的餐厅";


        // 分类

        document.getElementById(
            "category-" + key
        ).innerText =
            restaurant.category ||
            "餐厅";


        // 介绍

        document.getElementById(
            "description-" + key
        ).innerText =
            restaurant.description ||
            "欢迎光临";


        // 评分

        document.getElementById(
            "rating-" + key
        ).innerText =
            "⭐ " +
            (
                restaurant.rating ||
                "暂无评分"
            );


        // 营业状态

        updateRestaurantStatus(
            restaurant.status ||
            "营业中",
            key
        );


    } catch (error) {

        console.error(error);

        showRestaurantError(key);

    }

}


// =========================
// 显示营业状态
// =========================

function updateRestaurantStatus(
    status,
    key
) {

    const statusElement =
        document.getElementById(
            "status-" + key
        );


    const button =
        document.getElementById(
            "button-" + key
        );


    if (
        status === "营业中"
    ) {

        statusElement.innerText =
            "🟢 营业中";

        statusElement.className =
            "status open-status";


        button.innerText =
            "查看菜单";

        button.classList.remove(
            "closed"
        );


    } else {

        statusElement.innerText =
            "🔴 休息中";

        statusElement.className =
            "status closed-status";


        button.innerText =
            "休息中";

        button.classList.add(
            "closed"
        );


        button.onclick =
            function() {

                alert(
                    "这家餐厅目前休息中，请稍后再来"
                );

            };

    }

}


// =========================
// 读取失败
// =========================

function showRestaurantError(
    key
) {

    document.getElementById(
        "name-" + key
    ).innerText =
        "餐厅";


    document.getElementById(
        "category-" + key
    ).innerText =
        "信息暂时无法获取";


    document.getElementById(
        "status-" + key
    ).innerText =
        "⚠️ 暂时无法点餐";


    document.getElementById(
        "status-" + key
    ).className =
        "status closed-status";


    const button =
        document.getElementById(
            "button-" + key
        );


    button.innerText =
        "暂时无法点餐";


    button.classList.add(
        "closed"
    );

}


// =========================
// 打开餐厅
// =========================

function openRestaurant(id) {

    if (!id) {

        alert(
            "这家餐厅的菜单还在准备中"
        );

        return;

    }


    window.location.href =
        "menu.html?id=" + id;

}


// =========================
// 搜索
// =========================

function searchRestaurants() {

    const keyword =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase();


    const restaurants =
        document.querySelectorAll(
            ".restaurant"
        );


    restaurants.forEach(
        function(restaurant) {

            const text =
                restaurant.innerText
                    .toLowerCase();


            if (
                text.includes(keyword)
            ) {

                restaurant.style.display =
                    "";

            } else {

                restaurant.style.display =
                    "none";

            }

        }
    );

}


// =========================
// 启动
// =========================

loadRestaurant(
    "AxVX8H1owO7IKe0EJcmb",
    "sichuan"
);


loadRestaurant(
    "DKIiikHUTmC5bFtuSVdb",
    "mandalay"
);

</script>


</body>

</html>
