<script>

const firebaseConfig = {

// =========================

let currentCategory = "全部";

let allFoods = [];


// =========================

auth.onAuthStateChanged(

// =========================

// =========================

async function logout() {

            "已退出登录"

}


// =========================
// 读取餐厅资料
// =========================

async function loadRestaurant(
    restaurantId,
    key
) {

    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();


        if (!doc.exists) {

            showRestaurantError(key);

            return;

        }


        const restaurant =
            doc.data();


        // 餐厅名称

        document.getElementById(
            "name-" + key
        ).innerText =
            restaurant.name ||
            "我的餐厅";


        // 分类

        document.getElementById(
            "category-" + key
        ).innerText =
            restaurant.category ||
            "餐厅";


        // 介绍

        document.getElementById(
            "description-" + key
        ).innerText =
            restaurant.description ||
            "欢迎光临";


        // 评分

        document.getElementById(
            "rating-" + key
        ).innerText =
            "⭐ " +
            (
                restaurant.rating ||
                "暂无评分"
            );


        // 营业状态

        updateRestaurantStatus(
            restaurant.status ||
            "营业中",
            key
        );


        // 保存分类

        const restaurantElement =
            document.getElementById(
                "restaurant-" + key
            );


        restaurantElement.dataset.category =
            getCategoryName(
                restaurant.category
            );


    } catch (error) {

        console.error(error);

        showRestaurantError(key);

    }

}


// =========================
// 分类名称处理
// =========================

function getCategoryName(
    category
) {

    if (!category) {

        return "全部";

    }


    if (
        category.includes("川")
    ) {

        return "川菜";

    }


    if (
        category.includes("缅甸")
    ) {

        return "缅甸菜";

    }


    if (
        category.includes("烧烤") ||
        category.includes("夜宵")
    ) {

        return "烧烤";

    }


    return category;

}


// =========================
// 显示营业状态
// =========================

function updateRestaurantStatus(
    status,
    key
) {

    const statusElement =
        document.getElementById(
            "status-" + key
        );


    const button =
        document.getElementById(
            "button-" + key
        );


    if (
        status === "营业中"
    ) {

        statusElement.innerText =
            "🟢 营业中";


        statusElement.className =
            "status open-status";


        button.innerText =
            "查看菜单";


        button.classList.remove(
            "closed"
        );


        button.onclick =
            function() {

                if (
                    key === "sichuan"
                ) {

                    openRestaurant(
                        "AxVX8H1owO7IKe0EJcmb"
                    );

                }


                if (
                    key === "mandalay"
                ) {

                    openRestaurant(
                        "DKIiikHUTmC5bFtuSVdb"
                    );

                }

            };


    } else {

        statusElement.innerText =
            "🔴 休息中";


        statusElement.className =
            "status closed-status";


        button.innerText =
            "休息中";


        button.classList.add(
            "closed"
        );


        button.onclick =
            function() {

                alert(
                    "这家餐厅目前休息中，请稍后再来"
                );

            };

    }

}


// =========================
// 读取失败
// =========================

function showRestaurantError(
    key
) {

    document.getElementById(
        "name-" + key
    ).innerText =
        "餐厅";


    document.getElementById(
        "category-" + key
    ).innerText =
        "信息暂时无法获取";


    document.getElementById(
        "status-" + key
    ).innerText =
        "⚠️ 暂时无法点餐";


    document.getElementById(
        "status-" + key
    ).className =
        "status closed-status";


    const button =
        document.getElementById(
            "button-" + key
        );


    button.innerText =
        "暂时无法点餐";


    button.classList.add(
        "closed"
    );

}


// =========================
// 打开餐厅
// =========================

function openRestaurant(id) {

    if (!id) {

        alert(
            "这家餐厅的菜单还在准备中"
        );

        return;

    }


    window.location.href =
        "menu.html?id=" + id;

}


// =========================
// 读取所有菜品
// =========================

async function loadFoods() {

    try {

        const snapshot =
            await db
                .collection("foods")
                .get();


        allFoods = [];


        snapshot.forEach(
            function(doc) {

                const food =
                    doc.data();


                allFoods.push({

                    id: doc.id,

                    ...food

                });

            }
        );


    } catch (error) {

        console.error(
            "读取菜品失败:",
            error
        );

    }

}


// =========================
// 搜索菜品是否属于餐厅
// =========================

function findFoodMatches(
    restaurantId,
    keyword
) {

    if (!keyword) {

        return [];

    }


    return allFoods.filter(
        function(food) {

            const foodRestaurantId =
                food.restaurantId ||
                food.restaurantID ||
                food.restaurant_id ||
                "";


            const foodName =
                String(
                    food.name ||
                    food.foodName ||
                    food.title ||
                    ""
                ).toLowerCase();


            const foodDescription =
                String(
                    food.description ||
                    food.desc ||
                    ""
                ).toLowerCase();


            return (
                foodRestaurantId === restaurantId
                &&
                (
                    foodName.includes(keyword)
                    ||
                    foodDescription.includes(keyword)
                )
            );

        }
    );

}


// =========================
// 搜索
// =========================

function searchRestaurants() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const keyword =
        input.value
            .trim()
            .toLowerCase();


    const restaurants =
        document.querySelectorAll(
            ".restaurant"
        );


    let visibleCount = 0;


    restaurants.forEach(
        function(restaurant) {

            const restaurantText =
                restaurant.innerText
                    .toLowerCase();


            const category =
                restaurant.dataset.category ||
                "";


            let restaurantId =
                "";


            if (
                restaurant.id ===
                "restaurant-sichuan"
            ) {

                restaurantId =
                    "AxVX8H1owO7IKe0EJcmb";

            }


            if (
                restaurant.id ===
                "restaurant-mandalay"
            ) {

                restaurantId =
                    "DKIiikHUTmC5bFtuSVdb";

            }


            const foodMatches =
                findFoodMatches(
                    restaurantId,
                    keyword
                );


            const foodMatch =
                foodMatches.length > 0;


            const keywordMatch =
                !keyword ||
                restaurantText.includes(keyword) ||
                foodMatch;


            const categoryMatch =
                currentCategory === "全部" ||
                category === currentCategory;


            const show =
                keywordMatch &&
                categoryMatch;


            if (show) {

                restaurant.style.display =
                    "";


                visibleCount++;


            } else {

                restaurant.style.display =
                    "none";

            }


            // 菜品匹配提示

            const key =
                restaurant.id
                    .replace(
                        "restaurant-",
                        ""
                    );


            const foodMatchElement =
                document.getElementById(
                    "food-match-" + key
                );


            if (
                foodMatchElement
            ) {

                if (
                    keyword &&
                    foodMatches.length > 0
                ) {

                    const names =
                        foodMatches
                            .slice(0, 3)
                            .map(
                                function(food) {

                                    return (
                                        food.name ||
                                        food.foodName ||
                                        food.title ||
                                        "菜品"
                                    );

                                }
                            );


                    foodMatchElement.innerText =
                        "🍽️ 找到菜品：" +
                        names.join("、");


                    if (
                        foodMatches.length > 3
                    ) {

                        foodMatchElement.innerText +=
                            " 等";

                    }


                    foodMatchElement.style.display =
                        "block";


                } else {

                    foodMatchElement.style.display =
                        "none";

                }

            }

        }
    );


    const noResult =
        document.getElementById(
            "noResult"
        );


    if (
        visibleCount === 0
    ) {

        noResult.style.display =
            "block";

    } else {

        noResult.style.display =
            "none";

    }

}


// =========================
// 分类筛选
// =========================

function filterCategory(

    button

    currentCategory =
        category;


    const buttons =
        document.querySelectorAll(
            ".category-btn"
        );


    buttons.forEach(
        function(btn) {

            btn.classList.remove(
                "active"
            );

        }
    );


    button.classList.add(
        "active"
    );


    searchRestaurants();

}
