
<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MDY FOOD</title>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }


        /* =========================
           顶部
        ========================= */

        header {
            background: #ff5a1f;
            color: white;
            padding: 22px 15px;
            text-align: center;
        }


        header h1 {
            margin: 0;
            font-size: 28px;
        }


        header p {
            margin: 7px 0 0;
            font-size: 14px;
        }


        /* =========================
           容器
        ========================= */

        .container {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }


        /* =========================
           账号
        ========================= */

        .account-box {
            background: white;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }


        .account-login {
            display: block;
            width: 100%;
            padding: 13px;
            background: #ff5a1f;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }


        .account-user {
            font-size: 14px;
            color: #555;
            margin-bottom: 10px;
        }


        .account-user strong {
            color: #ff5a1f;
        }


        .account-buttons {
            display: flex;
            gap: 10px;
        }


        .account-buttons a,
        .logout-btn {
            flex: 1;
            padding: 11px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }


        .account-buttons a {
            background: #fff1ed;
            color: #ff5a1f;
        }


        .logout-btn {
            border: none;
            background: #eee;
            color: #555;
        }


        /* =========================
           搜索
        ========================= */

        .search {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            outline: none;
        }


        .search:focus {
            box-shadow: 0 0 0 2px #ff5a1f;
        }


        /* =========================
           分类
        ========================= */

        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin: 12px 0 15px;
            padding-bottom: 3px;
        }


        .category-bar::-webkit-scrollbar {
            display: none;
        }


        .category-btn {
            flex-shrink: 0;
            border: none;
            background: white;
            color: #555;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }


        .category-btn.active {
            background: #ff5a1f;
            color: white;
            font-weight: bold;
        }


        /* =========================
           我的订单
        ========================= */

        .orders-link {
            display: block;
            margin: 15px 0;
            padding: 14px;
            background: white;
            color: #ff5a1f;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }


        /* =========================
           餐厅卡片
        ========================= */

        .restaurant {
            background: white;
            border-radius: 14px;
            margin-bottom: 18px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }


        /* =========================
           餐厅图片
        ========================= */

        .restaurant-image-box {
            position: relative;
            width: 100%;
            height: 190px;
            overflow: hidden;
            background: #eee;
        }


        .restaurant-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #fff1eb,
                #ffe0d4
            );
            color: #ff5a1f;
            font-size: 55px;
        }


        /* =========================
           营业标签
        ========================= */

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }


        .status-badge.open {
            color: #238b57;
        }


        .status-badge.closed {
            color: #d33;
        }


        /* =========================
           餐厅内容
        ========================= */

        .restaurant-content {
            padding: 17px;
        }


        .restaurant h2 {
            margin: 0 0 7px;
            font-size: 21px;
        }


        .category {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }


        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 9px;
        }


        .restaurant-info {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 13px;
            font-size: 13px;
            color: #666;
        }


        .restaurant-rating {
            color: #f59e0b;
            font-weight: bold;
        }


        .food-count {
            color: #666;
        }


        /* =========================
           菜品搜索提示
        ========================= */

        .food-match {
            display: none;
            margin-bottom: 12px;
            padding: 9px 12px;
            background: #fff4ef;
            border-radius: 8px;
            color: #ff5a1f;
            font-size: 13px;
        }


        /* =========================
           按钮
        ========================= */

        .restaurant button {
            width: 100%;
            border: none;
            background: #ff5a1f;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }


        .restaurant button:hover {
            opacity: 0.9;
        }


        .restaurant button.closed {
            background: #999 !important;
        }


        .no-menu {
            background: #999 !important;
        }


        /* =========================
           无搜索结果
        ========================= */

        #noResult {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px 15px;
            text-align: center;
            color: #777;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }


        .no-result-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }


        .no-result-title {
            font-size: 17px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }


        .no-result-text {
            font-size: 14px;
        }


        /* =========================
           手机
        ========================= */

        @media (max-width: 500px) {

            header {
                padding: 18px 12px;
            }


            header h1 {
                font-size: 25px;
            }


            .container {
                padding: 12px;
            }


            .restaurant-image-box {
                height: 170px;
            }


            .restaurant-content {
                padding: 15px;
            }

        }

    </style>

</head>

<script>


// =========================
// Firebase
// =========================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();


// =========================
// 当前分类
// =========================

let currentCategory = "全部";


// =========================
// 所有菜品
// =========================

let allFoods = [];


// =========================
// 餐厅图片默认图
// =========================

const defaultImages = {

    sichuan:
        "https://images.unsplash.com/photo-1582450871972-ab5ca641643d",

    mandalay:
        ""

};


// =========================
// 登录状态
// =========================

auth.onAuthStateChanged(
    function(user) {

        const loggedOut =
            document.getElementById(
                "loggedOut"
            );


        const loggedIn =
            document.getElementById(
                "loggedIn"
            );


        const userEmail =
            document.getElementById(
                "userEmail"
            );


        if (user) {

            loggedOut.style.display =
                "none";


            loggedIn.style.display =
                "block";


            userEmail.innerText =
                user.email ||
                "用户";


        } else {

            loggedOut.style.display =
                "block";


            loggedIn.style.display =
                "none";

        }

    }
);


// =========================
// 退出登录
// =========================

async function logout() {

    try {

        await auth.signOut();


        alert(
            "已退出登录"
        );


    } catch (error) {

        console.error(error);


        alert(
            "退出登录失败，请稍后再试"
        );

    }

}


// =========================
// 设置餐厅图片
// =========================

function setRestaurantImage(
    imageUrl,
    key
) {

    const image =
        document.getElementById(
            "image-" + key
        );


    const placeholder =
        document.getElementById(
            "placeholder-" + key
        );


    const finalImage =
        imageUrl ||
        defaultImages[key] ||
        "";


    if (!finalImage) {

        image.style.display =
            "none";


        placeholder.style.display =
            "flex";


        return;

    }


    image.src =
        finalImage;


    image.onload =
        function() {

            image.style.display =
                "block";


            placeholder.style.display =
                "none";

        };


    image.onerror =
        function() {

            image.style.display =
                "none";


            placeholder.style.display =
                "flex";

        };

}


// =========================
// 读取餐厅
// =========================

async function loadRestaurant(
    restaurantId,
    key
) {

    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();


        if (!doc.exists) {

            showRestaurantError(key);

            return;

        }


        const restaurant =
            doc.data();


        // 名称

        document.getElementById(
            "name-" + key
        ).innerText =
            restaurant.name ||
            "我的餐厅";


        // 分类

        document.getElementById(
            "category-" + key
        ).innerText =
            restaurant.category ||
            "餐厅";


        // 介绍

        document.getElementById(
            "description-" + key
        ).innerText =
            restaurant.description ||
            "欢迎光临";


        // 评分

        document.getElementById(
            "rating-" + key
        ).innerText =
            "⭐ " +
            (
                restaurant.rating ||
                "暂无评分"
            );


        // 图片

        setRestaurantImage(
            restaurant.image ||
            "",
            key
        );


        // 分类

        document.getElementById(
            "restaurant-" + key
        ).dataset.category =
            getCategoryName(
                restaurant.category
            );


        // 营业状态

        updateRestaurantStatus(
            restaurant.status ||
            "营业中",
            key
        );


        // 菜品数量

        updateFoodCount(
            restaurantId,
            key
        );


    } catch (error) {

        console.error(error);

        showRestaurantError(key);

    }

}


// =========================
// 菜品数量
// =========================

async function updateFoodCount(
    restaurantId,
    key
) {

    try {

        const snapshot =
            await db
                .collection("foods")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();


        let count = 0;


        snapshot.forEach(
            function(doc) {

                const food =
                    doc.data();


                if (
                    food.status !== "下架"
                ) {

                    count++;

                }

            }
        );


        document.getElementById(
            "food-count-" + key
        ).innerText =
            "🍽️ " +
            count +
            " 道菜品";


    } catch (error) {

        console.error(
            "菜品数量读取失败:",
            error
        );


        document.getElementById(
            "food-count-" + key
        ).innerText =
            "🍽️ 菜品";
    }

}


// =========================
// 分类名称
// =========================

function getCategoryName(
    category
) {

    if (!category) {

        return "全部";

    }


    if (
        category.includes("川")
    ) {

        return "川菜";

    }


    if (
        category.includes("缅甸")
    ) {

        return "缅甸菜";

    }


    if (
        category.includes("烧烤") ||
        category.includes("夜宵")
    ) {

        return "烧烤";

    }


    return category;

}


// =========================
// 营业状态
// =========================

function updateRestaurantStatus(
    status,
    key
) {

    const restaurant =
        document.getElementById(
            "restaurant-" + key
        );


    const button =
        document.getElementById(
            "button-" + key
        );


    const badge =
        document.getElementById(
            "badge-" + key
        );


    if (
        status === "营业中"
    ) {

        badge.innerText =
            "🟢 营业中";


        badge.className =
            "status-badge open";


        button.innerText =
            "查看菜单";


        button.classList.remove(
            "closed"
        );


        button.onclick =
            function() {

                if (
                    key === "sichuan"
                ) {

                    openRestaurant(
                        "AxVX8H1owO7IKe0EJcmb"
                    );

                }


                if (
                    key === "mandalay"
                ) {

                    openRestaurant(
                        "DKIiikHUTmC5bFtuSVdb"
                    );

                }

            };


    } else {

        badge.innerText =
            "🔴 休息中";


        badge.className =
            "status-badge closed";


        button.innerText =
            "休息中";


        button.classList.add(
            "closed"
        );


        button.onclick =
            function() {

                alert(
                    "这家餐厅目前休息中，请稍后再来"
                );

            };

    }

}


// =========================
// 错误
// =========================

function showRestaurantError(
    key
) {

    document.getElementById(
        "name-" + key
    ).innerText =
        "餐厅";


    document.getElementById(
        "category-" + key
    ).innerText =
        "信息暂时无法获取";


    document.getElementById(
        "description-" + key
    ).innerText =
        "";


    document.getElementById(
        "rating-" + key
    ).innerText =
        "⭐";


    const button =
        document.getElementById(
            "button-" + key
        );


    button.innerText =
        "暂时无法点餐";


    button.classList.add(
        "closed"
    );


    const badge =
        document.getElementById(
            "badge-" + key
        );


    badge.innerText =
        "⚠️ 暂时无法点餐";


    badge.className =
        "status-badge closed";

}


// =========================
// 打开餐厅
// =========================

function openRestaurant(id) {

    if (!id) {

        alert(
            "这家餐厅的菜单还在准备中"
        );

        return;

    }


    window.location.href =
        "menu.html?id=" + id;

}


// =========================
// 读取菜品
// =========================

async function loadFoods() {

    try {

        const snapshot =
            await db
                .collection("foods")
                .get();


        allFoods = [];


        snapshot.forEach(
            function(doc) {

                const food =
                    doc.data();


                allFoods.push({

                    id: doc.id,

                    ...food

                });

            }
        );


        searchRestaurants();


    } catch (error) {

        console.error(
            "读取菜品失败:",
            error
        );

    }

}


// =========================
// 查找菜品
// =========================

function findFoodMatches(
    restaurantId,
    keyword
) {

    if (!keyword) {

        return [];

    }


    return allFoods.filter(
        function(food) {

            const foodRestaurantId =
                food.restaurantId ||
                "";


            const foodName =
                String(
                    food.name ||
                    ""
                ).toLowerCase();


            const foodDescription =
                String(
                    food.description ||
                    ""
                ).toLowerCase();


            const foodStatus =
                food.status ||
                "营业中";


            if (
                foodStatus === "下架"
            ) {

                return false;

            }


            return (
                foodRestaurantId ===
                restaurantId
                &&
                (
                    foodName.includes(
                        keyword
                    )
                    ||
                    foodDescription.includes(
                        keyword
                    )
                )
            );

        }
    );

}


// =========================
// 搜索
// =========================

function searchRestaurants() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const keyword =
        input.value
            .trim()
            .toLowerCase();


    const restaurants =
        document.querySelectorAll(
            ".restaurant"
        );


    let visibleCount = 0;


    restaurants.forEach(
        function(restaurant) {

            const restaurantText =
                restaurant.innerText
                    .toLowerCase();


            const category =
                restaurant.dataset.category ||
                "";


            let restaurantId =
                "";


            if (
                restaurant.id ===
                "restaurant-sichuan"
            ) {

                restaurantId =
                    "AxVX8H1owO7IKe0EJcmb";

            }


            if (
                restaurant.id ===
                "restaurant-mandalay"
            ) {

                restaurantId =
                    "DKIiikHUTmC5bFtuSVdb";

            }


            const foodMatches =
                findFoodMatches(
                    restaurantId,
                    keyword
                );


            const foodMatch =
                foodMatches.length > 0;


            const keywordMatch =
                !keyword ||
                restaurantText.includes(
                    keyword
                ) ||
                foodMatch;


            const categoryMatch =
                currentCategory === "全部" ||
                category === currentCategory;


            const show =
                keywordMatch &&
                categoryMatch;


            if (show) {

                restaurant.style.display =
                    "";


                visibleCount++;

            } else {

                restaurant.style.display =
                    "none";

            }


            // 菜品搜索提示

            const key =
                restaurant.id.replace(
                    "restaurant-",
                    ""
                );


            const foodMatchElement =
                document.getElementById(
                    "food-match-" + key
                );


            if (
                foodMatchElement
            ) {

                if (
                    keyword &&
                    foodMatches.length > 0
                ) {

                    const names =
                        foodMatches
                            .slice(0, 3)
                            .map(
                                function(food) {

                                    return (
                                        food.name ||
                                        "菜品"
                                    );

                                }
                            );


                    foodMatchElement.innerText =
                        "🍽️ 找到菜品：" +
                        names.join("、");


                    if (
                        foodMatches.length > 3
                    ) {

                        foodMatchElement.innerText +=
                            " 等";

                    }


                    foodMatchElement.style.display =
                        "block";


                } else {

                    foodMatchElement.style.display =
                        "none";

                }

            }

        }
    );


    const noResult =
        document.getElementById(
            "noResult"
        );


    if (
        visibleCount === 0
    ) {

        noResult.style.display =
            "block";

    } else {

        noResult.style.display =
            "none";

    }

}


// =========================
// 分类筛选
// =========================

function filterCategory(
    category,
    button
) {

    currentCategory =
        category;


    const buttons =
        document.querySelectorAll(
            ".category-btn"
        );


    buttons.forEach(
        function(btn) {

            btn.classList.remove(
                "active"
            );

        }
    );


    button.classList.add(
        "active"
    );


    searchRestaurants();

}


// =========================
// 启动
// =========================

loadRestaurant(
    "AxVX8H1owO7IKe0EJcmb",
    "sichuan"
);


loadRestaurant(
    "DKIiikHUTmC5bFtuSVdb",
    "mandalay"
);


loadFoods();


</script>
