<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家后台 - MDY FOOD</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #ff5a1f;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.restaurant-name {
    color: #ff5a1f;
    margin-top: 5px;
    font-size: 15px;
}

.logout {
    border: none;
    background: #555;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.form-group textarea {
    height: 80px;
    resize: vertical;
}

.add-food-btn {
    width: 100%;
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 13px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.food {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
}

.food img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.food-info {
    flex: 1;
    min-width: 0;
}

.food-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

.food-price {
    color: #ff5a1f;
    font-weight: bold;
    margin-bottom: 5px;
}

.food-description {
    color: #777;
    font-size: 14px;
    margin-bottom: 8px;
}

.food-status {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.food-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.food-buttons button {
    border: none;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

.status-btn {
    background: #555;
}

.edit-btn {
    background: #1677ff;
}

.delete-btn {
    background: #d33;
}

.cancel-btn {
    background: #777;
}

.save-edit-btn {
    background: #2e8b57;
}

.order {
    background: white;
    border: 1px solid #e8e8e8;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.order-new {
    border: 2px solid #ff5a1f;
}

.order-number {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.order-restaurant {
    color: #ff5a1f;
    font-weight: bold;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.status-waiting {
    background: #fff0e8;
    color: #ff5a1f;
}

.status-accepted {
    background: #eef6ff;
    color: #1677ff;
}

.status-rider {
    background: #f1edff;
    color: #6941c6;
}

.status-ready {
    background: #fff7df;
    color: #d88700;
}

.status-delivering {
    background: #eaf8ef;
    color: #16833b;
}

.status-completed {
    background: #e9f8ef;
    color: #16833b;
}

.progress {
    display: flex;
    align-items: center;
    margin: 8px 0 18px 0;
    width: 100%;
}

.progress-step {
    flex: 1;
    text-align: center;
    position: relative;
    min-width: 0;
}

.progress-step:not(:last-child)::after {
    content: "";
    position: absolute;
    height: 3px;
    background: #ddd;
    top: 13px;
    left: 50%;
    width: 100%;
    z-index: 0;
}

.progress-circle {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ddd;
    color: #777;
    margin: auto;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
}

.progress-step.active .progress-circle {
    background: #ff5a1f;
    color: white;
}

.progress-step.done .progress-circle {
    background: #2e8b57;
    color: white;
}

.progress-step.done:not(:last-child)::after {
    background: #2e8b57;
}

.progress-text {
    font-size: 11px;
    margin-top: 6px;
    color: #888;
    white-space: nowrap;
}

.progress-step.active .progress-text,
.progress-step.done .progress-text {
    color: #333;
    font-weight: bold;
}

.customer-box {
    background: #fafafa;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 13px;
    line-height: 1.8;
}

.customer-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.items {
    border-top: 1px solid #eee;
    margin-top: 12px;
    padding-top: 12px;
}

.items-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 9px 0;
    padding-bottom: 7px;
    border-bottom: 1px dashed #eee;
}

.item-name {
    flex: 1;
}

.item-price {
    font-weight: bold;
    white-space: nowrap;
}

.total {
    border-top: 1px solid #eee;
    margin-top: 12px;
    padding-top: 12px;
    color: #ff5a1f;
    font-size: 19px;
    font-weight: bold;
    text-align: right;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.buttons button {
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.accept-button {
    background: #1677ff !important;
}

.ready-button {
    background: #d88700 !important;
}

.completed {
    color: #2e8b57;
    font-weight: bold;
    margin-top: 15px;
}

.delivery-info {
    margin-top: 12px;
    padding: 13px;
    background: #f5f8ff;
    border-radius: 9px;
    font-size: 14px;
    line-height: 1.8;
}

.delivery-title {
    font-weight: bold;
    margin-bottom: 3px;
}

.time-info {
    color: #888;
    font-size: 13px;
    margin-top: 10px;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    color: #888;
}

.error {
    background: #fff0f0;
    color: #c00;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.6;
}

.success {
    background: #effff4;
    color: #16833b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
}

.restaurant-status {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.open-status {
    color: #2e8b57;
}

.closed-status {
    color: #d33;
}

.edit-box {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
}

.edit-box input,
.edit-box textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    margin-bottom: 8px;
    font-size: 14px;
}

.edit-box textarea {
    min-height: 65px;
    resize: vertical;
}

.edit-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.edit-buttons button {
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .section {
        padding: 14px;
    }

    .food {
        align-items: flex-start;
    }

    .food img {
        width: 75px;
        height: 75px;
    }

    .progress-text {
        font-size: 9px;
    }

    .progress-circle {
        width: 23px;
        height: 23px;
        font-size: 11px;
    }

    .order {
        padding: 14px;
    }
}
</style>
</head>

<body>

<header>
    🍜 MDY FOOD 商家后台
</header>

<div class="container">

    <div class="top">
        <div>
            <div class="title">👨‍🍳 商家管理</div>

            <div id="restaurantName" class="restaurant-name">
                正在读取餐厅...
            </div>
        </div>

        <button class="logout" onclick="logout()">
            退出登录
        </button>
    </div>


    <!-- 添加菜品 -->

    <div class="section">

        <div class="section-title">
            ➕ 添加菜品
        </div>

        <div id="successMessage" class="success">
            菜品添加成功！
        </div>

        <div class="form-group">
            <label>菜品名称</label>
            <input id="foodName" type="text" placeholder="例如：宫保鸡丁">
        </div>

        <div class="form-group">
            <label>价格（Ks）</label>
            <input id="foodPrice" type="number" placeholder="例如：8000">
        </div>

        <div class="form-group">
            <label>菜品描述</label>
            <textarea id="foodDescription" placeholder="例如：香辣可口，适合下饭"></textarea>
        </div>

        <div class="form-group">
            <label>图片地址</label>
            <input id="foodImage" type="text" placeholder="粘贴图片 URL（可留空）">
        </div>

        <button class="add-food-btn" onclick="addFood()">
            🍜 添加菜品
        </button>

    </div>


    <!-- 餐厅营业状态 -->

    <div class="section">

        <div class="section-title">
            🏪 餐厅营业状态
        </div>

        <div id="restaurantStatus" class="restaurant-status">
            正在读取...
        </div>

        <button
            id="restaurantStatusBtn"
            class="add-food-btn"
            onclick="toggleRestaurantStatus()">
            正在读取...
        </button>

    </div>


    <!-- 餐厅资料 -->

    <div class="section">

        <div class="section-title">
            🏪 餐厅资料
        </div>

        <div class="form-group">
            <label>餐厅名称</label>
            <input id="editRestaurantName" type="text" placeholder="例如：四川味道">
        </div>

        <div class="form-group">
            <label>餐厅分类</label>
            <input id="editRestaurantCategory" type="text" placeholder="例如：川菜 · 中餐">
        </div>

        <div class="form-group">
            <label>餐厅介绍</label>
            <textarea id="editRestaurantDescription" placeholder="介绍一下你的餐厅"></textarea>
        </div>

        <button class="add-food-btn" onclick="saveRestaurantInfo()">
            💾 保存餐厅资料
        </button>

        <div id="restaurantSaveMessage" class="success" style="margin-top:12px;">
            餐厅资料保存成功！
        </div>

    </div>


    <!-- 菜品 -->

    <div class="section">

        <div class="section-title">
            🍽️ 我的菜品
        </div>

        <div id="foods">
            正在加载菜品...
        </div>

    </div>


    <!-- 订单 -->

    <div class="section">

        <div class="section-title">
            📦 我的订单
        </div>

        <div id="orders">
            正在加载订单...
        </div>

    </div>

</div>


<script>

// ========================================
// 登录检查
// ========================================

if (localStorage.getItem("merchantLogin") !== "true") {

    window.location.href = "admin-login.html";

}


// ========================================
// 当前餐厅 ID
// ========================================

const restaurantId =
    localStorage.getItem("merchantRestaurantId");

if (!restaurantId) {

    alert("没有找到商家餐厅信息，请重新登录");

    localStorage.removeItem("merchantLogin");

    window.location.href = "admin-login.html";
}


// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey: "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqxv5X7Q",

    authDomain: "mdy-food.firebaseapp.com",

    projectId: "mdy-food",

    storageBucket: "mdy-food.firebasestorage.app",

    messagingSenderId: "498327590625",

    appId: "1:498327590625:web:cceafb7febb689e7ad09a0"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


// ========================================
// 防止特殊字符破坏页面
// ========================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// 读取餐厅
// ========================================

async function loadRestaurant() {

    try {

        const doc = await db
            .collection("restaurants")
            .doc(restaurantId)
            .get();

        if (doc.exists) {

            const restaurant = doc.data();

            document.getElementById("restaurantName").innerText =
                "🏪 " + (restaurant.name || "我的餐厅");

        } else {

            document.getElementById("restaurantName").innerText =
                "🏪 我的餐厅";
        }

    } catch (error) {

        console.error(error);

        document.getElementById("restaurantName").innerText =
            "🏪 我的餐厅";
    }

}


// ========================================
// 餐厅资料
// ========================================

async function loadRestaurantInfo() {

    try {

        const doc = await db
            .collection("restaurants")
            .doc(restaurantId)
            .get();

        if (!doc.exists) {
            return;
        }

        const restaurant = doc.data();

        document.getElementById("editRestaurantName").value =
            restaurant.name || "";

        document.getElementById("editRestaurantCategory").value =
            restaurant.category || "";

        document.getElementById("editRestaurantDescription").value =
            restaurant.description || "";

    } catch (error) {

        console.error(error);

    }

}


// ========================================
// 保存餐厅资料
// ========================================

async function saveRestaurantInfo() {

    const name =
        document
            .getElementById("editRestaurantName")
            .value
            .trim();

    const category =
        document
            .getElementById("editRestaurantCategory")
            .value
            .trim();

    const description =
        document
            .getElementById("editRestaurantDescription")
            .value
            .trim();

    if (!name) {

        alert("请输入餐厅名称");

        return;
    }

    try {

        await db
            .collection("restaurants")
            .doc(restaurantId)
            .update({

                name: name,

                category: category,

                description: description

            });

        document.getElementById("restaurantName").innerText =
            "🏪 " + name;

        const message =
            document.getElementById("restaurantSaveMessage");

        message.style.display = "block";

        setTimeout(function() {

            message.style.display = "none";

        }, 2500);

    } catch (error) {

        alert(
            "保存餐厅资料失败：" +
            error.message
        );

        console.error(error);
    }

}


// ========================================
// 餐厅营业状态
// ========================================

async function loadRestaurantStatus() {

    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();

        const status =
            doc.exists
                ? (doc.data().status || "营业中")
                : "营业中";

        const statusElement =
            document.getElementById("restaurantStatus");

        const button =
            document.getElementById("restaurantStatusBtn");

        if (status === "营业中") {

            statusElement.innerText =
                "🟢 营业中";

            statusElement.className =
                "restaurant-status open-status";

            button.innerText =
                "🔴 暂停营业";

        } else {

            statusElement.innerText =
                "🔴 休息中";

            statusElement.className =
                "restaurant-status closed-status";

            button.innerText =
                "🟢 恢复营业";
        }

    } catch (error) {

        console.error(error);

        document.getElementById("restaurantStatus").innerText =
            "读取失败";

        document.getElementById("restaurantStatusBtn").innerText =
            "重新读取";
    }

}


// ========================================
// 修改餐厅营业状态
// ========================================

async function toggleRestaurantStatus() {

    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();

        const currentStatus =
            doc.exists
                ? (doc.data().status || "营业中")
                : "营业中";

        const newStatus =
            currentStatus === "营业中"
                ? "休息中"
                : "营业中";

        await db
            .collection("restaurants")
            .doc(restaurantId)
            .update({

                status: newStatus

            });

        loadRestaurantStatus();

    } catch (error) {

        alert(
            "修改营业状态失败：" +
            error.message
        );

        console.error(error);
    }

}


// ========================================
// 添加菜品
// ========================================

async function addFood() {

    const name =
        document
            .getElementById("foodName")
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById("foodPrice")
                .value
        );

    const description =
        document
            .getElementById("foodDescription")
            .value
            .trim();

    const image =
        document
            .getElementById("foodImage")
            .value
            .trim();

    if (!name) {

        alert("请输入菜品名称");

        return;
    }

    if (!price || price <= 0) {

        alert("请输入正确的价格");

        return;
    }

    try {

        await db
            .collection("foods")
            .add({

                restaurantId: restaurantId,

                name: name,

                price: price,

                description: description,

                image: image,

                status: "营业中"

            });

        document.getElementById("foodName").value = "";

        document.getElementById("foodPrice").value = "";

        document.getElementById("foodDescription").value = "";

        document.getElementById("foodImage").value = "";

        const message =
            document.getElementById("successMessage");

        message.style.display = "block";

        setTimeout(function() {

            message.style.display = "none";

        }, 2500);

        loadFoods();

    } catch (error) {

        alert(
            "添加菜品失败：" +
            error.message
        );

        console.error(error);
    }

}


// ========================================
// 加载菜品
// ========================================

async function loadFoods() {

    try {

        const snapshot =
            await db
                .collection("foods")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();

        const container =
            document.getElementById("foods");

        if (snapshot.empty) {

            container.innerHTML = `
                <div class="empty">
                    目前还没有菜品
                </div>
            `;

            return;
        }

        container.innerHTML = "";

        snapshot.forEach(function(doc) {

            const food = doc.data();

            const div =
                document.createElement("div");

            div.className = "food";

            const image =
                food.image ||
                "https://via.placeholder.com/90";

            const statusText =
                food.status === "营业中"
                    ? "🟢 营业中"
                    : "🔴 已下架";

            div.innerHTML = `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(food.name || "")}"
                    onerror="this.src='https://via.placeholder.com/90'"
                >

                <div class="food-info">

                    <div class="food-name">
                        ${escapeHtml(food.name || "")}
                    </div>

                    <div class="food-price">
                        ${Number(food.price || 0).toLocaleString()} Ks
                    </div>

                    <div class="food-description">
                        ${escapeHtml(food.description || "")}
                    </div>

                    <div class="food-status">
                        ${statusText}
                    </div>

                    <div class="food-buttons">

                        <button
                            class="edit-btn"
                            onclick="showEditFood('${doc.id}')">
                            ✏️ 编辑
                        </button>

                        <button
                            class="status-btn"
                            onclick="toggleFoodStatus(
                                '${doc.id}',
                                '${escapeHtml(food.status || "营业中")}'
                            )">
                            ${
                                food.status === "营业中"
                                    ? "下架"
                                    : "上架"
                            }
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteFood('${doc.id}')">
                            🗑️ 删除
                        </button>

                    </div>

                    <div
                        id="edit-${doc.id}"
                        class="edit-box"
                        style="display:none;">

                        <strong>
                            ✏️ 编辑菜品
                        </strong>

                        <br><br>

                        <input
                            id="edit-name-${doc.id}"
                            type="text"
                            value="${escapeHtml(food.name || "")}"
                            placeholder="菜品名称">

                        <input
                            id="edit-price-${doc.id}"
                            type="number"
                            value="${Number(food.price || 0)}"
                            placeholder="价格">

                        <textarea
                            id="edit-description-${doc.id}"
                            placeholder="菜品描述">${escapeHtml(food.description || "")}</textarea>

                        <input
                            id="edit-image-${doc.id}"
                            type="text"
                            value="${escapeHtml(food.image || "")}"
                            placeholder="图片 URL">

                        <div class="edit-buttons">

                            <button
                                class="save-edit-btn"
                                onclick="saveFoodEdit('${doc.id}')">
                                💾 保存
                            </button>

                            <button
                                class="cancel-btn"
                                onclick="cancelFoodEdit('${doc.id}')">
                                取消
                            </button>

                        </div>

                    </div>

                </div>
            `;

            container.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("foods").innerHTML = `

            <div class="error">

                ❌ 读取菜品失败

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;
    }

}

// ========================================
// 保存菜品编辑
// ========================================

async function saveFoodEdit(documentId) {

    const name =
        document
            .getElementById(
                "edit-name-" + documentId
            )
            .value
            .trim();

    const price =
        Number(
            document
                .getElementById(
                    "edit-price-" + documentId
                )
                .value
        );

    const description =
        document
            .getElementById(
                "edit-description-" + documentId
            )
            .value
            .trim();

    const image =
        document
            .getElementById(
                "edit-image-" + documentId
            )
            .value
            .trim();

    if (!name) {

        alert("请输入菜品名称");

        return;
    }

    if (!price || price <= 0) {

        alert("请输入正确的价格");

        return;
    }

    try {

        await db
            .collection("foods")
            .doc(documentId)
            .update({

                name: name,

                price: price,

                description: description,

                image: image

            });

        alert("菜品修改成功！");

        loadFoods();

    } catch (error) {

        alert(
            "修改菜品失败：" +
            error.message
        );

    }

}

// ========================================
// 获取订单进度
// ========================================

function getOrderStep(status) {

    const steps = [

        "待接单",

        "商家已接单",

        "骑手已接单",

        "外卖好了",

        "配送中",

        "已完成"

    ];

    const index =
        steps.indexOf(status);

    return index >= 0 ? index : 0;

}


// ========================================
// 生成订单进度条
// ========================================

function createProgress(status) {

    const steps = [

        {
            name: "待接单",
            icon: "1"
        },

        {
            name: "商家已接单",
            icon: "2"
        },

        {
            name: "骑手已接单",
            icon: "3"
        },

        {
            name: "外卖好了",
            icon: "4"
        },

        {
            name: "配送中",
            icon: "5"
        },

        {
            name: "已完成",
            icon: "6"
        }

    ];

    const currentStep =
        getOrderStep(status);

    let html =
        `<div class="progress">`;

    steps.forEach(function(step, index) {

        let className = "";

        if (index < currentStep) {

            className = "done";

        } else if (index === currentStep) {

            className = "active";

        }

        html += `

            <div class="progress-step ${className}">

                <div class="progress-circle">
                    ${index < currentStep ? "✓" : step.icon}
                </div>

                <div class="progress-text">
                    ${step.name}
                </div>

            </div>

        `;

    });

    html += `</div>`;

    return html;

}


// ========================================
// 获取状态 CSS
// ========================================

function getStatusClass(status) {

    if (status === "待接单") {
        return "status-waiting";
    }

    if (status === "商家已接单") {
        return "status-accepted";
    }

    if (status === "骑手已接单") {
        return "status-rider";
    }

    if (status === "外卖好了") {
        return "status-ready";
    }

    if (status === "配送中") {
        return "status-delivering";
    }

    if (status === "已完成") {
        return "status-completed";
    }

    return "status-waiting";

}


// ========================================
// 加载订单
// ========================================

async function loadOrders() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();

        let orders = [];

        snapshot.forEach(function(doc) {

            orders.push({

                id: doc.id,

                data: doc.data()

            });

        });


        // ========================================
        // 最新订单排前面
        // ========================================

        orders.sort(function(a, b) {

            const timeA =
                a.data.created_at &&
                a.data.created_at.toMillis
                    ? a.data.created_at.toMillis()
                    : 0;

            const timeB =
                b.data.created_at &&
                b.data.created_at.toMillis
                    ? b.data.created_at.toMillis()
                    : 0;

            return timeB - timeA;

        });


        const container =
            document.getElementById("orders");


        if (orders.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    📦 目前没有属于本餐厅的订单

                </div>

            `;

            return;
        }


        container.innerHTML = "";


        orders.forEach(function(orderObject) {

            const order =
                orderObject.data;

            const documentId =
                orderObject.id;


            // ========================================
            // 时间
            // ========================================

            let createdTime = "暂无";

            if (
                order.created_at &&
                order.created_at.toDate
            ) {

                createdTime =
                    order.created_at
                        .toDate()
                        .toLocaleString();

            }


            // ========================================
            // 状态
            // ========================================

            const status =
                order.status || "待接单";


            // ========================================
            // 菜品
            // ========================================

            let itemsHTML = "";

            let itemCount = 0;

            if (
                order.items &&
                Array.isArray(order.items)
            ) {

                order.items.forEach(function(item) {

                    const quantity =
                        Number(
                            item.quantity || 0
                        );

                    const price =
                        Number(
                            item.price || 0
                        );

                    const subtotal =
                        price * quantity;

                    itemCount += quantity;

                    itemsHTML += `

                        <div class="item">

                            <div class="item-name">

                                ${escapeHtml(
                                    item.name || ""
                                )}

                                × ${quantity}

                            </div>

                            <div class="item-price">

                                ${subtotal.toLocaleString()}
                                Ks

                            </div>

                        </div>

                    `;

                });

            }


            // ========================================
            // 商家按钮
            // ========================================

            let buttonHTML = "";


            // ----------------------------------------
            // 待接单
            // ----------------------------------------

            if (status === "待接单") {

                buttonHTML = `

                    <button
                        class="accept-button"
                        onclick="changeStatus(
                            '${documentId}',
                            '商家已接单'
                        )">

                        ✅ 接受订单

                    </button>

                `;

            }


            // ----------------------------------------
            // 商家已接单
            // ----------------------------------------

            else if (
                status === "商家已接单"
            ) {

                buttonHTML = `

                    <button
                        class="ready-button"
                        onclick="changeStatus(
                            '${documentId}',
                            '外卖好了'
                        )">

                        🍱 外卖好了

                    </button>

                    <div class="delivery-info">

                        ⏳ <strong>等待骑手接单</strong>

                        <br>

                        骑手接单后，您可以继续制作外卖。

                    </div>

                `;

            }


            // ----------------------------------------
            // 骑手已接单
            // ----------------------------------------

            else if (
                status === "骑手已接单"
            ) {

                buttonHTML = `

                    <div class="delivery-info">

                        <div class="delivery-title">
                            🛵 骑手已接单
                        </div>

                        👨‍🍳 骑手正在等待外卖做好

                        <br>

                        ${
                            order.deliveryUsername
                                ? "配送员：" +
                                  escapeHtml(
                                      order.deliveryUsername
                                  )
                                : "配送员：已接单"
                        }

                    </div>


                    <button
                        class="ready-button"
                        onclick="changeStatus(
                            '${documentId}',
                            '外卖好了'
                        )">

                        🍱 外卖好了

                    </button>

                `;

            }


            // ----------------------------------------
            // 外卖好了
            // ----------------------------------------

            else if (
                status === "外卖好了"
            ) {

                buttonHTML = `

                    <div class="delivery-info">

                        <div class="delivery-title">
                            🍱 外卖已经做好
                        </div>

                        ${
                            order.deliveryUsername
                                ? "🛵 配送员：" +
                                  escapeHtml(
                                      order.deliveryUsername
                                  ) +
                                  "<br>骑手可以来取餐"
                                : "🛵 正在等待骑手接单"
                        }

                    </div>

                `;

            }


            // ----------------------------------------
            // 配送中
            // ----------------------------------------

            else if (
                status === "配送中"
            ) {

                buttonHTML = `

                    <div class="delivery-info">

                        <div class="delivery-title">
                            🛵 骑手正在配送
                        </div>

                        ${
                            order.deliveryUsername
                                ? "配送员：" +
                                  escapeHtml(
                                      order.deliveryUsername
                                  )
                                : "骑手信息读取中"
                        }

                        <br>

                        📦 外卖已经取走，正在送往顾客。

                    </div>

                `;

            }


            // ----------------------------------------
            // 已完成
            // ----------------------------------------

            else if (
                status === "已完成"
            ) {

                buttonHTML = `

                    <div class="delivery-info">

                        <div class="delivery-title">
                            ✅ 订单已完成
                        </div>

                        顾客已经收到外卖。

                    </div>

                `;

            }


            // ========================================
            // 骑手信息
            // ========================================

            let riderInfoHTML = "";

            if (order.deliveryId) {

                riderInfoHTML = `

                    <div class="delivery-info">

                        <div class="delivery-title">
                            🛵 配送员信息
                        </div>

                        👤 配送员：
                        ${
                            escapeHtml(
                                order.deliveryUsername ||
                                "未知"
                            )
                        }

                        ${
                            order.deliveryPhone
                                ? "<br>📞 电话：" +
                                  escapeHtml(
                                      order.deliveryPhone
                                  )
                                : ""
                        }

                    </div>

                `;

            }


            // ========================================
            // 新订单判断
            // ========================================

            const newOrderClass =
                status === "待接单"
                    ? "order order-new"
                    : "order";


            // ========================================
            // 创建订单卡片
            // ========================================

            const div =
                document.createElement("div");

            div.className =
                newOrderClass;


            div.innerHTML = `

                <div class="order-number">

                    📦 订单号：
                    ${escapeHtml(
                        order.order_number ||
                        documentId
                    )}

                </div>


                <div class="order-restaurant">

                    🏪
                    ${escapeHtml(
                        order.restaurantName ||
                        "本餐厅"
                    )}

                </div>


                <div class="status ${getStatusClass(status)}">

                    ${
                        status === "待接单"
                            ? "🔴 "
                            : status === "商家已接单"
                            ? "🔵 "
                            : status === "骑手已接单"
                            ? "🟣 "
                            : status === "外卖好了"
                            ? "🟠 "
                            : status === "配送中"
                            ? "🟢 "
                            : "✅ "
                    }

                    ${escapeHtml(status)}

                </div>


                ${createProgress(status)}


                <div class="customer-box">

                    <div class="customer-title">
                        👤 顾客信息
                    </div>

                    👤 姓名：
                    ${escapeHtml(
                        order.customername || ""
                    )}

                    <br>

                    📞 电话：
                    ${escapeHtml(
                        order.phone || ""
                    )}

                    <br>

                    📍 地址：
                    ${escapeHtml(
                        order.adress ||
                        order.address ||
                        ""
                    )}

                    <br>

                    💳 支付方式：
                    ${escapeHtml(
                        order.payment || ""
                    )}

                </div>


                <div class="items">

                    <div class="items-title">

                        🍜 订单内容

                        <span style="
                            color:#888;
                            font-size:13px;
                            font-weight:normal;
                        ">

                            共 ${itemCount} 件

                        </span>

                    </div>

                    ${itemsHTML}

                </div>


                <div class="total">

                    总计：
                    ${Number(
                        order.total || 0
                    ).toLocaleString()}
                    Ks

                </div>


                ${riderInfoHTML}


                <div class="time-info">

                    🕒 下单时间：
                    ${escapeHtml(createdTime)}

                </div>


                <div class="buttons">

                    ${buttonHTML}

                </div>

            `;


            container.appendChild(div);

        });

    } catch (error) {

        console.error(error);

        document.getElementById("orders").innerHTML = `

            <div class="error">

                ❌ 读取订单失败

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


// ========================================
// 修改订单状态
// ========================================

async function changeStatus(
    documentId,
    newStatus
) {

    const allowedStatuses = [

        "商家已接单",

        "外卖好了"

    ];


    if (
        !allowedStatuses.includes(
            newStatus
        )
    ) {

        alert(
            "商家不能直接修改为这个状态"
        );

        return;
    }


    try {

        const orderRef =
            db
                .collection("orders")
                .doc(documentId);


        const orderSnap =
            await orderRef.get();


        if (!orderSnap.exists) {

            alert("订单不存在");

            return;
        }


        const order =
            orderSnap.data();


        // ========================================
        // 接受订单
        // ========================================

        if (
            newStatus === "商家已接单"
        ) {

            if (
                order.status !== "待接单"
            ) {

                alert(
                    "这个订单当前不能接受"
                );

                return;
            }

        }


        // ========================================
        // 外卖好了
        // ========================================

        if (
            newStatus === "外卖好了"
        ) {

            if (
                order.status !== "商家已接单" &&
                order.status !== "骑手已接单"
            ) {

                alert(
                    "这个订单当前不能标记为外卖好了"
                );

                return;
            }

        }


        await orderRef.update({

            status: newStatus

        });


        await loadOrders();

    } catch (error) {

        alert(
            "修改订单状态失败：" +
            error.message
        );

        console.error(error);
    }

}
