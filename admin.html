<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家后台 - MDY FOOD</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #ff5a1f;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.restaurant-name {
    color: #ff5a1f;
    margin-top: 5px;
    font-size: 15px;
}

.logout {
    border: none;
    background: #555;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

/* =========================
   数据统计
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 16px 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stat-icon {
    font-size: 25px;
    margin-bottom: 7px;
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 5px;
}

.stat-label {
    color: #888;
    font-size: 13px;
}

.stat-money {
    color: #ff5a1f;
}

.stat-pending {
    color: #d88700;
}

.stat-delivering {
    color: #16833b;
}

/* =========================
   通用
========================= */

.section {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.form-group textarea {
    height: 80px;
    resize: vertical;
}

.add-food-btn {
    width: 100%;
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 13px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.food {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
}

.food img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.food-info {
    flex: 1;
    min-width: 0;
}

.food-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

.food-price {
    color: #ff5a1f;
    font-weight: bold;
    margin-bottom: 5px;
}

.food-description {
    color: #777;
    font-size: 14px;
    margin-bottom: 8px;
}

.food-status {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.food-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.food-buttons button {
    border: none;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

.status-btn {
    background: #555;
}

.edit-btn {
    background: #1677ff;
}

.delete-btn {
    background: #d33;
}

.cancel-btn {
    background: #777;
}

.save-edit-btn {
    background: #2e8b57;
}

/* =========================
   订单
========================= */

.order {
    background: white;
    border: 1px solid #e8e8e8;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.order-new {
    border: 2px solid #ff5a1f;
}

.order-number {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.order-restaurant {
    color: #ff5a1f;
    font-weight: bold;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.status-waiting {
    background: #fff0e8;
    color: #ff5a1f;
}

.status-accepted {
    background: #eef6ff;
    color: #1677ff;
}

.status-rider {
    background: #f1edff;
    color: #6941c6;
}

.status-ready {
    background: #fff7df;
    color: #d88700;
}

.status-delivering {
    background: #eaf8ef;
    color: #16833b;
}

.status-completed {
    background: #e9f8ef;
    color: #16833b;
}

.status-cancelled {
    background: #f3f3f3;
    color: #888;
}

.progress {
    display: flex;
    align-items: center;
    margin: 8px 0 18px 0;
    width: 100%;
}

.progress-step {
    flex: 1;
    text-align: center;
    position: relative;
    min-width: 0;
}

.progress-step:not(:last-child)::after {
    content: "";
    position: absolute;
    height: 3px;
    background: #ddd;
    top: 13px;
    left: 50%;
    width: 100%;
    z-index: 0;
}

.progress-circle {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ddd;
    color: #777;
    margin: auto;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
}

.progress-step.active .progress-circle {
    background: #ff5a1f;
    color: white;
}

.progress-step.done .progress-circle {
    background: #2e8b57;
    color: white;
}

.progress-step.done:not(:last-child)::after {
    background: #2e8b57;
}

.progress-text {
    font-size: 11px;
    margin-top: 6px;
    color: #888;
    white-space: nowrap;
}

.progress-step.active .progress-text,
.progress-step.done .progress-text {
    color: #333;
    font-weight: bold;
}

.customer-box {
    background: #fafafa;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 13px;
    line-height: 1.8;
}

.customer-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.items {
    border-top: 1px solid #eee;
    margin-top: 12px;
    padding-top: 12px;
}

.items-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 9px 0;
    padding-bottom: 7px;
    border-bottom: 1px dashed #eee;
}

.item-name {
    flex: 1;
}

.item-price {
    font-weight: bold;
    white-space: nowrap;
}

.total {
    border-top: 1px solid #eee;
    margin-top: 12px;
    padding-top: 12px;
    color: #ff5a1f;
    font-size: 19px;
    font-weight: bold;
    text-align: right;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.buttons button {
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.accept-button {
    background: #1677ff !important;
}

.ready-button {
    background: #d88700 !important;
}

.delivery-info {
    margin-top: 12px;
    padding: 13px;
    background: #f5f8ff;
    border-radius: 9px;
    font-size: 14px;
    line-height: 1.8;
}

.delivery-title {
    font-weight: bold;
    margin-bottom: 3px;
}

.time-info {
    color: #888;
    font-size: 13px;
    margin-top: 10px;
}

.order-time-box {
    margin-top: 12px;
    padding: 12px;
    background: #fafafa;
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.9;
}

.order-time-title {
    font-weight: bold;
    margin-bottom: 4px;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    color: #888;
}

.error {
    background: #fff0f0;
    color: #c00;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.6;
}

.success {
    background: #effff4;
    color: #16833b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
}

.restaurant-status {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.open-status {
    color: #2e8b57;
}

.closed-status {
    color: #d33;
}

.edit-box {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
}

.edit-box input,
.edit-box textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    margin-bottom: 8px;
    font-size: 14px;
}

.edit-box textarea {
    min-height: 65px;
    resize: vertical;
}

.edit-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.edit-buttons button {
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   商家工具栏 / 订单筛选
========================= */

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.search-input {
    flex: 1;
    min-width: 180px;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

.search-input:focus {
    border-color: #ff5a1f;
}

.refresh-btn {
    border: none;
    background: #555;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.filter-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.filter-buttons button {
    border: 1px solid #ddd;
    background: white;
    color: #555;
    padding: 8px 12px;
    border-radius: 18px;
    cursor: pointer;
}

.filter-buttons button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
    color: white;
}

.order-filter-count {
    color: #888;
    font-size: 13px;
    margin-bottom: 10px;
}

/* =========================
   订单金额统计
========================= */

.order-finance-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.order-finance-card {
    background: #fafafa;
    border-radius: 10px;
    padding: 13px 10px;
    text-align: center;
}

.order-finance-card .label {
    color: #888;
    font-size: 12px;
    margin-bottom: 6px;
}

.order-finance-card .value {
    font-size: 17px;
    font-weight: bold;
    color: #ff5a1f;
}

.order-finance-card.completed .value {
    color: #2e8b57;
}

.order-finance-card.filtered .value {
    color: #1677ff;
}

.order-live {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #2e8b57;
    background: #effff4;
    padding: 5px 9px;
    border-radius: 15px;
    margin-bottom: 12px;
}

.order-live-dot {
    width: 7px;
    height: 7px;
    background: #2e8b57;
    border-radius: 50%;
}

.restaurant-preview {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
    display: none;
}

.info-tip {
    background: #f7f9fb;
    color: #666;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.6;
}

.food-search-wrap {
    margin-bottom: 15px;
}

.food-hidden {
    display: none !important;
}

.stat-success {
    color: #2e8b57;
}

/* =========================
   顾客评价
========================= */

.review-summary {
    background: #fff8f2;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
}

.review-summary-top {
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.review-average {
    font-size: 34px;
    font-weight: bold;
    color: #ff5a1f;
    min-width: 70px;
}

.review-stars {
    color: #ffb000;
    font-size: 20px;
    letter-spacing: 2px;
}

.review-count {
    color: #777;
    font-size: 13px;
    margin-top: 4px;
}

.review-distribution {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.review-distribution-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
}

.review-distribution-label {
    width: 35px;
    flex-shrink: 0;
    color: #555;
}

.review-bar {
    flex: 1;
    height: 8px;
    background: #e9e9e9;
    border-radius: 10px;
    overflow: hidden;
}

.review-bar-fill {
    height: 100%;
    background: #ffb000;
    border-radius: 10px;
    transition: width 0.25s ease;
}

.review-distribution-count {
    width: 30px;
    text-align: right;
    color: #777;
}

.review-toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.review-filter-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.review-filter-buttons button {
    border: 1px solid #ddd;
    background: white;
    color: #555;
    padding: 7px 11px;
    border-radius: 18px;
    cursor: pointer;
}

.review-filter-buttons button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
    color: white;
}

.review-list-count {
    color: #888;
    font-size: 13px;
    margin-bottom: 10px;
}

.review-card {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    background: #fff;
}

.review-card:hover {
    border-color: #ffd2bf;
}

.review-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 7px;
}

.review-user {
    font-weight: bold;
}

.review-time {
    color: #999;
    font-size: 12px;
}

.review-comment {
    margin-top: 8px;
    line-height: 1.7;
    color: #444;
    white-space: pre-wrap;
}

.review-order {
    color: #888;
    font-size: 12px;
    margin-top: 8px;
}

.review-rating-number {
    color: #777;
    font-size: 13px;
    margin-left: 5px;
}

.review-empty {
    padding: 30px 15px;
    text-align: center;
    color: #888;
    background: #fafafa;
    border-radius: 10px;
}

.review-loading {
    padding: 25px;
    text-align: center;
    color: #888;
}

.review-live {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #2e8b57;
    background: #effff4;
    padding: 5px 9px;
    border-radius: 15px;
}

.review-live-dot {
    width: 7px;
    height: 7px;
    background: #2e8b57;
    border-radius: 50%;
}

@media (max-width: 700px) {

    .order-finance-summary {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .toolbar {
        flex-direction: column;
    }

    .search-input,
    .refresh-btn {
        width: 100%;
    }

    .review-toolbar {
        flex-direction: column;
    }

    .review-toolbar .search-input {
        width: 100%;
    }
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .section {
        padding: 14px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .stat-card {
        padding: 14px 8px;
    }

    .stat-number {
        font-size: 20px;
    }

    .food {
        align-items: flex-start;
    }

    .food img {
        width: 75px;
        height: 75px;
    }

    .progress-text {
        font-size: 9px;
    }

    .progress-circle {
        width: 23px;
        height: 23px;
        font-size: 11px;
    }

    .order {
        padding: 14px;
    }

    .review-summary-top {
        align-items: flex-start;
    }

    .review-average {
        font-size: 30px;
    }

}
</style>
</head>

<body>

<header>
    🍜 MDY FOOD 商家后台
</header>

<div class="container">

    <div class="top">
        <div>
            <div class="title">👨‍🍳 商家管理</div>

            <div id="restaurantName" class="restaurant-name">
                正在读取餐厅...
            </div>
        </div>

        <button class="logout" onclick="logout()">
            退出登录
        </button>
    </div>


    <!-- =========================
         数据统计
    ========================== -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <div
                id="todayOrders"
                class="stat-number">
                0
            </div>

            <div class="stat-label">
                今日订单
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <div
                id="todayRevenue"
                class="stat-number stat-money">
                0 Ks
            </div>

            <div class="stat-label">
                今日营业额
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⏳
            </div>

            <div
                id="pendingOrders"
                class="stat-number stat-pending">
                0
            </div>

            <div class="stat-label">
                待处理
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🛵
            </div>

            <div
                id="deliveringOrders"
                class="stat-number stat-delivering">
                0
            </div>

            <div class="stat-label">
                配送中
            </div>

        </div>

    </div>


    <!-- =========================
         顾客评价
    ========================== -->

    <div class="section">

        <div class="section-title">
            ⭐ 顾客评价管理
        </div>

        <div id="reviewSummary" class="review-summary">

            <div class="review-summary-top">

                <div class="review-average">
                    暂无
                </div>

                <div>

                    <div class="review-stars">
                        ☆☆☆☆☆
                    </div>

                    <div class="review-count">
                        正在读取评价...
                    </div>

                </div>

                <div class="review-live">
                    <span class="review-live-dot"></span>
                    实时更新
                </div>

            </div>

            <div id="reviewDistribution"
                 class="review-distribution">

            </div>

        </div>


        <div class="review-toolbar">

            <input
                id="reviewSearch"
                class="search-input"
                type="text"
                placeholder="搜索顾客姓名、评价内容、订单号..."
                oninput="renderReviews()">

        </div>


        <div class="review-filter-buttons">

            <button
                id="review-filter-all"
                class="active"
                onclick="setReviewFilter(0)">

                全部

            </button>

            <button
                id="review-filter-5"
                onclick="setReviewFilter(5)">

                ⭐ 5星

            </button>

            <button
                id="review-filter-4"
                onclick="setReviewFilter(4)">

                ⭐ 4星

            </button>

            <button
                id="review-filter-3"
                onclick="setReviewFilter(3)">

                ⭐ 3星

            </button>

            <button
                id="review-filter-2"
                onclick="setReviewFilter(2)">

                ⭐ 2星

            </button>

            <button
                id="review-filter-1"
                onclick="setReviewFilter(1)">

                ⭐ 1星

            </button>

        </div>


        <div
            id="reviewListCount"
            class="review-list-count">
        </div>


        <div id="reviews">

            <div class="review-loading">
                ⭐ 正在读取顾客评价...
            </div>

        </div>

    </div>


    <!-- =========================
         添加菜品
    ========================== -->

    <div class="section">

        <div class="section-title">
            ➕ 添加菜品
        </div>

        <div id="successMessage" class="success">
            菜品添加成功！
        </div>

        <div class="form-group">

            <label>菜品名称</label>

            <input

// ========================================
// 防止特殊字符破坏页面
// ========================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// 获取时间毫秒
// ========================================

function getTimestampMillis(timestamp) {

    if (!timestamp) {
        return 0;
    }

    try {

        if (
            typeof timestamp.toMillis === "function"
        ) {

            return timestamp.toMillis();

        }

        if (
            typeof timestamp.toDate === "function"
        ) {

            return timestamp.toDate().getTime();

        }

        const date =
            new Date(timestamp);

        return Number.isNaN(
            date.getTime()
        )
            ? 0
            : date.getTime();

    } catch (error) {

        return 0;

    }

}


// ========================================
// 格式化时间
// ========================================

function formatDateTime(timestamp) {

    const millis =
        getTimestampMillis(timestamp);

    if (!millis) {
        return "暂无";
    }

    try {

        return new Date(millis)
            .toLocaleString("zh-CN");

    } catch (error) {

        return "暂无";

    }

}


// ========================================
// 判断订单是不是今天
// ========================================

function isToday(timestamp) {

    const millis =
        getTimestampMillis(timestamp);

    if (!millis) {
        return false;
    }

    const date =
        new Date(millis);

    const now =
        new Date();

    return (
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate()
    );

}


// ========================================
// 更新商家统计
// ========================================

function updateMerchantStats() {

    let todayOrders = 0;

    let todayRevenue = 0;

    let pendingOrders = 0;

    let deliveringOrders = 0;


    allOrders.forEach(function(orderObject) {

        const order =
            orderObject.data || {};

        const status =
            order.status || "待接单";


        if (
            status === "待接单" ||
            status === "商家已接单" ||
            status === "骑手已接单" ||
            status === "外卖好了"
        ) {

            pendingOrders++;

        }


        if (status === "配送中") {

            deliveringOrders++;

        }


        if (isToday(order.created_at)) {

            todayOrders++;

            todayRevenue +=
                Number(order.total || 0);

        }

    });


    if (
        pendingOrders > lastPendingOrderCount &&
        lastPendingOrderCount >= 0
    ) {

        try {

            if (
                "Notification" in window &&
                Notification.permission === "granted"
            ) {

                new Notification(
                    "MDY FOOD 新订单",
                    {
                        body:
                            "你有 " +
                            pendingOrders +
                            " 个订单需要处理"
                    }
                );

            }

        } catch (notificationError) {

            console.log(
                notificationError
            );

        }

    }


    lastPendingOrderCount =
        pendingOrders;


    const todayOrdersElement =
        document.getElementById(
            "todayOrders"
        );

    const todayRevenueElement =
        document.getElementById(
            "todayRevenue"
        );

    const pendingOrdersElement =
        document.getElementById(
            "pendingOrders"
        );

    const deliveringOrdersElement =
        document.getElementById(
            "deliveringOrders"
        );


    if (todayOrdersElement) {

        todayOrdersElement.innerText =
            todayOrders;

    }

    if (todayRevenueElement) {

        todayRevenueElement.innerText =
            todayRevenue.toLocaleString() +
            " Ks";

    }

    if (pendingOrdersElement) {

        pendingOrdersElement.innerText =
            pendingOrders;

    }

    if (deliveringOrdersElement) {

        deliveringOrdersElement.innerText =
            deliveringOrders;

    }


    updateOrderFinanceSummary();

}

// ========================================
// 加载菜品
// ========================================

async function loadFoods() {

    try {

        const snapshot =
            await db
                .collection("foods")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();

        const container =
            document.getElementById("foods");


        if (snapshot.empty) {

            container.innerHTML = `
                <div class="empty">
                    目前还没有菜品
                </div>
            `;

            return;

        }


        container.innerHTML = "";

        const foodList = [];


        snapshot.forEach(function(doc) {

            foodList.push({

                id: doc.id,

                data: doc.data()

            });

        });


        foodList.sort(function(a, b) {

            const statusA =
                a.data.status === "营业中" ? 0 : 1;

            const statusB =
                b.data.status === "营业中" ? 0 : 1;


            if (statusA !== statusB) {

                return statusA - statusB;

            }


            return String(
                a.data.name || ""
            ).localeCompare(
                String(
                    b.data.name || ""
                ),
                "zh-CN"
            );

        });


        foodList.forEach(function(foodObject) {

            const doc = {

                id: foodObject.id,

                data: foodObject.data

            };

            const food = doc.data;


            const div =
                document.createElement("div");


            div.className = "food";


            div.dataset.foodSearch =
                (
                    String(food.name || "") + " " +
                    String(food.description || "")
                ).toLowerCase();


            const image =
                food.image ||
                "https://via.placeholder.com/90";


            const statusText =
                food.status === "营业中"
                    ? "🟢 营业中"
                    : "🔴 已下架";


            div.innerHTML = `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(food.name || "")}"
                    onerror="this.src='https://via.placeholder.com/90'"
                >

                <div class="food-info">

                    <div class="food-name">
                        ${escapeHtml(food.name || "")}
                    </div>

                    <div class="food-price">
                        ${Number(food.price || 0).toLocaleString()} Ks
                    </div>

                    <div class="food-description">
                        ${escapeHtml(food.description || "")}
                    </div>

                    <div class="food-status">
                        ${statusText}
                    </div>

                    <div class="food-buttons">

                        <button
                            class="edit-btn"
                            onclick="showEditFood('${doc.id}')">

                            ✏️ 编辑

                        </button>

                        <button
                            class="status-btn"
                            onclick="toggleFoodStatus(
                                '${doc.id}',
                                '${escapeHtml(food.status || "营业中")}'
                            )">

                            ${
                                food.status === "营业中"
                                    ? "下架"
                                    : "上架"
                            }

                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteFood('${doc.id}')">

                            🗑️ 删除

                        </button>

                    </div>


                    <div
                        id="edit-${doc.id}"
                        class="edit-box"
                        style="display:none;">

                        <strong>
                            ✏️ 编辑菜品
                        </strong>

                        <br><br>


                        <input
                            id="edit-name-${doc.id}"
                            type="text"
                            value="${escapeHtml(food.name || "")}"
                            placeholder="菜品名称">


                        <input
                            id="edit-price-${doc.id}"
                            type="number"
                            value="${Number(food.price || 0)}"
                            placeholder="价格">


                        <textarea
                            id="edit-description-${doc.id}"
                            placeholder="菜品描述">${escapeHtml(food.description || "")}</textarea>


                        <input
                            id="edit-image-${doc.id}"
                            type="text"
                            value="${escapeHtml(food.image || "")}"
                            placeholder="图片 URL">


                        <div class="edit-buttons">

                            <button
                                class="save-edit-btn"
                                onclick="saveFoodEdit('${doc.id}')">

                                💾 保存

                            </button>


                            <button
                                class="cancel-btn"
                                onclick="cancelFoodEdit('${doc.id}')">

                                取消

                            </button>

                        </div>

                    </div>

                </div>
            `;


            container.appendChild(div);

        });


        filterFoods();

    } catch (error) {

        console.error(error);

        document.getElementById("foods").innerHTML = `

            <div class="error">

                ❌ 读取菜品失败

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


// ========================================
// 菜品搜索
// ========================================

function filterFoods() {

    const input =
        document.getElementById("foodSearch");

    if (!input) {
        return;
    }

    const keyword =
        input.value.trim().toLowerCase();

    const foodCards =
        document.querySelectorAll("#foods .food");

    foodCards.forEach(function(card) {

        const text =
            card.dataset.foodSearch || "";


        if (
            !keyword ||
            text.includes(keyword)
        ) {

            card.classList.remove("food-hidden");

        } else {

            card.classList.add("food-hidden");

        }

    });

}

// 打开编辑
// ========================================

function showEditFood(documentId) {

    const box =
        document.getElementById(
            "edit-" + documentId
        );

    if (!box) {
        return;
    }

    box.style.display =
        box.style.display === "none"
            ? "block"
            : "none";

}


// ========================================
// 取消编辑
// ========================================

function cancelFoodEdit(documentId) {

    const box =
        document.getElementById(
            "edit-" + documentId
        );

    if (box) {

        box.style.display = "none";

    }

}


// ========================================
// 保存菜品编辑
// ========================================

async function saveFoodEdit(documentId) {

    const name =
        document
            .getElementById(
                "edit-name-" + documentId
            )
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById(
                    "edit-price-" + documentId
                )
                .value
        );


    const description =
        document
            .getElementById(
                "edit-description-" + documentId
            )
            .value
            .trim();


    const image =
        document
            .getElementById(
                "edit-image-" + documentId
            )
            .value
            .trim();


    if (!name) {

        alert("请输入菜品名称");

        return;

    }


    if (!price || price <= 0) {

        alert("请输入正确的价格");

        return;

    }


    try {

        await db
            .collection("foods")
            .doc(documentId)
            .update({

                name: name,

                price: price,

                description: description,

                image: image

            });


        alert("菜品修改成功！");

        loadFoods();

    } catch (error) {

        alert(
            "修改菜品失败：" +
            error.message
        );

        console.error(error);

    }

}


// ========================================
// 上架 / 下架
// ========================================

async function toggleFoodStatus(
    documentId,
    currentStatus
) {

    const newStatus =
        currentStatus === "营业中"
            ? "已下架"
            : "营业中";


    try {

        await db
            .collection("foods")
            .doc(documentId)
            .update({

                status: newStatus

            });


        loadFoods();

    } catch (error) {

        alert(
            "修改菜品状态失败：" +
            error.message
        );

        console.error(error);

    }

}


// ========================================
// 删除菜品
// ========================================

async function deleteFood(documentId) {

    if (
        !confirm(
            "确定要删除这道菜吗？删除后不能恢复。"
        )
    ) {

        return;

    }


    try {

        await db
            .collection("foods")
            .doc(documentId)
            .delete();


        loadFoods();

    } catch (error) {

        alert(
            "删除菜品失败：" +
            error.message
        );

        console.error(error);

    }

}


// ========================================
// 获取订单进度
// ========================================

function getOrderStep(status) {

    const steps = [

        "待接单",

        "商家已接单",

        "骑手已接单",

        "外卖好了",

        "配送中",

        "已完成"

    ];


    const index =
        steps.indexOf(status);


    return index >= 0 ? index : 0;

}


// ========================================
// 生成订单进度条
// ========================================

function createProgress(status) {

    if (status === "已取消") {

        return `
            <div
                style="
                    background:#f5f5f5;
                    color:#888;
                    padding:12px;
                    border-radius:9px;
                    margin-bottom:15px;
                    text-align:center;
                    font-weight:bold;
                ">

                ❌ 订单已取消

            </div>
        `;

    }


    const steps = [

        {
            name: "待接单",
            icon: "1"
        },

        {
            name: "商家已接单",
            icon: "2"
        },

        {
            name: "骑手已接单",
            icon: "3"
        },

        {
            name: "外卖好了",
            icon: "4"
        },

        {
            name: "配送中",
            icon: "5"
        },

        {
            name: "已完成",
            icon: "6"
        }

    ];


    const currentStep =
        getOrderStep(status);


    let html =
        `<div class="progress">`;


    steps.forEach(function(step, index) {

        let className = "";


        if (index < currentStep) {

            className = "done";

        } else if (index === currentStep) {

            className = "active";

        }


        html += `

            <div class="progress-step ${className}">

                <div class="progress-circle">
                    ${index < currentStep ? "✓" : step.icon}
                </div>

                <div class="progress-text">
                    ${step.name}
                </div>

            </div>

        `;

    });


    html += `</div>`;


    return html;

}


// ========================================
// 获取状态 CSS
// ========================================

function getStatusClass(status) {

    if (status === "待接单") {
        return "status-waiting";
    }

    if (status === "商家已接单") {
        return "status-accepted";
    }

    if (status === "骑手已接单") {
        return "status-rider";
    }

    if (status === "外卖好了") {
        return "status-ready";
    }

    if (status === "配送中") {
        return "status-delivering";
    }

    if (status === "已完成") {
        return "status-completed";
    }

    if (status === "已取消") {
        return "status-cancelled";
    }

    return "status-waiting";

}


// ========================================
// 读取订单并实时监听
// ========================================

function loadOrders() {

    const container =
        document.getElementById("orders");


    if (!container) {
        return;
    }


    if (ordersUnsubscribe) {

        try {

            ordersUnsubscribe();

        } catch (error) {

            console.log(error);

        }

        ordersUnsubscribe = null;

    }


    container.innerHTML = `

        <div class="empty">

            📦 正在读取订单...

        </div>

    `;


    try {

        ordersUnsubscribe =
            db
                .collection("orders")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .onSnapshot(

                    function(snapshot) {

                        allOrders = [];


                        snapshot.forEach(function(doc) {

                            allOrders.push({

                                id: doc.id,

                                data: doc.data()

                            });

                        });


                        allOrders.sort(function(a, b) {

                            const timeA =
                                getTimestampMillis(
                                    a.data.created_at
                                );

                            const timeB =
                                getTimestampMillis(
                                    b.data.created_at
                                );


                            return timeB - timeA;

                        });


                        updateMerchantStats();

                        renderOrders();

                    },

                    function(error) {

                        console.error(
                            "实时读取订单失败：",
                            error
                        );


                        container.innerHTML = `

                            <div class="error">

                                ❌ 读取订单失败

                                <br><br>

                                ${escapeHtml(
                                    error.message
                                )}

                                <br><br>

                                如果出现 Quota exceeded，通常是 Firebase 当前配额已经用完。

                            </div>

                        `;

                    }

                );

    } catch (error) {

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ❌ 读取订单失败

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


// ========================================
// 订单筛选
// ========================================

function setOrderFilter(filter) {

    currentOrderFilter =
        filter;


    const buttonMap = {

        "全部": "filter-all",

        "待接单": "filter-pending",

        "商家已接单": "filter-accepted",

        "骑手已接单": "filter-rider",

        "外卖好了": "filter-ready",

        "配送中": "filter-delivering",

        "已完成": "filter-completed",

        "已取消": "filter-cancelled"

    };


    Object.keys(buttonMap).forEach(function(key) {

        const button =
            document.getElementById(
                buttonMap[key]
            );


        if (button) {

            button.classList.toggle(
                "active",
                key === filter
            );

        }

    });


    renderOrders();

}


function orderMatchesFilter(order) {

    const status =
        order.status || "待接单";


    if (currentOrderFilter === "全部") {

        return true;

    }


    return status === currentOrderFilter;

}


// ========================================
// 更新订单金额统计
// ========================================

function updateOrderFinanceSummary() {

    const searchInput =
        document.getElementById(
            "orderSearch"
        );


    const keyword =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";


    const filteredOrders =
        allOrders.filter(function(orderObject) {

            const order =
                orderObject.data || {};


            if (!orderMatchesFilter(order)) {

                return false;

            }


            if (!keyword) {

                return true;

            }


            const searchText = [

                order.order_number || "",

                order.customername || "",

                order.customerName || "",

                order.phone || "",

                order.deliveryUsername || "",

                order.deliveryName || "",

                order.deliveryPhone || "",

                order.status || ""

            ]
                .join(" ")
                .toLowerCase();


            return searchText.includes(
                keyword
            );

        });


    const filteredRevenue =
        filteredOrders.reduce(
            function(sum, orderObject) {

                return (
                    sum +
                    Number(
                        orderObject.data.total || 0
                    )
                );

            },
            0
        );


    const todayRevenue =
        allOrders.reduce(
            function(sum, orderObject) {

                const order =
                    orderObject.data || {};

                if (
                    isToday(order.created_at)
                ) {

                    return (
                        sum +
                        Number(order.total || 0)
                    );

                }

                return sum;

            },
            0
        );


    const completedRevenue =
        allOrders.reduce(
            function(sum, orderObject) {

                const order =
                    orderObject.data || {};

                if (
                    order.status === "已完成"
                ) {

                    return (
                        sum +
                        Number(order.total || 0)
                    );

                }

                return sum;

            },
            0
        );


    const filteredElement =
        document.getElementById(
            "filteredOrderRevenue"
        );

    const todayElement =
        document.getElementById(
            "orderTodayRevenue"
        );

    const completedElement =
        document.getElementById(
            "completedOrderRevenue"
        );


    if (filteredElement) {

        filteredElement.innerText =
            filteredRevenue.toLocaleString() +
            " Ks";

    }

    if (todayElement) {

        todayElement.innerText =
            todayRevenue.toLocaleString() +
            " Ks";

    }

    if (completedElement) {

        completedElement.innerText =
            completedRevenue.toLocaleString() +
            " Ks";

    }

}

    const status =
        order.status || "待接单";


    if (status === "骑手已接单") {

        return "🟣 已接单，等待取餐";

    }

    if (status === "外卖好了") {

        return "🟠 已做好，等待取餐";

    if (status === "配送中") {

    if (status === "已完成") {

    }

    if (status === "已取消") {

    }

    return "⏳ 等待配送";
