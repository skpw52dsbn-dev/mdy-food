// ========================================
// 渲染订单
// ========================================

function renderOrders() {

    const container =
        document.getElementById("orders");


    if (!container) {

        return;

    }


    const searchInput =
        document.getElementById("orderSearch");


    const keyword =
        searchInput
            ? searchInput.value.trim().toLowerCase()
            : "";


    const filteredOrders =
        allOrders.filter(function(orderObject) {

            const order =
                orderObject.data || {};


            if (!orderMatchesFilter(order)) {

                return false;

            }


            if (!keyword) {

                return true;

            }


            const searchText = [

                order.order_number || "",

                order.customername || "",

                order.customerName || "",

                order.phone || "",

                order.deliveryUsername || "",

                order.deliveryName || "",

                order.deliveryPhone || "",

                order.status || ""

            ]
                .join(" ")
                .toLowerCase();


            return searchText.includes(keyword);

        });


    updateOrderFinanceSummary();


    const countElement =
        document.getElementById(
            "orderFilterCount"
        );


    if (countElement) {

        countElement.innerText =
            "当前显示 " +
            filteredOrders.length +
            " 个订单 / 共 " +
            allOrders.length +
            " 个订单";

    }


    if (filteredOrders.length === 0) {

        container.innerHTML = `

            <div class="empty">

                ${
                    allOrders.length === 0
                        ? "📦 目前没有属于本餐厅的订单"
                        : "🔍 没有符合当前筛选条件的订单"
                }

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    filteredOrders.forEach(function(orderObject) {

        const order =
            orderObject.data || {};


        const documentId =
            orderObject.id;


        const status =
            order.status || "待接单";


        let itemsHTML = "";

        let itemCount = 0;


        if (
            order.items &&
            Array.isArray(order.items)
        ) {

            order.items.forEach(function(item) {

                const quantity =
                    Number(
                        item.quantity || 0
                    );


                const price =
                    Number(
                        item.price || 0
                    );


                const subtotal =
                    price * quantity;


                itemCount += quantity;


                itemsHTML += `

                    <div class="item">

                        <div class="item-name">

                            ${escapeHtml(
                                item.name || ""
                            )}

                            × ${quantity}

                        </div>

                        <div class="item-price">

                            ${subtotal.toLocaleString()}
                            Ks

                        </div>

                    </div>

                `;

            });

        }


        let buttonHTML = "";


        if (status === "待接单") {

            buttonHTML = `

                <button
                    class="accept-button"
                    onclick="changeStatus(
                        '${documentId}',
                        '商家已接单'
                    )">

                    ✅ 接受订单

                </button>

            `;

        }

        else if (
            status === "商家已接单"
        ) {

            buttonHTML = `

                <button
                    class="ready-button"
                    onclick="changeStatus(
                        '${documentId}',
                        '外卖好了'
                    )">

                    🍱 外卖好了

                </button>

                <div class="delivery-info">

                    ⏳ <strong>等待骑手接单</strong>

                    <br>

                    骑手接单后，您可以继续制作外卖。

                </div>

            `;

        }

        else if (
            status === "骑手已接单"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🛵 骑手已接单
                    </div>

                    👨‍🍳 骑手正在等待外卖做好

                    <br>

                    👤 配送员：
                    ${escapeHtml(
                        getDeliveryName(order)
                    )}

                </div>

                <button
                    class="ready-button"
                    onclick="changeStatus(
                        '${documentId}',
                        '外卖好了'
                    )">

                    🍱 外卖好了

                </button>

            `;

        }

        else if (
            status === "外卖好了"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🍱 外卖已经做好
                    </div>

                    👤 配送员：
                    ${escapeHtml(
                        getDeliveryName(order)
                    )}

                    <br>

                    🛵 骑手可以来取餐

                </div>

            `;

        }

        else if (
            status === "配送中"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🛵 骑手正在配送
                    </div>

                    👤 配送员：
                    ${escapeHtml(
                        getDeliveryName(order)
                    )}

                    <br>

                    📦 外卖已经取走，正在送往顾客。

                </div>

            `;

        }

        else if (
            status === "已完成"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        ✅ 订单已完成
                    </div>

                    顾客已经收到外卖。

                </div>

            `;

        }

        else if (
            status === "已取消"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        ❌ 订单已取消
                    </div>

                    此订单已经取消。

                </div>

            `;

        }


        let riderInfoHTML = "";


        if (order.deliveryId) {

            riderInfoHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🛵 配送员信息
                    </div>

                    👤 姓名：
                    ${escapeHtml(
                        getDeliveryName(order)
                    )}

                    ${
                        getDeliveryPhone(order)
                            ? "<br>📞 电话：" +
                              escapeHtml(
                                  getDeliveryPhone(order)
                              )
                            : ""
                    }

                    <br>

                    📍 当前状态：
                    ${escapeHtml(
                        getDeliveryStatusText(order)
                    )}

                    <br>

                    🆔 配送员ID：
                    ${escapeHtml(
                        order.deliveryId
                    )}

                </div>

            `;

        }


        const newOrderClass =
            status === "待接单"
                ? "order order-new"
                : "order";


        const div =
            document.createElement("div");


        div.className =
            newOrderClass;


        div.innerHTML = `

            <div class="order-number">

                📦 订单号：
                ${escapeHtml(
                    order.order_number ||
                    documentId
                )}

            </div>


            <div class="order-restaurant">

                🏪
                ${escapeHtml(
                    order.restaurantName ||
                    "本餐厅"
                )}

            </div>


            <div class="status ${getStatusClass(status)}">

                ${
                    status === "待接单"
                        ? "🔴 "
                        : status === "商家已接单"
                        ? "🔵 "
                        : status === "骑手已接单"
                        ? "🟣 "
                        : status === "外卖好了"
                        ? "🟠 "
                        : status === "配送中"
                        ? "🟢 "
                        : status === "已完成"
                        ? "✅ "
                        : "❌ "
                }

                ${escapeHtml(status)}

            </div>


            ${createProgress(status)}


            <div class="customer-box">

                <div class="customer-title">
                    👤 顾客信息
                </div>

                👤 姓名：
                ${escapeHtml(
                    order.customername ||
                    order.customerName ||
                    ""
                )}

                <br>

                📞 电话：
                ${escapeHtml(
                    order.phone || ""
                )}

                <br>

                📍 地址：
                ${escapeHtml(
                    order.adress ||
                    order.address ||
                    ""
                )}

                <br>

                💳 支付方式：
                ${escapeHtml(
                    order.payment || ""
                )}

            </div>


            <div class="items">

                <div class="items-title">

                    🍜 订单内容

                    <span style="
                        color:#888;
                        font-size:13px;
                        font-weight:normal;
                    ">

                        共 ${itemCount} 件

                    </span>

                </div>

                ${
                    itemsHTML ||
                    '<div style="color:#999;">暂无商品明细</div>'
                }

            </div>


            <div class="total">

                总计：
                ${Number(
                    order.total || 0
                ).toLocaleString()}
                Ks

            </div>


            ${riderInfoHTML}


            ${createOrderTimeBox(order)}


            <div class="buttons">

                ${buttonHTML}

            </div>

        `;


        container.appendChild(div);

    });

}


// ========================================
// 开启新订单提醒
// ========================================

async function enableOrderNotification() {

    if (!("Notification" in window)) {

        alert("当前浏览器不支持网页通知。");

        return;

    }


    try {

        const permission =
            await Notification.requestPermission();


        if (permission === "granted") {

            alert("新订单提醒已开启！");

        } else {

            alert(
                "浏览器没有允许通知，请在浏览器设置中开启。"
            );

        }

    } catch (error) {

        alert(
            "开启通知失败：" +
            error.message
        );

    }

}


// ========================================
// 顾客评价
// ========================================

function getReviewRating(data) {

    const value =
        data.rating ??
        data.star ??
        data.stars ??
        data.score ??
        data.rate;

    const number =
        Number(value);

    return Number.isFinite(number)
        ? Math.max(0, Math.min(5, number))
        : 0;

}


function getReviewComment(data) {

    return (
        data.comment ||
        data.review ||
        data.reviewText ||
        data.content ||
        data.message ||
        data.text ||
        ""
    );

}


function getReviewUser(data) {

    return (
        data.customername ||
        data.customerName ||
        data.username ||
        data.userName ||
        data.name ||
        "顾客"
    );

}


function getReviewTimeValue(data) {

    return (
        data.created_at ||
        data.createdAt ||
        data.timestamp ||
        data.time ||
        null
    );

}


function getReviewTime(data) {

    const value =
        getReviewTimeValue(data);


    if (!value) {
        return "";
    }


    try {

        const date =
            value.toDate
                ? value.toDate()
                : new Date(value);


        if (Number.isNaN(date.getTime())) {
            return "";
        }


        return date.toLocaleString("zh-CN");

    } catch (e) {

        return "";

    }

}


function getReviewTimeMillis(data) {

    const value =
        getReviewTimeValue(data);


    if (!value) {
        return 0;
    }


    try {

        if (
            typeof value.toMillis === "function"
        ) {

            return value.toMillis();

        }


        if (
            typeof value.toDate === "function"
        ) {

            return value.toDate().getTime();

        }


        const date =
            new Date(value);


        return Number.isNaN(
            date.getTime()
        )
            ? 0
            : date.getTime();

    } catch (error) {

        return 0;

    }

}


function isReviewData(data) {

    const rating =
        getReviewRating(data);

    const comment =
        getReviewComment(data);


    return (
        rating > 0 ||
        comment.trim() !== "" ||
        data.hasReview === true ||
        data.reviewed === true
    );

}


function renderStars(rating) {

    const rounded =
        Math.round(
            Number(rating) || 0
        );


    return "★★★★★"
        .split("")
        .map(
            (star, index) =>
                index < rounded
                    ? "★"
                    : "☆"
        )
        .join("");

}


// ========================================
// 设置评价筛选
// ========================================

function setReviewFilter(rating) {

    currentReviewFilter =
        Number(rating) || 0;


    const buttonIds = [

        "review-filter-all",
        "review-filter-5",
        "review-filter-4",
        "review-filter-3",
        "review-filter-2",
        "review-filter-1"

    ];


    buttonIds.forEach(function(id) {

        const button =
            document.getElementById(id);


        if (!button) {
            return;
        }


        let buttonRating = 0;


        if (id !== "review-filter-all") {

            buttonRating =
                Number(
                    id.replace(
                        "review-filter-",
                        ""
                    )
                );

        }


        button.classList.toggle(
            "active",
            buttonRating === currentReviewFilter
        );

    });


    renderReviews();

}


// ========================================
// 读取并监听当前商家评价
// ========================================

function loadReviews() {

    const box =
        document.getElementById(
            "reviews"
        );


    if (!box) {
        return;
    }


    if (reviewsUnsubscribe) {

        try {

            reviewsUnsubscribe();

        } catch (error) {

            console.log(error);

        }

        reviewsUnsubscribe = null;

    }


    box.innerHTML = `

        <div class="review-loading">

            ⭐ 正在读取顾客评价...

        </div>

    `;


    try {

        reviewsUnsubscribe =
            db
                .collection("reviews")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .onSnapshot(

                    function(snapshot) {

                        allReviews = [];


                        snapshot.forEach(function(doc) {

                            const data =
                                doc.data() || {};


                            if (!isReviewData(data)) {
                                return;
                            }


                            allReviews.push({

                                id: doc.id,

                                ...data

                            });

                        });


                        allReviews.sort(
                            function(a, b) {

                                return (
                                    getReviewTimeMillis(b) -
                                    getReviewTimeMillis(a)
                                );

                            }
                        );


                        updateReviewSummary();

                        renderReviews();

                    },

                    function(error) {

                        console.error(
                            "实时读取评价失败：",
                            error
                        );


                        const summaryBox =
                            document.getElementById(
                                "reviewSummary"
                            );


                        if (summaryBox) {

                            summaryBox.innerHTML = `

                                <div class="review-summary-top">

                                    <div class="review-average">
                                        暂无
                                    </div>

                                    <div>

                                        <div class="review-stars">
                                            ☆☆☆☆☆
                                        </div>

                                        <div class="review-count">
                                            评价暂时无法读取
                                        </div>

                                    </div>

                                </div>

                            `;

                        }


                        box.innerHTML = `

                            <div class="error">

                                ❌ 读取评价失败

                                <br><br>

                                ${escapeHtml(
                                    error.message
                                )}

                            </div>

                        `;

                    }

                );

    } catch (error) {

        console.error(
            "加载评价监听失败：",
            error
        );


        box.innerHTML = `

            <div class="error">

                ❌ 读取评价失败

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


// ========================================
// 更新评价统计
// ========================================

function updateReviewSummary() {

    const summaryBox =
        document.getElementById(
            "reviewSummary"
        );


    const distributionBox =
        document.getElementById(
            "reviewDistribution"
        );


    if (!summaryBox) {
        return;
    }


    const ratedReviews =
        allReviews.filter(
            function(review) {

                return getReviewRating(review) > 0;

            }
        );


    const total =
        allReviews.length;


    const ratingTotal =
        ratedReviews.reduce(
            function(sum, review) {

                return (
                    sum +
                    getReviewRating(review)
                );

            },
            0
        );


    const average =
        ratedReviews.length
            ? ratingTotal /
              ratedReviews.length
            : 0;


    const starCounts = {

        5: 0,
        4: 0,
        3: 0,
        2: 0,
        1: 0

    };


    ratedReviews.forEach(
        function(review) {

            const rating =
                Math.round(
                    getReviewRating(review)
                );


            if (
                rating >= 1 &&
                rating <= 5
            ) {

                starCounts[rating]++;

            }

        }
    );


    const top =
        summaryBox.querySelector(
            ".review-summary-top"
        );


    if (top) {

        top.innerHTML = `

            <div class="review-average">

                ${
                    average
                        ? average.toFixed(1)
                        : "暂无"
                }

            </div>


            <div>

                <div class="review-stars">

                    ${
                        average
                            ? renderStars(average)
                            : "☆☆☆☆☆"
                    }

                </div>

                <div class="review-count">

                    共 ${total} 条评价

                    ${
                        ratedReviews.length
                            ? " · " +
                              ratedReviews.length +
                              " 条有评分"
                            : ""
                    }

                </div>

            </div>


            <div class="review-live">

                <span class="review-live-dot"></span>

                实时更新

            </div>

        `;

    }


    if (!distributionBox) {
        return;
    }


    if (!ratedReviews.length) {

        distributionBox.innerHTML = `

            <div style="
                color:#999;
                font-size:13px;
            ">

                暂无评分统计

            </div>

        `;

        return;

    }


    let distributionHTML = "";


    [5, 4, 3, 2, 1].forEach(
        function(star) {

            const count =
                starCounts[star];


            const percentage =
                ratedReviews.length
                    ? (
                        count /
                        ratedReviews.length *
                        100
                    )
                    : 0;


            distributionHTML += `

                <div class="review-distribution-row">

                    <div class="review-distribution-label">

                        ${star} 星

                    </div>

                    <div class="review-bar">

                        <div
                            class="review-bar-fill"
                            style="
                                width:${percentage}%;
                            ">
                        </div>

                    </div>

                    <div class="review-distribution-count">

                        ${count}

                    </div>

                </div>

            `;

        }
    );


    distributionBox.innerHTML =
        distributionHTML;

}


// ========================================
// 渲染评价列表
// ========================================

function renderReviews() {

    const box =
        document.getElementById(
            "reviews"
        );


    const countBox =
        document.getElementById(
            "reviewListCount"
        );


    if (!box) {
        return;
    }


    const searchInput =
        document.getElementById(
            "reviewSearch"
        );


    const keyword =
        searchInput
            ? searchInput.value
                .trim()
                .toLowerCase()
            : "";


    const filteredReviews =
        allReviews.filter(
            function(review) {

                const rating =
                    Math.round(
                        getReviewRating(review)
                    );


                if (
                    currentReviewFilter > 0 &&
                    rating !== currentReviewFilter
                ) {

                    return false;

                }


                if (!keyword) {

                    return true;

                }


                const searchText = [

                    getReviewUser(review),

                    getReviewComment(review),

                    review.order_number || "",

                    review.orderNumber || "",

                    review.orderId || ""

                ]
                    .join(" ")
                    .toLowerCase();


                return searchText.includes(
                    keyword
                );

            }
        );


    if (countBox) {

        countBox.innerText =
            "当前显示 " +
            filteredReviews.length +
            " 条评价 / 共 " +
            allReviews.length +
            " 条评价";

    }


    if (!allReviews.length) {

        box.innerHTML = `

            <div class="review-empty">

                ⭐ 暂时还没有顾客评价

                <br><br>

                顾客完成订单并提交评价后，会自动显示在这里。

            </div>

        `;

        return;

    }


    if (!filteredReviews.length) {

        box.innerHTML = `

            <div class="review-empty">

                🔍 没有找到符合条件的评价

            </div>

        `;

        return;

    }


    box.innerHTML = "";


    filteredReviews.forEach(
        function(review) {

            const rating =
                getReviewRating(review);


            const comment =
                getReviewComment(review);


            const user =
                getReviewUser(review);


            const time =
                getReviewTime(review);


            const orderNumber =
                review.order_number ||
                review.orderNumber ||
                review.orderId ||
                "";


            const div =
                document.createElement("div");


            div.className =
                "review-card";


            div.innerHTML = `

                <div class="review-top">

                    <div class="review-user">

                        👤
                        ${escapeHtml(user)}

                    </div>

                    <div class="review-time">

                        ${escapeHtml(time)}

                    </div>

                </div>


                <div class="review-stars">

                    ${
                        rating
                            ? renderStars(rating) +
                              `<span class="review-rating-number">
                                  ${rating}/5
                              </span>`
                            : "☆☆☆☆☆"
                    }

                </div>


                ${
                    comment
                        ? `

                            <div class="review-comment">

                                ${escapeHtml(comment)}

                            </div>

                        `
                        : `

                            <div
                                class="review-comment"
                                style="color:#999;">

                                顾客没有填写文字评价

                            </div>

                        `
                }


                ${
                    orderNumber
                        ? `

                            <div class="review-order">

                                📦 订单：
                                ${escapeHtml(orderNumber)}

                            </div>

                        `
                        : ""
                }

            `;


            box.appendChild(div);

        }
    );

}


// ========================================
// 手动刷新
// ========================================

async function manualRefresh() {

    const button =
        document.querySelector(
            ".refresh-btn"
        );


    if (button) {

        button.disabled = true;

        button.innerText =
            "⏳ 刷新中...";

    }


    try {

        await Promise.all([

            loadRestaurant(),

            loadRestaurantStatus(),

            loadRestaurantInfo(),

            loadFoods()

        ]);


        /*
            订单已经使用 onSnapshot 实时监听，
            不需要手动重新读取。
        */

        updateMerchantStats();

        renderOrders();

    } catch (error) {

        console.error(
            "刷新失败：",
            error
        );

    }


    if (button) {

        button.disabled = false;

        button.innerText =
            "🔄 刷新";

    }

}


// ========================================
// 修改订单状态
// ========================================

async function changeStatus(
    documentId,
    newStatus
) {

    const allowedStatuses = [

        "商家已接单",

        "外卖好了"

    ];


    if (
        !allowedStatuses.includes(
            newStatus
        )
    ) {

        alert(
            "商家不能直接修改为这个状态"
        );

        return;

    }


    try {

        const orderRef =
            db
                .collection("orders")
                .doc(documentId);


        const orderSnap =
            await orderRef.get();


        if (!orderSnap.exists) {

            alert("订单不存在");

            return;

        }


        const order =
            orderSnap.data();


        if (
            newStatus === "商家已接单"
        ) {

            if (
                order.status !== "待接单"
            ) {

                alert(
                    "这个订单当前不能接受"
                );

                return;

            }


            await orderRef.update({

                status: newStatus,

                acceptedAt:
                    firebase.firestore.FieldValue
                        .serverTimestamp()

            });

        }


        else if (
            newStatus === "外卖好了"
        ) {

            if (
                order.status !== "商家已接单" &&
                order.status !== "骑手已接单"
            ) {

                alert(
                    "这个订单当前不能标记为外卖好了"
                );

                return;

            }


            await orderRef.update({

                status: newStatus,

                readyAt:
                    firebase.firestore.FieldValue
                        .serverTimestamp()

            });

        }


        /*
            不再手动 loadOrders。
            onSnapshot 会自动更新页面。
        */

    } catch (error) {

        alert(
            "修改订单状态失败：" +
            error.message
        );

        console.error(error);

    }

}


// ========================================
// 退出登录
// ========================================

function logout() {

    if (ordersUnsubscribe) {

        try {

            ordersUnsubscribe();

        } catch (error) {

            console.log(error);

        }

        ordersUnsubscribe = null;

    }


    if (reviewsUnsubscribe) {

        try {

            reviewsUnsubscribe();

        } catch (error) {

            console.log(error);

        }

        reviewsUnsubscribe = null;

    }


    localStorage.removeItem(
        "merchantLogin"
    );


    localStorage.removeItem(
        "merchantUsername"
    );


    localStorage.removeItem(
        "merchantRestaurantId"
    );


    window.location.href =
        "admin-login.html";

}


// ========================================
// 启动
// ========================================

loadRestaurant();

loadRestaurantStatus();

loadRestaurantInfo();

loadFoods();

loadOrders();

loadReviews();


// 注意：
// 订单使用 onSnapshot 实时监听。
// 顾客评价使用 onSnapshot 实时监听。
// 其他资料保持手动读取，避免不必要的 Firestore 高频读取。

</script>
