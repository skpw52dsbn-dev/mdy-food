
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>商家后台 - MDY FOOD</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .logout {
            border: none;
            background: #555;
            color: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            background: #fff1eb;
            color: #ff5a1f;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            line-height: 1.8;
        }

        .items {
            border-top: 1px solid #eee;
            margin-top: 12px;
            padding-top: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            margin: 7px 0;
        }

        .total {
            border-top: 1px solid #eee;
            margin-top: 12px;
            padding-top: 12px;
            color: #ff5a1f;
            font-size: 18px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .buttons button {
            border: none;
            background: #ff5a1f;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .completed {
            color: #2e8b57;
            font-weight: bold;
            margin-top: 15px;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #888;
        }

        .error {
            background: #fff0f0;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<header>
    🍜 MDY FOOD 商家后台
</header>

<div class="container">

    <div class="top">
        <div class="title">📦 订单管理</div>

        <button class="logout" onclick="logout()">
            退出登录
        </button>
    </div>

    <div id="orders">
        正在加载订单...
    </div>

</div>

<script>

if (localStorage.getItem("merchantLogin") !== "true") {
    window.location.href = "admin-login.html";
}

const firebaseConfig = {
    apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",
    authDomain: "mdy-food.firebaseapp.com",
    projectId: "mdy-food",
    storageBucket: "mdy-food.firebasestorage.app",
    messagingSenderId: "498327590625",
    appId: "1:498327590625:web:cceafb7febb689e7ad09a0",
    measurementId: "G-6Q5G2862XQ"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


async function loadOrders() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .get();

        let orders = [];

        snapshot.forEach(function(doc) {

            orders.push({
                id: doc.id,
                data: doc.data()
            });

        });


        // 自己在网页里按照时间排序
        orders.sort(function(a, b) {

            const timeA =
                a.data.created_at &&
                a.data.created_at.toMillis
                    ? a.data.created_at.toMillis()
                    : 0;

            const timeB =
                b.data.created_at &&
                b.data.created_at.toMillis
                    ? b.data.created_at.toMillis()
                    : 0;

            return timeB - timeA;

        });


        const container =
            document.getElementById("orders");


        if (orders.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    目前没有订单
                </div>
            `;

            return;
        }


        container.innerHTML = "";


        orders.forEach(function(orderObject) {

            const order =
                orderObject.data;

            const documentId =
                orderObject.id;


            let createdTime = "暂无";

            if (order.created_at) {

                if (order.created_at.toDate) {

                    createdTime =
                        order.created_at
                            .toDate()
                            .toLocaleString();

                }

            }


            let itemsHTML = "";


            if (
                order.items &&
                Array.isArray(order.items)
            ) {

                order.items.forEach(function(item) {

                    itemsHTML += `
                        <div class="item">

                            <span>
                                ${item.name} × ${item.quantity}
                            </span>

                            <span>
                                ${(item.price * item.quantity).toLocaleString()} Ks
                            </span>

                        </div>
                    `;

                });

            }


            let buttonHTML = "";


            if (order.status === "待接单") {

                buttonHTML = `
                    <button onclick="changeStatus(
                        '${documentId}',
                        '商家已接单'
                    )">
                        接受订单
                    </button>
                `;

            } else if (
                order.status === "商家已接单"
            ) {

                buttonHTML = `
                    <button onclick="changeStatus(
                        '${documentId}',
                        '配送中'
                    )">
                        开始配送
                    </button>
                `;

            } else if (
                order.status === "配送中"
            ) {

                buttonHTML = `
                    <button onclick="changeStatus(
                        '${documentId}',
                        '已完成'
                    )">
                        完成订单
                    </button>
                `;

            } else if (
                order.status === "已完成"
            ) {

                buttonHTML = `
                    <div class="completed">
                        ✅ 订单已完成
                    </div>
                `;

            }


            const div =
                document.createElement("div");

            div.className = "order";


            div.innerHTML = `

                <div class="order-number">
                    订单号：
                    ${order.order_number || "暂无"}
                </div>

                <div class="status">
                    ${order.status || "待接单"}
                </div>

                <div class="info">

                    👤 顾客：
                    ${order.customername || ""}

                    <br>

                    📞 电话：
                    ${order.phone || ""}

                    <br>

                    📍 地址：
                    ${order.adress || ""}

                    <br>

                    💳 支付：
                    ${order.payment || ""}

                    <br>

                    🕒 时间：
                    ${createdTime}

                </div>


                <div class="items">

                    <strong>
                        🍜 订单内容
                    </strong>

                    ${itemsHTML}

                </div>


                <div class="total">

                    总计：
                    ${(order.total || 0).toLocaleString()}
                    Ks

                </div>


                <div class="buttons">

                    ${buttonHTML}

                </div>

            `;


            container.appendChild(div);

        });


    } catch (error) {

        console.error(error);

        document.getElementById("orders").innerHTML = `

            <div class="error">

                ❌ 读取订单失败

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


async function changeStatus(
    documentId,
    newStatus
) {

    try {

        await db
            .collection("orders")
            .doc(documentId)
            .update({
                status: newStatus
            });


        loadOrders();


    } catch (error) {

        alert(
            "修改订单状态失败：" +
            error.message
        );

        console.error(error);

    }

}


function logout() {

    localStorage.removeItem(
        "merchantLogin"
    );

    window.location.href =
        "admin-login.html";

}


loadOrders();


// 每3秒自动刷新
setInterval(
    loadOrders,
    3000
);

</script>

</body>
</html>
```
