<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商家后台 - MDY FOOD</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #ff5a1f;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.restaurant-name {
    color: #ff5a1f;
    margin-top: 5px;
    font-size: 15px;
}

.logout {
    border: none;
    background: #555;
    color: white;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

/* =========================
   数据统计
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 16px 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stat-icon {
    font-size: 25px;
    margin-bottom: 7px;
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 5px;
}

.stat-label {
    color: #888;
    font-size: 13px;
}

.stat-money {
    color: #ff5a1f;
}

.stat-pending {
    color: #d88700;
}

.stat-delivering {
    color: #16833b;
}

/* =========================
   通用
========================= */

.section {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.form-group textarea {
    height: 80px;
    resize: vertical;
}

.add-food-btn {
    width: 100%;
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 13px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.food {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    gap: 12px;
}

.food img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.food-info {
    flex: 1;
    min-width: 0;
}

.food-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 5px;
}

.food-price {
    color: #ff5a1f;
    font-weight: bold;
    margin-bottom: 5px;
}

.food-description {
    color: #777;
    font-size: 14px;
    margin-bottom: 8px;
}

.food-status {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.food-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.food-buttons button {
    border: none;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

.status-btn {
    background: #555;
}

.edit-btn {
    background: #1677ff;
}

.delete-btn {
    background: #d33;
}

.cancel-btn {
    background: #777;
}

.save-edit-btn {
    background: #2e8b57;
}

/* =========================
   订单
========================= */

.order {
    background: white;
    border: 1px solid #e8e8e8;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.order-new {
    border: 2px solid #ff5a1f;
}

.order-number {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.order-restaurant {
    color: #ff5a1f;
    font-weight: bold;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    padding: 7px 13px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.status-waiting {
    background: #fff0e8;
    color: #ff5a1f;
}

.status-accepted {
    background: #eef6ff;
    color: #1677ff;
}

.status-rider {
    background: #f1edff;
    color: #6941c6;
}

.status-ready {
    background: #fff7df;
    color: #d88700;
}

.status-delivering {
    background: #eaf8ef;
    color: #16833b;
}

.status-completed {
    background: #e9f8ef;
    color: #16833b;
}

.progress {
    display: flex;
    align-items: center;
    margin: 8px 0 18px 0;
    width: 100%;
}

.progress-step {
    flex: 1;
    text-align: center;
    position: relative;
    min-width: 0;
}

.progress-step:not(:last-child)::after {
    content: "";
    position: absolute;
    height: 3px;
    background: #ddd;
    top: 13px;
    left: 50%;
    width: 100%;
    z-index: 0;
}

.progress-circle {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ddd;
    color: #777;
    margin: auto;
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
}

.progress-step.active .progress-circle {
    background: #ff5a1f;
    color: white;
}

.progress-step.done .progress-circle {
    background: #2e8b57;
    color: white;
}

.progress-step.done:not(:last-child)::after {
    background: #2e8b57;
}

.progress-text {
    font-size: 11px;
    margin-top: 6px;
    color: #888;
    white-space: nowrap;
}

.progress-step.active .progress-text,
.progress-step.done .progress-text {
    color: #333;
    font-weight: bold;
}

.customer-box {
    background: #fafafa;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 13px;
    line-height: 1.8;
}

.customer-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.items {
    border-top: 1px solid #eee;
    margin-top: 12px;
    padding-top: 12px;
}

.items-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin: 9px 0;
    padding-bottom: 7px;
    border-bottom: 1px dashed #eee;
}

.item-name {
    flex: 1;
}

.item-price {
    font-weight: bold;
    white-space: nowrap;
}

.total {
    border-top: 1px solid #eee;
    margin-top: 12px;
    padding-top: 12px;
    color: #ff5a1f;
    font-size: 19px;
    font-weight: bold;
    text-align: right;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.buttons button {
    border: none;
    background: #ff5a1f;
    color: white;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.accept-button {
    background: #1677ff !important;
}

.ready-button {
    background: #d88700 !important;
}

.delivery-info {
    margin-top: 12px;
    padding: 13px;
    background: #f5f8ff;
    border-radius: 9px;
    font-size: 14px;
    line-height: 1.8;
}

.delivery-title {
    font-weight: bold;
    margin-bottom: 3px;
}

.time-info {
    color: #888;
    font-size: 13px;
    margin-top: 10px;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    color: #888;
}

.error {
    background: #fff0f0;
    color: #c00;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.6;
}

.success {
    background: #effff4;
    color: #16833b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    display: none;
}

.restaurant-status {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.open-status {
    color: #2e8b57;
}

.closed-status {
    color: #d33;
}

.edit-box {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
}

.edit-box input,
.edit-box textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 7px;
    margin-bottom: 8px;
    font-size: 14px;
}

.edit-box textarea {
    min-height: 65px;
    resize: vertical;
}

.edit-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.edit-buttons button {
    border: none;
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}


/* =========================
   商家工具栏 / 订单筛选
========================= */

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.search-input {
    flex: 1;
    min-width: 180px;
    padding: 11px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

.search-input:focus {
    border-color: #ff5a1f;
}

.refresh-btn {
    border: none;
    background: #555;
    color: white;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.filter-buttons {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.filter-buttons button {
    border: 1px solid #ddd;
    background: white;
    color: #555;
    padding: 8px 12px;
    border-radius: 18px;
    cursor: pointer;
}

.filter-buttons button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
    color: white;
}

.order-filter-count {
    color: #888;
    font-size: 13px;
    margin-bottom: 10px;
}

.restaurant-preview {
    width: 100%;
    max-height: 180px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
    display: none;
}

.info-tip {
    background: #f7f9fb;
    color: #666;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.6;
}

.food-search-wrap {
    margin-bottom: 15px;
}

.food-hidden {
    display: none !important;
}

.stat-success {
    color: #2e8b57;
}

@media (max-width: 600px) {
    .toolbar {
        flex-direction: column;
    }

    .search-input,
    .refresh-btn {
        width: 100%;
    }
}

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .section {
        padding: 14px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .stat-card {
        padding: 14px 8px;
    }

    .stat-number {
        font-size: 20px;
    }

    .food {
        align-items: flex-start;
    }

    .food img {
        width: 75px;
        height: 75px;
    }

    .progress-text {
        font-size: 9px;
    }

    .progress-circle {
        width: 23px;
        height: 23px;
        font-size: 11px;
    }

    .order {
        padding: 14px;
    }
}

.review-summary { display:flex; gap:14px; align-items:center; flex-wrap:wrap; background:#fff8f2; border-radius:10px; padding:14px; margin-bottom:15px; }
.review-average { font-size:30px; font-weight:bold; color:#ff5a1f; }
.review-stars { color:#ffb000; font-size:20px; letter-spacing:2px; }
.review-count { color:#777; font-size:13px; }
.review-card { border:1px solid #eee; border-radius:10px; padding:14px; margin-bottom:12px; }
.review-top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:7px; }
.review-user { font-weight:bold; }
.review-time { color:#999; font-size:12px; }
.review-comment { margin-top:8px; line-height:1.7; color:#444; white-space:pre-wrap; }
.review-order { color:#888; font-size:12px; margin-top:8px; }

</style>
</head>

<body>

<header>
    🍜 MDY FOOD 商家后台
</header>

<div class="container">

    <div class="top">
        <div>
            <div class="title">👨‍🍳 商家管理</div>

            <div id="restaurantName" class="restaurant-name">
                正在读取餐厅...
            </div>
        </div>

        <button class="logout" onclick="logout()">
            退出登录
        </button>
    </div>


    <!-- =========================
         数据统计
    ========================== -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <div
                id="todayOrders"
                class="stat-number">
                0
            </div>

            <div class="stat-label">
                今日订单
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <div
                id="todayRevenue"
                class="stat-number stat-money">
                0 Ks
            </div>

            <div class="stat-label">
                今日营业额
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⏳
            </div>

            <div
                id="pendingOrders"
                class="stat-number stat-pending">
                0
            </div>

            <div class="stat-label">
                待处理
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🛵
            </div>

            <div
                id="deliveringOrders"
                class="stat-number stat-delivering">
                0
            </div>

            <div class="stat-label">
                配送中
            </div>

        </div>

    </div>


    <!-- 添加菜品 -->

    <div class="section">
    <!-- =========================
         顾客评价
    ========================== -->

    <div class="section">

        <div class="section-title">
            ⭐ 顾客评价
        </div>

        <div id="reviewSummary" class="review-summary">
            <div class="review-average">
                暂无
            </div>

            <div>
                <div class="review-stars">
                    ☆☆☆☆☆
                </div>

                <div class="review-count">
                    正在读取评价...
                </div>
            </div>
        </div>

        <div id="reviews">
            <div class="empty">
                ⭐ 正在读取顾客评价...
            </div>
        </div>

    </div>
        <div class="section-title">
            ➕ 添加菜品
        </div>

        <div id="successMessage" class="success">
            菜品添加成功！
        </div>

        <div class="form-group">
            <label>菜品名称</label>
            <input id="foodName" type="text" placeholder="例如：宫保鸡丁">
        </div>

        <div class="form-group">
            <label>价格（Ks）</label>
            <input id="foodPrice" type="number" placeholder="例如：8000">
        </div>

        <div class="form-group">
            <label>菜品描述</label>
            <textarea id="foodDescription" placeholder="例如：香辣可口，适合下饭"></textarea>
        </div>

        <div class="form-group">
            <label>图片地址</label>
            <input id="foodImage" type="text" placeholder="粘贴图片 URL（可留空）">
        </div>

        <button class="add-food-btn" onclick="addFood()">
            🍜 添加菜品
        </button>

    </div>


    <!-- 餐厅营业状态 -->

    <div class="section">

        <div class="section-title">
            🏪 餐厅营业状态
        </div>

        <div id="restaurantStatus" class="restaurant-status">
            正在读取...
        </div>

        <button
            id="restaurantStatusBtn"
            class="add-food-btn"
            onclick="toggleRestaurantStatus()">
            正在读取...
        </button>

    </div>


    <!-- 餐厅资料 -->

    <div class="section">

        <div class="section-title">
            🏪 餐厅资料
        </div>

        <div class="form-group">
            <label>餐厅名称</label>
            <input id="editRestaurantName" type="text" placeholder="例如：四川味道">
        </div>

        <div class="form-group">
            <label>餐厅分类</label>
            <input id="editRestaurantCategory" type="text" placeholder="例如：川菜 · 中餐">
        </div>

        <div class="form-group">
            <label>餐厅介绍</label>
            <textarea id="editRestaurantDescription" placeholder="介绍一下你的餐厅"></textarea>
        </div>

        <div class="form-group">
            <label>餐厅图片 URL</label>
            <input id="editRestaurantImage" type="text" placeholder="粘贴餐厅图片 URL（可留空）" oninput="previewRestaurantImage()">
        </div>

        <img id="restaurantImagePreview" class="restaurant-preview" alt="餐厅图片预览">

        <div class="info-tip">
            💡 保存后，顾客首页会同步显示新的餐厅名称、介绍和图片。
        </div>

        <button class="add-food-btn" onclick="saveRestaurantInfo()">
            💾 保存餐厅资料
        </button>

        <div id="restaurantSaveMessage" class="success" style="margin-top:12px;">
            餐厅资料保存成功！
        </div>

    </div>


    <!-- 菜品 -->

    <div class="section">

        <div class="section-title">
            🍽️ 我的菜品
        </div>

        <div class="food-search-wrap">
            <input
                id="foodSearch"
                class="search-input"
                type="text"
                placeholder="搜索菜品名称 / 描述..."
                oninput="filterFoods()"
            >
        </div>

        <div id="foods">
            正在加载菜品...
        </div>

    </div>


    <!-- 订单 -->

    <div class="section">

        <div class="section-title">
            📦 我的订单
        </div>

        <div class="toolbar">
            <input
                id="orderSearch"
                class="search-input"
                type="text"
                placeholder="搜索订单号 / 顾客姓名 / 电话..."
                oninput="renderOrders()"
            >
            <button class="refresh-btn" onclick="manualRefresh()">
                🔄 刷新
            </button>
            <button class="refresh-btn" onclick="enableOrderNotification()">
                🔔 开启提醒
            </button>
        </div>

        <div class="filter-buttons">
            <button id="filter-all" class="active" onclick="setOrderFilter('全部')">全部</button>
            <button id="filter-pending" onclick="setOrderFilter('待处理')">⏳ 待处理</button>
            <button id="filter-rider" onclick="setOrderFilter('骑手')">🛵 骑手订单</button>
            <button id="filter-delivering" onclick="setOrderFilter('配送中')">🚴 配送中</button>
            <button id="filter-completed" onclick="setOrderFilter('已完成')">✅ 已完成</button>
        </div>

        <div id="orderFilterCount" class="order-filter-count"></div>

        <div id="orders">
            正在加载订单...
        </div>

    </div>

</div>


<script>

// ========================================
// 登录检查
// ========================================

if (localStorage.getItem("merchantLogin") !== "true") {

    window.location.href = "admin-login.html";

}


// ========================================
// 当前餐厅 ID
// ========================================

const restaurantId =
    localStorage.getItem("merchantRestaurantId");

if (!restaurantId) {

    alert("没有找到商家餐厅信息，请重新登录");

    localStorage.removeItem("merchantLogin");

    window.location.href = "admin-login.html";
}


// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain: "mdy-food.firebaseapp.com",

    projectId: "mdy-food",

    storageBucket: "mdy-food.firebasestorage.app",

    messagingSenderId: "498327590625",

    appId: "1:498327590625:web:cceafb7febb689e7ad09a0"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let allOrders = [];
let currentOrderFilter = "全部";
let lastPendingOrderCount = 0;


// ========================================
// 防止特殊字符破坏页面
// ========================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// 判断订单是不是今天
// ========================================

function isToday(timestamp) {

    if (!timestamp) {
        return false;
    }

    let date;

    try {

        if (timestamp.toDate) {

            date = timestamp.toDate();

        } else if (timestamp instanceof Date) {

            date = timestamp;

        } else {

            return false;

        }

    } catch (error) {

        return false;
    }

    const now = new Date();

    return (
        date.getFullYear() === now.getFullYear() &&
        date.getMonth() === now.getMonth() &&
        date.getDate() === now.getDate()
    );

}

async function loadStats() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();


        let todayOrders = 0;

        let todayRevenue = 0;

        let pendingOrders = 0;

        let deliveringOrders = 0;


        snapshot.forEach(function(doc) {

            const order = doc.data();

            const status =
                order.status || "待接单";


            // ----------------------------
            // 待处理
            // ----------------------------

            if (
                status === "待接单" ||
                status === "商家已接单" ||
                status === "骑手已接单" ||
                status === "外卖好了"
            ) {

                pendingOrders++;

            }


            // ----------------------------
            // 配送中
            // ----------------------------

            if (
                status === "配送中"
            ) {

                deliveringOrders++;

            }


            // ----------------------------
            // 今日数据
            // ----------------------------

            if (
                isToday(order.created_at)
            ) {

                todayOrders++;

                todayRevenue +=
                    Number(
                        order.total || 0
                    );

            }

        });


        if (
            pendingOrders > lastPendingOrderCount &&
            lastPendingOrderCount >= 0
        ) {
            try {
                if (
                    "Notification" in window &&
                    Notification.permission === "granted"
                ) {
                    new Notification(
                        "MDY FOOD 新订单",
                        {
                            body:
                                "你有 " +
                                pendingOrders +
                                " 个订单需要处理"
                        }
                    );
                }
            } catch (notificationError) {
                console.log(notificationError);
            }
        }

        lastPendingOrderCount = pendingOrders;

        document.getElementById(
            "todayOrders"
        ).innerText =
            todayOrders;


        document.getElementById(
            "todayRevenue"
        ).innerText =
            todayRevenue.toLocaleString() +
            " Ks";


        document.getElementById(
            "pendingOrders"
        ).innerText =
            pendingOrders;


        document.getElementById(
            "deliveringOrders"
        ).innerText =
            deliveringOrders;


    } catch (error) {

            error
        );

    }

}

    const foodCards = document.querySelectorAll("#foods .food");

        if (!keyword || text.includes(keyword)) {
            card.classList.remove("food-hidden");
            visibleCount++;
        } else {

        }

    });
}

// ========================================
// 获取订单进度
// ========================================

function getOrderStep(status) {

    const steps = [

        "待接单",

        "商家已接单",

        "骑手已接单",

        "外卖好了",

        "配送中",

        "已完成"

    ];

    const index =
        steps.indexOf(status);

    return index >= 0 ? index : 0;

}


// ========================================
// 生成订单进度条
// ========================================

function createProgress(status) {

    const steps = [

        {
            name: "待接单",
            icon: "1"
        },

        {
            name: "商家已接单",
            icon: "2"
        },

        {
            name: "骑手已接单",
            icon: "3"
        },

        {
            name: "外卖好了",
            icon: "4"
        },

        {
            name: "配送中",
            icon: "5"
        },

        {
            name: "已完成",
            icon: "6"
        }

    ];

    const currentStep =
        getOrderStep(status);

    let html =
        `<div class="progress">`;

    steps.forEach(function(step, index) {

        let className = "";

        if (index < currentStep) {

            className = "done";

        } else if (index === currentStep) {

            className = "active";

        }

        html += `

            <div class="progress-step ${className}">

                <div class="progress-circle">
                    ${index < currentStep ? "✓" : step.icon}
                </div>

                <div class="progress-text">
                    ${step.name}
                </div>

            </div>

        `;

    });

    html += `</div>`;

    return html;

}

async function loadOrders() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();

        allOrders = [];

        snapshot.forEach(function(doc) {

            allOrders.push({
                id: doc.id,
                data: doc.data()
            });

        });

        allOrders.sort(function(a, b) {

            const timeA =
                a.data.created_at &&
                a.data.created_at.toMillis
                    ? a.data.created_at.toMillis()
                    : 0;

            const timeB =
                b.data.created_at &&
                b.data.created_at.toMillis
                    ? b.data.created_at.toMillis()
                    : 0;

            return timeB - timeA;

        });

        renderOrders();

    } catch (error) {

        console.error(error);

        document.getElementById("orders").innerHTML = `

            <div class="error">

                ❌ 读取订单失败

                <br><br>

                ${escapeHtml(error.message)}

                <br><br>

                如果出现 Quota exceeded，通常是 Firebase 当前配额已经用完。
                代码可以继续开发，等 Firebase 配额恢复后再测试。

            </div>

        `;

    }

}


// ========================================
// 订单筛选
// ========================================

function setOrderFilter(filter) {

    currentOrderFilter = filter;

    const buttonMap = {
        "全部": "filter-all",
        "待处理": "filter-pending",
        "骑手": "filter-rider",
        "配送中": "filter-delivering",
        "已完成": "filter-completed"
    };

    Object.keys(buttonMap).forEach(function(key) {

        const button =
            document.getElementById(buttonMap[key]);

        if (button) {
            button.classList.toggle(
                "active",
                key === filter
            );
        }

    });

    renderOrders();
}


function orderMatchesFilter(order) {

    const status = order.status || "待接单";

    if (currentOrderFilter === "全部") {
        return true;
    }

    if (currentOrderFilter === "待处理") {
        return (
            status === "待接单" ||
            status === "商家已接单" ||
            status === "骑手已接单" ||
            status === "外卖好了"
        );
    }

    if (currentOrderFilter === "骑手") {
        return Boolean(order.deliveryId);
    }

    if (currentOrderFilter === "配送中") {
        return status === "配送中";
    }

    if (currentOrderFilter === "已完成") {
        return status === "已完成";
    }

    return true;
}


function renderOrders() {

    const container =
        document.getElementById("orders");

    if (!container) {
        return;
    }

    const searchInput =
        document.getElementById("orderSearch");

    const keyword =
        searchInput
            ? searchInput.value.trim().toLowerCase()
            : "";

    const filteredOrders =
        allOrders.filter(function(orderObject) {

            const order = orderObject.data || {};

            if (!orderMatchesFilter(order)) {
                return false;
            }

            if (!keyword) {
                return true;
            }

            const searchText = [
                order.order_number || "",
                order.customername || "",
                order.phone || "",
                order.deliveryUsername || "",
                order.status || ""
            ]
                .join(" ")
                .toLowerCase();

            return searchText.includes(keyword);

        });

    const countElement =
        document.getElementById("orderFilterCount");

    if (countElement) {
        countElement.innerText =
            "当前显示 " +
            filteredOrders.length +
            " 个订单 / 共 " +
            allOrders.length +
            " 个订单";
    }

    if (filteredOrders.length === 0) {

        container.innerHTML = `

            <div class="empty">

                ${
                    allOrders.length === 0
                        ? "📦 目前没有属于本餐厅的订单"
                        : "🔍 没有符合当前筛选条件的订单"
                }

            </div>

        `;

        return;
    }

    container.innerHTML = "";

    filteredOrders.forEach(function(orderObject) {

        const order =
            orderObject.data;

        const documentId =
            orderObject.id;

        let createdTime = "暂无";

        if (
            order.created_at &&
            order.created_at.toDate
        ) {

            createdTime =
                order.created_at
                    .toDate()
                    .toLocaleString();

        }

        const status =
            order.status || "待接单";

        let itemsHTML = "";

        let itemCount = 0;

        if (
            order.items &&
            Array.isArray(order.items)
        ) {

            order.items.forEach(function(item) {

                const quantity =
                    Number(
                        item.quantity || 0
                    );

                const price =
                    Number(
                        item.price || 0
                    );

                const subtotal =
                    price * quantity;

                itemCount += quantity;

                itemsHTML += `

                    <div class="item">

                        <div class="item-name">

                            ${escapeHtml(
                                item.name || ""
                            )}

                            × ${quantity}

                        </div>

                        <div class="item-price">

                            ${subtotal.toLocaleString()}
                            Ks

                        </div>

                    </div>

                `;

            });

        }

        let buttonHTML = "";

        if (status === "待接单") {

            buttonHTML = `

                <button
                    class="accept-button"
                    onclick="changeStatus(
                        '${documentId}',
                        '商家已接单'
                    )">

                    ✅ 接受订单

                </button>

            `;

        }

        else if (
            status === "商家已接单"
        ) {

            buttonHTML = `

                <button
                    class="ready-button"
                    onclick="changeStatus(
                        '${documentId}',
                        '外卖好了'
                    )">

                    🍱 外卖好了

                </button>

                <div class="delivery-info">

                    ⏳ <strong>等待骑手接单</strong>

                    <br>

                    骑手接单后，您可以继续制作外卖。

                </div>

            `;

        }

        else if (
            status === "骑手已接单"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🛵 骑手已接单
                    </div>

                    👨‍🍳 骑手正在等待外卖做好

                    <br>

                    ${
                        order.deliveryUsername
                            ? "配送员：" +
                              escapeHtml(
                                  order.deliveryUsername
                              )
                            : "配送员：已接单"
                    }

                </div>

                <button
                    class="ready-button"
                    onclick="changeStatus(
                        '${documentId}',
                        '外卖好了'
                    )">

                    🍱 外卖好了

                </button>

            `;

        }

        else if (
            status === "外卖好了"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🍱 外卖已经做好
                    </div>

                    ${
                        order.deliveryUsername
                            ? "🛵 配送员：" +
                              escapeHtml(
                                  order.deliveryUsername
                              ) +
                              "<br>骑手可以来取餐"
                            : "🛵 正在等待骑手接单"
                    }

                </div>

            `;

        }

        else if (
            status === "配送中"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🛵 骑手正在配送
                    </div>

                    ${
                        order.deliveryUsername
                            ? "配送员：" +
                              escapeHtml(
                                  order.deliveryUsername
                              )
                            : "骑手信息读取中"
                    }

                    <br>

                    📦 外卖已经取走，正在送往顾客。

                </div>

            `;

        }

        else if (
            status === "已完成"
        ) {

            buttonHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        ✅ 订单已完成
                    </div>

                    顾客已经收到外卖。

                </div>

            `;

        }

        let riderInfoHTML = "";

        if (order.deliveryId) {

            riderInfoHTML = `

                <div class="delivery-info">

                    <div class="delivery-title">
                        🛵 配送员信息
                    </div>

                    👤 配送员：
                    ${
                        escapeHtml(
                            order.deliveryUsername ||
                            "未知"
                        )
                    }

                    ${
                        order.deliveryPhone
                            ? "<br>📞 电话：" +
                              escapeHtml(
                                  order.deliveryPhone
                              )
                            : ""
                    }

                </div>

            `;

        }

        const newOrderClass =
            status === "待接单"
                ? "order order-new"
                : "order";

        const div =
            document.createElement("div");

        div.className =
            newOrderClass;

        div.innerHTML = `

            <div class="order-number">

                📦 订单号：
                ${escapeHtml(
                    order.order_number ||
                    documentId
                )}

            </div>

            <div class="order-restaurant">

                🏪
                ${escapeHtml(
                    order.restaurantName ||
                    "本餐厅"
                )}

            </div>

            <div class="status ${getStatusClass(status)}">

                ${
                    status === "待接单"
                        ? "🔴 "
                        : status === "商家已接单"
                        ? "🔵 "
                        : status === "骑手已接单"
                        ? "🟣 "
                        : status === "外卖好了"
                        ? "🟠 "
                        : status === "配送中"
                        ? "🟢 "
                        : "✅ "
                }

                ${escapeHtml(status)}

            </div>

            ${createProgress(status)}

            <div class="customer-box">

                <div class="customer-title">
                    👤 顾客信息
                </div>

                👤 姓名：
                ${escapeHtml(
                    order.customername || ""
                )}

                <br>

                📞 电话：
                ${escapeHtml(
                    order.phone || ""
                )}

                <br>

                📍 地址：
                ${escapeHtml(
                    order.adress ||
                    order.address ||
                    ""
                )}

                <br>

                💳 支付方式：
                ${escapeHtml(
                    order.payment || ""
                )}

            </div>

            <div class="items">

                <div class="items-title">

                    🍜 订单内容

                    <span style="
                        color:#888;
                        font-size:13px;
                        font-weight:normal;
                    ">

                        共 ${itemCount} 件

                    </span>

                </div>

                ${itemsHTML}

            </div>

            <div class="total">

                总计：
                ${Number(
                    order.total || 0
                ).toLocaleString()}
                Ks

            </div>

            ${riderInfoHTML}

            <div class="time-info">

                🕒 下单时间：
                ${escapeHtml(createdTime)}

            </div>

            <div class="buttons">

                ${buttonHTML}

            </div>

        `;

        container.appendChild(div);

    });

}

async function enableOrderNotification() {

    if (!("Notification" in window)) {
        alert("当前浏览器不支持网页通知。");
        return;
    }

    try {

        const permission =
            await Notification.requestPermission();

        if (permission === "granted") {
            alert("新订单提醒已开启！");
        } else {
            alert("浏览器没有允许通知，请在浏览器设置中开启。");
        }

    } catch (error) {

        alert(
            "开启通知失败：" +
            error.message
        );

    }

}




// ========================================
// 顾客评价
// ========================================

function getReviewRating(data) {
    const value = data.rating ?? data.star ?? data.stars ?? data.score ?? data.rate;
    const number = Number(value);
    return Number.isFinite(number) ? Math.max(0, Math.min(5, number)) : 0;
}

function getReviewComment(data) {
    return data.comment || data.review || data.reviewText || data.content || data.message || data.text || "";
}

function getReviewUser(data) {
    return data.customername || data.customerName || data.username || data.userName || data.name || "顾客";
}

function getReviewTime(data) {
    const value = data.created_at || data.createdAt || data.timestamp || data.time;
    if (!value) return "";
    try {
        const date = value.toDate ? value.toDate() : new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toLocaleString("zh-CN");
    } catch (e) {
        return "";
    }
}

function isReviewData(data) {
    const rating = getReviewRating(data);
    const comment = getReviewComment(data);
    return rating > 0 || comment.trim() !== "" || data.hasReview === true || data.reviewed === true;
}

function renderStars(rating) {
    const rounded = Math.round(Number(rating) || 0);
    return "★★★★★".split("").map((star, index) => index < rounded ? "★" : "☆").join("");
}

async function loadReviews() {
    const summaryBox = document.getElementById("reviewSummary");
    const box = document.getElementById("reviews");
    if (!summaryBox || !box) return;

    try {
        const reviewMap = new Map();

        // 先读取独立 reviews 集合（如果项目使用这种结构）
        try {
            const reviewSnapshot = await db.collection("reviews")
                .where("restaurantId", "==", restaurantId)
                .get();

            reviewSnapshot.forEach(doc => {
                const data = doc.data() || {};
                if (isReviewData(data)) {
                    reviewMap.set("review:" + doc.id, { id: doc.id, ...data });
                }
            });
        } catch (reviewError) {
            console.log("独立 reviews 集合读取失败，继续检查订单评价：", reviewError);
        }

        // 再检查订单里是否直接保存了评价
        try {
            const orderSnapshot = await db.collection("orders")
                .where("restaurantId", "==", restaurantId)
                .get();

            orderSnapshot.forEach(doc => {
                const data = doc.data() || {};
                if (isReviewData(data)) {
                    reviewMap.set("order:" + doc.id, {
                        id: doc.id,
                        orderId: doc.id,
                        ...data
                    });
                }
            });
        } catch (orderReviewError) {
            console.log("订单评价读取失败：", orderReviewError);
        }

        const reviews = Array.from(reviewMap.values());
        reviews.sort((a, b) => {
            const aValue = a.created_at?.seconds || a.createdAt?.seconds || 0;
            const bValue = b.created_at?.seconds || b.createdAt?.seconds || 0;
            return bValue - aValue;
        });

        const rated = reviews.filter(item => getReviewRating(item) > 0);
        const average = rated.length
            ? rated.reduce((sum, item) => sum + getReviewRating(item), 0) / rated.length
            : 0;

        summaryBox.innerHTML = `
            <div class="review-average">${average ? average.toFixed(1) : "暂无"}</div>
            <div>
                <div class="review-stars">${average ? renderStars(average) : "☆☆☆☆☆"}</div>
                <div class="review-count">共 ${reviews.length} 条评价${rated.length ? " · " + rated.length + " 条有评分" : ""}</div>
            </div>
        `;

        if (!reviews.length) {
            box.innerHTML = `
                <div class="empty" style="padding:20px;text-align:center;color:#888;">
                    ⭐ 暂时还没有顾客评价
                </div>
            `;
            return;
        }

        box.innerHTML = "";

        reviews.forEach(review => {
            const rating = getReviewRating(review);
            const comment = getReviewComment(review);
            const user = getReviewUser(review);
            const time = getReviewTime(review);
            const orderNumber = review.order_number || review.orderNumber || review.orderId || "";

            const div = document.createElement("div");
            div.className = "review-card";
            div.innerHTML = `
                <div class="review-top">
                    <div class="review-user">👤 ${escapeHtml(user)}</div>
                    <div class="review-time">${escapeHtml(time)}</div>
                </div>
                <div class="review-stars">
                    ${rating ? renderStars(rating) + " " + rating + "/5" : "暂无评分"}
                </div>
                ${comment ? `<div class="review-comment">${escapeHtml(comment)}</div>` : ""}
                ${orderNumber ? `<div class="review-order">📦 订单：${escapeHtml(orderNumber)}</div>` : ""}
            `;
            box.appendChild(div);
        });

    } catch (error) {
        console.error("读取评价失败：", error);
        summaryBox.innerHTML = "⭐ 评价统计暂时无法读取";
        box.innerHTML = `
            <div class="error">
                ❌ 读取评价失败<br><br>${escapeHtml(error.message)}
            </div>
        `;
    }
}


// ========================================
// 手动刷新
// ========================================

async function manualRefresh() {

    const button =
        document.querySelector(".refresh-btn");

    if (button) {
        button.disabled = true;
        button.innerText = "⏳ 刷新中...";
    }

    await Promise.all([
        loadRestaurant(),
        loadRestaurantStatus(),
        loadRestaurantInfo(),
        loadFoods(),
        loadOrders(),
        loadStats(),
        loadReviews()
    ]);

    if (button) {
        button.disabled = false;
        button.innerText = "🔄 刷新";
    }

}



// ========================================
// 修改订单状态
// ========================================

async function changeStatus(
    documentId,
    newStatus
) {

    const allowedStatuses = [

        "商家已接单",

        "外卖好了"

    ];


    if (
        !allowedStatuses.includes(
            newStatus
        )
    ) {

        alert(
            "商家不能直接修改为这个状态"
        );

        return;
    }


    try {

        const orderRef =
            db
                .collection("orders")
                .doc(documentId);


        const orderSnap =
            await orderRef.get();


        if (!orderSnap.exists) {

            alert("订单不存在");

            return;
        }


        const order =
            orderSnap.data();


        if (
            newStatus === "商家已接单"
        ) {

            if (
                order.status !== "待接单"
            ) {

                alert(
                    "这个订单当前不能接受"
                );

                return;
            }

        }


        if (
            newStatus === "外卖好了"
        ) {

            if (
                order.status !== "商家已接单" &&
                order.status !== "骑手已接单"
            ) {

                alert(
                    "这个订单当前不能标记为外卖好了"
                );

                return;
            }

        }


        await orderRef.update({

            status: newStatus

        });


        await loadOrders();

        await loadStats();

    } catch (error) {

        alert(
            "修改订单状态失败：" +
            error.message
        );

        console.error(error);
    }

}
