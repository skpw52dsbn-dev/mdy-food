<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>商家后台 - MDY FOOD</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 15px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .restaurant-name {
            color: #ff5a1f;
            margin-top: 5px;
            font-size: 15px;
        }

        .logout {
            border: none;
            background: #555;
            color: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .form-group textarea {
            height: 80px;
            resize: vertical;
        }

        .add-food-btn {
            width: 100%;
            border: none;
            background: #ff5a1f;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .food {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
        }

        .food img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .food-info {
            flex: 1;
        }

        .food-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .food-price {
            color: #ff5a1f;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .food-description {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .food-status {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .food-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .food-buttons button {
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .status-btn {
            background: #555;
        }

        .delete-btn {
            background: #d33;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .order-restaurant {
            color: #ff5a1f;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            background: #fff1eb;
            color: #ff5a1f;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            line-height: 1.8;
        }

        .items {
            border-top: 1px solid #eee;
            margin-top: 12px;
            padding-top: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            margin: 7px 0;
        }

        .total {
            border-top: 1px solid #eee;
            margin-top: 12px;
            padding-top: 12px;
            color: #ff5a1f;
            font-size: 18px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .buttons button {
            border: none;
            background: #ff5a1f;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .completed {
            color: #2e8b57;
            font-weight: bold;
            margin-top: 15px;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #888;
        }

        .error {
            background: #fff0f0;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
        }

        .success {
            background: #effff4;
            color: #16833b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            display: none;
        }

    </style>

</head>

<body>

<header>
    🍜 MDY FOOD 商家后台
</header>


<div class="container">

    <div class="top">

        <div>

            <div class="title">
                👨‍🍳 商家管理
            </div>

            <div
                id="restaurantName"
                class="restaurant-name"
            >
                正在读取餐厅...
            </div>

        </div>


        <button
            class="logout"
            onclick="logout()"
        >
            退出登录
        </button>

    </div>


    <!-- 添加菜品 -->

    <div class="section">

        <div class="section-title">
            ➕ 添加菜品
        </div>

        <div
            id="successMessage"
            class="success"
        >
            菜品添加成功！
        </div>


        <div class="form-group">

            <label>
                菜品名称
            </label>

            <input
                id="foodName"
                type="text"
                placeholder="例如：宫保鸡丁"
            >

        </div>


        <div class="form-group">

            <label>
                价格（Ks）
            </label>

            <input
                id="foodPrice"
                type="number"
                placeholder="例如：8000"
            >

        </div>


        <div class="form-group">

            <label>
                菜品描述
            </label>

            <textarea
                id="foodDescription"
                placeholder="例如：香辣可口，适合下饭"
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                图片地址
            </label>

            <input
                id="foodImage"
                type="text"
                placeholder="粘贴图片 URL（可留空）"
            >

        </div>


        <button
            class="add-food-btn"
            onclick="addFood()"
        >
            🍜 添加菜品
        </button>

    </div>

<!-- 餐厅营业状态 -->

<div class="section">

    <div class="section-title">
        🏪 餐厅营业状态
    </div>

    <div id="restaurantStatus"
         style="
            font-size:18px;
            font-weight:bold;
            margin-bottom:15px;
         ">
        正在读取...
    </div>

    <button
        id="restaurantStatusBtn"
        class="add-food-btn"
        onclick="toggleRestaurantStatus()"
    >
        正在读取...
    </button>

</div>
    <!-- 我的菜品 -->

    <div class="section">

        <div class="section-title">
            🍽️ 我的菜品
        </div>

        <div id="foods">
            正在加载菜品...
        </div>

    </div>


    <!-- 订单 -->

    <div class="section">

        <div class="section-title">
            📦 我的订单
        </div>

        <div id="orders">
            正在加载订单...
        </div>

    </div>

</div>


<script>


// =========================
// 登录检查
// =========================

if (
    localStorage.getItem("merchantLogin")
    !== "true"
) {

    window.location.href =
        "admin-login.html";

}


// =========================
// 获取当前商家餐厅 ID
// =========================

const restaurantId =
    localStorage.getItem(
        "merchantRestaurantId"
    );


if (!restaurantId) {

    alert(
        "没有找到商家餐厅信息，请重新登录"
    );

    localStorage.removeItem(
        "merchantLogin"
    );

    window.location.href =
        "admin-login.html";

}


// =========================
// Firebase
// =========================

const firebaseConfig = {

    apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain: "mdy-food.firebaseapp.com",

    projectId: "mdy-food",

    storageBucket: "mdy-food.firebasestorage.app",

    messagingSenderId: "498327590625",

    appId: "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId: "G-6Q5G2862XQ"

};


firebase.initializeApp(firebaseConfig);

const db =
    firebase.firestore();


// =========================
// 读取餐厅名称
// =========================

async function loadRestaurant() {

    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();


        if (doc.exists) {

            const restaurant =
                doc.data();

            document.getElementById(
                "restaurantName"
            ).innerText =
                "🏪 " +
                (restaurant.name || "我的餐厅");

        } else {

            document.getElementById(
                "restaurantName"
            ).innerText =
                "🏪 我的餐厅";

        }

    } catch (error) {

        console.error(error);

        document.getElementById(
            "restaurantName"
        ).innerText =
            "🏪 我的餐厅";

    }

}

// =========================
// 餐厅营业状态
// =========================

async function loadRestaurantStatus() {

    try {

        const doc = await db
            .collection("restaurants")
            .doc(restaurantId)
            .get();

        const status = doc.exists
            ? (doc.data().status || "营业中")
            : "营业中";

        const statusElement =
            document.getElementById("restaurantStatus");

        const button =
            document.getElementById("restaurantStatusBtn");

        if (status === "营业中") {

            statusElement.innerText =
                "🟢 营业中";

            button.innerText =
                "🔴 暂停营业";

        } else {

            statusElement.innerText =
                "🔴 休息中";

            button.innerText =
                "🟢 恢复营业";

        }

    } catch (error) {

        console.error(error);

        document.getElementById(
            "restaurantStatus"
        ).innerText = "读取失败";

    }

}


async function toggleRestaurantStatus() {

    try {

        const doc = await db
            .collection("restaurants")
            .doc(restaurantId)
            .get();

        const currentStatus =
            doc.exists
                ? (doc.data().status || "营业中")
                : "营业中";

        const newStatus =
            currentStatus === "营业中"
                ? "休息中"
                : "营业中";

        await db
            .collection("restaurants")
            .doc(restaurantId)
            .update({

                status: newStatus

            });

        loadRestaurantStatus();

    } catch (error) {

        alert(
            "修改营业状态失败：" +
            error.message
        );

        console.error(error);

    }

}
// =========================
// 添加菜品
// =========================

async function addFood() {

    const name =
        document
            .getElementById("foodName")
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById("foodPrice")
                .value
        );


    const description =
        document
            .getElementById("foodDescription")
            .value
            .trim();


    const image =
        document
            .getElementById("foodImage")
            .value
            .trim();


    if (!name) {

        alert("请输入菜品名称");

        return;

    }


    if (!price || price <= 0) {

        alert("请输入正确的价格");

        return;

    }


    try {

        await db
            .collection("foods")
            .add({

                restaurantId:
                    restaurantId,

                name:
                    name,

                price:
                    price,

                description:
                    description,

                image:
                    image,

                status:
                    "营业中"

            });


        document.getElementById(
            "foodName"
        ).value = "";


        document.getElementById(
            "foodPrice"
        ).value = "";


        document.getElementById(
            "foodDescription"
        ).value = "";


        document.getElementById(
            "foodImage"
        ).value = "";


        const message =
            document.getElementById(
                "successMessage"
            );


        message.style.display =
            "block";


        setTimeout(function() {

            message.style.display =
                "none";

        }, 2500);


        loadFoods();


    } catch (error) {

        alert(
            "添加菜品失败：" +
            error.message
        );

        console.error(error);

    }

}


// =========================
// 读取当前餐厅菜品
// =========================

async function loadFoods() {

    try {

        const snapshot =
            await db
                .collection("foods")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();


        const container =
            document.getElementById(
                "foods"
            );


        if (snapshot.empty) {

            container.innerHTML = `

                <div class="empty">
                    目前还没有菜品
                </div>

            `;

            return;

        }


        container.innerHTML = "";


        snapshot.forEach(function(doc) {

            const food =
                doc.data();


            const div =
                document.createElement("div");


            div.className =
                "food";


            const image =
                food.image ||
                "https://via.placeholder.com/90";


            const statusText =
                food.status === "营业中"
                    ? "🟢 营业中"
                    : "🔴 已下架";


            div.innerHTML = `

                <img
                    src="${image}"
                    alt="${food.name || ""}"
                >


                <div class="food-info">

                    <div class="food-name">
                        ${food.name || ""}
                    </div>


                    <div class="food-price">
                        ${
                            Number(
                                food.price || 0
                            ).toLocaleString()
                        }
                        Ks
                    </div>


                    <div class="food-description">
                        ${food.description || ""}
                    </div>


                    <div class="food-status">
                        ${statusText}
                    </div>


                    <div class="food-buttons">

                        <button
                            class="status-btn"
                            onclick="toggleFoodStatus(
                                '${doc.id}',
                                '${food.status}'
                            )"
                        >
                            ${
                                food.status === "营业中"
                                    ? "下架"
                                    : "上架"
                            }
                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteFood(
                                '${doc.id}'
                            )"
                        >
                            删除
                        </button>

                    </div>

                </div>

            `;


            container.appendChild(div);

        });


    } catch (error) {

        console.error(error);


        document.getElementById(
            "foods"
        ).innerHTML = `

            <div class="error">

                ❌ 读取菜品失败

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


// =========================
// 上架 / 下架
// =========================

async function toggleFoodStatus(
    documentId,
    currentStatus
) {

    const newStatus =
        currentStatus === "营业中"
            ? "已下架"
            : "营业中";


    try {

        await db
            .collection("foods")
            .doc(documentId)
            .update({

                status:
                    newStatus

            });


        loadFoods();


    } catch (error) {

        alert(
            "修改菜品状态失败：" +
            error.message
        );

    }

}


// =========================
// 删除菜品
// =========================

async function deleteFood(
    documentId
) {

    if (
        !confirm(
            "确定要删除这道菜吗？"
        )
    ) {

        return;

    }


    try {

        await db
            .collection("foods")
            .doc(documentId)
            .delete();


        loadFoods();


    } catch (error) {

        alert(
            "删除菜品失败：" +
            error.message
        );

    }

}


// =========================
// 读取订单
// ⭐ 只读取当前餐厅的订单
// =========================

async function loadOrders() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .where(
                    "restaurantId",
                    "==",
                    restaurantId
                )
                .get();


        let orders = [];


        snapshot.forEach(function(doc) {

            orders.push({

                id:
                    doc.id,

                data:
                    doc.data()

            });

        });


        orders.sort(function(a, b) {

            const timeA =
                a.data.created_at &&
                a.data.created_at.toMillis
                    ? a.data.created_at.toMillis()
                    : 0;


            const timeB =
                b.data.created_at &&
                b.data.created_at.toMillis
                    ? b.data.created_at.toMillis()
                    : 0;


            return timeB - timeA;

        });


        const container =
            document.getElementById(
                "orders"
            );


        if (orders.length === 0) {

            container.innerHTML = `

                <div class="empty">
                    目前没有属于本餐厅的订单
                </div>

            `;

            return;

        }


        container.innerHTML = "";


        orders.forEach(function(orderObject) {

            const order =
                orderObject.data;


            const documentId =
                orderObject.id;


            let createdTime =
                "暂无";


            if (
                order.created_at &&
                order.created_at.toDate
            ) {

                createdTime =
                    order.created_at
                        .toDate()
                        .toLocaleString();

            }


            let itemsHTML = "";


            if (
                order.items &&
                Array.isArray(order.items)
            ) {

                order.items.forEach(function(item) {

                    itemsHTML += `

                        <div class="item">

                            <span>
                                ${item.name}
                                ×
                                ${item.quantity}
                            </span>


                            <span>

                                ${
                                    (
                                        Number(item.price) *
                                        Number(item.quantity)
                                    ).toLocaleString()
                                }

                                Ks

                            </span>

                        </div>

                    `;

                });

            }


            let buttonHTML = "";


            if (
                order.status === "待接单"
            ) {

                buttonHTML = `

                    <button
                        onclick="changeStatus(
                            '${documentId}',
                            '商家已接单'
                        )"
                    >
                        接受订单
                    </button>

                `;

            } else if (
                order.status === "商家已接单"
            ) {

                buttonHTML = `

                    <button
                        onclick="changeStatus(
                            '${documentId}',
                            '配送中'
                        )"
                    >
                        开始配送
                    </button>

                `;

            } else if (
                order.status === "配送中"
            ) {

                buttonHTML = `

                    <button
                        onclick="changeStatus(
                            '${documentId}',
                            '已完成'
                        )"
                    >
                        完成订单
                    </button>

                `;

            } else if (
                order.status === "已完成"
            ) {

                buttonHTML = `

                    <div class="completed">
                        ✅ 订单已完成
                    </div>

                `;

            }


            const div =
                document.createElement("div");


            div.className =
                "order";


            div.innerHTML = `

                <div class="order-number">

                    订单号：
                    ${order.order_number || "暂无"}

                </div>


                <div class="order-restaurant">

                    🏪
                    ${order.restaurantName || "本餐厅"}

                </div>


                <div class="status">

                    ${order.status || "待接单"}

                </div>


                <div class="info">

                    👤 顾客：
                    ${order.customername || ""}

                    <br>

                    📞 电话：
                    ${order.phone || ""}

                    <br>

                    📍 地址：
                    ${order.adress || ""}

                    <br>

                    💳 支付：
                    ${order.payment || ""}

                    <br>

                    🕒 时间：
                    ${createdTime}

                </div>


                <div class="items">

                    <strong>
                        🍜 订单内容
                    </strong>

                    ${itemsHTML}

                </div>


                <div class="total">

                    总计：
                    ${
                        Number(
                            order.total || 0
                        ).toLocaleString()
                    }
                    Ks

                </div>


                <div class="buttons">

                    ${buttonHTML}

                </div>

            `;


            container.appendChild(div);

        });


    } catch (error) {

        console.error(error);


        document.getElementById(
            "orders"
        ).innerHTML = `

            <div class="error">

                ❌ 读取订单失败

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


// =========================
// 修改订单状态
// =========================

async function changeStatus(
    documentId,
    newStatus
) {

    try {

        await db
            .collection("orders")
            .doc(documentId)
            .update({

                status:
                    newStatus

            });


        loadOrders();


    } catch (error) {

        alert(
            "修改订单状态失败：" +
            error.message
        );

    }

}


// =========================
// 退出登录
// =========================

function logout() {

    localStorage.removeItem(
        "merchantLogin"
    );

    localStorage.removeItem(
        "merchantUsername"
    );

    localStorage.removeItem(
        "merchantRestaurantId"
    );


    window.location.href =
        "admin-login.html";

}


// =========================
// 启动
// =========================

loadRestaurant();

loadRestaurantStatus();

loadFoods();

loadOrders();


setInterval(
    loadOrders,
    3000
);

</script>

</body>

</html>
