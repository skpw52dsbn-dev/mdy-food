
<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MDY FOOD 商家后台</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #fff1eb;
            color: #ff5a1f;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            line-height: 1.8;
            color: #444;
        }

        .items {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }

        .total {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 18px;
            font-weight: bold;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 13px;
            margin-top: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .accept {
            background: #28a745;
        }

        .delivery {
            background: #007bff;
        }

        .complete {
            background: #6f42c1;
        }

        .done {
            background: #eee;
            color: #555;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            margin-top: 12px;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            color: #888;
        }

        .error {
            background: #fff0f0;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .logout {
            background: #555;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

<header>

    <h1>🍜 MDY FOOD</h1>

    <div>商家订单后台</div>

</header>


<div class="container">

    <button
        class="logout"
        onclick="logout()"
    >
        退出商家账号
    </button>

    <div id="orders"></div>

</div>


<script>

    /* =========================
       检查商家登录
    ========================= */

    if (
        localStorage.getItem("merchantLogin")
        !== "true"
    ) {

        window.location.href =
            "admin-login.html";

    }


    /* =========================
       Firebase 配置
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

        authDomain:
            "mdy-food.firebaseapp.com",

        projectId:
            "mdy-food",

        storageBucket:
            "mdy-food.firebasestorage.app",

        messagingSenderId:
            "498327590625",

        appId:
            "1:498327590625:web:cceafb7febb689e7ad09a0",

        measurementId:
            "G-6Q5G2862XQ"

    };


    /* 初始化 Firebase */

    firebase.initializeApp(
        firebaseConfig
    );


    /* Firestore */

    const db =
        firebase.firestore();


    /* =========================
       从 Firebase 获取订单
    ========================= */

    async function loadOrders() {

        const container =
            document.getElementById(
                "orders"
            );

        try {

            const snapshot =
                await db
                    .collection("orders")
                    .orderBy(
                        "created_at",
                        "desc"
                    )
                    .get();


            if (snapshot.empty) {

                container.innerHTML = `
                    <div class="empty">

                        <div style="font-size:40px;">
                            📦
                        </div>

                        <h3>
                            目前没有订单
                        </h3>

                        <p>
                            新订单会显示在这里
                        </p>

                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            snapshot.forEach(
                function(doc) {

                    const order =
                        doc.data();

                    showOrder(
                        doc.id,
                        order,
                        container
                    );

                }
            );


        } catch (error) {

            console.error(
                "读取订单失败:",
                error
            );


            container.innerHTML = `

                <div class="error">

                    ❌ 读取订单失败

                    <br><br>

                    ${error.message}

                </div>

            `;

        }

    }


    /* =========================
       显示单个订单
    ========================= */

    function showOrder(
        documentId,
        order,
        container
    ) {

        let buttonHTML = "";


        if (
            order.status === "待接单"
        ) {

            buttonHTML = `

                <button
                    class="accept"
                    onclick="
                        changeStatus(
                            '${documentId}',
                            '商家已接单'
                        )
                    "
                >
                    ✅ 接受订单
                </button>

            `;

        }


        else if (
            order.status === "商家已接单"
        ) {

            buttonHTML = `

                <button
                    class="delivery"
                    onclick="
                        changeStatus(
                            '${documentId}',
                            '配送中'
                        )
                    "
                >
                    🛵 开始配送
                </button>

            `;

        }


        else if (
            order.status === "配送中"
        ) {

            buttonHTML = `

                <button
                    class="complete"
                    onclick="
                        changeStatus(
                            '${documentId}',
                            '已完成'
                        )
                    "
                >
                    ✅ 完成订单
                </button>

            `;

        }


        else {

            buttonHTML = `

                <div class="done">

                    🎉 订单已完成

                </div>

            `;

        }


        /* =========================
           订单商品
        ========================= */

        let itemsHTML = "";


        const items =
            Array.isArray(order.items)
                ? order.items
                : [];


        items.forEach(
            function(item) {

                const price =
                    Number(item.price) || 0;

                const quantity =
                    Number(item.quantity) || 0;


                itemsHTML += `

                    <div class="item">

                        <span>
                            ${item.name}
                            ×
                            ${quantity}
                        </span>

                        <span>
                            ${(price * quantity)
                                .toLocaleString()}
                            Ks
                        </span>

                    </div>

                `;

            }
        );


        /* =========================
           时间
        ========================= */

        let createdAt = "暂无";


        if (
            order.created_at &&
            order.created_at.toDate
        ) {

            createdAt =
                order.created_at
                    .toDate()
                    .toLocaleString();

        }


        /* =========================
           创建订单卡片
        ========================= */

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "order";


        div.innerHTML = `

            <div class="order-number">

                📦 订单号：

                ${order.order_number || "暂无"}

            </div>


            <div class="status">

                ${order.status || "待接单"}

            </div>


            <div class="info">

                👤 姓名：
                ${order.customername || "暂无"}

                <br>


                📞 电话：
                ${order.phone || "暂无"}

                <br>


                📍 地址：
                ${order.adress || "暂无"}

                <br>


                💳 支付：
                ${order.payment || "暂无"}

                <br>


                🕐 时间：
                ${createdAt}

            </div>


            <div class="items">

                <strong>
                    🍜 订单内容
                </strong>

                ${itemsHTML}

            </div>


            <div class="total">

                💰 总计：

                ${Number(order.total || 0)
                    .toLocaleString()}
                Ks

            </div>


            ${buttonHTML}

        `;


        container.appendChild(div);

    }


    /* =========================
       修改订单状态
    ========================= */

    async function changeStatus(
        documentId,
        newStatus
    ) {

        try {

            await db
                .collection("orders")
                .doc(documentId)
                .update({

                    status:
                        newStatus

                });


            /* 更新成功后重新读取 */

            loadOrders();


        } catch (error) {

            console.error(
                "修改订单状态失败:",
                error
            );


            alert(
                "修改订单失败：\n" +
                error.message
            );

        }

    }


    /* =========================
       退出登录
    ========================= */

    function logout() {

        localStorage.removeItem(
            "merchantLogin"
        );

        window.location.href =
            "admin-login.html";

    }


    /* =========================
       第一次加载
    ========================= */

    loadOrders();


    /* =========================
       每 3 秒检查新订单
    ========================= */

    setInterval(
        function() {

            loadOrders();

        },
        3000
    );

</script>

</body>

</html>
```
