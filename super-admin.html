<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #ff5a1f;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.title {
    font-size: 22px;
    font-weight: bold;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}

button {
    cursor: pointer;
}

.refresh-btn,
.logout-btn {
    border: none;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
}

.refresh-btn {
    background: #555;
}

.logout-btn {
    background: #333;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
}

.stat-label {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}

.pending-number {
    color: #d88700;
}

.approved-number {
    color: #2e8b57;
}

.rejected-number {
    color: #d33;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.filter-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.filter-buttons button {
    border: 1px solid #ddd;
    background: white;
    color: #555;
    padding: 8px 13px;
    border-radius: 20px;
}

.filter-buttons button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
    color: white;
}

.application {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
}

.application.pending {
    border: 2px solid #ffb000;
}

.application.approved {
    border-left: 5px solid #2e8b57;
}

.application.rejected {
    border-left: 5px solid #d33;
}

.application-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 12px;
}

.restaurant-name {
    font-size: 20px;
    font-weight: bold;
}

.restaurant-category {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}

.status {
    padding: 6px 10px;
    border-radius: 15px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.status-pending {
    background: #fff3d6;
    color: #b36b00;
}

.status-approved {
    background: #eaf8ef;
    color: #16833b;
}

.status-rejected {
    background: #fff0f0;
    color: #c00;
}

.info {
    background: #fafafa;
    border-radius: 9px;
    padding: 12px;
    line-height: 1.9;
    margin-bottom: 12px;
}

.info-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.description {
    color: #555;
    line-height: 1.7;
}

.time {
    color: #999;
    font-size: 12px;
    margin-top: 10px;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.buttons button {
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 7px;
    font-weight: bold;
}

.approve-btn {
    background: #2e8b57;
}

.reject-btn {
    background: #d33;
}

.reopen-btn {
    background: #1677ff;
}

.empty {
    padding: 35px;
    text-align: center;
    color: #888;
    background: #fafafa;
    border-radius: 10px;
}

.error {
    background: #fff0f0;
    color: #c00;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.6;
}

.success {
    background: #effff4;
    color: #16833b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
}

@media (max-width: 600px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .top {
        flex-direction: column;
        align-items: stretch;
    }

    .application-top {
        flex-direction: column;
    }

}

</style>

</head>

<body>

<script>

// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0"

};

firebase.initializeApp(firebaseConfig);

const db =
    firebase.firestore();


let applications = [];

let currentFilter = "全部";


// ========================================
// 防止特殊字符
// ========================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// 获取状态
// ========================================

function getStatus(data) {

    return data.status || "pending";

}


// ========================================
// 状态文字
// ========================================

function statusText(status) {

    if (
        status === "approved" ||
        status === "已通过"
    ) {

        return "已通过";

    }

    if (
        status === "rejected" ||
        status === "已拒绝"
    ) {

        return "已拒绝";

    }

    return "待审核";

}


// ========================================
// 状态 CSS
// ========================================

function statusClass(status) {

    if (
        status === "approved" ||
        status === "已通过"
    ) {

        return "status-approved";

    }

    if (
        status === "rejected" ||
        status === "已拒绝"
    ) {

        return "status-rejected";

    }

    return "status-pending";

}


// ========================================
// 时间
// ========================================

function getTimestamp(data) {

    const value =
        data.createdAt ||
        data.created_at;

    if (!value) {

        return 0;

    }

    try {

        if (value.toMillis) {

            return value.toMillis();

        }

        if (value.seconds) {

            return value.seconds * 1000;

        }

        const date =
            new Date(value);

        return date.getTime() || 0;

    } catch (error) {

        return 0;

    }

}


function getTime(data) {

    const timestamp =
        getTimestamp(data);

    if (!timestamp) {

        return "";

    }

    return new Date(timestamp)
        .toLocaleString("zh-CN");

}


// ========================================
// 读取申请
// ========================================

async function loadApplications() {

    const container =
        document.getElementById(
            "applications"
        );


    container.innerHTML =
        `<div class="empty">⏳ 正在读取...</div>`;


    try {

        const snapshot =
            await db
                .collection(
                    "merchantApplications"
                )
                .get();


        applications = [];


        snapshot.forEach(function(doc) {

            applications.push({

                id: doc.id,

                data: doc.data() || {}

            });

        });


        applications.sort(function(a, b) {

            return getTimestamp(b.data)
                -
                getTimestamp(a.data);

        });


        updateStats();

        renderApplications();


    } catch (error) {

        console.error(
            "读取商家申请失败：",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ 读取商家申请失败

                <br><br>

                ${escapeHtml(error.message)}

                <br><br>

                请检查 Firebase Firestore Rules
                是否允许读取 merchantApplications。

            </div>

        `;

    }

}


// ========================================
// 更新统计
// ========================================

function updateStats() {

    let pending = 0;

    let approved = 0;

    let rejected = 0;


    applications.forEach(function(item) {

        const status =
            getStatus(item.data);


        if (
            status === "approved" ||
            status === "已通过"
        ) {

            approved++;

        }

        else if (
            status === "rejected" ||
            status === "已拒绝"
        ) {

            rejected++;

        }

        else {

            pending++;

        }

    });


    document.getElementById(
        "pendingCount"
    ).innerText = pending;


    document.getElementById(
        "approvedCount"
    ).innerText = approved;


    document.getElementById(
        "rejectedCount"
    ).innerText = rejected;

}


// ========================================
// 筛选
// ========================================

function setFilter(filter) {

    currentFilter = filter;


    const map = {

        "全部": "filter-all",

        "待审核": "filter-pending",

        "已通过": "filter-approved",

        "已拒绝": "filter-rejected"

    };


    Object.keys(map).forEach(function(key) {

        const button =
            document.getElementById(
                map[key]
            );

        if (button) {

            button.classList.toggle(
                "active",
                key === filter
            );

        }

    });


    renderApplications();

}


// ========================================
// 筛选判断
// ========================================

function matchesFilter(data) {

    const status =
        getStatus(data);


    if (currentFilter === "全部") {

        return true;

    }


    if (currentFilter === "待审核") {

        return !(
            status === "approved" ||
            status === "已通过" ||
            status === "rejected" ||
            status === "已拒绝"
        );

    }


    if (currentFilter === "已通过") {

        return (
            status === "approved" ||
            status === "已通过"
        );

    }


    if (currentFilter === "已拒绝") {

        return (
            status === "rejected" ||
            status === "已拒绝"
        );

    }


    return true;

}


// ========================================
// 显示申请
// ========================================

function renderApplications() {

    const container =
        document.getElementById(
            "applications"
        );


    const list =
        applications.filter(function(item) {

            return matchesFilter(item.data);

        });


    if (!list.length) {

        container.innerHTML = `

            <div class="empty">

                📭 当前没有商家申请

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    list.forEach(function(item) {

        const data = item.data;

        const id = item.id;

        const status =
            getStatus(data);


        const name =
            data.restaurantName ||
            "未填写餐厅名称";


        const type =
            data.restaurantType ||
            "未填写";


        const address =
            data.restaurantAddress ||
            "未填写";


        const owner =
            data.ownerName ||
            "未填写";


        const phone =
            data.phone ||
            "未填写";


        const email =
            data.email ||
            "未填写";


        const description =
            data.restaurantDescription ||
            "暂无餐厅介绍";


        const time =
            getTime(data);


        const div =
            document.createElement("div");


        div.className =
            "application " +
            (
                status === "approved"
                    ? "approved"
                    :
                status === "rejected"
                    ? "rejected"
                    :
                    "pending"
            );


        let buttons = "";


        if (
            status !== "approved"
        ) {

            buttons += `

                <button
                    class="approve-btn"
                    onclick="approveRestaurant('${id}')">

                    ✅ 通过审核

                </button>

            `;

        }


        if (
            status !== "rejected"
        ) {

            buttons += `

                <button
                    class="reject-btn"
                    onclick="rejectRestaurant('${id}')">

                    ❌ 拒绝申请

                </button>

            `;

        }


        if (
            status === "rejected"
        ) {

            buttons += `

                <button
                    class="reopen-btn"
                    onclick="approveRestaurant('${id}')">

                    🔄 重新通过

                </button>

            `;

        }


        div.innerHTML = `

            <div class="application-top">

                <div>

                    <div class="restaurant-name">

                        🏪
                        ${escapeHtml(name)}

                    </div>

                    <div class="restaurant-category">

                        ${escapeHtml(type)}

                    </div>

                </div>


                <div
                    class="status ${statusClass(status)}">

                    ${statusText(status)}

                </div>

            </div>


            <div class="info">

                <div class="info-title">
                    👤 商家信息
                </div>

                👤 负责人：
                ${escapeHtml(owner)}

                <br>

                📞 电话：
                ${escapeHtml(phone)}

                <br>

                📧 邮箱：
                ${escapeHtml(email)}

                <br>

                📍 地址：
                ${escapeHtml(address)}

            </div>


            <div class="info">

                <div class="info-title">
                    🍜 餐厅介绍
                </div>

                <div class="description">

                    ${escapeHtml(description)}

                </div>

            </div>


            ${
                time
                    ? `
                        <div class="time">

                            🕒 申请时间：
                            ${escapeHtml(time)}

                        </div>
                    `
                    : ""
            }


            <div class="buttons">

                ${buttons}

            </div>

        `;


        container.appendChild(div);

    });

}


// ========================================
// 通过审核
// ========================================

async function approveRestaurant(id) {

    const item =
        applications.find(function(item) {

            return item.id === id;

        });


    if (!item) {

        alert("找不到这个申请");

        return;

    }


    const data =
        item.data;


    const name =
        data.restaurantName ||
        "这个餐厅";


    if (
        !confirm(
            "确定通过「" +
            name +
            "」的商家入驻申请吗？"
        )
    ) {

        return;

    }


    try {

        // ========================================
        // 1. 更新申请状态
        // ========================================

        await db
            .collection(
                "merchantApplications"
            )
            .doc(id)
            .update({

                status:
                    "approved",

                approvedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        // ========================================
        // 2. 创建正式餐厅
        // ========================================

        await db
            .collection(
                "restaurants"
            )
            .doc(id)
            .set({

                restaurantId:
                    id,

                merchantId:
                    data.uid || id,

                uid:
                    data.uid || id,

                name:
                    data.restaurantName || "",

                restaurantName:
                    data.restaurantName || "",

                category:
                    data.restaurantType || "",

                restaurantType:
                    data.restaurantType || "",

                address:
                    data.restaurantAddress || "",

                restaurantAddress:
                    data.restaurantAddress || "",

                description:
                    data.restaurantDescription || "",

                restaurantDescription:
                    data.restaurantDescription || "",

                ownerName:
                    data.ownerName || "",

                phone:
                    data.phone || "",

                email:
                    data.email || "",

                approvalStatus:
                    "approved",

                approved:
                    true,

                createdAt:
                    data.createdAt ||
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                approvedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        showSuccess(
            "✅ " +
            name +
            " 已通过审核，并已正式上线！"
        );


        await loadApplications();


    } catch (error) {

        console.error(
            "审核失败：",
            error
        );


        alert(
            "审核失败：" +
            error.message
        );

    }

}


// ========================================
// 拒绝申请
// ========================================

async function rejectRestaurant(id) {

    const item =
        applications.find(function(item) {

            return item.id === id;

        });


    if (!item) {

        alert("找不到这个申请");

        return;

    }


    const name =
        item.data.restaurantName ||
        "这个餐厅";


    const reason =
        prompt(
            "请输入拒绝原因："
        );


    if (reason === null) {

        return;

    }


    if (
        !confirm(
            "确定拒绝「" +
            name +
            "」吗？"
        )
    ) {

        return;

    }


    try {

        await db
            .collection(
                "merchantApplications"
            )
            .doc(id)
            .update({

                status:
                    "rejected",

                rejectionReason:
                    reason.trim(),

                rejectedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        showSuccess(
            "❌ " +
            name +
            " 已拒绝。"
        );


        await loadApplications();


    } catch (error) {

        console.error(
            "拒绝失败：",
            error
        );


        alert(
            "拒绝失败：" +
            error.message
        );

    }

}


// ========================================
// 成功提示
// ========================================

function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.innerText =
        message;


    box.style.display =
        "block";


    setTimeout(function() {

        box.style.display =
            "none";

    }, 4000);

}


// ========================================
// 退出
// ========================================

function logout() {

    localStorage.removeItem(
        "superAdminLogin"
    );

    window.location.href =
        "index.html";

}


// ========================================
// 启动
// ========================================

loadApplications();

</script>

</body>
