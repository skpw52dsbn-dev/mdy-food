
<!DOCTYPE html>
<html lang="zh-CN">

<head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #ff5a1f;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.title {
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}

.top-buttons {
    display: flex;
    gap: 8px;
}

button {
    cursor: pointer;
}

.refresh-btn,
.logout-btn {
    border: none;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    font-weight: bold;
}

.refresh-btn {
    background: #555;
}

.logout-btn {
    background: #333;
}


/* =========================
   数据统计
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.stat-number {
    font-size: 27px;
    font-weight: bold;
}

.stat-label {
    color: #888;
    font-size: 14px;
    margin-top: 6px;
}

.orange {
    color: #ff5a1f;
}

.green {
    color: #2e8b57;
}

.blue {
    color: #1677ff;
}

.red {
    color: #d33;
}

.gold {
    color: #d88700;
}


/* =========================
   区块
========================= */

.section {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}


/* =========================
   标签按钮
========================= */

.filter-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.filter-buttons button {
    border: 1px solid #ddd;
    background: white;
    color: #555;
    padding: 8px 13px;
    border-radius: 20px;
}

.filter-buttons button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
    color: white;
}


/* =========================
   搜索
========================= */

.search-box {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 15px;
}


/* =========================
   商家申请
========================= */

.application {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
}

.application.pending {
    border: 2px solid #ffb000;
}

.application.approved {
    border-left: 5px solid #2e8b57;
}

.application.rejected {
    border-left: 5px solid #d33;
}

.application-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 12px;
}

.restaurant-name {
    font-size: 20px;
    font-weight: bold;
}

.restaurant-category {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}

.status {
    padding: 6px 10px;
    border-radius: 15px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.status-pending {
    background: #fff3d6;
    color: #b36b00;
}

.status-approved {
    background: #eaf8ef;
    color: #16833b;
}

.status-rejected {
    background: #fff0f0;
    color: #c00;
}

.info {
    background: #fafafa;
    border-radius: 9px;
    padding: 12px;
    line-height: 1.9;
    margin-bottom: 12px;
}

.info-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.description {
    color: #555;
    line-height: 1.7;
}

.time {
    color: #999;
    font-size: 12px;
    margin-top: 10px;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.buttons button {
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 7px;
    font-weight: bold;
}

.approve-btn {
    background: #2e8b57;
}

.reject-btn {
    background: #d33;
}

.reopen-btn {
    background: #1677ff;
}


/* =========================
   商家列表
========================= */

.restaurant-card {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
}

.restaurant-card-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.restaurant-card-name {
    font-size: 18px;
    font-weight: bold;
}

.restaurant-card-info {
    color: #666;
    line-height: 1.8;
}

.restaurant-actions {
    margin-top: 12px;
}

.restaurant-actions button {
    border: none;
    padding: 9px 13px;
    border-radius: 7px;
    color: white;
    font-weight: bold;
    margin-right: 6px;
}

.disable-btn {
    background: #d33;
}

.enable-btn {
    background: #2e8b57;
}


/* =========================
   订单
========================= */

.order-card {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
}

.order-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
}

.order-number {
    font-weight: bold;
    font-size: 17px;
}

.order-status {
    padding: 6px 10px;
    border-radius: 15px;
    background: #fff3d6;
    color: #a56500;
    font-size: 13px;
    font-weight: bold;
}

.order-info {
    background: #fafafa;
    padding: 12px;
    border-radius: 9px;
    line-height: 1.9;
}

.order-items {
    margin-top: 10px;
    color: #555;
    line-height: 1.8;
}

.order-total {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #eee;
    font-size: 18px;
    font-weight: bold;
    color: #ff5a1f;
}


/* =========================
   评价
========================= */

.review-card {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
}

.review-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.review-rating {
    font-size: 18px;
}

.review-time {
    color: #999;
    font-size: 12px;
}

.review-restaurant {
    font-weight: bold;
    margin-top: 8px;
}

.review-customer {
    color: #777;
    font-size: 14px;
    margin-top: 5px;
}

.review-comment {
    background: #fafafa;
    border-radius: 8px;
    padding: 12px;
    margin-top: 10px;
    line-height: 1.7;
}


/* =========================
   提示
========================= */

.success {
    background: #effff4;
    color: #16833b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
}

.error {
    background: #fff0f0;
    color: #c00;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.6;
}

.empty {
    padding: 35px;
    text-align: center;
    color: #888;
    background: #fafafa;
    border-radius: 10px;
}


/* =========================
   手机
========================= */

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 600px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .top {
        flex-direction: column;
        align-items: stretch;
    }

    .top-buttons {
        width: 100%;
    }

    .top-buttons button {
        flex: 1;
    }

    .application-top,
    .restaurant-card-top,
    .order-top,
    .review-top {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>

</head>

<script>


// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


// ========================================
// 数据
// ========================================

let applications = [];

let restaurants = [];

let orders = [];

let reviews = [];

let applicationFilter = "全部";

let orderFilter = "全部";


// ========================================
// HTML 安全
// ========================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// 时间
// ========================================

function getTimestamp(data) {

    const value =
        data.createdAt ||
        data.created_at ||
        data.approvedAt ||
        data.rejectedAt;


    if (!value) {
        return 0;
    }


    try {

        if (value.toMillis) {
            return value.toMillis();
        }

        if (value.seconds) {
            return value.seconds * 1000;
        }

        const date =
            new Date(value);

        return date.getTime() || 0;

    }

    catch (error) {

        return 0;

    }

}


function formatTime(data) {

    const timestamp =
        getTimestamp(data);


    if (!timestamp) {
        return "";
    }


    return new Date(timestamp)
        .toLocaleString("zh-CN");

}


// ========================================
// 状态文字
// ========================================

function statusText(status) {

    if (
        status === "approved" ||
        status === "已通过"
    ) {
        return "已通过";
    }


    if (
        status === "rejected" ||
        status === "已拒绝"
    ) {
        return "已拒绝";
    }


    return "待审核";

}


function statusClass(status) {

    if (
        status === "approved" ||
        status === "已通过"
    ) {
        return "status-approved";
    }


    if (
        status === "rejected" ||
        status === "已拒绝"
    ) {
        return "status-rejected";
    }


    return "status-pending";

}


// ========================================
// 读取商家申请
// ========================================

async function loadApplications() {

    try {

        const snapshot =
            await db
                .collection(
                    "merchantApplications"
                )
                .get();


        applications = [];


        snapshot.forEach(function(doc) {

            applications.push({

                id: doc.id,

                data: doc.data() || {}

            });

        });


        applications.sort(function(a, b) {

            return getTimestamp(b.data)
                -
                getTimestamp(a.data);

        });


        updateApplicationStats();

        renderApplications();

        updatePlatformStats();


    }

    catch (error) {

        console.error(
            "读取商家申请失败:",
            error
        );


        document.getElementById(
            "applications"
        ).innerHTML = `

            <div class="error">

                ❌ 读取商家申请失败

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


// ========================================
// 商家申请统计
// ========================================

function updateApplicationStats() {

    let pending = 0;

    let approved = 0;

    let rejected = 0;


    applications.forEach(function(item) {

        const status =
            item.data.status ||
            "pending";


        if (status === "approved") {
            approved++;
        }

        else if (status === "rejected") {
            rejected++;
        }

        else {
            pending++;
        }

    });


    document.getElementById(
        "approvedRestaurants"
    ).innerText =
        approved;


    document.getElementById(
        "pendingRestaurants"
    ).innerText =
        pending;

}


// ========================================
// 商家申请筛选
// ========================================

function setApplicationFilter(filter) {

    applicationFilter =
        filter;


    const map = {

        "全部": "filter-all",

        "待审核": "filter-pending",

        "已通过": "filter-approved",

        "已拒绝": "filter-rejected"

    };


    Object.keys(map).forEach(function(key) {

        const button =
            document.getElementById(
                map[key]
            );


        if (button) {

            button.classList.toggle(
                "active",
                key === filter
            );

        }

    });


    renderApplications();

}


function matchesApplicationFilter(data) {

    const status =
        data.status ||
        "pending";


    if (
        applicationFilter ===
        "全部"
    ) {
        return true;
    }


    if (
        applicationFilter ===
        "待审核"
    ) {

        return status !== "approved" &&
               status !== "rejected";

    }


    if (
        applicationFilter ===
        "已通过"
    ) {

        return status === "approved";

    }


    if (
        applicationFilter ===
        "已拒绝"
    ) {

        return status === "rejected";

    }


    return true;

}


// ========================================
// 显示申请
// ========================================

function renderApplications() {

    const container =
        document.getElementById(
            "applications"
        );


    const list =
        applications.filter(function(item) {

            return matchesApplicationFilter(
                item.data
            );

        });


    if (!list.length) {

        container.innerHTML = `

            <div class="empty">

                📭 当前没有商家申请

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    list.forEach(function(item) {

        const data =
            item.data;


        const id =
            item.id;


        const status =
            data.status ||
            "pending";


        const name =
            data.restaurantName ||
            "未填写餐厅名称";


        const type =
            data.restaurantType ||
            "未填写";


        const address =
            data.restaurantAddress ||
            "未填写";


        const owner =
            data.ownerName ||
            "未填写";


        const phone =
            data.phone ||
            "未填写";


        const email =
            data.email ||
            "未填写";


        const description =
            data.restaurantDescription ||
            "暂无餐厅介绍";


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "application " +
            (
                status === "approved"
                    ? "approved"
                    :
                status === "rejected"
                    ? "rejected"
                    :
                    "pending"
            );


        let buttons = "";


        if (
            status !==
            "approved"
        ) {

            buttons += `

                <button
                    class="approve-btn"
                    onclick="approveRestaurant('${escapeHtml(id)}')"
                >
                    ✅ 通过审核
                </button>

            `;

        }


        if (
            status !==
            "rejected"
        ) {

            buttons += `

                <button
                    class="reject-btn"
                    onclick="rejectRestaurant('${escapeHtml(id)}')"
                >
                    ❌ 拒绝申请
                </button>

            `;

        }


        if (
            status ===
            "rejected"
        ) {

            buttons += `

                <button
                    class="reopen-btn"
                    onclick="approveRestaurant('${escapeHtml(id)}')"
                >
                    🔄 重新通过
                </button>

            `;

        }


        div.innerHTML = `

            <div class="application-top">

                <div>

                    <div class="restaurant-name">

                        🏪
                        ${escapeHtml(name)}

                    </div>

                    <div class="restaurant-category">

                        ${escapeHtml(type)}

                    </div>

                </div>


                <div
                    class="status ${statusClass(status)}"
                >

                    ${statusText(status)}

                </div>

            </div>


            <div class="info">

                <div class="info-title">
                    👤 商家信息
                </div>

                👤 负责人：
                ${escapeHtml(owner)}

                <br>

                📞 电话：
                ${escapeHtml(phone)}

                <br>

                📧 邮箱：
                ${escapeHtml(email)}

                <br>

                📍 地址：
                ${escapeHtml(address)}

            </div>


            <div class="info">

                <div class="info-title">
                    🍜 餐厅介绍

async function approveRestaurant(id) {

    const item =
        applications.find(function(item) {

            return item.id === id;

        });


    if (!item) {

        alert("找不到这个申请");

        return;

    }


    const data =
        item.data;


    const name =
        data.restaurantName ||
        "这个餐厅";


    if (
        !confirm(
            "确定通过「" +
            name +
            "」的商家入驻申请吗？"
        )
    ) {

        return;

    }


    try {


        // 1. 更新申请状态

        await db
            .collection(
                "merchantApplications"
            )
            .doc(id)
            .update({

                status:
                    "approved",

                approvedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        // 2. 创建正式餐厅

        await db
            .collection(
                "restaurants"
            )
            .doc(id)
            .set({

                restaurantId:
                    id,

                merchantId:
                    data.uid ||
                    id,

                uid:
                    data.uid ||
                    id,

                name:
                    data.restaurantName ||
                    "",

                restaurantName:
                    data.restaurantName ||
                    "",

                category:
                    data.restaurantType ||
                    "",

                restaurantType:
                    data.restaurantType ||
                    "",

                address:
                    data.restaurantAddress ||
                    "",

                restaurantAddress:
                    data.restaurantAddress ||
                    "",

                description:
                    data.restaurantDescription ||
                    "",

                restaurantDescription:
                    data.restaurantDescription ||
                    "",

                ownerName:
                    data.ownerName ||
                    "",

                phone:
                    data.phone ||
                    "",

                email:
                    data.email ||
                    "",

                approvalStatus:
                    "approved",

                approved:
                    true,

                enabled:
                    true,

                createdAt:
                    data.createdAt ||
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                approvedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        showSuccess(
            "✅ " +
            name +
            " 已通过审核并正式上线！"
        );


        await refreshAll();

    }


    catch (error) {

        console.error(
            "审核失败:",
            error
        );


        alert(
            "审核失败：" +
            error.message
        );

    }

}


// ========================================
// 拒绝商家
// ========================================

async function rejectRestaurant(id) {

    const item =
        applications.find(function(item) {

            return item.id === id;

        });


    if (!item) {

        alert("找不到这个申请");

        return;

    }


    const name =
        item.data.restaurantName ||
        "这个餐厅";


    const reason =
        prompt(
            "请输入拒绝原因："
        );


    if (reason === null) {
        return;
    }


    if (
        !confirm(
            "确定拒绝「" +
            name +
            "」吗？"
        )
    ) {

        return;

    }


    try {

        await db
            .collection(
                "merchantApplications"
            )
            .doc(id)
            .update({

                status:
                    "rejected",

                rejectionReason:
                    reason.trim(),

                rejectedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        showSuccess(
            "❌ " +
            name +
            " 已拒绝"
        );


        await loadApplications();

    }


    catch (error) {

        console.error(
            "拒绝失败:",
            error
        );


        alert(
            "拒绝失败：" +
            error.message
        );

    }

}

        snapshot.forEach(function(doc) {

            restaurants.push({

// ========================================

function setOrderFilter(filter) {

    orderFilter =
        filter;


    const map = {

        "全部":
            "order-filter-all",

        "待接单":
            "order-filter-pending",

        "已接单":
            "order-filter-accepted",

        "配送中":
            "order-filter-delivering",

        "已完成":
            "order-filter-completed"

    };


    Object.keys(map).forEach(function(key) {

        const button =
            document.getElementById(
                map[key]
            );


        if (button) {

            button.classList.toggle(
                "active",
                key === filter
            );

        }

    });


    renderOrders();

}

function renderOrders() {

        )
        .trim()
        .toLowerCase();

                data.status ||
                "";

                orderFilter !==
                "全部"
            ) {

                    status !==
                    orderFilter
                ) {

                    return false;

                }

            }


            const text =
                (
                    (data.order_number || "") +
                    " " +
                    (data.restaurantName || "") +
                    " " +
                    (data.customername || "") +
                    " " +
                    (data.customerEmail || "") +
                    " " +
                    (data.phone || "")
                )

            return text.includes(
                search
            );

            <div class="empty">

                📭 没有找到订单

            </div>

        return;

    }


    container.innerHTML = "";

            data.restaurantName ||

            data.customername ||
            "未填写";

            data.phone ||
            "未填写";


        const address =
            data.adress ||
            data.address ||
            "未填写";


        const payment =
            data.payment ||
            "未填写";


        const status =
            data.status ||
            "未知";


        const total =
            Number(
                data.total
            ) || 0;


        let itemsHtml = "";


        if (
            Array.isArray(
                data.items
            )
        ) {

            data.items.forEach(
                function(itemData) {

                    itemsHtml += `

            document.createElement(
                "div"
            );

                <b>🍜 菜品：</b>

                <br>

                ${

// ========================================

// ========================================

function renderReviews() {

    const container =
        document.getElementById(
            "reviews"
        );


    const search =
        (
            document.getElementById(
                "reviewSearch"
            ).value || ""
        )
        .trim()
        .toLowerCase();


    const list =
        reviews.filter(function(item) {

            const data =
                item.data;


            const text =
                (
                    (data.restaurantName || "") +
                    " " +
                    (data.customerName || "") +
                    " " +
                    (data.customername || "") +
                    " " +
                    (data.comment || "")
                )
                .toLowerCase();


            return text.includes(
                search
            );

        });


    if (!list.length) {

        container.innerHTML = `

            <div class="empty">

                📭 暂无评价

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    list.forEach(function(item) {

        const data =
            item.data;


        const rating =
            Number(
                data.rating ||
                data.star ||
                data.stars ||
                data.score ||
                0
            );


        const customer =
            data.customerName ||
            data.customername ||
            data.customerEmail ||
            "匿名顾客";


        const restaurant =
            data.restaurantName ||
            "未知餐厅";


        const comment =
            data.comment ||
            "没有填写评价";


        let stars = "";


        for (
            let i = 1;
            i <= 5;
            i++
        ) {

            stars +=
                i <= rating
                    ? "⭐"
                    : "☆";

        }


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "review-card";


        div.innerHTML = `

            <div class="review-top">

                <div class="review-rating">

                    ${stars}

                    <span>
                        ${rating}/5
                    </span>

                </div>


                <div class="review-time">

                    ${escapeHtml(
                        formatTime(data)
                    )}

                </div>

            </div>


            <div class="review-restaurant">

                🏪
                ${escapeHtml(
                    restaurant
                )}

            </div>


            <div class="review-customer">

                👤
                ${escapeHtml(
                    customer
                )}

            </div>


            <div class="review-comment">

                ${escapeHtml(
                    comment
                )}

            </div>

        `;


        container.appendChild(
            div
        );

    });

}


// ========================================
// 平台统计
// ========================================

function updatePlatformStats() {

    const totalOrderCount =
        orders.length;


    let revenue = 0;


    orders.forEach(function(item) {

        revenue +=
            Number(
                item.data.total
            ) || 0;

    });


    document.getElementById(
        "totalOrders"
    ).innerText =
        totalOrderCount;


    document.getElementById(
        "totalRevenue"
    ).innerText =
        revenue.toLocaleString() +
        " Ks";


    document.getElementById(
        "totalReviews"
    ).innerText =
        reviews.length;


    let approved = 0;

    let pending = 0;


    applications.forEach(function(item) {

        const status =
            item.data.status ||
            "pending";


        if (
            status ===
            "approved"
        ) {

            approved++;

        }

        else if (
            status !==
            "rejected"
        ) {

            pending++;

        }

    });


    document.getElementById(
        "approvedRestaurants"
    ).innerText =
        approved;


    document.getElementById(
        "pendingRestaurants"
    ).innerText =
        pending;

}

// 刷新全部

    showSuccess(

        loadApplications(),

        loadRestaurants(),

        loadOrders(),

        loadReviews()

    showSuccess(
        "✅ 平台数据已刷新"
    );

}
