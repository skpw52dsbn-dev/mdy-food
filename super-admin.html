<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #ff5a1f;
    color: white;
    padding: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 15px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.title {
    font-size: 22px;
    font-weight: bold;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}

.refresh-btn,
.logout-btn {
    border: none;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.refresh-btn {
    background: #555;
}

.logout-btn {
    background: #333;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat-card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 5px;
}

.stat-label {
    color: #888;
    font-size: 14px;
}

.pending-number {
    color: #d88700;
}

.approved-number {
    color: #2e8b57;
}

.rejected-number {
    color: #d33;
}

.section {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.filter-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.filter-buttons button {
    border: 1px solid #ddd;
    background: white;
    color: #555;
    padding: 8px 13px;
    border-radius: 20px;
    cursor: pointer;
}

.filter-buttons button.active {
    background: #ff5a1f;
    border-color: #ff5a1f;
    color: white;
}

.application {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
}

.application.pending {
    border: 2px solid #ffb000;
}

.application.approved {
    border-left: 5px solid #2e8b57;
}

.application.rejected {
    border-left: 5px solid #d33;
}

.application-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 12px;
}

.restaurant-name {
    font-size: 20px;
    font-weight: bold;
}

.restaurant-category {
    color: #888;
    font-size: 14px;
    margin-top: 5px;
}

.status {
    padding: 6px 10px;
    border-radius: 15px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.status-pending {
    background: #fff3d6;
    color: #b36b00;
}

.status-approved {
    background: #eaf8ef;
    color: #16833b;
}

.status-rejected {
    background: #fff0f0;
    color: #c00;
}

.restaurant-image {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 14px;
}

.info {
    background: #fafafa;
    border-radius: 9px;
    padding: 12px;
    line-height: 1.9;
    margin-bottom: 12px;
}

.info-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.description {
    color: #555;
    line-height: 1.7;
    margin-top: 8px;
}

.time {
    color: #999;
    font-size: 12px;
    margin-top: 10px;
}

.buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
}

.buttons button {
    border: none;
    color: white;
    padding: 10px 14px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.approve-btn {
    background: #2e8b57;
}

.reject-btn {
    background: #d33;
}

.reopen-btn {
    background: #1677ff;
}

.empty {
    padding: 35px;
    text-align: center;
    color: #888;
    background: #fafafa;
    border-radius: 10px;
}

.error {
    background: #fff0f0;
    color: #c00;
    padding: 15px;
    border-radius: 10px;
    line-height: 1.6;
}

.success {
    background: #effff4;
    color: #16833b;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    display: none;
}

@media (max-width: 600px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .top {
        flex-direction: column;
        align-items: stretch;
    }

    .application-top {
        flex-direction: column;
    }

    .restaurant-name {
        font-size: 18px;
    }

}

</style>

</head>

<body>

<div class="container">

</div>

<script>

// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain: "mdy-food.firebaseapp.com",

    projectId: "mdy-food",

    storageBucket: "mdy-food.firebasestorage.app",

    messagingSenderId: "498327590625",

    appId: "1:498327590625:web:cceafb7febb689e7ad09a0"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let applications = [];

let currentFilter = "全部";


// ========================================
// 防止特殊字符
// ========================================

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// 获取状态
// ========================================

function getStatus(data) {

    return data.approvalStatus ||
           data.status ||
           "待审核";

}


// ========================================
// 获取时间
// ========================================

function getTime(data) {

    const value =
        data.createdAt ||
        data.created_at ||
        data.timestamp;

    if (!value) {
        return "";
    }

    try {

        const date =
            value.toDate
                ? value.toDate()
                : new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "";
        }

        return date.toLocaleString("zh-CN");

    } catch (error) {

        return "";

    }

}


// ========================================
// 状态文字
// ========================================

function statusText(status) {

    if (
        status === "approved" ||
        status === "已通过"
    ) {

        return "已通过";

    }

    if (
        status === "rejected" ||
        status === "已拒绝"
    ) {

        return "已拒绝";

    }

    return "待审核";

}


// ========================================
// 状态 CSS
// ========================================

function statusClass(status) {

    if (
        status === "approved" ||
        status === "已通过"
    ) {

        return "status-approved";

    }

    if (
        status === "rejected" ||
        status === "已拒绝"
    ) {

        return "status-rejected";

    }

    return "status-pending";

}


// ========================================
// 读取商家申请
// ========================================

async function loadApplications() {

    const container =
        document.getElementById("applications");

    container.innerHTML =
        `<div class="empty">⏳ 正在读取...</div>`;


    try {

        /*
         * 这里读取 restaurants 集合。
         *
         * 商家申请提交后，
         * 我们后面会让它保存到这里。
         */

        const snapshot =
            await db
                .collection("restaurants")
                .get();


        applications = [];


        snapshot.forEach(function(doc) {

            applications.push({

                id: doc.id,

                data: doc.data() || {}

            });

        });


        applications.sort(function(a, b) {

            const timeA =
                getTimestamp(a.data);

            const timeB =
                getTimestamp(b.data);

            return timeB - timeA;

        });


        updateStats();

        renderApplications();


    } catch (error) {

        console.error(
            "读取商家申请失败：",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ 读取商家申请失败

                <br><br>

                ${escapeHtml(error.message)}

                <br><br>

                如果这里显示
                "Missing or insufficient permissions"，
                说明 Firebase Firestore Rules
                还需要调整。

            </div>

        `;

    }

}


// ========================================
// 获取时间戳
// ========================================

function getTimestamp(data) {

    const value =
        data.createdAt ||
        data.created_at ||
        data.timestamp;

    if (!value) {
        return 0;
    }

    try {

        if (value.toMillis) {

            return value.toMillis();

        }

        if (value.seconds) {

            return value.seconds * 1000;

        }

        const date =
            new Date(value);

        return date.getTime() || 0;

    } catch (error) {

        return 0;

    }

}


// ========================================
// 更新统计
// ========================================

function updateStats() {

    let pending = 0;

    let approved = 0;

    let rejected = 0;


    applications.forEach(function(item) {

        const status =
            getStatus(item.data);


        if (
            status === "approved" ||
            status === "已通过"
        ) {

            approved++;

        }

        else if (
            status === "rejected" ||
            status === "已拒绝"
        ) {

            rejected++;

        }

        else {

            pending++;

        }

    });


    document.getElementById(
        "pendingCount"
    ).innerText = pending;


    document.getElementById(
        "approvedCount"
    ).innerText = approved;


    document.getElementById(
        "rejectedCount"
    ).innerText = rejected;

}


// ========================================
// 设置筛选
// ========================================

function setFilter(filter) {

    currentFilter = filter;


    const map = {

        "全部": "filter-all",

        "待审核": "filter-pending",

        "已通过": "filter-approved",

        "已拒绝": "filter-rejected"

    };


    Object.keys(map).forEach(function(key) {

        const button =
            document.getElementById(
                map[key]
            );

        if (button) {

            button.classList.toggle(
                "active",
                key === filter
            );

        }

    });


    renderApplications();

}


// ========================================
// 判断是否符合筛选
// ========================================

function matchesFilter(data) {

    const status =
        getStatus(data);


    if (currentFilter === "全部") {

        return true;

    }


    if (currentFilter === "待审核") {

        return !(
            status === "approved" ||
            status === "已通过" ||
            status === "rejected" ||
            status === "已拒绝"
        );

    }


    if (currentFilter === "已通过") {

        return (
            status === "approved" ||
            status === "已通过"
        );

    }


    if (currentFilter === "已拒绝") {

        return (
            status === "rejected" ||
            status === "已拒绝"
        );

    }


    return true;

}


// ========================================
// 显示申请
// ========================================

function renderApplications() {

    const container =
        document.getElementById("applications");


    const list =
        applications.filter(function(item) {

            return matchesFilter(item.data);

        });


    if (!list.length) {

        container.innerHTML = `

            <div class="empty">

                📭 当前没有商家申请

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    list.forEach(function(item) {

        const data = item.data;

        const id = item.id;

        const status =
            getStatus(data);


        const displayStatus =
            statusText(status);


        const image =
            data.image ||
            data.restaurantImage ||
            data.logo ||
            "";


        const name =
            data.name ||
            data.restaurantName ||
            "未填写餐厅名称";


        const category =
            data.category ||
            data.restaurantCategory ||
            "未填写分类";


        const owner =
            data.ownerName ||
            data.username ||
            data.merchantName ||
            data.name ||
            "未填写";


        const phone =
            data.phone ||
            data.mobile ||
            data.telephone ||
            "未填写";


        const address =
            data.address ||
            data.adress ||
            data.location ||
            "未填写";


        const description =
            data.description ||
            data.introduction ||
            "暂无餐厅介绍";


        const time =
            getTime(data);


        const div =
            document.createElement("div");


        let actionButtons = "";


        if (
            status !== "approved" &&
            status !== "已通过"
        ) {

            actionButtons += `

                <button
                    class="approve-btn"
                    onclick="approveRestaurant('${id}')">

                    ✅ 通过审核

                </button>

            `;

        }


        if (
            status !== "rejected" &&
            status !== "已拒绝"
        ) {

            actionButtons += `

                <button
                    class="reject-btn"
                    onclick="rejectRestaurant('${id}')">

                    ❌ 拒绝申请

                </button>

            `;

        }


        if (
            status === "rejected" ||
            status === "已拒绝"
        ) {

            actionButtons += `

                <button
                    class="reopen-btn"
                    onclick="approveRestaurant('${id}')">

                    🔄 重新通过

                </button>

            `;

        }


        div.className =
            "application " +
            (
                status === "approved" ||
                status === "已通过"
                    ? "approved"
                    : status === "rejected" ||
                      status === "已拒绝"
                    ? "rejected"
                    : "pending"
            );


        div.innerHTML = `

            <div class="application-top">

                <div>

                    <div class="restaurant-name">

                        🏪
                        ${escapeHtml(name)}

                    </div>

                    <div class="restaurant-category">

                        ${escapeHtml(category)}

                    </div>

                </div>


                <div
                    class="status ${statusClass(status)}">

                    ${displayStatus}

                </div>

            </div>


            ${
                image
                    ? `
                        <img
                            class="restaurant-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(name)}"
                            onerror="this.style.display='none'"
                        >
                    `
                    : ""
            }


            <div class="info">

                <div class="info-title">
                    👤 商家信息
                </div>

                👤 商家：
                ${escapeHtml(owner)}

                <br>

                📞 电话：
                ${escapeHtml(phone)}

                <br>

                📍 地址：
                ${escapeHtml(address)}

            </div>


            <div class="info">

                <div class="info-title">
                    🍜 餐厅介绍
                </div>

                <div class="description">

                    ${escapeHtml(description)}

                </div>

            </div>


            ${
                time
                    ? `
                        <div class="time">

                            🕒 申请时间：
                            ${escapeHtml(time)}

                        </div>
                    `
                    : ""
            }


            <div class="buttons">

                ${actionButtons}

            </div>

        `;


        container.appendChild(div);

    });

}


// ========================================
// 通过审核
// ========================================

async function approveRestaurant(id) {

    const item =
        applications.find(function(item) {

            return item.id === id;

        });


    if (!item) {

        alert("找不到这个商家申请");

        return;

    }


    const name =
        item.data.name ||
        item.data.restaurantName ||
        "这个餐厅";


    if (
        !confirm(
            "确定通过「" +
            name +
            "」的商家入驻申请吗？"
        )
    ) {

        return;

    }


    try {

        await db
            .collection("restaurants")
            .doc(id)
            .update({

                approvalStatus: "approved",

                approved: true,

                approvedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


        showSuccess(
            "✅ 「" +
            name +
            "」已通过审核！"
        );


        await loadApplications();


    } catch (error) {

        alert(
            "审核通过失败：" +
            error.message
        );

        console.error(error);

    }

}


// ========================================
// 拒绝申请
// ========================================

async function rejectRestaurant(id) {

    const item =
        applications.find(function(item) {

            return item.id === id;

        });


    if (!item) {

        alert("找不到这个商家申请");

        return;

    }


    const name =
        item.data.name ||
        item.data.restaurantName ||
        "这个餐厅";


    const reason =
        prompt(
            "请输入拒绝原因（可选）："
        );


    if (reason === null) {

        return;

    }


    if (
        !confirm(
            "确定拒绝「" +
            name +
            "」的商家入驻申请吗？"
        )
    ) {

        return;

    }


    try {

        await db
            .collection("restaurants")
            .doc(id)
            .update({

                approvalStatus: "rejected",

                approved: false,

                rejectionReason:
                    reason.trim(),

                rejectedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


        showSuccess(
            "❌ 「" +
            name +
            "」已拒绝。"
        );


        await loadApplications();


    } catch (error) {

        alert(
            "拒绝申请失败：" +
            error.message
        );

        console.error(error);

    }

}


// ========================================
// 成功提示
// ========================================

function showSuccess(message) {

    const box =
        document.getElementById(
            "successMessage"
        );


    box.innerText = message;

    box.style.display = "block";


    setTimeout(function() {

        box.style.display = "none";

    }, 3000);

}


// ========================================
// 退出
// ========================================

function logout() {

    /*
     * 这里暂时只清除管理员页面标记。
     * 后面我们正式做管理员登录时，
     * 再接入 Firebase Authentication。
     */

    localStorage.removeItem(
        "superAdminLogin"
    );

    window.location.href =
        "index.html";

}


// ========================================
// 启动
// ========================================

loadApplications();

</script>
