<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDY FOOD - 配送员登录</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    .header {
        background: #ff6b00;
        color: white;
        padding: 18px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
    }

    .container {
        max-width: 420px;
        margin: 50px auto;
        padding: 20px;
    }

    .login-box {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #ff6b00;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #e85f00;
    }

    .message {
        margin-top: 15px;
        text-align: center;
        color: #e53935;
    }

    .info {
        margin-top: 20px;
        padding: 12px;
        background: #fff7ef;
        border-radius: 8px;
        color: #666;
        font-size: 14px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="header">
    🛵 MDY FOOD 配送员
</div>

<div class="container">

    <div class="login-box">

        <h2>配送员登录</h2>

        <input
            type="text"
            id="username"
            placeholder="请输入配送员账号"
        >

        <input
            type="password"
            id="password"
            placeholder="请输入密码"
        >

        <button onclick="login()">
            登录
        </button>

        <div class="message" id="message"></div>

        <div class="info">
            配送员登录后可以查看和处理配送订单
        </div>

    </div>

</div>

<script>

function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("message");

    if (!username || !password) {
        message.textContent = "请输入账号和密码";
        return;
    }

    /*
      暂时使用测试账号
      后面再接 Firebase 配送员账号系统
    */

    if (username === "delivery" && password === "123456") {

        localStorage.setItem("deliveryLogin", "true");
        localStorage.setItem("deliveryUsername", username);

        window.location.href = "delivery.html";

    } else {

        message.textContent = "账号或密码错误";

    }
}

</script>

</body>
</html>
