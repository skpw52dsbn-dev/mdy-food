<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDY FOOD - 骑手登录</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .login-box {
      width: 92%;
      max-width: 400px;
      background: white;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #ff6b00;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #ff6b00;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #777;
      text-decoration: none;
      font-size: 14px;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 11px;
      background: #fff0f0;
      color: #d33;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 11px;
      background: #edf9f1;
      color: #168a43;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      🛵 MDY FOOD
    </div>

    <div class="subtitle">
      骑手登录
    </div>

    <label>骑手账号</label>
    <input
      type="text"
      id="username"
      placeholder="请输入骑手账号"
      autocomplete="username"
    >

    <label>密码</label>
    <input
      type="password"
      id="password"
      placeholder="请输入密码"
      autocomplete="current-password"
    >

    <button id="loginBtn" onclick="login()">
      登录
    </button>

    <div id="error" class="error"></div>

    <div id="success" class="success">
      登录成功，正在进入骑手中心...
    </div>

    <a href="index.html" class="back">
      ← 返回顾客首页
    </a>

  </div>


  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqxv5X7Q",
      authDomain: "mdy-food.firebaseapp.com",
      projectId: "mdy-food",
      storageBucket: "mdy-food.firebasestorage.app",
      messagingSenderId: "498327590625",
      appId: "1:498327590625:web:cceafb7febb689e7ad09a0"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    async function login() {

      const username =
        document.getElementById("username")
          .value.trim();

      const password =
        document.getElementById("password")
          .value;

      const errorBox =
        document.getElementById("error");

      const successBox =
        document.getElementById("success");

      const loginBtn =
        document.getElementById("loginBtn");


      errorBox.style.display = "none";
      successBox.style.display = "none";


      if (!username || !password) {

        errorBox.textContent =
          "请输入账号和密码";

        errorBox.style.display = "block";

        return;
      }


      loginBtn.disabled = true;
      loginBtn.textContent = "正在登录...";


      try {

        /*
          根据用户名寻找骑手
        */

        const snapshot =
          await db.collection("delivery")
            .where("username", "==", username)
            .limit(1)
            .get();


        if (snapshot.empty) {

          throw new Error(
            "账号不存在"
          );
        }


        const riderDoc =
          snapshot.docs[0];

        const rider =
          riderDoc.data();


        /*
          目前项目使用统一测试密码
        */

        if (password !== "123456") {

          throw new Error(
            "密码错误"
          );
        }


        /*
          保存真正的 Firestore 文档 ID
        */

        localStorage.setItem(
          "deliveryLogin",
          "true"
        );

        localStorage.setItem(
          "deliveryUsername",
          username
        );

        localStorage.setItem(
          "deliveryId",
          riderDoc.id
        );


        /*
          如果骑手没有状态，
          自动设置为在线
        */

        if (!rider.status) {

          await db.collection("delivery")
            .doc(riderDoc.id)
            .update({
              status: "在线",
              currentOrderId: "",
              previousStatus: ""
            });

        }


        successBox.style.display =
          "block";

        loginBtn.textContent =
          "登录成功";


        setTimeout(() => {

          window.location.href =
            "delivery.html";

        }, 500);


      } catch (error) {

        console.error(
          "骑手登录失败：",
          error
        );


        errorBox.textContent =
          error.message ||
          "登录失败，请检查账号和密码";

        errorBox.style.display =
          "block";


        loginBtn.disabled = false;

        loginBtn.textContent =
          "登录";
      }
    }


    /*
      按 Enter 也可以登录
    */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );

  </script>

</body>
</html>
