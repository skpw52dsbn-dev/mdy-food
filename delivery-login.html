<body>

<div class="login-box">

```
<div class="logo">

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>


/* =========================================================
   Firebase
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqv5X7Q",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();



/* =========================================================
   显示错误
========================================================= */

function showError(message) {

    const errorBox =
        document.getElementById(
            "error"
        );


    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";


    document.getElementById(
        "success"
    ).style.display =
        "none";

}



/* =========================================================
   显示成功
========================================================= */

function showSuccess() {

    document.getElementById(
        "error"
    ).style.display =
        "none";


    document.getElementById(
        "success"
    ).style.display =
        "block";

}



/* =========================================================
   登录
========================================================= */

async function login() {


    const username =
        document.getElementById(
            "username"
        )
        .value
        .trim();


    const password =
        document.getElementById(
            "password"
        )
        .value;


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    document.getElementById(
        "error"
    ).style.display =
        "none";


    document.getElementById(
        "success"
    ).style.display =
        "none";



    /* -------------------------------------------------------
       基本检查
    ------------------------------------------------------- */

    if (
        !username ||
        !password
    ) {

        showError(
            "请输入账号和密码。"
        );

        return;

    }



    loginBtn.disabled =
        true;


    loginBtn.textContent =
        "正在登录...";



    try {


        let riderDoc =
            null;



        /* ===================================================
           1. 先按照 username 查找
        =================================================== */

        let snapshot =
            await db
                .collection(
                    "delivery"
                )
                .where(
                    "username",
                    "==",
                    username
                )
                .limit(1)
                .get();


        if (
            !snapshot.empty
        ) {

            riderDoc =
                snapshot.docs[0];

        }



        /* ===================================================
           2. 如果没有 username
              尝试手机号
        =================================================== */

        if (
            !riderDoc
        ) {

            snapshot =
                await db
                    .collection(
                        "delivery"
                    )
                    .where(
                        "phone",
                        "==",
                        username
                    )
                    .limit(1)
                    .get();


            if (
                !snapshot.empty
            ) {

                riderDoc =
                    snapshot.docs[0];

            }

        }



        /* ===================================================
           3. 尝试邮箱
        =================================================== */

        if (
            !riderDoc
        ) {

            snapshot =
                await db
                    .collection(
                        "delivery"
                    )
                    .where(
                        "email",
                        "==",
                        username
                    )
                    .limit(1)
                    .get();


            if (
                !snapshot.empty
            ) {

                riderDoc =
                    snapshot.docs[0];

            }

        }



        /* ===================================================
           4. 尝试 UID
        =================================================== */

        if (
            !riderDoc
        ) {

            snapshot =
                await db
                    .collection(
                        "delivery"
                    )
                    .where(
                        "uid",
                        "==",
                        username
                    )
                    .limit(1)
                    .get();


            if (
                !snapshot.empty
            ) {

                riderDoc =
                    snapshot.docs[0];

            }

        }



        /* ===================================================
           5. 如果上面都找不到
              尝试把输入当成 Firestore 文档 ID
        =================================================== */

        if (
            !riderDoc
        ) {

            const doc =
                await db
                    .collection(
                        "delivery"
                    )
                    .doc(
                        username
                    )
                    .get();


            if (
                doc.exists
            ) {

                riderDoc =
                    doc;

            }

        }



        /* ===================================================
           6. 还是找不到
        =================================================== */

        if (
            !riderDoc
        ) {

            throw new Error(
                "账号不存在。请确认你输入的是审核通过的骑手账号、手机号或 UID。"
            );

        }



        /* ===================================================
           获取骑手资料
        =================================================== */

        const rider =
            riderDoc.data() || {};



        /* ===================================================
           检查骑手状态
        =================================================== */

        const approvalStatus =
            rider.approvalStatus ||
            rider.status ||
            "";


        if (
            rider.enabled === false
        ) {

            throw new Error(
                "该骑手账号已被平台暂停，暂时无法登录。"
            );

        }



        /*
         * 如果明确是 rejected
         */

        if (
            approvalStatus ===
            "rejected"
        ) {

            throw new Error(
                "该骑手申请未通过审核。"
            );

        }



        /* ===================================================
           当前测试密码
        =================================================== */

        if (
            password !==
            "123456"
        ) {

            throw new Error(
                "密码错误。当前测试密码为 123456"
            );

        }



        /* ===================================================
           保存登录信息
        =================================================== */

        localStorage.setItem(
            "deliveryLogin",
            "true"
        );


        localStorage.setItem(
            "deliveryUsername",
            username
        );


        localStorage.setItem(
            "deliveryId",
            riderDoc.id
        );


        localStorage.setItem(
            "deliveryName",
            rider.name ||
            ""
        );


        localStorage.setItem(
            "deliveryPhone",
            rider.phone ||
            ""
        );


        localStorage.setItem(
            "deliveryUid",
            rider.uid ||
            riderDoc.id
        );



        /* ===================================================
           如果没有 online 字段
           设置默认状态
        =================================================== */

        if (
            typeof rider.online ===
            "undefined"
        ) {

            await db
                .collection(
                    "delivery"
                )
                .doc(
                    riderDoc.id
                )
                .set({

                    online:
                        false,

                    available:
                        true,

                    enabled:
                        true

                }, {

                    merge: true

                });

        }



        /* ===================================================
           登录成功
        =================================================== */

        showSuccess();


        loginBtn.textContent =
            "登录成功";


        setTimeout(
            function() {

                window.location.href =
                    "delivery.html";

            },
            500
        );


    }

    catch (error) {


        console.error(
            "骑手登录失败：",
            error
        );


        showError(
            error.message ||
            "登录失败，请稍后重试。"
        );


        loginBtn.disabled =
            false;


        loginBtn.textContent =
            "登录";

    }

}



/* =========================================================
   Enter 登录
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            login();

        }

    }
);


</script>

</body>
