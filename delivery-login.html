<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MDY FOOD - 骑手登录</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;
            background: linear-gradient(135deg, #ff6b35, #ff9f43);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 22px;
            padding: 32px 26px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.18);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: 800;
            color: #ff5a1f;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .rider-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #fff2eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
            margin-bottom: 18px;
        }

        input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
        }

        button {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: #ff6b35;
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #f45b25;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .error {
            display: block;
            background: #fff1f0;
            color: #d93025;
        }

        .success {
            display: block;
            background: #f0fff4;
            color: #188038;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .register a {
            color: #ff5a1f;
            text-decoration: none;
            font-weight: 600;
        }

        .tip {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            background: #f7f7f7;
            color: #777;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="rider-icon">🏍️</div>

    <div class="logo">MDY FOOD</div>

    <div class="subtitle">骑手工作台登录</div>

    <form id="loginForm">

        <label for="username">骑手账号</label>

        <input
            type="text"
            id="username"
            placeholder="请输入手机号 / 邮箱 / UID"
            autocomplete="username"
            required
        >

        <label for="password">登录密码</label>

        <input
            type="password"
            id="password"
            placeholder="请输入密码"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginBtn">
            登录骑手工作台
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
        还没有骑手账号？
        <a href="delivery-register.html">申请成为骑手</a>
    </div>

    <div class="tip">
        💡 测试账号：<br>
        账号可以使用注册时的<strong>手机号</strong>登录。<br>
        当前测试密码：<strong>123456</strong>
    </div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyA84W7Xx-yNWAWWqwmcbeHzKCRsqxv5X7Q",
    authDomain: "mdy-food.firebaseapp.com",
    projectId: "mdy-food",
    storageBucket: "mdy-food.firebasestorage.app",
    messagingSenderId: "498327590625",
    appId: "1:498327590625:web:cceafb7febb689e7ad09a0"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

function showMessage(text, type) {

    message.className = "message " + type;
    message.textContent = text;

}

function normalize(value) {

    return String(value || "")
        .trim()
        .toLowerCase();

}


async function login() {

    const usernameInput =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if (!usernameInput) {

        showMessage("请输入骑手账号。", "error");
        return;

    }

    if (!password) {

        showMessage("请输入登录密码。", "error");
        return;

    }

    loginBtn.disabled = true;
    loginBtn.textContent = "登录中...";

    message.className = "message";
    message.textContent = "";

    try {

        console.log("开始读取 delivery 集合...");

        /*
         * 不再使用：
         *
         * where("username", "==", xxx)
         *
         * 而是直接读取 delivery。
         *
         * 这样可以兼容目前已经存在的骑手资料。
         */

        const snapshot =
            await db.collection("delivery").get();

        console.log(
            "delivery 集合读取成功，共有：",
            snapshot.size,
            "条"
        );

        if (snapshot.empty) {

            throw new Error(
                "delivery 集合目前没有任何骑手资料"
            );

        }

        const input =
            normalize(usernameInput);

        let rider = null;
        let riderId = null;

        snapshot.forEach(function(doc) {

            if (rider) {
                return;
            }

            const data = doc.data() || {};

            const possibleAccounts = [

                data.username,
                data.account,
                data.phone,
                data.email,
                data.uid,
                data.name,
                doc.id

            ];

            for (let i = 0; i < possibleAccounts.length; i++) {

                if (
                    normalize(possibleAccounts[i]) === input
                ) {

                    rider = data;
                    riderId = doc.id;

                    break;

                }

            }

        });


        /*
         * 如果没有找到，输出实际读取到的字段，
         * 方便以后排查。
         */

        if (!rider) {

            console.log(
                "没有匹配到骑手账号。"
            );

            snapshot.forEach(function(doc) {

                const data = doc.data() || {};

                console.log(
                    "骑手文档：",
                    doc.id,
                    {
                        username: data.username || "",
                        account: data.account || "",
                        phone: data.phone || "",
                        email: data.email || "",
                        uid: data.uid || "",
                        name: data.name || "",
                        status: data.status || "",
                        enabled: data.enabled
                    }
                );

            });

            throw new Error(
                "账号不存在，请使用注册时的手机号、邮箱或UID。"
            );

        }


        console.log(
            "找到骑手：",
            rider
        );


        /*
         * 检查账号状态
         */

        if (rider.enabled === false) {

            throw new Error(
                "该骑手账号已被停用，请联系平台管理员。"
            );

        }


        if (
            rider.status === "rejected" ||
            rider.approvalStatus === "rejected"
        ) {

            throw new Error(
                "该骑手申请未通过审核。"
            );

        }


        if (
            rider.status &&
            rider.status !== "approved" &&
            rider.status !== "在线" &&
            rider.status !== "offline"
        ) {

            throw new Error(
                "该骑手账号当前状态为：" +
                rider.status
            );

        }


        /*
         * 当前系统使用统一测试密码
         */

        if (password !== "123456") {

            throw new Error(
                "密码错误。当前测试密码为 123456"
            );

        }


        /*
         * 保存骑手登录状态
         */

        localStorage.setItem(
            "deliveryLogin",
            "true"
        );

        localStorage.setItem(
            "deliveryId",
            riderId
        );

        localStorage.setItem(
            "deliveryUsername",
            usernameInput
        );

        localStorage.setItem(
            "deliveryName",
            rider.name || ""
        );

        localStorage.setItem(
            "deliveryPhone",
            rider.phone || ""
        );

        localStorage.setItem(
            "deliveryUid",
            rider.uid || ""
        );


        /*
         * 如果没有 online 字段，
         * 自动补充基础状态。
         */

        const updateData = {};

        if (typeof rider.online === "undefined") {
            updateData.online = false;
        }

        if (typeof rider.available === "undefined") {
            updateData.available = true;
        }

        if (typeof rider.enabled === "undefined") {
            updateData.enabled = true;
        }

        if (Object.keys(updateData).length > 0) {

            await db
                .collection("delivery")
                .doc(riderId)
                .set(
                    updateData,
                    { merge: true }
                );

        }


        showMessage(
            "登录成功，正在进入骑手工作台...",
            "success"
        );

        setTimeout(function() {

            window.location.href =
                "delivery.html";

        }, 700);


    } catch (error) {

        console.error(
            "骑手登录失败：",
            error
        );

        showMessage(
            error.message ||
            "登录失败，请稍后再试。",
            "error"
        );

    } finally {

        loginBtn.disabled = false;
        loginBtn.textContent =
            "登录骑手工作台";

    }

}


form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        login();

    }
);

</script>

</body>
</html>
