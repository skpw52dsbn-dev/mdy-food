<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

header {

}

}

.back {

.toolbar {

.refresh-button,
.notification-button {

.login-box {

.login-icon {

}

.login-box h2 {
    color: #555;

}

.login-box p {

}

.login-button {

    background: #ff5a1f;
    color: white;

}

.live-box {

.live-dot {
    display: inline-block;

.order {

.status {

.status.accepted {

.status.rider {

.status.ready {

.status.delivery {

}

.status.completed {

}

.status.cancelled {

.order-timeline {

    background: #fafafa;
    border-radius: 12px;

}

.timeline-title {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 18px;
}

.timeline {
    position: relative;
    padding-left: 4px;
}

.timeline-item {
    position: relative;
    display: flex;
    min-height: 58px;
}

.timeline-item:last-child {
    min-height: 34px;
}

.timeline-line {
    position: absolute;
    left: 14px;
    top: 29px;
    bottom: -2px;
    width: 2px;
    background: #ddd;
}

.timeline-item.completed .timeline-line,
.timeline-item.current .timeline-line {
    background: #ff5a1f;
}

.timeline-dot {
    position: relative;
    z-index: 2;

    height: 30px;
    min-width: 30px;

    align-items: center;
    justify-content: center;
    font-size: 15px;
    margin-right: 12px;
}

.timeline-item.completed .timeline-dot,
.timeline-item.current .timeline-dot {
    background: #ff5a1f;
    color: white;
}

.timeline-item.current .timeline-dot {

}

.timeline-content {
    padding-top: 3px;

}

.timeline-item:last-child .timeline-content {
    padding-bottom: 0;
}

.timeline-label {
    font-size: 14px;

}

.timeline-item.completed .timeline-label,

}

}

.rider-box {
    background: #f7f7f7;
    border-radius: 12px;
    padding: 14px;

}

.rider-title {

}

.rider-status {
    display: inline-block;
    margin-top: 6px;

    border-radius: 8px;

}

.waiting-box {

}

.ready-box {

}

.delivery-box {

}

.completed-box {

.info {

}

.amount-title {

}

}

.amount-row.delivery-fee .amount-value {

.amount-total {

    align-items: center;

    padding-top: 12px;

}

.items {

    border-top: 1px solid #eee;
}

.items-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.item {

    justify-content: space-between;

}

.item-name {
    flex: 1;
}

.item-price {
    white-space: nowrap;
}

.review-area {
    margin-top: 16px;
    padding-top: 15px;
    border-top: 1px solid #eee;
}

.review-button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    background: #ff5a1f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.review-button:active {
    transform: scale(0.98);
}

.reviewed-box {
    background: #fff8e8;
    border-radius: 10px;
    padding: 13px;
    color: #c98a00;
    text-align: center;
    font-weight: bold;
}

.review-modal {
    display: none;
    position: fixed;
    z-index: 99999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    padding: 20px;
    overflow-y: auto;
}

.review-modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
}

.review-modal-box {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
}

.review-modal-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 8px;
}

.review-modal-restaurant {
    color: #777;
    font-size: 14px;
    margin-bottom: 18px;
}

.star-selector {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 18px 0;
}

.star-button {
    border: none;
    background: transparent;
    font-size: 38px;
    color: #ccc;
    cursor: pointer;
    padding: 3px;
    width: auto;
}

.star-button.active {
    color: #ffb000;
}

.rating-text {
    text-align: center;
    color: #ff5a1f;
    font-weight: bold;
    min-height: 22px;
    margin-bottom: 15px;
}

.review-textarea {
    width: 100%;
    min-height: 120px;
    resize: vertical;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    outline: none;
}

.review-textarea:focus {
    border-color: #ff5a1f;
}

.review-modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.review-cancel-button,
.review-submit-button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.review-cancel-button {
    background: #eee;
    color: #555;
}

.review-submit-button {
    background: #ff5a1f;
    color: white;
}

.review-submit-button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

.empty {
    background: white;
    padding: 45px 20px;
    text-align: center;
    border-radius: 14px;
    color: #888;
}

.empty-icon {
    font-size: 55px;
}

.empty h2 {
    color: #555;
}

.home-button {
    display: block;
    margin-top: 20px;
    padding: 14px;
    background: #ff5a1f;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 9px;
    font-weight: bold;
}

.loading {
    background: white;
    padding: 35px 20px;
    text-align: center;
    border-radius: 14px;
    color: #888;
}

.error {
    background: #fff0f0;
    color: #c00;
    padding: 20px;
    border-radius: 12px;
    line-height: 1.6;
}

.time {
    color: #888;
    font-size: 13px;
}

.toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #333;
    color: white;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    z-index: 999999;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.order.new-order {
    animation: newOrderFlash 1s ease 3;
}

@keyframes newOrderFlash {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.02);
    }

    100% {
        transform: scale(1);
    }

}

@media (max-width: 480px) {

    .order {
        padding: 15px;
    }

    .toolbar {
        gap: 8px;
    }

    .refresh-button,
    .notification-button {
        font-size: 14px;
    }

    .review-modal {
        padding: 12px;
    }

    .review-modal-box {
        padding: 18px;
    }

    .star-button {
        font-size: 32px;
    }

    .order-timeline {
        padding: 16px 11px;
    }

}

</style>

</head>


<body>


<header>
    📦 <span id="pageTitle">我的订单</span>
</header>


<div class="container">


<a
    class="back"
    href="index.html"
    id="backHome"
>
    ← <span id="backHomeText">返回首页</span>
</a>


<div
    id="loginBox"
    class="login-box"
    style="display:none;"
>

    <div class="login-icon">
        🔐
    </div>

    <h2 id="loginTitle">
        请先登录
    </h2>

    <p id="loginDescription">
        登录后才能查看你的订单。
        <br>
        订单会自动保存到你的账号。
    </p>

    <a
        class="login-button"
        href="login.html"
        id="loginButton"
    >
        👤 登录 / 注册
    </a>

</div>


<div
    id="orderArea"
    style="display:none;"
>


    <div class="toolbar">

        <button
            class="refresh-button"
            onclick="manualRefresh()"
            id="refreshButton"
        >
            🔄 刷新订单
        </button>


        <button
            class="notification-button"
            onclick="enableNotifications()"
            id="notificationButton"
        >
            🔔 开启提醒
        </button>

    </div>


    <div class="live-box">

        <span class="live-dot"></span>

        <span id="liveText">
            订单状态实时同步中
        </span>

    </div>


    <div id="orders">

        <div class="loading" id="initialLoading">
            正在加载订单...
        </div>

    </div>

</div>


</div>


<div
    id="reviewModal"
    class="review-modal"
>

    <div class="review-modal-box">

        <div class="review-modal-title">
            ⭐ <span id="reviewTitle">评价订单</span>
        </div>

        <div
            id="reviewRestaurant"
            class="review-modal-restaurant"
        >
            餐厅
        </div>


        <div class="star-selector">

            <button
                type="button"
                class="star-button"
                data-rating="1"
                onclick="selectRating(1)"
            >★</button>

            <button
                type="button"
                class="star-button"
                data-rating="2"
                onclick="selectRating(2)"
            >★</button>

            <button
                type="button"
                class="star-button"
                data-rating="3"
                onclick="selectRating(3)"
            >★</button>

            <button
                type="button"
                class="star-button"
                data-rating="4"
                onclick="selectRating(4)"
            >★</button>

            <button
                type="button"
                class="star-button"
                data-rating="5"
                onclick="selectRating(5)"
            >★</button>

        </div>


        <div
            id="ratingText"
            class="rating-text"
        >
            请选择评分
        </div>


        <textarea
            id="reviewComment"
            class="review-textarea"
            placeholder="写下你对这次订单的评价吧～（可选）"
            maxlength="500"
        ></textarea>


        <div class="review-modal-buttons">

            <button
                type="button"
                class="review-cancel-button"
                onclick="closeReviewModal()"
                id="cancelReviewButton"
            >
                取消
            </button>

            <button
                type="button"
                id="submitReviewButton"
                class="review-submit-button"
                onclick="submitReview()"
            >
                提交评价
            </button>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast"
>
    🔔 订单状态发生变化
</div>


<script>


// ========================================
// 语言
// ========================================

function t(key, fallback) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t === "function"
    ) {

        return window.MDYLanguage.t(
            key,
            {},
            fallback || key
        );

    }

    return fallback || key;

}


// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();


auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
)
.catch(
    function(error) {

        console.error(
            "Firebase Auth LOCAL 持久化设置失败：",
            error
        );

    }
);


let currentUser = null;

let unsubscribeOrders = null;

let firstSnapshot = true;

let previousOrders = {};

let currentOrders = [];

let reviewedOrderIds = new Set();

let currentReviewOrder = null;

let selectedRating = 0;

let authStateInitialized = false;

let authCheckTimer = null;


// ========================================
// HTML 安全
// ========================================

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// ========================================
// 状态统一
// ========================================

function normalizeStatus(status) {

    const value =
        String(status || "")
            .trim()
            .toLowerCase();


    if (
        value === "pending" ||
        value === "待接单" ||
        value === "pending_order" ||
        value === "waiting"
    ) {
        return "待接单";
    }


    if (
        value === "accepted_by_merchant" ||
        value === "merchant_accepted" ||
        value === "商家已接单"
    ) {
        return "商家已接单";
    }


    if (
        value === "accepted" ||
        value === "rider_accepted" ||
        value === "骑手已接单" ||
        value === "已接单"
    ) {
        return "骑手已接单";
    }


    if (
        value === "ready" ||
        value === "food_ready" ||
        value === "外卖好了" ||
        value === "已备餐" ||
        value === "ready_for_pickup"
    ) {
        return "外卖好了";
    }


    if (
        value === "delivering" ||
        value === "delivery" ||
        value === "配送中" ||
        value === "配送"
    ) {
        return "配送中";
    }


    if (
        value === "completed" ||
        value === "complete" ||
        value === "已完成" ||
        value === "完成"
    ) {
        return "已完成";
    }


    if (
        value === "cancelled" ||
        value === "canceled" ||
        value === "cancel" ||
        value === "cancelled_order" ||
        value === "已取消" ||
        value === "取消"
    ) {
        return "已取消";
    }


    return "待接单";

}


// ========================================
// 状态翻译
// ========================================

function translateStatus(status) {

    const normalized =
        normalizeStatus(status);


    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.translateStatus === "function"
    ) {

        return window.MDYLanguage.translateStatus(
            normalized
        );

    }


    const map = {

        "待接单":
            t("pending", "待接单"),

        "商家已接单":
            t("merchantAccepted", "商家已接单"),

        "骑手已接单":
            t("riderAccepted", "骑手已接单"),

        "外卖好了":
            t("ready", "外卖好了"),

        "配送中":
            t("delivering", "配送中"),

        "已完成":
            t("completed", "已完成"),

        "已取消":
            t("cancelled", "已取消")

    };


    return map[normalized] || normalized;

}


// ========================================
// 状态 Class
// ========================================

function getStatusClass(status) {

    const normalized =
        normalizeStatus(status);


    if (normalized === "商家已接单") {
        return "accepted";
    }

    if (normalized === "骑手已接单") {
        return "rider";
    }

    if (normalized === "外卖好了") {
        return "ready";
    }

    if (normalized === "配送中") {
        return "delivery";
    }

    if (normalized === "已完成") {
        return "completed";
    }

    if (normalized === "已取消") {
        return "cancelled";
    }

    return "";

}


// ========================================
// 状态图标
// ========================================

function getStatusIcon(status) {

    const normalized =
        normalizeStatus(status);


    const icons = {

        "待接单": "⏳",

// ========================================
// 时间
// ========================================

function formatTime(createdAt) {

    if (!createdAt) {

        return t(
            "timeUnknown",
            "暂无"
        );

    }


    try {

        if (createdAt.toDate) {

            const date =
                createdAt.toDate();


            if (
                window.MDYLanguage &&
                typeof window.MDYLanguage.formatDateTime === "function"
            ) {

                return window.MDYLanguage.formatDateTime(
                    date
                );

            }


            return date.toLocaleString("zh-CN");

        }


        if (createdAt.seconds) {

            const date =
                new Date(
                    createdAt.seconds * 1000
                );


            if (
                window.MDYLanguage &&
                typeof window.MDYLanguage.formatDateTime === "function"
            ) {

                return window.MDYLanguage.formatDateTime(
                    date
                );

            }


            return date.toLocaleString("zh-CN");

        }

    }

    catch (error) {

        console.error(error);

    }


    return t(
        "timeUnknown",
        "暂无"
    );

}


// ========================================
// 金额
// ========================================

function formatMoney(number) {

    return (
        Number(number) || 0

// ========================================
// 配送费
// ========================================

function getDeliveryFee(order) {

    const fee =
        Number(
            order.deliveryFee
        );


    if (
        Number.isFinite(fee) &&
        fee >= 0
    ) {

        return fee;

    }


    return 0;

}


// ========================================
// 商品金额
// ========================================

function getFoodSubtotal(order) {

    const subtotal =
        Number(
            order.subtotal
        );


    if (
        Number.isFinite(subtotal) &&
        subtotal >= 0
    ) {

        return subtotal;

    }


    if (
        Array.isArray(order.items) &&
        order.items.length > 0
    ) {

        let total = 0;


        order.items.forEach(
            function(item) {

                const price =
                    Number(
                        item.price
                    ) || 0;


                const quantity =
                    Number(
                        item.quantity
                    ) || 0;


                total +=
                    price * quantity;

            }
        );


        if (total > 0) {

            return total;

        }

    }


    const orderTotal =
        Number(
            order.total
        ) || 0;


    const deliveryFee =
        getDeliveryFee(order);


    if (
        deliveryFee > 0 &&
        orderTotal >= deliveryFee
    ) {

        return orderTotal - deliveryFee;

    }


    return orderTotal;

}


// ========================================
// 订单总金额
// ========================================

function getOrderTotal(order) {

    const total =
        Number(
            order.total
        );


    if (
        Number.isFinite(total) &&
        total >= 0
    ) {

        return total;

    }


    return (
        getFoodSubtotal(order) +
        getDeliveryFee(order)
    );

}

                                    )
                                )}
                            </div>

                        </div>

    const steps = [

            ),

            ),
            sub: t(

            )
        },

        {
            key: "骑手已接单",
            icon: "🛵",
            text: t(
                "riderAccepted",

            ),
            sub: t(
                "riderAcceptedSub",

        },

        {

            icon: "🍱",

            sub: t(
                "orderReadySub",

                "completed",
                "已完成"
            ),
            sub: t(
                "completedSub",
                "外卖已经送达"
            )
        }

    ];


    const currentIndex =
        steps.findIndex(
            function(step) {

                return step.key === status;

            }
        );


    let activeIndex =
        currentIndex;


    if (activeIndex < 0) {

        activeIndex = 0;

    }


    let html = `

        <div class="order-timeline">

            <div class="timeline-title">
                📍 ${escapeHTML(
                    t("orderProgress", "订单进度")
                )}

            <div class="timeline">

    `;


    steps.forEach(
        function(step, index) {

            let stateClass = "";


            if (index < activeIndex) {

                stateClass = "completed";

            }

            else if (index === activeIndex) {

                stateClass = "current";

            }


            const line =
                index < steps.length - 1
                ? `<div class="timeline-line"></div>`
                : "";


            let subText = "";


            if (index === activeIndex) {

                subText =
                    step.sub;

            }

            else if (index < activeIndex) {

                subText =
                    t(
                        "completed",
                        "已完成"
                    );

            }

            else {

                subText =
                    t(

                    );

            }


            html += `

                <div class="timeline-item ${stateClass}">

                            ? "✓"
                            : step.icon
                        }

                    </div>

                    <div class="timeline-content">

                        <div class="timeline-label">

                            ${escapeHTML(
                                step.text
                            )}

                        </div>

                        <div class="timeline-sub">

                            ${escapeHTML(
                                subText
                            )}

                        </div>

                    </div>

                </div>

            `;

        }
    );


    html += `

            </div>

        </div>

    `;


    return html;

// ========================================
// 读取顾客评价
// ========================================

async function loadMyReviews() {

    reviewedOrderIds =
        new Set();


    if (!currentUser) {
        return;
    }


    try {

        const snapshot =
            await db
                .collection("reviews")
                .where(
                    "customerId",
                    "==",
                    currentUser.uid
                )
                .get();


        snapshot.forEach(
            function(doc) {

                const data =
                    doc.data() || {};


                reviewedOrderIds.add(
                    doc.id
                );


                if (data.orderId) {

                    reviewedOrderIds.add(
                        data.orderId
                    );

                }

            }
        );


    }

    catch (error) {

        console.error(
            "读取评价失败：",
            error
        );

    }


    if (currentOrders.length > 0) {

        renderOrders(
            currentOrders
        );

    }

}


// ========================================
// 打开评价
// ========================================

function openReviewModal(orderId) {

    if (!currentUser) {

        alert(
            t(
                "pleaseLogin",
                "请先登录账号。"
            )
        );

        return;

    }


    const orderObject =
        currentOrders.find(
            function(item) {

                return item.id === orderId;

            }
        );


    if (!orderObject) {

        alert(
            t(
                "orderNotFound",
                "找不到这个订单，请刷新页面后重试。"
            )
        );

        return;

    }


    const order =
        orderObject.data;


    const status =
        normalizeStatus(
            order.status
        );


    if (status !== "已完成") {

        alert(
            t(
                "reviewCompletedOnly",
                "只有已经完成的订单才能评价。"
            )
        );

        return;

    }


    if (
        reviewedOrderIds.has(orderId)
    ) {

        alert(
            t(
                "reviewAlreadyExists",
                "这个订单已经评价过了。"
            )
        );

        return;

    }


    currentReviewOrder = {

        id:
            orderId,

        data:
            order

    };


    selectedRating = 0;


    document.getElementById(
        "reviewRestaurant"
    ).innerText =
        "🏪 " +
        (
            order.restaurantName ||
            t(
                "defaultRestaurantName",
                "MDY FOOD 餐厅"
            )
        );


    document.getElementById(
        "reviewComment"
    ).value =
        "";


    document.getElementById(
        "ratingText"
    ).innerText =
        t(
            "ratingRequired",
            "请选择评分"
        );


    updateStarButtons();


    document.getElementById(
        "submitReviewButton"
    ).disabled =
        false;


    document.getElementById(
        "submitReviewButton"
    ).innerText =
        t(
            "submitReview",
            "提交评价"
        );


    document.getElementById(
        "reviewModal"
    ).classList.add(
        "show"
    );

}

        null;


    selectedRating =
        0;

}


// ========================================
// 星级
// ========================================

function selectRating(rating) {

    selectedRating =
        Number(rating) || 0;


    updateStarButtons();


    const texts = {

        1:
            t(
                "rating1",
                "⭐ 非常不满意"
            ),

        2:
            t(
                "rating2",
                "⭐⭐ 不太满意"
            ),

        3:
            t(
                "rating3",
                "⭐⭐⭐ 一般"
            ),

        4:
            t(
                "rating4",
                "⭐⭐⭐⭐ 满意"
            ),

        5:
            t(
                "rating5",
                "⭐⭐⭐⭐⭐ 非常满意"
            )

    };


    document.getElementById(
        "ratingText"
    ).innerText =
        texts[selectedRating] ||
        t(
            "ratingRequired",
            "请选择评分"
        );

}


// ========================================
// 更新星星
// ========================================

function updateStarButtons() {

    const buttons =
        document.querySelectorAll(
            ".star-button"
        );


    buttons.forEach(
        function(button) {

            const rating =
                Number(
                    button.dataset.rating
                );


            if (rating <= selectedRating) {

                button.classList.add(
                    "active"
                );

            }

            else {

                button.classList.remove(
                    "active"
                );

            }

        }
    );

}


// ========================================
// 提交评价
// ========================================

async function submitReview() {

    if (!currentUser) {

        alert(
            t(
                "pleaseLogin",
                "请先登录账号。"
            )
        );

        return;

    }


    if (!currentReviewOrder) {

        alert(
            t(
                "reviewOrderMissing",
                "评价订单不存在，请重新打开。"
            )
        );

        return;

    }


    if (
        selectedRating < 1 ||
        selectedRating > 5
    ) {

        alert(
            t(
                "ratingRequired",
                "请选择 1～5 星评分。"
            )
        );

        return;

    }


    const orderId =
        currentReviewOrder.id;


    const order =
        currentReviewOrder.data;


    const status =
        normalizeStatus(
            order.status
        );


    if (status !== "已完成") {

        alert(
            t(
                "reviewCompletedOnly",
                "只有已经完成的订单才能评价。"
            )
        );

        return;

    }


    if (
        reviewedOrderIds.has(orderId)
    ) {

        alert(
            t(
                "reviewAlreadyExists",
                "这个订单已经评价过了。"
            )
        );


        closeReviewModal();


        renderOrders(
            currentOrders
        );

        return;

    }


    const comment =
        document
            .getElementById(
                "reviewComment"
            )
            .value
            .trim();


    const submitButton =
        document.getElementById(
            "submitReviewButton"
        );


    submitButton.disabled =
        true;


    submitButton.innerText =
        t(
            "submitting",
            "正在提交..."
        );


    try {

        await db
            .collection("reviews")
            .doc(orderId)
            .set({

                orderId:
                    orderId,

                order_number:
                    order.order_number ||
                    orderId,

                restaurantId:
                    order.restaurantId ||
                    "",

                restaurantName:
                    order.restaurantName ||
                    "MDY FOOD 餐厅",

                customerId:
                    currentUser.uid,

                customerEmail:
                    currentUser.email ||
                    "",

                customername:
                    order.customername ||
                    "",

                customerName:
                    order.customername ||
                    "",

                rating:
                    selectedRating,

                comment:
                    comment,

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),

                created_at:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        reviewedOrderIds.add(
            orderId
        );


        closeReviewModal();


        renderOrders(
            currentOrders
        );


        showToast(
            "⭐ " +
            t(
                "reviewSuccess",
                "评价提交成功！感谢你的反馈 ❤️"
            )
        );


    }

    catch (error) {

        console.error(
            "提交评价失败：",
            error
        );


        alert(
            t(
                "reviewFailed",
                "评价提交失败"
            ) +
            "：\n" +
            error.message
        );


        submitButton.disabled =
            false;


        submitButton.innerText =
            t(
                "submitReview",
                "提交评价"
            );

    }

}

document.getElementById(

// ========================================
// 声音
// ========================================

function playNotificationSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const audioContext =
            new AudioContext();


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.frequency.value =
            880;


        oscillator.type =
            "sine";


        gain.gain.setValueAtTime(
            0.001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.25,
            audioContext.currentTime + 0.05
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.6
        );


        oscillator.start();


        oscillator.stop(
            audioContext.currentTime + 0.6
        );

    }

    catch (error) {

        console.log(
            "声音提醒失败",
            error
        );

    }

}


// ========================================
// Toast
// ========================================

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function() {

            toast.classList.remove(
                "show"
            );

        },
        3500
    );

}


// ========================================
// 浏览器通知
// ========================================

function sendBrowserNotification(
    title,
    message
) {

    if (
        !("Notification" in window)
    ) {

        return;

    }


    if (
        Notification.permission !==
        "granted"
    ) {

        return;

    }


    try {

        new Notification(
            title,
            {
                body: message,
                icon: "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/firebase-logo.png"
            }
        );

    }

    catch (error) {

        console.log(
            "浏览器通知失败",
            error
        );

    }

}


// ========================================
// 开启通知
// ========================================

async function enableNotifications() {

    if (
        !("Notification" in window)
    ) {

        showToast(
            "❌ " +
            t(
                "notificationUnsupported",
                "当前浏览器不支持通知"
            )
        );

        return;

    }


    try {

        const permission =
            await Notification.requestPermission();


        if (
            permission === "granted"
        ) {

            showToast(
                "🔔 " +
                t(
                    "notificationEnabled",
                    "订单提醒已开启"
                )
            );


            sendBrowserNotification(
                "MDY FOOD",
                t(
                    "notificationEnabledMessage",
                    "订单提醒已经开启！"
                )
            );

        }

        else {

            showToast(
                "⚠️ " +
                t(
                    "notificationDenied",
                    "你没有允许浏览器通知"
                )
            );

        }

    }

    catch (error) {

        console.error(error);

    }

}


// ========================================
// 订单变化提醒
// ========================================

function checkOrderChanges(
    orders
) {

    if (firstSnapshot) {

        previousOrders = {};


        orders.forEach(
            function(orderObject) {

                previousOrders[
                    orderObject.id
                ] =
                    orderObject.data.status ||
                    "待接单";

            }
        );


        firstSnapshot = false;

        return;

    }


    orders.forEach(
        function(orderObject) {

            const id =
                orderObject.id;


            const status =
                orderObject.data.status ||
                "待接单";


            const oldStatus =
                previousOrders[id];


            if (
                oldStatus === undefined
            ) {

                orderObject.isChanged =
                    true;


                showToast(
                    "🆕 " +
                    t(
                        "newOrderReceived",
                        "收到新的订单！"
                    )
                );


                playNotificationSound();


                sendBrowserNotification(
                    "🆕 MDY FOOD",
                    t(
                        "newOrderNotification",
                        "你有一个新的订单，请查看订单详情。"
                    )
                );

            }


            else if (
                normalizeStatus(oldStatus) !==
                normalizeStatus(status)
            ) {

                orderObject.isChanged =
                    true;


                const displayStatus =
                    translateStatus(
                        status
                    );


                showToast(
                    "🔔 " +
                    t(
                        "orderStatus",
                        "订单状态"
                    ) +
                    "：" +
                    displayStatus
                );


                playNotificationSound();


                sendBrowserNotification(
                    "🔔 MDY FOOD",
                    t(
                        "orderStatusChanged",
                        "订单状态已经变更为"
                    ) +
                    "：" +
                    displayStatus
                );

            }


            previousOrders[id] =
                status;

        }
    );


    Object.keys(
        previousOrders
    ).forEach(
        function(id) {

            const exists =
                orders.some(
                    function(orderObject) {

                        return (
                            orderObject.id === id
                        );

                    }
                );


            if (!exists) {

                delete previousOrders[id];

            }

        }
    );

}


// ========================================
// 实时订单
// ========================================

function listenMyOrders() {

    if (unsubscribeOrders) {

        unsubscribeOrders();

        unsubscribeOrders =
            null;

    }


    if (!currentUser) {
        return;
    }


    firstSnapshot = true;

    previousOrders = {};


    unsubscribeOrders =

        db
            .collection("orders")
            .where(
                "customerId",
                "==",
                currentUser.uid
            )
            .onSnapshot(

                async function(snapshot) {

                    let orders = [];


                    snapshot.forEach(
                        function(doc) {

                            orders.push({

                                id:
                                    doc.id,

                                data:
                                    doc.data()

                            });

                        }
                    );


                    orders.sort(
                        function(a, b) {

                            let timeA = 0;

                            let timeB = 0;


                            if (
                                a.data.created_at &&
                                a.data.created_at.toMillis
                            ) {

                                timeA =
                                    a.data.created_at
                                        .toMillis();

                            }


                            if (
                                b.data.created_at &&
                                b.data.created_at.toMillis
                            ) {

                                timeB =
                                    b.data.created_at
                                        .toMillis();

                            }


                            return timeB - timeA;

                        }
                    );


                    currentOrders =
                        orders;


                    checkOrderChanges(
                        orders
                    );


                    renderOrders(
                        orders
                    );


                    await loadMyReviews();

                },


                function(error) {

                    console.error(
                        "订单实时监听失败：",
                        error
                    );


                    document.getElementById(
                        "orders"
                    ).innerHTML = `

                        <div class="error">

                            ❌ ${escapeHTML(
                                t(
                                    "dataLoadFailed",
                                    "订单加载失败"
                                )
                            )}

                            <br><br>

                            ${escapeHTML(
                                error.message
                            )}

                        </div>

                    `;

                }

            );

}

// ========================================
// Auth
// ========================================

function handleAuthUser(user) {

    if (user) {

        currentUser =
            user;


        authStateInitialized =
            true;


        if (authCheckTimer) {

            clearTimeout(
                authCheckTimer
            );

            authCheckTimer =
                null;

        }


        console.log(
            "MDY FOOD：登录状态已恢复",
            user.uid
        );


        showOrderArea();


        listenMyOrders();


        return;

    }


    if (!authStateInitialized) {

        console.log(
            "MDY FOOD：正在等待 Firebase Auth 恢复..."
        );


        if (auth.currentUser) {

            handleAuthUser(
                auth.currentUser
            );

            return;

        }


        if (authCheckTimer) {

            clearTimeout(
                authCheckTimer
            );

        }


        authCheckTimer =
            setTimeout(
                function() {

                    const restoredUser =
                        auth.currentUser;


                    if (restoredUser) {

                        handleAuthUser(
                            restoredUser
                        );

                        return;

                    }


                    authStateInitialized =
                        true;


                    currentUser =
                        null;


                    if (unsubscribeOrders) {

                        unsubscribeOrders();

                        unsubscribeOrders =
                            null;

                    }


                    currentOrders =
                        [];


                    reviewedOrderIds =
                        new Set();


                    console.log(
                        "MDY FOOD：确认没有登录用户"
                    );


                    showLoginBox();

                },
                2500
            );


        return;

    }


    currentUser =
        null;


    if (unsubscribeOrders) {

        unsubscribeOrders();

        unsubscribeOrders =
            null;

    }


    currentOrders =
        [];


    reviewedOrderIds =
        new Set();


    console.log(
        "MDY FOOD：用户已退出登录"
    );


    showLoginBox();

}

                    );

    );

    );

    );

        );


    if (loginDescription) {

            escapeHTML(

                    "登录后才能查看你的订单。"
                )
            ) +

            escapeHTML(
                t(

                    "订单会自动保存到你的账号。"
                )
            );

    );


    setText(
        "refreshButton",
        "refreshOrders",
        "🔄 刷新订单"
    );


    setText(
        "notificationButton",
        "enableNotifications",
        "🔔 开启提醒"
    );


    setText(
        "liveText",
        "orderRealtimeSync",
        "订单状态实时同步中"
    );


    setText(
        "reviewTitle",
        "reviewTitle",
        "评价订单"
    );


    setText(
        "ratingText",
        "ratingRequired",
        "请选择评分"
    );


    const comment =
        document.getElementById(
            "reviewComment"
        );


    if (comment) {

        comment.placeholder =
            t(
                "commentPlaceholder",
                "写下你对这次订单的评价吧～（可选）"
            );

    }


    setText(
        "cancelReviewButton",
        "cancel",
        "取消"
    );


    const submitButton =
        document.getElementById(
            "submitReviewButton"
        );


    if (
        submitButton &&
        !submitButton.disabled
    ) {

        submitButton.innerText =

            );

    }


    if (currentOrders.length > 0) {

        );

    }

}

    }
);

// Firebase Auth 登录监听
// ========================================

        console.log(
            "MDY FOOD：Auth 状态变化：",

                ? user.uid
                : "null"
        );


        handleAuthUser(
            user
        );

    }
);


// ========================================
// Firebase Token
// ========================================

auth.onIdTokenChanged(
    function(user) {

        console.log(
            "MDY FOOD：Token 状态变化：",
            user
                ? user.uid
                : "null"
        );


        if (
            user &&
            !currentUser
        ) {

            handleAuthUser(
                user
            );

        }

    }
);
