<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的订单 - MDY FOOD</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        .back {
            display: block;
            margin-bottom: 15px;
            color: #ff5a1f;
            text-decoration: none;
            font-weight: bold;
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status {
            display: block;
            padding: 12px;
            border-radius: 10px;
            background: #fff1eb;
            color: #ff5a1f;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        .info {
            line-height: 1.8;
        }

        .items {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }

        .total {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
            font-size: 18px;
            font-weight: bold;
            color: #ff5a1f;
            display: flex;
            justify-content: space-between;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            color: #888;
        }

        .loading {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            color: #888;
        }

        .error {
            background: #fff0f0;
            color: #c00;
            padding: 20px;
            border-radius: 12px;
            line-height: 1.6;
        }

        .home-button {
            display: block;
            margin-top: 20px;
            padding: 14px;
            background: #ff5a1f;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    📦 我的订单
</header>

<div class="container">

    <a class="back" href="index.html">
        ← 返回首页
    </a>

    <div id="orders">
        <div class="loading">
            正在加载订单...
        </div>
    </div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",
    authDomain: "mdy-food.firebaseapp.com",
    projectId: "mdy-food",
    storageBucket: "mdy-food.firebasestorage.app",
    messagingSenderId: "498327590625",
    appId: "1:498327590625:web:cceafb7febb689e7ad09a0",
    measurementId: "G-6Q5G2862XQ"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


async function loadOrders() {

    try {

        const snapshot =
            await db
                .collection("orders")
                .get();

        let orders = [];

        snapshot.forEach(function(doc) {

            orders.push({
                id: doc.id,
                data: doc.data()
            });

        });


        // 最新订单排在最前面
        orders.sort(function(a, b) {

            let timeA = 0;
            let timeB = 0;

            if (
                a.data.created_at &&
                a.data.created_at.toMillis
            ) {
                timeA =
                    a.data.created_at.toMillis();
            }

            if (
                b.data.created_at &&
                b.data.created_at.toMillis
            ) {
                timeB =
                    b.data.created_at.toMillis();
            }

            return timeB - timeA;

        });


        const container =
            document.getElementById("orders");


        if (orders.length === 0) {

            container.innerHTML = `
                <div class="empty">

                    <div style="font-size:50px;">
                        📦
                    </div>

                    <h2>
                        暂时没有订单
                    </h2>

                    <p>
                        你还没有提交订单
                    </p>

                    <a
                        class="home-button"
                        href="index.html"
                    >
                        去点餐
                    </a>

                </div>
            `;

            return;
        }


        container.innerHTML = "";


        orders.forEach(function(orderObject) {

            const order =
                orderObject.data;


            let createdTime = "暂无";


            if (
                order.created_at &&
                order.created_at.toDate
            ) {

                createdTime =
                    order.created_at
                        .toDate()
                        .toLocaleString();

            }


            let itemsHTML = "";


            if (
                order.items &&
                Array.isArray(order.items)
            ) {

                order.items.forEach(function(item) {

                    itemsHTML += `

                        <div class="item">

                            <span>
                                ${item.name}
                                × ${item.quantity}
                            </span>

                            <span>
                                ${(item.price * item.quantity)
                                    .toLocaleString()}
                                Ks
                            </span>

                        </div>

                    `;

                });

            }


            const div =
                document.createElement("div");

            div.className = "order";


            div.innerHTML = `

                <div class="order-number">

                    订单号：
                    ${order.order_number || "暂无"}

                </div>


                <div class="status">

                    🚚
                    ${order.status || "待接单"}

                </div>


                <div class="info">

                    👤 姓名：
                    ${order.customername || ""}

                    <br>

                    📱 电话：
                    ${order.phone || ""}

                    <br>

                    📍 地址：
                    ${order.adress || ""}

                    <br>

                    💳 付款：
                    ${order.payment || ""}

                    <br>

                    🕐 下单时间：
                    ${createdTime}

                </div>


                <div class="items">

                    <strong>
                        🍜 订单内容
                    </strong>

                    ${itemsHTML}

                </div>


                <div class="total">

                    <span>
                        总计
                    </span>

                    <span>
                        ${(order.total || 0)
                            .toLocaleString()}
                        Ks
                    </span>

                </div>

            `;


            container.appendChild(div);

        });


    } catch (error) {

        console.error(error);

        document.getElementById("orders").innerHTML = `

            <div class="error">

                ❌ 加载订单失败

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


// 第一次加载
loadOrders();


// 每 2 秒自动检查一次
setInterval(function() {

    loadOrders();

}, 2000);

</script>

</body>

</html>
