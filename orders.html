</div>

<script>


// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();



// ========================================
// 当前登录用户
// ========================================

let currentUser =
    null;


let unsubscribeOrders =
    null;



// ========================================
// HTML 安全处理
// ========================================

function escapeHTML(value) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ========================================
// 状态样式
// ========================================

function getStatusClass(
    status
) {

    if (
        status === "商家已接单"
    ) {

        return "accepted";

    }


    if (
        status === "配送中"
    ) {

        return "delivery";

    }


    if (
        status === "已完成"
    ) {

        return "completed";

    }


    if (
        status === "已取消" ||
        status === "取消"
    ) {

        return "cancelled";

    }


    return "";

}



// ========================================
// 状态图标
// ========================================

function getStatusIcon(
    status
) {

    if (
        status === "待接单"
    ) {

        return "⏳";

    }


    if (
        status === "商家已接单"
    ) {

        return "👨‍🍳";

    }


    if (
        status === "配送中"
    ) {

        return "🛵";

    }


    if (
        status === "已完成"
    ) {

        return "✅";

    }


    if (
        status === "已取消" ||
        status === "取消"
    ) {

        return "❌";

    }


    return "🚚";

}



// ========================================
// 时间
// ========================================

function formatTime(
    createdAt
) {

    if (!createdAt) {

        return "暂无";

    }


    try {

        if (
            createdAt.toDate
        ) {

            return createdAt
                .toDate()
                .toLocaleString(
                    "zh-CN",
                    {
                        year: "numeric",
                        month: "2-digit",
                        day: "2-digit",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );

        }


        if (
            createdAt.seconds
        ) {

            return new Date(
                createdAt.seconds * 1000
            ).toLocaleString(
                "zh-CN"
            );

        }

    }

    catch (error) {

        console.error(error);

    }


    return "暂无";

}



// ========================================
// 金额
// ========================================

function formatMoney(
    number
) {

    return (
        Number(number) || 0
    ).toLocaleString();

}



// ========================================
// 显示订单
// ========================================

function renderOrders(
    orders
) {

    const container =
        document.getElementById(
            "orders"
        );


    if (
        orders.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📦
                </div>


                <h2>
                    暂时没有订单
                </h2>


                <p>
                    你还没有提交订单
                </p>


                <a
                    class="home-button"
                    href="index.html"
                >
                    去点餐
                </a>

            </div>

        `;

        return;

    }


    container.innerHTML = "";


    orders.forEach(
        function(orderObject) {

            const order =
                orderObject.data;


            const status =
                order.status ||
                "待接单";


            let itemsHTML = "";


            if (
                Array.isArray(
                    order.items
                )
            ) {

                order.items.forEach(
                    function(item) {

                        const name =
                            escapeHTML(
                                item.name ||
                                "菜品"
                            );


                        const quantity =
                            Number(
                                item.quantity
                            ) || 0;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const itemTotal =
                            price *
                            quantity;


                        itemsHTML += `

                            <div class="item">

                                <span
                                    class="item-name"
                                >

                                    ${name}

                                    × ${quantity}

                                </span>


                                <span
                                    class="item-price"
                                >

                                    ${formatMoney(
                                        itemTotal
                                    )}

                                    Ks

                                </span>

                            </div>

                        `;

                    }
                );

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "order";


            div.innerHTML = `

                <div class="order-number">

                    订单号：

                    ${escapeHTML(
                        order.order_number ||
                        "暂无"
                    )}

                </div>


                <div class="restaurant-name">

                    🏪

                    ${escapeHTML(
                        order.restaurantName ||
                        "MDY FOOD 餐厅"
                    )}

                </div>


                <div
                    class="status
                    ${getStatusClass(status)}"
                >

                    ${getStatusIcon(status)}

                    ${escapeHTML(status)}

                </div>


                <div class="info">

                    👤 姓名：

                    ${escapeHTML(
                        order.customername ||
                        ""
                    )}

                    <br>


                    📱 电话：

                    ${escapeHTML(
                        order.phone ||
                        ""
                    )}

                    <br>


                    📍 地址：

                    ${escapeHTML(
                        order.adress ||
                        order.address ||
                        ""
                    )}

                    <br>


                    💳 付款：

                    ${escapeHTML(
                        order.payment ||
                        ""
                    )}

                    <br>


                    🕐 下单时间：

                    <span class="time">

                        ${formatTime(
                            order.created_at
                        )}

                    </span>

                </div>


                <div class="items">

                    <div class="items-title">

                        🍜 订单内容

                    </div>


                    ${itemsHTML}

                </div>


                <div class="total">

                    <span>
                        总计
                    </span>


                    <span>

                        ${formatMoney(
                            order.total
                        )}

                        Ks

                    </span>

                </div>

            `;


            container.appendChild(
                div
            );

        }
    );

}



// ========================================
// 实时监听当前用户订单
// ========================================

function listenMyOrders() {


    // 如果之前已经监听过
    // 先取消旧监听

    if (
        unsubscribeOrders
    ) {

        unsubscribeOrders();

        unsubscribeOrders =
            null;

    }


    if (!currentUser) {

        return;

    }


    unsubscribeOrders =

        db
            .collection("orders")

            .where(
                "customerId",
                "==",
                currentUser.uid
            )

            .onSnapshot(

                function(snapshot) {


                    let orders = [];


                    snapshot.forEach(
                        function(doc) {

                            orders.push({

                                id:
                                    doc.id,

                                data:
                                    doc.data()

                            });

                        }
                    );


                    // ========================================
                    // 最新订单在最上面
                    // ========================================

                    orders.sort(
                        function(a, b) {

                            let timeA = 0;

                            let timeB = 0;


                            if (
                                a.data.created_at &&
                                a.data.created_at.toMillis
                            ) {

                                timeA =
                                    a.data.created_at
                                        .toMillis();

                            }


                            if (
                                b.data.created_at &&
                                b.data.created_at.toMillis
                            ) {

                                timeB =
                                    b.data.created_at
                                        .toMillis();

                            }


                            return timeB - timeA;

                        }
                    );


                    renderOrders(
                        orders
                    );

                },


                function(error) {

                    console.error(
                        "订单实时监听失败：",
                        error
                    );


                    document.getElementById(
                        "orders"
                    ).innerHTML = `

                        <div class="error">

                            ❌ 订单加载失败

                            <br><br>

                            ${escapeHTML(
                                error.message
                            )}

                        </div>

                    `;

                }

            );

}



// ========================================
// Firebase 登录状态
// ========================================

auth.onAuthStateChanged(
    function(user) {

        currentUser =
            user;


        const loginBox =
            document.getElementById(
                "loginBox"
            );


        const orderArea =
            document.getElementById(
                "orderArea"
            );


        if (user) {

            // ========================================
            // 已登录
            // ========================================

            loginBox.style.display =
                "none";


            orderArea.style.display =
                "block";


            listenMyOrders();

        }

        else {

            // ========================================
            // 未登录
            // ========================================

            if (
                unsubscribeOrders
            ) {

                unsubscribeOrders();

                unsubscribeOrders =
                    null;

            }


            loginBox.style.display =
                "block";


            orderArea.style.display =
                "none";

        }

    }
);


</script>

</body>
