</div>

            我的
        </span>

</div>


<script>

"use strict";


/* =========================================================
   MDY FOOD - MY REVIEWS
   language.js 统一语言系统版本
========================================================= */


/* =========================
   语言工具
========================= */

function t(key, fallback){

    if(
        window.MDYLanguage &&
        typeof window.MDYLanguage.t === "function"
    ){

        return window.MDYLanguage.t(
            key,
            {},
            fallback || key
        );

    }

    return fallback || key;

}


/* =========================
   Firebase
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


if(
    !firebase.apps.length
){

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();


const db =
    firebase.firestore();


/* =========================
   全局数据
========================= */

let currentUser = null;

let currentReviews = [];


/* =========================
   HTML 安全
========================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   获取时间毫秒
========================= */

function getReviewTime(
    review
){

    const timestamp =
        review.createdAt ||
        review.created_at;


    if(!timestamp){

        return 0;

    }


    try{

        if(
            typeof timestamp.toMillis ===
            "function"
        ){

            return timestamp.toMillis();

        }


        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .getTime();

        }


        if(
            timestamp instanceof Date
        ){

            return timestamp.getTime();

        }


        if(
            typeof timestamp === "number"
        ){

            return timestamp;

        }


        const parsed =
            new Date(timestamp)
                .getTime();


        return isNaN(parsed)
            ? 0
            : parsed;

    }

    catch(error){

        return 0;

    }

}


/* =========================
   时间格式化
========================= */

function formatTime(
    timestamp
){

    if(!timestamp){

        return t(
            "timeUnknown",
            "时间未知"
        );

    }


    try{

        const date =
            timestamp &&
            typeof timestamp.toDate ===
            "function"

                ? timestamp.toDate()

                : timestamp instanceof Date

                ? timestamp

                : new Date(timestamp);


        if(
            isNaN(
                date.getTime()
            )
        ){

            return t(
                "timeUnknown",
                "时间未知"
            );

        }


        if(
            window.MDYLanguage &&
            typeof window.MDYLanguage.formatDateTime ===
            "function"
        ){

            return window.MDYLanguage.formatDateTime(
                date
            );

        }


        return date.toLocaleString(
            "zh-CN",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                hour12:false
            }
        );

    }

    catch(error){

        console.error(
            "时间格式化失败：",
            error
        );


        return t(
            "timeUnknown",
            "时间未知"
        );

    }

}


/* =========================
   星星
========================= */

function createStars(
    rating
){

    const number =
        Math.max(
            0,
            Math.min(
                5,
                Number(rating) || 0
            )
        );


    let stars = "";


    for(
        let i = 1;
        i <= 5;
        i++
    ){

        stars +=
            i <= number
                ? "★"
                : "☆";

    }


    return stars;

}


/* =========================
   渲染评价
========================= */

function renderReviews(
    reviews
){

    const content =
        document.getElementById(
            "content"
        );


    const count =
        document.getElementById(
            "reviewCount"
        );


    if(
        !content ||
        !count
    ){

        return;

    }


    count.textContent =
        reviews.length;


    /* =========================
       没有评价
    ========================= */

    if(
        reviews.length === 0
    ){

        content.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⭐
                </div>


                <div class="empty-title">

                    ${escapeHtml(
                        t(
                            "noMyReviews",
                            "还没有评价"
                        )
                    )}

                </div>


                <div class="empty-desc">

                    ${escapeHtml(
                        t(
                            "noMyReviewsDesc",
                            "完成订单后可以给餐厅留下评价"
                        )
                    )}

                </div>

            </div>

        `;

        return;

    }


    /* =========================
       有评价
    ========================= */

    content.innerHTML =

        reviews.map(
            function(review){

                const restaurantName =
                    review.restaurantName ||
                    t(
                        "defaultRestaurantName",
                        "MDY FOOD 餐厅"
                    );


                const orderNumber =
                    review.order_number ||
                    review.orderId ||
                    "";


                const rating =
                    Number(
                        review.rating
                    ) || 0;


                const comment =
                    review.comment ||
                    t(
                        "userNoTextReview",
                        "用户未填写文字评价"
                    );


                const createdAt =
                    review.createdAt ||
                    review.created_at ||
                    null;


                return `

                    <div class="review-card">

                        <div class="restaurant-row">

                            <div>

                                <div class="restaurant-name">

                                    ${escapeHtml(
                                        restaurantName
                                    )}

                                </div>


                                ${
                                    orderNumber
                                    ?
                                    `

                                    <div class="order-number">

                                        ${escapeHtml(
                                            t(
                                                "orderNumberShort",
                                                "订单号"
                                            )
                                        )}：

                                        ${escapeHtml(
                                            orderNumber
                                        )}

                                    </div>

                                    `
                                    :
                                    ""
                                }

                            </div>


                            <div class="rating">

                                ${createStars(
                                    rating
                                )}

                                <span class="rating-number">

                                    ${rating.toFixed(1)}

                                </span>

                            </div>

                        </div>


                        <div class="review-content">

                            ${escapeHtml(
                                comment
                            )}

                        </div>


                        <div class="review-time">

                            ${escapeHtml(
                                formatTime(
                                    createdAt
                                )
                            )}

                        </div>

                    </div>

                `;

            }
        ).join("");

}


/* =========================
   加载评价
========================= */

function loadReviews(
    user
){

    const content =
        document.getElementById(
            "content"
        );


    if(
        !content ||
        !user
    ){

        return;

    }


    content.innerHTML = `

        <div class="loading">

            ${escapeHtml(
                t(
                    "reviewLoading",
                    "正在加载评价..."
                )
            )}

        </div>

    `;


    /*
       不使用 orderBy。

       避免 Firestore 因索引问题报错。
       查询后在前端按照时间排序。
    */

    db.collection("reviews")

        .where(
            "customerId",
            "==",
            user.uid
        )

        .get()

        .then(
            function(snapshot){

                const reviews = [];


                snapshot.forEach(
                    function(doc){

                        const data =
                            doc.data() || {};


                        reviews.push({

                            ...data,

                            _docId:
                                doc.id

                        });

                    }
                );


                /* =========================
                   最新评价排前面
                ========================= */

                reviews.sort(
                    function(a,b){

                        return (
                            getReviewTime(b) -
                            getReviewTime(a)
                        );

                    }
                );


                currentReviews =
                    reviews;


                renderReviews(
                    currentReviews
                );

            }
        )

        .catch(
            function(error){

                console.error(
                    "加载评价失败：",
                    error
                );


                currentReviews =
                    [];


                document.getElementById(
                    "reviewCount"
                ).textContent =
                    "0";


                content.innerHTML = `

                    <div class="error">

                        <div
                            style="
                                font-size:40px;
                                margin-bottom:10px;
                            "
                        >
                            ⚠️
                        </div>


                        <div>

                            ${escapeHtml(
                                t(
                                    "reviewLoadFailed",
                                    "评价加载失败"
                                )
                            )}

                        </div>


                        <div
                            style="
                                font-size:12px;
                                margin-top:8px;
                            "
                        >

                            ${escapeHtml(
                                t(
                                    "retry",
                                    "请刷新页面后重试"
                                )
                            )}

                        </div>

                    </div>

                `;

            }
        );

}


/* =========================
   登录状态页面
========================= */

function showLoginState(){

    const count =
        document.getElementById(
            "reviewCount"
        );


    const content =
        document.getElementById(
            "content"
        );


    if(count){

        count.textContent =
            "0";

    }


    if(!content){

        return;

    }


    content.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                👤
            </div>


            <div class="empty-title">

                ${escapeHtml(
                    t(
                        "loginToView",
                        "请先登录"
                    )
                )}

            </div>


            <div class="empty-desc">

                ${escapeHtml(
                    t(
                        "loginToViewDesc",
                        "登录后才能查看我的评价"
                    )
                )}

            </div>


            <button
                class="login-button"
                onclick="location.href='login.html'"
            >

                ${escapeHtml(
                    t(
                        "goLogin",
                        "去登录"
                    )
                )}

            </button>

        </div>

    `;

}


/* =========================
   更新静态页面语言
========================= */

function updatePageLanguage(){

    const language =
        window.MDYLanguage &&
        typeof window.MDYLanguage.getLanguage ===
        "function"

            ? window.MDYLanguage.getLanguage()

            : "zh";


    /* =========================
       HTML lang
    ========================= */

    document.documentElement.lang =

        language === "my"

            ? "my"

            : language === "en"

            ? "en"

            : "zh-CN";


    /* =========================
       页面标题
    ========================= */

    document.title =
        "MDY FOOD - " +
        t(
            "myReviews",
            "我的评价"
        );


    /* =========================
       顶部标题
    ========================= */

    const pageTitle =
        document.getElementById(
            "pageTitle"
        );


    if(pageTitle){

        pageTitle.textContent =
            t(
                "myReviews",
                "我的评价"
            );

    }


    /* =========================
       Summary 标题
    ========================= */

    const summaryTitle =
        document.getElementById(
            "summaryTitle"
        );


    if(summaryTitle){

        summaryTitle.textContent =
            t(
                "myReviews",
                "我的评价"
            );

    }


    /* =========================
       Summary 描述
    ========================= */

    const summaryDesc =
        document.getElementById(
            "summaryDesc"
        );


    if(summaryDesc){

        summaryDesc.textContent =
            t(
                "myReviewsDesc",
                "查看你提交过的餐厅评价"
            );

    }


    /* =========================
       底部导航
    ========================= */

    const navHome =
        document.getElementById(
            "navHome"
        );


    if(navHome){

        navHome.textContent =
            t(
                "home",
                "首页"
            );

    }


    const navOrders =
        document.getElementById(
            "navOrders"
        );


    if(navOrders){

        navOrders.textContent =
            t(
                "orders",
                "订单"
            );

    }


    const navProfile =
        document.getElementById(
            "navProfile"
        );


    if(navProfile){

        navProfile.textContent =
            t(
                "profile",
                "我的"
            );

    }


    /* =========================
       当前评价重新渲染
       不重新请求 Firestore
    ========================= */

    if(
        currentUser
    ){

        renderReviews(
            currentReviews
        );

    }

}


/* =========================
   语言切换监听
========================= */

window.addEventListener(
    "mdyLanguageChanged",
    function(){

        updatePageLanguage();

    }
);


/* =========================
   Firebase 登录状态
========================= */

auth.onAuthStateChanged(
    function(user){

        if(!user){

            currentUser =
                null;

            currentReviews =
                [];

            showLoginState();

            return;

        }


        currentUser =
            user;


        loadReviews(
            user
        );

    }
);


/* =========================
   初始页面语言
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        updatePageLanguage();

    }
);

</script>
