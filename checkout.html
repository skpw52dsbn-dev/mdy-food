</div>

<script>


// ========================================
// Firebase
// ========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.firestore();


const auth =
    firebase.auth();



// ========================================
// 当前登录顾客
// ========================================

let currentUser =
    null;



// ========================================
// 获取购物车
// ========================================

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];



// ========================================
// 餐厅
// ========================================

let restaurantId =
    null;


let restaurantName =
    "未知餐厅";


if (cart.length > 0) {

    restaurantId =
        cart[0].restaurantId ||
        null;

}



// ========================================
// 读取餐厅
// ========================================

async function loadRestaurant() {

    const nameElement =
        document.getElementById(
            "restaurantName"
        );


    if (!restaurantId) {

        nameElement.innerText =
            "⚠️ 无法识别餐厅";

        return;

    }


    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();


        if (doc.exists) {

            const data =
                doc.data();


            restaurantName =
                data.name ||
                "未知餐厅";


            nameElement.innerText =
                "🏪 " +
                restaurantName;

        }

        else {

            nameElement.innerText =
                "⚠️ 餐厅不存在";

        }


    }

    catch (error) {

        console.error(error);


        nameElement.innerText =
            "⚠️ 餐厅信息加载失败";

    }

}



// ========================================
// 显示订单
// ========================================

function showOrder() {

    const container =
        document.getElementById(
            "orderItems"
        );


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty">

                🛒

                <br><br>

                购物车是空的

            </div>

        `;

        return;

    }


    let subtotal = 0;


    container.innerHTML = "";


    cart.forEach(
        function(item) {

            const price =
                Number(item.price) || 0;


            const quantity =
                Number(item.quantity) || 0;


            const itemTotal =
                price * quantity;


            subtotal +=
                itemTotal;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "item";


            div.innerHTML = `

                <span>

                    ${item.name}

                    × ${quantity}

                </span>


                <span>

                    ${itemTotal
                        .toLocaleString()}
                    Ks

                </span>

            `;


            container.appendChild(
                div
            );

        }
    );


    document.getElementById(
        "subtotal"
    ).innerText =
        subtotal.toLocaleString() +
        " Ks";


    document.getElementById(
        "total"
    ).innerText =
        (
            subtotal + 2000
        ).toLocaleString() +
        " Ks";

}



// ========================================
// 自动读取顾客资料
// ========================================

async function loadCustomerProfile(
    user
) {

    if (!user) {

        return;

    }


    try {

        const doc =
            await db
                .collection("customers")
                .doc(user.uid)
                .get();


        if (!doc.exists) {

            return;

        }


        const customer =
            doc.data();


        document.getElementById(
            "name"
        ).value =
            customer.name ||
            "";


        document.getElementById(
            "phone"
        ).value =
            customer.phone ||
            "";


        document.getElementById(
            "address"
        ).value =
            customer.address ||
            "";

    }

    catch (error) {

        console.error(
            "读取顾客资料失败:",
            error
        );

    }

}



// ========================================
// 登录状态
// ========================================

auth.onAuthStateChanged(
    async function(user) {

        currentUser =
            user;


        const warning =
            document.getElementById(
                "loginWarning"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        if (user) {

            // 已登录

            warning.style.display =
                "none";


            submitButton.disabled =
                false;


            await loadCustomerProfile(
                user
            );

        }

        else {

            // 未登录

            warning.style.display =
                "block";


            submitButton.disabled =
                false;

        }

    }
);



// ========================================
// 提交订单
// ========================================

async function submitOrder() {


    // ========================================
    // 检查登录
    // ========================================

    if (!currentUser) {

        alert(
            "请先登录账号，再提交订单。"
        );


        window.location.href =
            "login.html";


        return;

    }


    if (cart.length === 0) {

        alert(
            "购物车是空的"
        );

        return;

    }


    if (!restaurantId) {

        alert(
            "无法识别餐厅，请返回菜单重新加入菜品。"
        );

        return;

    }


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const phone =
        document
            .getElementById("phone")
            .value
            .trim();


    const address =
        document
            .getElementById("address")
            .value
            .trim();


    const paymentElement =
        document.querySelector(
            'input[name="payment"]:checked'
        );


    const payment =
        paymentElement
            ? paymentElement.value
            : "现金";


    if (!name) {

        alert(
            "请输入姓名"
        );

        return;

    }


    if (!phone) {

        alert(
            "请输入电话号码"
        );

        return;

    }


    if (!address) {

        alert(
            "请输入配送地址"
        );

        return;

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        true;


    submitButton.innerText =
        "正在提交订单...";



    // ========================================
    // 计算金额
    // ========================================

    const subtotal =
        cart.reduce(
            function(sum, item) {

                return sum +
                    (
                        Number(item.price) || 0
                    ) *
                    (
                        Number(item.quantity) || 0
                    );

            },
            0
        );


    const total =
        subtotal + 2000;



    // ========================================
    // 订单号
    // ========================================

    const orderNumber =
        "MDY" +
        Date.now();



    try {


        // ========================================
        // 保存到 Firebase
        // ========================================

        await db
            .collection("orders")
            .add({

                order_number:
                    orderNumber,


                restaurantId:
                    restaurantId,


                restaurantName:
                    restaurantName,


                // ⭐ Firebase 登录账号 UID

                customerId:
                    currentUser.uid,


                // ⭐ 顾客账号邮箱

                customerEmail:
                    currentUser.email ||
                    "",


                customername:
                    name,


                phone:
                    phone,


                adress:
                    address,


                total:
                    total,


                status:
                    "待接单",


                payment:
                    payment,


                method:
                    "网站",


                items:
                    cart,


                created_at:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });



        // ========================================
        // 本地保存
        // ========================================

        const order = {

            orderNumber:
                orderNumber,


            restaurantId:
                restaurantId,


            restaurantName:
                restaurantName,


            customerId:
                currentUser.uid,


            customerEmail:
                currentUser.email ||
                "",


            name:
                name,


            phone:
                phone,


            address:
                address,


            payment:
                payment,


            items:
                cart,


            total:
                total,


            status:
                "待接单",


            createdAt:
                new Date()
                    .toLocaleString()

        };


        let orders =
            JSON.parse(
                localStorage.getItem(
                    "orders"
                )
            ) || [];


        orders.push(
            order
        );


        localStorage.setItem(
            "orders",
            JSON.stringify(
                orders
            )
        );


        localStorage.setItem(
            "lastOrder",
            JSON.stringify(
                order
            )
        );



        // ========================================
        // 清空购物车
        // ========================================

        localStorage.removeItem(
            "cart"
        );



        // ========================================
        // 成功
        // ========================================

        window.location.href =
            "success.html";


    }

    catch (error) {

        console.error(
            "Firebase 订单错误:",
            error
        );


        alert(
            "订单提交失败：\n" +
            error.message
        );


        submitButton.disabled =
            false;


        submitButton.innerText =
            "提交订单";

    }

}



// ========================================
// 页面启动
// ========================================

showOrder();

loadRestaurant();

</script>

</body>
