<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>确认订单 - MDY FOOD</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ff5a1f;
            color: white;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
        }

        .restaurant-name {
            color: #ff5a1f;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .summary {
            line-height: 2;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .payment {
            margin-bottom: 15px;
        }

        .payment label {
            display: block;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #ff5a1f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

    </style>

</head>

<body>

<header>
    🛒 确认订单
</header>

<div class="container">

    <div class="box">

        <h2>🍜 订单内容</h2>

        <div id="restaurantName" class="restaurant-name">
            正在确认餐厅...
        </div>

        <div id="orderItems"></div>

        <div class="summary">

            <div>
                小计：
                <span id="subtotal">0 Ks</span>
            </div>

            <div>
                配送费：
                <span>2,000 Ks</span>
            </div>

        </div>

        <div class="total">

            <span>总计</span>

            <span id="total">
                2,000 Ks
            </span>

        </div>

    </div>


    <div class="box">

        <h2>📍 配送信息</h2>

        <label>姓名</label>

        <input
            id="name"
            type="text"
            placeholder="请输入姓名"
        >

        <label>电话</label>

        <input
            id="phone"
            type="tel"
            placeholder="请输入电话号码"
        >

        <label>地址</label>

        <textarea
            id="address"
            placeholder="请输入详细配送地址"
        ></textarea>

    </div>


    <div class="box">

        <h2>💳 付款方式</h2>

        <div class="payment">

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="现金"
                    checked
                >
                💵 现金
            </label>

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="KBZPay"
                >
                📱 KBZPay
            </label>

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="Wave Money"
                >
                📱 Wave Money
            </label>

        </div>

        <button id="submitButton" onclick="submitOrder()">
            提交订单
        </button>

    </div>

</div>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain: "mdy-food.firebaseapp.com",

    projectId: "mdy-food",

    storageBucket: "mdy-food.firebasestorage.app",

    messagingSenderId: "498327590625",

    appId: "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId: "G-6Q5G2862XQ"

};


firebase.initializeApp(firebaseConfig);


const db = firebase.firestore();


/* =========================
   获取购物车
========================= */

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


/* =========================
   获取餐厅 ID
========================= */

let restaurantId = null;

let restaurantName = "未知餐厅";


/*
   从购物车里的菜品获取餐厅 ID
*/

if (cart.length > 0) {

    restaurantId =
        cart[0].restaurantId || null;

}


/* =========================
   获取餐厅名称
========================= */

async function loadRestaurant() {

    const nameElement =
        document.getElementById("restaurantName");


    if (!restaurantId) {

        nameElement.innerText =
            "⚠️ 无法识别餐厅";

        return;

    }


    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();


        if (doc.exists) {

            const data =
                doc.data();


            restaurantName =
                data.name || "未知餐厅";


            nameElement.innerText =
                "🏪 " + restaurantName;

        } else {

            nameElement.innerText =
                "⚠️ 餐厅不存在";

        }

    } catch (error) {

        console.error(error);

        nameElement.innerText =
            "⚠️ 餐厅信息加载失败";

    }

}


/* =========================
   显示订单
========================= */

function showOrder() {

    const container =
        document.getElementById("orderItems");


    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty">
                购物车是空的
            </div>
        `;

        return;

    }


    let subtotal = 0;


    container.innerHTML = "";


    cart.forEach(function(item) {

        subtotal +=
            Number(item.price) *
            Number(item.quantity);


        const div =
            document.createElement("div");


        div.className =
            "item";


        div.innerHTML = `

            <span>
                ${item.name} × ${item.quantity}
            </span>

            <span>
                ${(Number(item.price) *
                  Number(item.quantity))
                  .toLocaleString()} Ks
            </span>

        `;


        container.appendChild(div);

    });


    document.getElementById("subtotal")
        .innerText =
        subtotal.toLocaleString() + " Ks";


    document.getElementById("total")
        .innerText =
        (subtotal + 2000)
        .toLocaleString() + " Ks";

}


/* =========================
   提交订单
========================= */

async function submitOrder() {

    if (cart.length === 0) {

        alert("购物车是空的");

        return;

    }


    if (!restaurantId) {

        alert(
            "无法识别餐厅，请返回菜单重新加入菜品。"
        );

        return;

    }


    const name =
        document.getElementById("name")
        .value.trim();


    const phone =
        document.getElementById("phone")
        .value.trim();


    const address =
        document.getElementById("address")
        .value.trim();


    const paymentElement =
        document.querySelector(
            'input[name="payment"]:checked'
        );


    const payment =
        paymentElement
        ? paymentElement.value
        : "现金";


    if (!name) {

        alert("请输入姓名");

        return;

    }


    if (!phone) {

        alert("请输入电话号码");

        return;

    }


    if (!address) {

        alert("请输入配送地址");

        return;

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled = true;


    submitButton.innerText =
        "正在提交订单...";


    /* =========================
       计算金额
    ========================= */

    const subtotal =
        cart.reduce(
            function(sum, item) {

                return sum +
                    Number(item.price) *
                    Number(item.quantity);

            },
            0
        );


    const total =
        subtotal + 2000;


    /* 订单号 */

    const orderNumber =
        "MDY" + Date.now();


    try {

        /* =========================
           写入 Firebase
        ========================= */

        await db
            .collection("orders")
            .add({

                order_number:
                    orderNumber,

                /* ⭐ 新增：餐厅 ID */

                restaurantId:
                    restaurantId,

                /* ⭐ 新增：餐厅名称 */

                restaurantName:
                    restaurantName,

                customername:
                    name,

                phone:
                    phone,

                adress:
                    address,

                total:
                    total,

                status:
                    "待接单",

                payment:
                    payment,

                method:
                    "网站",

                items:
                    cart,

                created_at:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });


        /* =========================
           本地保存
        ========================= */

        const order = {

            orderNumber:
                orderNumber,

            restaurantId:
                restaurantId,

            restaurantName:
                restaurantName,

            name:
                name,

            phone:
                phone,

            address:
                address,

            payment:
                payment,

            items:
                cart,

            total:
                total,

            status:
                "待接单",

            createdAt:
                new Date()
                .toLocaleString()

        };


        let orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];


        orders.push(order);


        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );


        localStorage.setItem(
            "lastOrder",
            JSON.stringify(order)
        );


        /* 清空购物车 */

        localStorage.removeItem("cart");


        /* 成功 */

        window.location.href =
            "success.html";


    } catch (error) {

        console.error(
            "Firebase 订单错误:",
            error
        );


        alert(
            "订单提交失败：\n" +
            error.message
        );


        submitButton.disabled =
            false;


        submitButton.innerText =
            "提交订单";

    }

}


/* =========================
   页面启动
========================= */

showOrder();

loadRestaurant();

</script>

</body>

</html>
