<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>确认订单 - MDY FOOD</title>


    <!-- ========================================
         Firebase
    ========================================= -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


    <!-- ========================================
         MDY FOOD 全站语言系统
    ========================================= -->

    <script src="language.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            background: #f5f5f5;

            color: #333;

        }


        header {

            background: #ff5a1f;

            color: white;

            padding: 16px 20px;

            font-weight: bold;

        }


        /* ========================================
           返回购物车
        ========================================= */

        .back-button {

            display: inline-block;

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: normal;

            margin-bottom: 10px;

            opacity: 0.95;

        }


        .back-button:hover {

            opacity: 0.8;

        }


        .header-title {

            font-size: 20px;

            font-weight: bold;

        }


        .container {

            max-width: 700px;

            margin: 25px auto;

            padding: 0 20px;

        }


        .box {

            background: white;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.05);

        }


        h2 {

            margin-top: 0;

        }


        .restaurant-name {

            color: #ff5a1f;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .login-warning {

            background: #fff4ef;

            border:
                1px solid #ffcfbf;

            color: #d94a20;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 20px;

            line-height: 1.7;

        }


        .login-warning a {

            display: inline-block;

            margin-top: 8px;

            color: #ff5a1f;

            font-weight: bold;

            text-decoration: none;

        }


        .item {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            padding: 12px 0;

            border-bottom:
                1px solid #eee;

        }


        .summary {

            line-height: 2;

            margin-top: 12px;

        }


        .total {

            display: flex;

            justify-content: space-between;

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

            padding-top: 15px;

            border-top:
                1px solid #eee;

            color: #ff5a1f;

        }


        label {

            display: block;

            font-weight: bold;

            margin-top: 8px;

        }


        input,
        textarea {

            width: 100%;

            padding: 13px;

            margin-top: 8px;

            margin-bottom: 15px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

        }


        input:focus,
        textarea:focus {

            border-color: #ff5a1f;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        .payment {

            margin-bottom: 15px;

        }


        .payment label {

            display: block;

            padding: 12px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            margin-bottom: 8px;

            cursor: pointer;

            font-weight: normal;

        }


        .payment input {

            width: auto;

            margin: 0 8px 0 0;

        }


        button {

            width: 100%;

            padding: 15px;

            background: #ff5a1f;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            cursor: pointer;

        }


        button:disabled {

            background: #aaa;

            cursor: not-allowed;

        }


        .empty {

            text-align: center;

            padding: 50px 20px;

        }


        @media (max-width: 600px) {

            .container {

                padding: 0 12px;

                margin-top: 15px;

            }


            .box {

                padding: 16px;

            }


            header {

                padding: 15px 16px;

            }


            .header-title {

                font-size: 19px;

            }

        }

    </style>

</head>


<body>


<header>


    <!-- ========================================
         返回购物车
    ========================================= -->

    <a
        href="cart.html"
        class="back-button"
        id="backToCartButton"
    >
        ← <span id="backToCartText">返回购物车</span>
    </a>


    <!-- ========================================
         页面标题
    ========================================= -->

    <div class="header-title">

        🛒

        <span data-i18n="checkoutTitle">
            确认订单
        </span>

    </div>


</header>


<div class="container">


    <!-- ========================================
         登录提醒
    ========================================= -->

    <div
        id="loginWarning"
        class="login-warning"
        style="display:none;"
    >

        <span data-i18n="notLoggedIn">
            ⚠️ 你还没有登录。
        </span>


        <br>


        <span data-i18n="loginRequiredDesc">
            登录后才能提交订单，并且你的订单会自动保存到你的账号。
        </span>


        <br>


        <a href="login.html">

            👉

            <span data-i18n="goLogin">
                去登录 / 注册
            </span>

        </a>

    </div>



    <!-- ========================================
         订单内容
    ========================================= -->

    <div class="box">


        <h2>

            🍜

            <span data-i18n="orderContent">
                订单内容
            </span>

        </h2>


        <div
            id="restaurantName"
            class="restaurant-name"
        >
            正在确认餐厅...
        </div>


        <div id="orderItems"></div>


        <div class="summary">


            <div>

                <span data-i18n="subtotal">
                    小计
                </span>

                ：

                <span id="subtotal">
                    0 Ks
                </span>

            </div>


            <div>

                <span data-i18n="deliveryFee">
                    配送费
                </span>

                ：

                <span id="deliveryFee">
                    2,000 Ks
                </span>

            </div>


        </div>


        <div class="total">

            <span data-i18n="total">
                总计
            </span>


            <span id="total">
                2,000 Ks
            </span>

        </div>

    </div>



    <!-- ========================================
         配送信息
    ========================================= -->

    <div class="box">


        <h2>

            📍

            <span data-i18n="deliveryInfo">
                配送信息
            </span>

        </h2>


        <label data-i18n="name">
            姓名
        </label>


        <input
            id="name"
            type="text"
            data-i18n-placeholder="namePlaceholder"
            placeholder="请输入姓名"
        >


        <label data-i18n="phone">
            电话
        </label>


        <input
            id="phone"
            type="tel"
            data-i18n-placeholder="phonePlaceholder"
            placeholder="请输入电话号码"
        >


        <label data-i18n="address">
            地址
        </label>


        <textarea
            id="address"
            data-i18n-placeholder="addressPlaceholder"
            placeholder="请输入详细配送地址"
        ></textarea>

    </div>



    <!-- ========================================
         付款方式
    ========================================= -->

    <div class="box">


        <h2>

            💳

            <span data-i18n="paymentMethod">
                付款方式
            </span>

        </h2>


        <div class="payment">


            <label>

                <input
                    type="radio"
                    name="payment"
                    value="现金"
                    checked
                >

                💵

                <span data-i18n="cash">
                    现金
                </span>

            </label>


            <label>

                <input
                    type="radio"
                    name="payment"
                    value="KBZPay"
                >

                📱

                <span data-i18n="kbzPay">
                    KBZPay
                </span>

            </label>


            <label>

                <input
                    type="radio"
                    name="payment"
                    value="Wave Money"
                >

                📱

                <span data-i18n="waveMoney">
                    Wave Money
                </span>

            </label>


        </div>


        <button
            id="submitButton"
            onclick="submitOrder()"
            data-i18n="placeOrder"
        >
            提交订单
        </button>

    </div>


</div>



<script>


    // ========================================
    // Firebase
    // ========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

        authDomain:
            "mdy-food.firebaseapp.com",

        projectId:
            "mdy-food",

        storageBucket:
            "mdy-food.firebasestorage.app",

        messagingSenderId:
            "498327590625",

        appId:
            "1:498327590625:web:cceafb7febb689e7ad09a0",

        measurementId:
            "G-6Q5G2862XQ"

    };


    if (!firebase.apps.length) {

        firebase.initializeApp(
            firebaseConfig
        );

    }


    const db =
        firebase.firestore();


    const auth =
        firebase.auth();



    // ========================================
    // 语言
    // ========================================

    function t(key, fallback) {

        if (
            window.MDYLanguage &&
            typeof MDYLanguage.t === "function"
        ) {

            const result =
                MDYLanguage.t(
                    key,
                    {},
                    fallback
                );


            if (
                result &&
                result !== key
            ) {

                return result;

            }

        }


        return fallback || key;

    }



    // ========================================
    // 更新页面语言
    // ========================================

    function updateCheckoutLanguage() {


        if (
            window.MDYLanguage &&
            typeof MDYLanguage.apply === "function"
        ) {

            MDYLanguage.apply(
                MDYLanguage.getLanguage()
            );

        }


        /*
         * 返回购物车使用现有共享 back
         * 翻译键，不另外创建语言系统。
         */

        const backText =
            document.getElementById(
                "backToCartText"
            );


        if (backText) {

            backText.innerText =
                t(
                    "back",
                    "返回购物车"
                );

        }


        document.title =
            t(
                "checkoutTitle",
                "确认订单 - MDY FOOD"
            );


        showOrder();


        loadRestaurant();


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        if (
            submitButton &&
            !submitButton.disabled
        ) {

            submitButton.innerText =
                t(
                    "placeOrder",
                    "提交订单"
                );

        }

    }



    // ========================================
    // 当前登录顾客
    // ========================================

    let currentUser =
        null;



    // ========================================
    // 获取购物车
    // ========================================

    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];



    // ========================================
    // 餐厅
    // ========================================

    let restaurantId =
        null;


    let restaurantName =
        "未知餐厅";


    if (cart.length > 0) {

        restaurantId =
            cart[0].restaurantId ||
            null;

    }



    // ========================================
    // 读取餐厅
    // ========================================

    async function loadRestaurant() {

        const nameElement =
            document.getElementById(
                "restaurantName"
            );


        if (!restaurantId) {

            nameElement.innerText =
                "⚠️ " +
                t(
                    "cannotIdentifyRestaurant",
                    "无法识别餐厅"
                );

            return;

        }


        try {

            const doc =
                await db
                    .collection("restaurants")
                    .doc(restaurantId)
                    .get();


            if (doc.exists) {

                const data =
                    doc.data();


                restaurantName =
                    data.name ||
                    t(
                        "unknownRestaurant",
                        "未知餐厅"
                    );


                nameElement.innerText =
                    "🏪 " +
                    restaurantName;

            }

            else {

                nameElement.innerText =
                    "⚠️ " +
                    t(
                        "restaurantDoesNotExist",
                        "餐厅不存在"
                    );

            }


        }

        catch (error) {

            console.error(error);


            nameElement.innerText =
                "⚠️ " +
                t(
                    "restaurantLoadError",
                    "餐厅信息加载失败"
                );

        }

    }



    // ========================================
    // 显示订单
    // ========================================

    function showOrder() {

        const container =
            document.getElementById(
                "orderItems"
            );


        if (cart.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    🛒

                    <br><br>

                    ${t(
                        "emptyCartCheckout",
                        "购物车是空的"
                    )}

                </div>

            `;


            document.getElementById(
                "subtotal"
            ).innerText =
                "0 Ks";


            document.getElementById(
                "deliveryFee"
            ).innerText =
                "2,000 Ks";


            document.getElementById(
                "total"
            ).innerText =
                "2,000 Ks";


            return;

        }


        let subtotal = 0;


        container.innerHTML = "";


        cart.forEach(
            function(item) {

                const price =
                    Number(item.price) || 0;


                const quantity =
                    Number(item.quantity) || 0;


                const itemTotal =
                    price * quantity;


                subtotal +=
                    itemTotal;


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "item";


                div.innerHTML = `

                    <span>

                        ${item.name}

                        × ${quantity}

                    </span>


                    <span>

                        ${itemTotal
                            .toLocaleString()}
                        Ks

                    </span>

                `;


                container.appendChild(
                    div
                );

            }
        );


        document.getElementById(
            "subtotal"
        ).innerText =
            subtotal.toLocaleString() +
            " Ks";


        document.getElementById(
            "deliveryFee"
        ).innerText =
            "2,000 Ks";


        document.getElementById(
            "total"
        ).innerText =
            (
                subtotal + 2000
            ).toLocaleString() +
            " Ks";

    }



    // ========================================
    // 自动读取顾客资料
    // ========================================

    async function loadCustomerProfile(
        user
    ) {

        if (!user) {

            return;

        }


        try {

            const doc =
                await db
                    .collection("customers")
                    .doc(user.uid)
                    .get();


            if (!doc.exists) {

                return;

            }


            const customer =
                doc.data();


            document.getElementById(
                "name"
            ).value =
                customer.name ||
                "";


            document.getElementById(
                "phone"
            ).value =
                customer.phone ||
                "";


            document.getElementById(
                "address"
            ).value =
                customer.address ||
                "";

        }

        catch (error) {

            console.error(
                "读取顾客资料失败:",
                error
            );

        }

    }



    // ========================================
    // 登录状态
    // ========================================

    auth.onAuthStateChanged(
        async function(user) {

            currentUser =
                user;


            const warning =
                document.getElementById(
                    "loginWarning"
                );


            const submitButton =
                document.getElementById(
                    "submitButton"
                );


            if (user) {

                warning.style.display =
                    "none";


                submitButton.disabled =
                    false;


                await loadCustomerProfile(
                    user
                );

            }

            else {

                warning.style.display =
                    "block";


                submitButton.disabled =
                    false;

            }

        }
    );



    // ========================================
    // 提交订单
    // ========================================

    async function submitOrder() {


        // ========================================
        // 检查登录
        // ========================================

        if (!currentUser) {

            alert(
                t(
                    "pleaseLoginBeforeOrder",
                    "请先登录账号，再提交订单。"
                )
            );


            window.location.href =
                "login.html";


            return;

        }


        if (cart.length === 0) {

            alert(
                t(
                    "emptyCartCheckout",
                    "购物车是空的"
                )
            );


            return;

        }


        if (!restaurantId) {

            alert(
                t(
                    "restaurantReturnToMenu",
                    "无法识别餐厅，请返回菜单重新加入菜品。"
                )
            );


            return;

        }


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const address =
            document
                .getElementById("address")
                .value
                .trim();


        const paymentElement =
            document.querySelector(
                'input[name="payment"]:checked'
            );


        /*
         * payment 的内部值保持不变。
         */

        const payment =
            paymentElement
                ? paymentElement.value
                : "现金";


        if (!name) {

            alert(
                t(
                    "pleaseEnterName",
                    "请输入姓名"
                )
            );


            return;

        }


        if (!phone) {

            alert(
                t(
                    "pleaseEnterPhone",
                    "请输入电话号码"
                )
            );


            return;

        }


        if (!address) {

            alert(
                t(
                    "pleaseEnterAddress",
                    "请输入配送地址"
                )
            );


            return;

        }


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        submitButton.disabled =
            true;


        submitButton.innerText =
            t(
                "submittingOrder",
                "正在提交订单..."
            );



        // ========================================
        // 计算金额
        // ========================================

        const subtotal =
            cart.reduce(
                function(sum, item) {

                    return sum +
                        (
                            Number(item.price) || 0
                        ) *
                        (
                            Number(item.quantity) || 0
                        );

                },
                0
            );


        const total =
            subtotal + 2000;



        // ========================================
        // 订单号
        // ========================================

        const orderNumber =
            "MDY" +
            Date.now();



        try {


            // ========================================
            // 保存到 Firebase
            // ========================================

            await db
                .collection("orders")
                .add({

                    order_number:
                        orderNumber,


                    restaurantId:
                        restaurantId,


                    restaurantName:
                        restaurantName,


                    customerId:
                        currentUser.uid,


                    customerEmail:
                        currentUser.email ||
                        "",


                    customername:
                        name,


                    phone:
                        phone,


                    adress:
                        address,


                    total:
                        total,


                    status:
                        "待接单",


                    payment:
                        payment,


                    method:
                        "网站",


                    items:
                        cart,


                    created_at:
                        firebase.firestore
                            .FieldValue
                            .serverTimestamp()

                });



            // ========================================
            // 本地保存
            // ========================================

            const order = {

                orderNumber:
                    orderNumber,


                restaurantId:
                    restaurantId,


                restaurantName:
                    restaurantName,


                customerId:
                    currentUser.uid,


                customerEmail:
                    currentUser.email ||
                    "",


                name:
                    name,


                phone:
                    phone,


                address:
                    address,


                payment:
                    payment,


                items:
                    cart,


                total:
                    total,


                status:
                    "待接单",


                createdAt:
                    new Date()
                        .toLocaleString()

            };


            let orders =
                JSON.parse(
                    localStorage.getItem(
                        "orders"
                    )
                ) || [];


            orders.push(
                order
            );


            localStorage.setItem(
                "orders",
                JSON.stringify(
                    orders
                )
            );


            localStorage.setItem(
                "lastOrder",
                JSON.stringify(
                    order
                )
            );



            // ========================================
            // 清空购物车
            // ========================================

            localStorage.removeItem(
                "cart"
            );



            // ========================================
            // 成功
            // ========================================

            window.location.href =
                "success.html";


        }

        catch (error) {

            console.error(
                "Firebase 订单错误:",
                error
            );


            alert(
                t(
                    "orderSubmitFailed",
                    "订单提交失败"
                ) +
                "：\n" +
                error.message
            );


            submitButton.disabled =
                false;


            submitButton.innerText =
                t(
                    "placeOrder",
                    "提交订单"
                );

        }

    }



    // ========================================
    // 监听语言变化
    // ========================================

    window.addEventListener(
        "mdyLanguageChanged",
        function() {

            updateCheckoutLanguage();

        }
    );



    // ========================================
    // 页面启动
    // ========================================

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            updateCheckoutLanguage();

        }
    );

</script>


</body>

</html>
