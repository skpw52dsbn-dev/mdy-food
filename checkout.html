<style>

body {

.payment-option input {

.payment-icon {

.kbz-pay-button {

}

.kbz-pay-button:hover {

}

.kbz-pay-info {
    display: none;

    border: 1px solid #b7ebc6;
    border-radius: 9px;

    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.7;
    color: #276749;
}

.payment-note {
    font-size: 12px;

    line-height: 1.6;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 15px;
    background: #ff5a1f;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {

}

.empty {
    text-align: center;
    padding: 50px 20px;

    line-height: 1.8;
}

.status-box {
    display: none;
    background: #fff8e8;
    border: 1px solid #f3d58a;

}

@media (max-width: 600px) {

    }

    .box {
        padding: 16px;
    }

    header {
        padding: 15px 16px;
    }

    .header-title {
        font-size: 19px;
    }

}

<script>

/* ========================================
   Firebase
======================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};

if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}

const db =
    firebase.firestore();

const auth =
    firebase.auth();


/* ========================================
   语言
======================================== */

function t(key, fallback) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t === "function"
    ) {

        const result =
            window.MDYLanguage.t(
                key,
                {},
                fallback
            );

        if (
            result &&
            result !== key
        ) {

            return result;

        }

    }

    return fallback || key;

}


/* ========================================
   当前用户
======================================== */

let currentUser = null;


/* ========================================
   购物车
======================================== */

let cart = [];

try {

    cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    if (!Array.isArray(cart)) {

        cart = [];

    }

} catch (error) {

    console.error(
        "读取购物车失败:",
        error
    );

    cart = [];

}


/* ========================================
   餐厅
======================================== */

let restaurantId =
    null;

let restaurantName =
    t(
        "unknownRestaurant",
        "未知餐厅"
    );

if (cart.length > 0) {

    restaurantId =
        cart[0].restaurantId ||
        null;

}


/* ========================================
   KBZPay 测试配置
======================================== */

/*
 * 注意：
 * 这里使用的是“尝试唤起 App”的测试方式。
 *
 * 由于 KBZPay 官方没有在公开网页上给出
 * 一个可以直接给普通网页使用的通用
 * web -> app 支付 Deep Link，
 * 所以这里先尝试常见 App Scheme。
 *
 * 如果手机上无法打开 KBZPay，
 * 不代表支付失败，只代表该设备/浏览器
 * 不支持这个 Scheme。
 */

const KBZPAY_SCHEME =
    "kbzpay://";


/* ========================================
   当前付款方式
======================================== */

let selectedPayment =
    "现金";


/* ========================================
   选择付款方式
======================================== */

function selectPayment(payment) {

    selectedPayment =
        payment;

    const options =
        document.querySelectorAll(
            ".payment-option"
        );

    options.forEach(
        function(option) {

            option.classList.remove(
                "selected"
            );

        }
    );

    const radio =
        document.querySelector(
            'input[name="payment"][value="' +
            payment +
            '"]'
        );

    if (radio) {

        radio.checked =
            true;

        const parent =
            radio.closest(
                ".payment-option"
            );

        if (parent) {

            parent.classList.add(
                "selected"
            );

        }

    }


    const kbzButton =
        document.getElementById(
            "kbzPayButton"
        );

    const kbzInfo =
        document.getElementById(
            "kbzPayInfo"
        );

    const paymentStatus =
        document.getElementById(
            "paymentStatus"
        );


    if (payment === "KBZPay") {

        kbzButton.style.display =
            "block";

        kbzInfo.style.display =
            "block";

        paymentStatus.style.display =
            "none";

    }

    else {

        kbzButton.style.display =
            "none";

        kbzInfo.style.display =
            "none";

        paymentStatus.style.display =
            "none";

    }

}


/* ========================================
   打开 KBZPay
======================================== */

function openKBZPay() {

    const paymentStatus =
        document.getElementById(
            "paymentStatus"
        );

    paymentStatus.style.display =
        "block";

    paymentStatus.innerHTML =
        "📱 正在尝试打开 KBZPay App...";

    /*
     * 记录一次尝试。
     *
     * 注意：
     * 这里只代表用户点击了支付，
     * 不能代表 KBZPay 已经付款成功。
     */

    try {

        localStorage.setItem(
            "kbzPayLastAttempt",
            JSON.stringify({

                time:
                    new Date().toISOString(),

                payment:
                    "KBZPay"

            })
        );

    }

    catch (error) {

        console.warn(
            "保存 KBZPay 测试记录失败:",
            error
        );

    }


    /*
     * 尝试打开 KBZPay。
     */

    let opened =
        false;


    const startTime =
        Date.now();


    const handleVisibility =
        function() {

            if (
                document.hidden
            ) {

                opened =
                    true;

                paymentStatus.innerHTML =
                    "📱 已尝试打开 KBZPay。<br>" +
                    "请在 KBZPay 中完成付款，然后返回 MDY FOOD。";

            }

        };


    document.addEventListener(
        "visibilitychange",
        handleVisibility
    );


    window.location.href =
        KBZPAY_SCHEME;


    /*
     * 如果没有离开网页，
     * 说明浏览器可能不支持该 Scheme。
     */

    setTimeout(
        function() {

            document.removeEventListener(
                "visibilitychange",
                handleVisibility
            );


            if (!opened) {

                paymentStatus.innerHTML =
                    "⚠️ 当前浏览器没有成功打开 KBZPay App。<br>" +
                    "请确认手机已经安装 KBZPay，并使用手机浏览器打开 MDY FOOD。";

            }

        },
        1800
    );

}


/* ========================================
   页面语言
======================================== */

function updateCheckoutLanguage() {

    document.title =
        t(
            "checkoutTitle",
            "确认订单 - MDY FOOD"
        );

    showOrder();

    const nameElement =
        document.getElementById(
            "restaurantName"
        );

    if (
        nameElement &&
        !restaurantId
    ) {

        nameElement.innerText =
            "⚠️ " +
            t(
                "cannotIdentifyRestaurant",
                "无法识别餐厅"
            );

    }

    const submitButton =
        document.getElementById(
            "submitButton"
        );

    if (
        submitButton &&
        !submitButton.disabled
    ) {

        submitButton.innerText =
            t(
                "placeOrder",
                "提交订单"
            );

    }

}


/* ========================================
   读取餐厅
======================================== */

async function loadRestaurant() {

    const nameElement =
        document.getElementById(
            "restaurantName"
        );

    if (!nameElement) {

        return;

    }

    if (!restaurantId) {

        nameElement.innerText =
            "⚠️ " +
            t(
                "cannotIdentifyRestaurant",
                "无法识别餐厅"
            );

        return;

    }

    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();

        if (doc.exists) {

            const data =
                doc.data();

            restaurantName =
                data.name ||
                t(
                    "unknownRestaurant",
                    "未知餐厅"
                );

            nameElement.innerText =
                "🏪 " +
                restaurantName;

        }

        else {

            nameElement.innerText =
                "⚠️ " +
                t(
                    "restaurantDoesNotExist",
                    "餐厅不存在"
                );

        }

    }

    catch (error) {

        console.error(
            "读取餐厅失败:",
            error
        );

        nameElement.innerText =
            "⚠️ " +
            t(
                "restaurantLoadError",
                "餐厅信息加载失败"
            );

    }

}


/* ========================================
   显示订单
======================================== */

function showOrder() {

    const container =
        document.getElementById(
            "orderItems"
        );

    if (!container) {

        return;

    }

    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty">

                🛒

                <br><br>

                ${t(
                    "emptyCartCheckout",
                    "购物车是空的"
                )}

            </div>

        `;

        document.getElementById(
            "subtotal"
        ).innerText =
            "0 Ks";

        document.getElementById(
            "deliveryFee"
        ).innerText =
            "2,000 Ks";

        document.getElementById(
            "total"
        ).innerText =
            "2,000 Ks";

        return;

    }

    let subtotal =
        0;

    container.innerHTML =
        "";

    cart.forEach(
        function(item) {

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 0;

            const itemTotal =
                price * quantity;

            subtotal +=
                itemTotal;

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "item";

            div.innerHTML = `

                <span>

                    ${escapeHtml(
                        item.name || ""
                    )}

                    × ${quantity}

                </span>

                <span>

                    ${itemTotal.toLocaleString()}
                    Ks

                </span>

            `;

            container.appendChild(
                div
            );

        }
    );

    document.getElementById(
        "subtotal"
    ).innerText =
        subtotal.toLocaleString() +
        " Ks";

    document.getElementById(
        "deliveryFee"
    ).innerText =
        "2,000 Ks";

    document.getElementById(
        "total"
    ).innerText =
        (
            subtotal + 2000
        ).toLocaleString() +
        " Ks";

}


/* ========================================
   HTML 安全处理
======================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ========================================
   自动读取顾客资料
======================================== */

async function loadCustomerProfile(
    user
) {

    if (!user) {

        return;

    }

    try {

        const doc =
            await db
                .collection("customers")
                .doc(user.uid)
                .get();

        if (!doc.exists) {

            return;

        }

        const customer =
            doc.data();

        document.getElementById(
            "name"
        ).value =
            customer.name ||
            "";

        document.getElementById(
            "phone"
        ).value =
            customer.phone ||
            "";

        document.getElementById(
            "address"
        ).value =
            customer.address ||
            "";

    }

    catch (error) {

        console.error(
            "读取顾客资料失败:",
            error
        );

    }

}


/* ========================================
   登录状态
======================================== */

auth.onAuthStateChanged(
    async function(user) {

        currentUser =
            user;

        const warning =
            document.getElementById(
                "loginWarning"
            );

        const submitButton =
            document.getElementById(
                "submitButton"
            );

        if (user) {

            warning.style.display =
                "none";

            submitButton.disabled =
                false;

            submitButton.innerText =
                t(
                    "placeOrder",
                    "提交订单"
                );

            await loadCustomerProfile(
                user
            );

        }

        else {

            warning.style.display =
                "block";

            submitButton.disabled =
                false;

            submitButton.innerText =
                t(
                    "placeOrder",
                    "提交订单"
                );

        }

    }
);


/* ========================================
   提交订单
======================================== */

async function submitOrder() {

    if (!currentUser) {

        alert(
            t(
                "pleaseLoginBeforeOrder",
                "请先登录账号，再提交订单。"
            )
        );

        window.location.href =
            "login.html";

        return;

    }

    if (cart.length === 0) {

        alert(
            t(
                "emptyCartCheckout",
                "购物车是空的"
            )
        );

        return;

    }

    if (!restaurantId) {

        alert(
            t(
                "restaurantReturnToMenu",
                "无法识别餐厅，请返回菜单重新加入菜品。"
            )
        );

        return;

    }

    const name =
        document
            .getElementById("name")
            .value
            .trim();

    const phone =
        document
            .getElementById("phone")
            .value
            .trim();

    const address =
        document
            .getElementById("address")
            .value
            .trim();

    const paymentElement =
        document.querySelector(
            'input[name="payment"]:checked'
        );

    const payment =
        paymentElement
            ? paymentElement.value
            : "现金";

    selectedPayment =
        payment;

    if (!name) {

        alert(
            t(
                "pleaseEnterName",
                "请输入姓名"
            )
        );

        return;

    }

    if (!phone) {

        alert(
            t(
                "pleaseEnterPhone",
                "请输入电话号码"
            )
        );

        return;

    }

    if (!address) {

        alert(
            t(
                "pleaseEnterAddress",
                "请输入配送地址"
            )
        );

        return;

    }


    /*
     * 如果选择 KBZPay：
     *
     * 目前先进行 App 跳转测试。
     *
     * 不把“点击按钮”当成支付成功。
     */

    if (
        payment === "KBZPay"
    ) {

        const continueOrder =
            confirm(
                "你选择了 KBZPay。\n\n" +
                "请先点击“打开 KBZPay 支付”尝试打开 App。\n\n" +
                "目前这是支付跳转测试版，尚未接入 KBZPay 官方支付成功回调。\n\n" +
                "是否继续创建订单？"
            );

        if (!continueOrder) {

            return;

        }

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );

    submitButton.disabled =
        true;

    submitButton.innerText =
        t(
            "submittingOrder",
            "正在提交订单..."
        );


    const subtotal =
        cart.reduce(
            function(sum, item) {

                return sum +

                    (
                        Number(item.price) || 0
                    ) *

                    (
                        Number(item.quantity) || 0
                    );

            },
            0
        );

    const total =
        subtotal + 2000;


    const orderNumber =
        "MDY" +
        Date.now();


    /*
     * 当前测试版支付状态
     */

    let paymentStatus =
        "unpaid";

    if (
        payment === "现金"
    ) {

        paymentStatus =
            "cash_on_delivery";

    }

    else if (
        payment === "KBZPay"
    ) {

        paymentStatus =
            "pending";

    }

    else if (
        payment === "Wave Money"
    ) {

        paymentStatus =
            "pending";

    }


    try {

        await db
            .collection("orders")
            .add({

                order_number:
                    orderNumber,

                restaurantId:
                    restaurantId,

                restaurantName:
                    restaurantName,

                customerId:
                    currentUser.uid,

                customerEmail:
                    currentUser.email ||
                    "",

                customername:
                    name,

                phone:
                    phone,

                adress:
                    address,

                total:
                    total,

                status:
                    "待接单",

                payment:
                    payment,

                paymentStatus:
                    paymentStatus,

                method:
                    "网站",

                items:
                    cart,

                created_at:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        /*
         * 本地订单记录
         */

        const order = {

            orderNumber:
                orderNumber,

            restaurantId:
                restaurantId,

            restaurantName:
                restaurantName,

            customerId:
                currentUser.uid,

            customerEmail:
                currentUser.email ||
                "",

            name:
                name,

            phone:
                phone,

            address:
                address,

            payment:
                payment,

            paymentStatus:
                paymentStatus,

            items:
                cart,

            total:
                total,

            status:
                "待接单",

            createdAt:
                new Date()
                    .toLocaleString()

        };


        let orders = [];

        try {

            orders =
                JSON.parse(
                    localStorage.getItem(
                        "orders"
                    )
                ) || [];

            if (!Array.isArray(orders)) {

                orders = [];

            }

        }

        catch (error) {

            orders = [];

        }


        orders.push(
            order
        );


        localStorage.setItem(
            "orders",
            JSON.stringify(
                orders
            )
        );


        localStorage.setItem(
            "lastOrder",
            JSON.stringify(
                order
            )
        );


        /*
         * 清空购物车
         */

        localStorage.removeItem(
            "cart"
        );


        /*
         * 成功
         */

        window.location.href =
            "success.html";

    }

    catch (error) {

        console.error(
            "Firebase 订单错误:",
            error
        );

        alert(
            t(
                "orderSubmitFailed",
                "订单提交失败"
            ) +
            "：\n" +
            error.message
        );

        submitButton.disabled =
            false;

        submitButton.innerText =
            t(
                "placeOrder",
                "提交订单"
            );

    }

}


/* ========================================
   监听语言变化
======================================== */

window.addEventListener(
    "mdyLanguageChanged",
    function() {

        updateCheckoutLanguage();

    }
);


/* ========================================
   页面启动
======================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateCheckoutLanguage();

        loadRestaurant();

        /*
         * 默认选中现金
         */

        selectPayment(
            "现金"
        );

    }
);

</script>

</body>

</html>
