<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- MDY FOOD 全站语言系统 -->

    <script src="language.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding-bottom: 30px;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            background: #f5f5f5;

            color: #333;

        }


        header {

            background:
                linear-gradient(
                    135deg,
                    #ff6a2a,
                    #ff4d1f
                );

            color: white;

            padding: 17px 20px 20px;

            font-weight: bold;

        }


        .back-button {

            display: inline-block;

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: normal;

            margin-bottom: 11px;

            opacity: 0.95;

        }


        .back-button:hover {

            opacity: 0.8;

        }


        .header-title {

            font-size: 21px;

            font-weight: bold;

        }


        .container {

            max-width: 700px;

            margin: 20px auto;

            padding: 0 15px;

        }


        .box {

            background: white;

            padding: 19px;

            border-radius: 16px;

            margin-bottom: 16px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.06);

        }


        h2 {

            margin: 0 0 16px;

            font-size: 18px;

        }


        .restaurant-name {

            color: #ff5a1f;

            font-size: 17px;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .login-warning {

            background: #fff4ef;

            border:
                1px solid #ffcfbf;

            color: #d94a20;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 16px;

            line-height: 1.7;

        }


        .login-warning a {

            display: inline-block;

            margin-top: 8px;

            color: #ff5a1f;

            font-weight: bold;

            text-decoration: none;

        }


        .item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 12px 0;

            border-bottom:
                1px solid #eee;

            font-size: 14px;

        }


        .item:last-child {

            border-bottom: none;

        }


        .item-name {

            flex: 1;

            color: #444;

        }


        .item-price {

            flex-shrink: 0;

            font-weight: bold;

            color: #333;

        }


        .summary {

            line-height: 2;

            margin-top: 12px;

            color: #666;

            font-size: 14px;

        }


        .summary-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .total {

            display: flex;

            justify-content: space-between;

            align-items: center;

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

            padding-top: 15px;

            border-top:
                1px solid #eee;

            color: #ff5a1f;

        }


        label.field-label {

            display: block;

            font-weight: bold;

            margin-top: 8px;

            margin-bottom: 0;

            font-size: 14px;

        }


        input[type="text"],
        input[type="tel"],
        textarea {

            width: 100%;

            padding: 13px;

            margin-top: 8px;

            margin-bottom: 15px;

            border:
                1px solid #ddd;

            border-radius: 9px;

            font-size: 16px;

            outline: none;

            background: #fff;

        }


        input[type="text"]:focus,
        input[type="tel"]:focus,
        textarea:focus {

            border-color: #ff5a1f;

            box-shadow:
                0 0 0 2px
                rgba(255,90,31,0.08);

        }


        textarea {

            min-height: 100px;

            resize: vertical;

        }


        /* =====================================================
           支付方式
        ===================================================== */

        .payment-list {

            display: flex;

            flex-direction: column;

            gap: 10px;

            margin-bottom: 15px;

        }


        .payment-option {

            position: relative;

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 14px;

            border:
                1.5px solid #e5e5e5;

            border-radius: 13px;

            background: white;

            cursor: pointer;

            transition:
                border-color .15s,
                background .15s,
                box-shadow .15s,
                transform .12s;

        }


        .payment-option:active {

            transform: scale(.99);

        }


        .payment-option.selected {

            border-color: #ff5a1f;

            background: #fff8f5;

            box-shadow:
                0 3px 12px
                rgba(255,90,31,0.10);

        }


        .payment-radio {

            width: 20px;

            height: 20px;

            margin: 0;

            flex-shrink: 0;

            accent-color: #ff5a1f;

        }


        .payment-icon {

            width: 43px;

            height: 43px;

            flex-shrink: 0;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            background: #f5f5f5;

        }


        .payment-option.selected .payment-icon {

            background: #fff0e9;

        }


        .payment-info {

            flex: 1;

            min-width: 0;

        }


        .payment-name {

            font-size: 15px;

            font-weight: bold;

            color: #333;

        }


        .payment-description {

            font-size: 12px;

            color: #999;

            margin-top: 4px;

            line-height: 1.4;

        }


        .payment-check {

            width: 22px;

            height: 22px;

            border-radius: 50%;

            border: 2px solid #ddd;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 12px;

            flex-shrink: 0;

        }


        .payment-option.selected .payment-check {

            background: #ff5a1f;

            border-color: #ff5a1f;

        }


        /* =====================================================
           在线支付提示
        ===================================================== */

        .online-payment-box {

            display: none;

            background:
                linear-gradient(
                    135deg,
                    #fff8f4,
                    #fff3ed
                );

            border:
                1px solid #ffd8c8;

            border-radius: 13px;

            padding: 14px;

            margin-top: 5px;

            margin-bottom: 15px;

        }


        .online-payment-box.show {

            display: block;

        }


        .online-payment-title {

            font-size: 14px;

            font-weight: bold;

            color: #d94a20;

            margin-bottom: 7px;

        }


        .online-payment-text {

            font-size: 12px;

            line-height: 1.7;

            color: #777;

        }


        .online-payment-amount {

            margin-top: 10px;

            padding-top: 10px;

            border-top:
                1px dashed #ffc8b5;

            font-size: 14px;

            color: #555;

        }


        .online-payment-amount strong {

            color: #ff5a1f;

            font-size: 17px;

        }


        /* =====================================================
           提交按钮
        ===================================================== */

        #submitButton {

            width: 100%;

            padding: 15px;

            background:
                linear-gradient(
                    135deg,
                    #ff6a2a,
                    #ff4d1f
                );

            color: white;

            border: none;

            border-radius: 11px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 13px
                rgba(255,90,31,0.20);

            transition:
                transform .12s,
                opacity .12s;

        }


        #submitButton:active {

            transform: scale(.99);

        }


        #submitButton:disabled {

            background: #aaa;

            box-shadow: none;

            cursor: not-allowed;

        }


        /* =====================================================
           空购物车
        ===================================================== */

        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #777;

            line-height: 1.8;

        }


        /* =====================================================
           小提示
        ===================================================== */

        .payment-note {

            font-size: 11px;

            color: #999;

            line-height: 1.6;

            margin-top: 10px;

            text-align: center;

        }


        @media (max-width: 600px) {

            .container {

                padding: 0 12px;

                margin-top: 15px;

            }


            .box {

                padding: 16px;

            }


            header {

                    15px

                    18px;

            }

            }


            .payment-option {

                padding: 13px;

            }


            .payment-icon {

                width: 40px;

                height: 40px;

            }

        }

    </style>

</head>

<script>


/* =========================================================
   Firebase
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDR8dxsbDYA3a6pLaXcJTngzFhNfWPUlv0",

    authDomain:
        "mdy-food.firebaseapp.com",

    projectId:
        "mdy-food",

    storageBucket:
        "mdy-food.firebasestorage.app",

    messagingSenderId:
        "498327590625",

    appId:
        "1:498327590625:web:cceafb7febb689e7ad09a0",

    measurementId:
        "G-6Q5G2862XQ"

};


if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}


const db =
    firebase.firestore();


const auth =
    firebase.auth();


/* =========================================================
   语言
========================================================= */

function t(key, fallback) {

    if (
        window.MDYLanguage &&
        typeof window.MDYLanguage.t === "function"
    ) {

        const result =
            window.MDYLanguage.t(
                key,
                {},
                fallback
            );


        if (
            result &&
            result !== key
        ) {

            return result;

        }

    }


    return fallback || key;

}


/* =========================================================
   当前用户
========================================================= */

let currentUser =
    null;


/* =========================================================
   购物车
========================================================= */

let cart = [];


try {

    cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    if (!Array.isArray(cart)) {

        cart = [];

    }

}
catch (error) {

    console.error(
        "读取购物车失败:",
        error
    );

    cart = [];

}


/* =========================================================
   餐厅
========================================================= */

let restaurantId =
    null;


let restaurantName =
    t(
        "unknownRestaurant",
        "未知餐厅"
    );


if (cart.length > 0) {

    restaurantId =
        cart[0].restaurantId ||
        null;

}


/* =========================================================
   配送费
========================================================= */

const DELIVERY_FEE =
    2000;


/* =========================================================
   当前支付方式
========================================================= */

let selectedPayment =
    "现金";


/* =========================================================
   页面语言
========================================================= */

function updateCheckoutLanguage() {

    document.title =
        t(
            "checkoutTitle",
            "确认订单 - MDY FOOD"
        );


    showOrder();


    const nameElement =
        document.getElementById(
            "restaurantName"
        );


    if (
        nameElement &&
        !restaurantId
    ) {

        nameElement.innerText =
            "⚠️ " +
            t(
                "cannotIdentifyRestaurant",
                "无法识别餐厅"
            );

    }


    updatePaymentUI();


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    if (
        submitButton &&
        !submitButton.disabled
    ) {

        submitButton.innerText =
            t(
                "placeOrder",
                "提交订单"
            );

    }

}


/* =========================================================
   读取餐厅
========================================================= */

async function loadRestaurant() {

    const nameElement =
        document.getElementById(
            "restaurantName"
        );


    if (!nameElement) {

        return;

    }


    if (!restaurantId) {

        nameElement.innerText =
            "⚠️ " +
            t(
                "cannotIdentifyRestaurant",
                "无法识别餐厅"
            );

        return;

    }


    try {

        const doc =
            await db
                .collection("restaurants")
                .doc(restaurantId)
                .get();


        if (doc.exists) {

            const data =
                doc.data() || {};


            restaurantName =
                data.name ||
                t(
                    "unknownRestaurant",
                    "未知餐厅"
                );


            nameElement.innerText =
                "🏪 " +
                restaurantName;

        }

        else {

            nameElement.innerText =
                "⚠️ " +
                t(
                    "restaurantDoesNotExist",
                    "餐厅不存在"
                );

        }

    }
    catch (error) {

        console.error(
            "读取餐厅失败:",
            error
        );


        nameElement.innerText =
            "⚠️ " +
            t(
                "restaurantLoadError",
                "餐厅信息加载失败"
            );

    }

}


/* =========================================================
   显示订单
========================================================= */

function showOrder() {

    const container =
        document.getElementById(
            "orderItems"
        );


    if (!container) {

        return;

    }


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty">

                🛒

                <br>
                <br>

                ${escapeHtml(
                    t(
                        "emptyCartCheckout",
                        "购物车是空的"
                    )
                )}

            </div>

        `;


        document.getElementById(
            "subtotal"
        ).innerText =
            "0 Ks";


        document.getElementById(
            "deliveryFee"
        ).innerText =
            "2,000 Ks";


        document.getElementById(
            "total"
        ).innerText =
            "2,000 Ks";


        document.getElementById(
            "onlinePaymentAmount"
        ).innerText =
            "2,000 Ks";


        return;

    }


    let subtotal =
        0;


    container.innerHTML =
        "";


    cart.forEach(
        function(item) {

            const price =
                Number(item.price) || 0;


            const quantity =
                Number(item.quantity) || 0;


            const itemTotal =
                price * quantity;


            subtotal +=
                itemTotal;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "item";


            div.innerHTML = `

                <span class="item-name">

                    ${escapeHtml(
                        item.name || ""
                    )}

                    × ${quantity}

                </span>


                <span class="item-price">

                    ${itemTotal.toLocaleString()}
                    Ks

                </span>

            `;


            container.appendChild(
                div
            );

        }
    );


    const total =
        subtotal +
        DELIVERY_FEE;


    document.getElementById(
        "subtotal"
    ).innerText =
        subtotal.toLocaleString() +
        " Ks";


    document.getElementById(
        "deliveryFee"
    ).innerText =
        DELIVERY_FEE.toLocaleString() +
        " Ks";


    document.getElementById(
        "total"
    ).innerText =
        total.toLocaleString() +
        " Ks";


    document.getElementById(
        "onlinePaymentAmount"
    ).innerText =
        total.toLocaleString() +
        " Ks";

}


/* =========================================================
   HTML 安全处理
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   自动读取顾客资料
========================================================= */

async function loadCustomerProfile(
    user
) {

    if (!user) {

        return;

    }


    try {

        const doc =
            await db
                .collection("customers")
                .doc(user.uid)
                .get();


        if (!doc.exists) {

            return;

        }


        const customer =
            doc.data() || {};


        document.getElementById(
            "name"
        ).value =
            customer.name ||
            "";


        document.getElementById(
            "phone"
        ).value =
            customer.phone ||
            "";


        document.getElementById(
            "address"
        ).value =
            customer.address ||
            "";

    }
    catch (error) {

        console.error(
            "读取顾客资料失败:",
            error
        );

    }

}


/* =========================================================
   支付 UI
========================================================= */

function updatePaymentUI() {

    const options =
        document.querySelectorAll(
            ".payment-option"
        );


    options.forEach(
        function(option) {

            const radio =
                option.querySelector(
                    'input[name="payment"]'
                );


            if (!radio) {
                return;
            }


            option.classList.toggle(
                "selected",
                radio.checked
            );

        }
    );


    const onlineBox =
        document.getElementById(
            "onlinePaymentBox"
        );


    const onlineTitle =
        document.getElementById(
            "onlinePaymentTitle"
        );


    const onlineText =
        document.getElementById(
            "onlinePaymentText"
        );


    const totalElement =
        document.getElementById(
            "total"
        );


    const onlineAmount =
        document.getElementById(
            "onlinePaymentAmount"
        );


    if (!onlineBox) {
        return;
    }


    if (totalElement && onlineAmount) {

        onlineAmount.innerText =
            totalElement.innerText;

    }


    if (
        selectedPayment ===
        "KBZPay"
    ) {

        onlineBox.classList.add(
            "show"
        );


        onlineTitle.innerText =
            "📱 KBZPay";


        onlineText.innerText =
            t(
                "kbzPayPreparing",
                "KBZPay 在线支付通道正在准备中。当前订单会先保存为待支付状态，接入正式支付接口后即可完成在线支付。"
            );

    }

    else if (
        selectedPayment ===
        "Wave Money"
    ) {

        onlineBox.classList.add(
            "show"
        );


        onlineTitle.innerText =
            "📱 Wave Money";


        onlineText.innerText =
            t(
                "waveMoneyPreparing",
                "Wave Money 在线支付通道正在准备中。当前订单会先保存为待支付状态，接入正式支付接口后即可完成在线支付。"
            );

    }

    else {

        onlineBox.classList.remove(
            "show"
        );

    }

}


/* =========================================================
   支付方式监听
========================================================= */

document.addEventListener(
    "change",
    function(event) {

        if (
            !event.target.matches(
                'input[name="payment"]'
            )
        ) {

            return;

        }


        selectedPayment =
            event.target.value;


        updatePaymentUI();

    }
);


/* =========================================================
   登录状态
========================================================= */

auth.onAuthStateChanged(
    async function(user) {

        currentUser =
            user;


        const warning =
            document.getElementById(
                "loginWarning"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        if (!warning || !submitButton) {

            return;

        }


        if (user) {

            warning.style.display =
                "none";


            submitButton.disabled =
                false;


            submitButton.innerText =
                t(
                    "placeOrder",
                    "提交订单"
                );


            await loadCustomerProfile(
                user
            );

        }

        else {

            warning.style.display =
                "block";


            submitButton.disabled =
                false;


            submitButton.innerText =
                t(
                    "placeOrder",
                    "提交订单"
                );

        }

    }
);


/* =========================================================
   提交订单
========================================================= */

async function submitOrder() {

    if (!currentUser) {

        alert(
            t(
                "pleaseLoginBeforeOrder",
                "请先登录账号，再提交订单。"
            )
        );


        window.location.href =
            "login.html";


        return;

    }


    if (cart.length === 0) {

        alert(
            t(
                "emptyCartCheckout",
                "购物车是空的"
            )
        );


        return;

    }


    if (!restaurantId) {

        alert(
            t(
                "restaurantReturnToMenu",
                "无法识别餐厅，请返回菜单重新加入菜品。"
            )
        );


        return;

    }


    const name =
        document
            .getElementById("name")
            .value
            .trim();


    const phone =
        document
            .getElementById("phone")
            .value
            .trim();


    const address =
        document
            .getElementById("address")
            .value
            .trim();


    const paymentElement =
        document.querySelector(
            'input[name="payment"]:checked'
        );


    const payment =
        paymentElement
            ? paymentElement.value
            : "现金";


    selectedPayment =
        payment;


    if (!name) {

        alert(
            t(
                "pleaseEnterName",
                "请输入姓名"
            )
        );


        return;

    }


    if (!phone) {

        alert(
            t(
                "pleaseEnterPhone",
                "请输入电话号码"
            )
        );


        return;

    }


    if (!address) {

        alert(
            t(
                "pleaseEnterAddress",
                "请输入配送地址"
            )
        );


        return;

    }


    const submitButton =
        document.getElementById(
            "submitButton"
        );


    submitButton.disabled =
        true;


    submitButton.innerText =
        t(
            "submittingOrder",
            "正在提交订单..."
        );


    const subtotal =
        cart.reduce(
            function(sum, item) {

                return sum +

                    (
                        Number(item.price) ||
                        0
                    ) *

                    (
                        Number(item.quantity) ||
                        0
                    );

            },
            0
        );


    const total =
        subtotal +
        DELIVERY_FEE;


    const orderNumber =
        "MDY" +
        Date.now();


    /*
       =====================================================
       支付状态

       现金：
       unpaid

       KBZPay / Wave Money：
       pending

       后面接真实支付接口时，
       支付成功再改成 paid。
       =====================================================
    */

    let paymentStatus =
        "unpaid";


    if (
        payment === "KBZPay" ||
        payment === "Wave Money"
    ) {

        paymentStatus =
            "pending";

    }


    /*
       当前阶段还没有真实支付交易号。
    */

    const paymentTransactionId =
        "";


    try {

        /*
           =================================================
           写入 Firestore
        =================================================
        */

        await db
            .collection("orders")
            .add({

                /*
                   原有订单字段
                */

                order_number:
                    orderNumber,

                restaurantId:
                    restaurantId,

                restaurantName:
                    restaurantName,

                customerId:
                    currentUser.uid,

                customerEmail:
                    currentUser.email ||
                    "",

                customername:
                    name,

                phone:
                    phone,

                adress:
                    address,

                total:
                    total,

                status:
                    "待接单",

                payment:
                    payment,

                method:
                    "网站",

                items:
                    cart,

                created_at:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp(),


                /*
                   =================================================
                   新支付字段
                =================================================
                */

                paymentMethod:
                    payment,

                paymentStatus:
                    paymentStatus,

                paymentAmount:
                    total,

                paymentTransactionId:
                    paymentTransactionId,

                paidAt:
                    null

            });


        /*
           =================================================
           本地订单记录
        =================================================
        */

        const order = {

            orderNumber:
                orderNumber,

            restaurantId:
                restaurantId,

            restaurantName:
                restaurantName,

            customerId:
                currentUser.uid,

            customerEmail:
                currentUser.email ||
                "",

            name:
                name,

            phone:
                phone,

            address:
                address,

            payment:
                payment,

            paymentMethod:
                payment,

            paymentStatus:
                paymentStatus,

            paymentAmount:
                total,

            paymentTransactionId:
                paymentTransactionId,

            paidAt:
                null,

            items:
                cart,

            total:
                total,

            status:
                "待接单",

            createdAt:
                new Date()
                    .toLocaleString()

        };


        let orders = [];


        try {

            orders =
                JSON.parse(
                    localStorage.getItem(
                        "orders"
                    )
                ) || [];


            if (!Array.isArray(orders)) {

                orders = [];

            }

        }
        catch (error) {

            orders = [];

        }


        orders.push(
            order
        );


        localStorage.setItem(
            "orders",
            JSON.stringify(
                orders
            )
        );


        localStorage.setItem(
            "lastOrder",
            JSON.stringify(
                order
            )
        );


        /*
           =================================================
           清空购物车
        =================================================
        */

        localStorage.removeItem(
            "cart"
        );


        /*
           =================================================
           成功
        =================================================
        */

        window.location.href =
            "success.html";

    }
    catch (error) {

        console.error(
            "Firebase 订单错误:",
            error
        );


        alert(
            t(
                "orderSubmitFailed",
                "订单提交失败"
            ) +
            "：\n" +
            error.message
        );


        submitButton.disabled =
            false;


        submitButton.innerText =
            t(
                "placeOrder",
                "提交订单"
            );

    }

}
